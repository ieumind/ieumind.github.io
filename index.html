function render(){
  if(typeof dueKey === "function") DUE_KEY = dueKey();
  renderTop();
  const app = document.getElementById("app");
  let h = "";
  document.body.classList.toggle("presenting", S.view === "present");
  if(S.preview) h += `<div class="preview-banner" role="status"><span>👀 <b>학생 화면 미리보기 중</b> · 실제 학생 데이터에는 영향을 주지 않습니다. 여기서 쓴 내용은 저장되지 않아요.</span><button class="btn sm pri" type="button" data-a="preview-exit">교사 화면으로 돌아가기</button></div>`;
  else if(S.demo) h += `<div class="notice demo-bar"><span>🧪 <b>체험 모드</b> · 예시 반(학생 6명)으로 마음껏 눌러 보세요. 만들거나 고친 것은 저장되지 않아요.</span><span class="row"><button class="btn sm" type="button" data-a="tour-start">🧭 둘러보기</button><button class="btn sm pri" type="button" data-a="demo-exit">체험 끝내고 시작하기 →</button></span></div>`;
  else if(S.mode === "local") h += `<div class="notice"><b>미리보기 모드</b> · 이 화면에서는 글이 저장되지 않아요. ${window.claude ? "공유 링크로 열면 반 전체가 같은 활동을 씁니다." : "학생 글을 모으려면 README의 Supabase 설정을 마쳐 주세요."}${S.supaError ? ` (연결 오류: ${esc(S.supaError)})` : ""}</div>`;
  else if(!S.canWrite && !(S.mode === "supa" && !Auth.teacher && (S.wantTeacher || !S.name))) h += `<div class="notice"><b>보기 전용</b> · 이 계정은 글을 읽을 수만 있어요. 선생님께 참여 권한을 요청하세요.</div>`;

  if(S.mode === "supa" && S.wantTeacher && !Auth.teacher) h += viewTeacherLogin();
  else if(S.mode === "supa" && !Auth.teacher && !S.name) h += viewCodeGate();          // 이 선생님 반 학생으로 확인되기 전에는 활동이 보이지 않는다
  else if(S.mode !== "local" && !S.loaded.rooms) h += `<p class="who">활동을 불러오는 중…</p>`;
  else if(S.view === "present" && room() && isTeacher()) h += viewPresent(room());
  else if(S.view === "room" && room()){ S.pendingRoom = null; h += isTeacher() ? viewRoomTeacher(room()) : viewRoomStudent(room()) }
  else if(S.view === "room" && S.pendingRoom === S.roomId) h += `<p class="who">활동을 저장하는 중…</p>`;   // 방금 만든 활동이 저장소에서 돌아오기 전
  else if(S.view === "create" && isTeacher()) h += viewCreate();
  else if(S.view === "mine" && !isTeacher()) h += viewMine();
  else { S.view = "home"; h += isTeacher() ? viewManage() : viewHome() }

  app.innerHTML = h;
  renderModal();
  afterRender();
  mqFit();
}
/* 긴 과목 이름: 줄을 바꾸지 않고 한 줄에서 천천히 옆으로 흘러가며 끝까지 보여 준다 (넘칠 때만) */
const mq = t => `<span class="mq"><span class="mq-in">${esc(t)}</span></span>`;
function mqFit(){
  document.querySelectorAll(".mq").forEach(el => {
    const d = el.firstElementChild.scrollWidth - el.clientWidth, run = d > 2;
    el.classList.toggle("run", run);
    if(run){ el.style.setProperty("--mq-x", -d + "px"); el.style.setProperty("--mq-t", Math.max(2.5, d / 70 + 1.6).toFixed(1) + "s") }
  });
}
addEventListener("resize", () => { clearTimeout(mqFit.t); mqFit.t = setTimeout(mqFit, 150) });
function afterRender(){
  S.landed = null;
  if(S.comFocus){ const t = document.querySelector(`[data-form="com:${S.comFocus}"]`); S.comFocus = null; if(t){ t.scrollIntoView({block:"center"}); t.focus({preventScroll:true}) } }

}

    if(S.name) h += `<button class="btn sm" type="button" data-a="mine">📒 내 생각 기록</button>`;   // 로그인(코드 확인) 전에는 보이지 않는다

function distHTML(r, posts){
  if(!(r.stances||[]).length || !posts.length) return "";
  const n = posts.length;
  const bars = r.stances.map((s,i)=>{ const c = posts.filter(p=>p.stance===s).length; return c ? `<i style="width:${c/n*100}%;background:var(--${SC[i%4]})"></i>` : "" }).join("");
  const lg = r.stances.map((s,i)=>`<span style="--c:var(--${SC[i%4]})"><span class="shp" aria-hidden="true">${SHAPES[i%4]}</span>${esc(s)} ${posts.filter(p=>p.stance===s).length}</span>`).join("");
  return `<div class="dist" aria-hidden="true">${bars}</div><div class="legend">${lg}</div>`;
}

/* ---- 학생 첫 화면: 과목·선생님별로 모아 보기, 할 일 먼저 ---- */
const SUBJ_IC = [[/국어|문학|독서|언어|작문|화법/,"📖"],[/수학|미적|확률|기하|대수/,"➗"],[/영어|English/i,"🔤"],[/물리|화학|생명|지구|과학/,"🔬"],
  [/한국사|역사|세계사|동아시아/,"📜"],[/사회|지리|정치|경제|법|윤리|도덕|사상/,"🏛️"],[/음악/,"🎵"],[/미술/,"🎨"],[/체육/,"⚽"],[/정보|코딩|인공지능/,"💻"],[/일본어|중국어|독일어|프랑스어|스페인어/,"🌏"]];
const subjIcon = t => (SUBJ_IC.find(([re]) => re.test(t||"")) || [0,"📘"])[1];
const subjKey = r => ((r.subject||"").trim() || "-") + "|" + (r.teacherName||"");
const subjLabel = r => `${(r.subject||"").trim() || "과목 미정"}${r.teacherName ? ` · ${r.teacherName} 선생님` : ""}`;
const subjTone = k => { let h = 0; for(const c of k) h = (h*31 + c.charCodeAt(0)) >>> 0; return SC[h%4] };
function homeState(r){
  const mine = myPost(r), open = r.open !== false && statusOf(r) === "open";
  if(isNotes(r)){
    if(mine?.notes && noteRedoReq(mine)) return {k:"todo", l:"↻ 다시 제출해 주세요", o:0};
    if(mine?.notes) return {k:"done", l:"✓ 제출 완료", o:3};
    return open ? {k:"todo", l:"📸 아직 안 냈어요", o:0} : {k:"closed", l:"🔒 마감", o:4};
  }
  if(submitted(mine)){
    const phs = phasesOf(r), done = phs.filter(ph => phaseState(r,mine,ph) === "done").length;
    if(done >= phs.length || !open) return {k:"done", l:"✓ 다 했어요", o:3};
    return {k:"doing", l:`▶ ${phs[done].l} 하는 중`, o:1};
  }
  if(!open) return {k:"closed", l:"🔒 마감", o:4};
  return mine ? {k:"todo", l:"✏️ 쓰는 중", o:0} : {k:"todo", l:"✏️ 아직 안 했어요", o:0};
}
const HSORTS = [["todo","할 일 먼저"],["new","새로 올라온 순"],["due","마감 가까운 순"],["subject","과목 순"]];
/* 카드 왼쪽 위 표시: 게시일(기본) · 마감 · 차시 · 단원 — 작은 버튼으로 돌려 가며 바꾼다 */
const HLABELS = [["posted","게시일"],["due","마감"],["lesson","차시"],["unit","단원"]];
function postedLabel(ts){
  if(!ts) return "";
  const d = new Date(ts), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(new Date()) - day(d)) / 864e5);
  return diff === 0 ? "오늘 올라옴" : diff === 1 ? "어제 올라옴" : `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]}) 게시`;
}
function cardLabel(r, k){
  if(k === "due") return r.dueAt ? (pastDue(r) ? `⏰ ${fmtDue(r.dueAt)} 마감됨` : `⏰ ${fmtDue(r.dueAt)}까지`) : {muted:"마감 없음"};
  if(k === "lesson") return r.year ? `📍 ${r.year}` : {muted:"차시 정보 없음"};
  if(k === "unit") return r.unit ? `📚 ${r.unit}` : {muted:"단원 정보 없음"};
  return `🗓 ${postedLabel(r.createdAt)}`;
}
/* ---- 학생: 과목 대시보드 ----
   과목(선생님이 만든 과목 = course)마다 대시보드 하나. 과목에 넣지 않은 활동은 ‘교과 · 선생님’별로 묶는다 */
const dashKey = r => r.courseId && courseOf(r.courseId) ? "c:" + r.courseId : "s:" + subjKey(r);
function dashInfo(k, rs){
  if(k.startsWith("c:")){
    const c = courseOf(k.slice(2));
    return {k, c, title:c.title, icon:courseIcon(c), teacher:c.teacherName || rs.find(r => r.teacherName)?.teacherName || "", tone:subjTone(k), notices:noticesOf(c)};
  }
  const r = rs[0] || {}, subj = (r.subject||"").trim();
  return {k, c:null, title:subj || "기타 활동", icon:subj ? subjIcon(subj) : "🗂", teacher:r.teacherName || "", tone:subjTone(k), notices:[]};
}
/* 새로 올라온 것 표시: 이 기기에서 이미 본 활동·공지 기억 (처음 쓰는 기기는 지금 있는 것을 다 본 것으로) */
let SEEN = (() => { try{ const v = JSON.parse(lsGet("nonjae.seen") || "null"); return v && {r:new Set(v.r||[]), n:new Set(v.n||[])} }catch(e){ return null } })();
function seenInit(){
  if(SEEN || !S.loaded.rooms) return;
  SEEN = {r:new Set(S.rooms.map(r => r.id)), n:new Set(S.courses.flatMap(c => noticesOf(c).map(n => n.id)))}; seenSave();
}
function seenSave(){ if(SEEN) lsSet("nonjae.seen", JSON.stringify({r:[...SEEN.r].slice(-500), n:[...SEEN.n].slice(-200)})) }
const isNewRoom = r => !!SEEN && !SEEN.r.has(r.id) && (r.createdAt||0) > Date.now() - 14*864e5;
const isNewNotice = n => !!SEEN && !SEEN.n.has(n.id);
function markSeen(kind, ids){ if(!SEEN) return; let ch = false; ids.forEach(id => { if(!SEEN[kind].has(id)){ SEEN[kind].add(id); ch = true } }); if(ch) seenSave() }
/* 화면을 보고 있는 동안 새 공지·새 활동이 오면 알려 준다 */
function checkNews(){
  if(isTeacher() || S.preview || !S.name || !S.loaded.rooms) return;
  if(!S._pushSynced && S.mode === "supa"){ S._pushSynced = true; pushSync() }   // 이 기기가 이미 알림을 켰으면 주소를 다시 알려 둔다
  const rs = S.rooms.filter(r => statusOf(r) === "open"), ns = S.courses.flatMap(c => noticesOf(c).map(n => ({...n, c})));
  if(!S.known){ S.known = {r:new Set(rs.map(r => r.id)), n:new Set(ns.map(n => n.id))}; return }
  const nr = rs.filter(r => !S.known.r.has(r.id)), nn = ns.filter(n => !S.known.n.has(n.id));
  nr.forEach(r => S.known.r.add(r.id)); nn.forEach(n => S.known.n.add(n.id));
  if(nn.length) toast(`📢 ${nn[0].c.title} 새 공지: ${nn[0].text.slice(0, 40)}${nn[0].text.length > 40 ? "…" : ""}`);
  else if(nr.length) toast(`🆕 새 활동이 올라왔어요 · ${nr[0].title}${nr.length > 1 ? ` 외 ${nr.length - 1}개` : ""}`);
}
function viewHomeStudent(all){
  seenInit();
  if(S.course && courseOf(S.course)) S.sdash = "c:" + S.course;
  const groups = new Map();
  all.forEach(r => { const k = dashKey(r); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r) });
  S.courses.forEach(c => { const k = "c:" + c.id; if(!c.archived && !groups.has(k) && (Array.isArray(c.members) || myGroup(c.id) || noticesOf(c).length || S.sdash === k)) groups.set(k, []) });   // 수강 학생으로 정해진 과목은 활동이 없어도 보인다
  if(S.sdash && groups.has(S.sdash)) return viewDash(dashInfo(S.sdash, groups.get(S.sdash)), groups.get(S.sdash));
  S.sdash = ""; S.course = "";
  return viewDashList(groups, all);
}

function viewDashList(groups, all){
  const nm = splitAuthor(S.name).name.trim(), now = new Date();

  const so = stuOrder(), born = d => d.info.c?.createdAt || Math.min(...d.rs.map(r => r.createdAt || 0), 9e15);
  const dashes = orderCourses([...groups.entries()].map(([k, rs]) => ({info:dashInfo(k, rs), rs})), born, d => { const i = so.indexOf(d.info.k); return i < 0 ? null : i });

/* ⏱ 수업 타이머: room.timer = {dur, endsAt, left, at}

  const left = Math.min(t.dur, (t.endsAt || 0) - now);                 // 기기 시계가 조금 늦어도 처음 시간보다 길게 보이지 않게

   9. 방 — 학생: 3단계 + 칠판 + 지금 할 일
   ========================================================= */
function viewRoomStudent(r){
  if(!visibleToStudents(r) && !S.preview) return `<button class="linkbtn back" type="button" data-a="home">← 활동 목록</button><div class="empty">아직 공개되지 않았거나 보관된 활동이에요.</div>`;
  if(r._needGroup) return roomHead(r) + `<div class="stage" id="stage">${groupPickHTML(courseOf(r.courseId), asgIds(r))}</div>`;
  if(r._notAssigned) return roomHead(r) + `<div class="stage" id="stage"><div class="empty">이 활동은 우리 그룹(${esc(groupName(r.courseId, r._notAssigned))})에는 아직 열리지 않았어요.<br><button class="linkbtn" type="button" data-a="regroup" data-c="${esc(r.courseId)}">그룹을 잘못 골랐다면 다시 고르기</button></div></div>`;
  if(r._ready){ const a = r.assign[r._gid]; return roomHead(r) + `<div class="stage" id="stage"><div class="empty">⏳ 아직 시작 전인 활동이에요.${a?.startAt ? `<br>${esc(fmt(a.startAt))}에 열려요.` : " 선생님이 시작하면 참여할 수 있어요."}</div></div>` }
  const p = myPost(r);
  if(!S.name) return roomHead(r) + `<div class="stage" id="stage">${nameForm()}</div>`;
  markViewed(r);                                                       // 👀 들어와 본 것만으로도 ‘조회’로 남긴다
  if(isNotes(r)) return viewNotesStudent(r, p);                      // 오늘의 필기: 사진 제출 화면
  if(S.work !== r.id) return roomHead(r, {sourceOpen:false}) + roomTabs(r, "board") + roomBoard(r, p);   // 처음에는 우리 반 게시판
  const sel = selectedStep(r, p), phs = phasesOf(r);
  const curPh = sel === "record" ? null : phaseOfStep(r, sel);
  let h = roomHead(r, {sourceOpen: curPh ? curPh.k === "think" : false}) + roomTabs(r, "work");

  // 큰 3단계 (단계가 하나뿐인 빠른 활동에서는 생략)
  if(phs.length > 1){
    h += `<nav class="phases" aria-label="활동 단계"><ol>` + phs.map((ph,i)=>{
      const state = phaseState(r,p,ph), cur = curPh && ph.k === curPh.k;
      const stt = state==="done" ? "마쳤어요" : state==="locked" ? "글을 낸 뒤 열려요" : (cur ? "지금 하는 중" : "");
      return `<li class="${state}"><button type="button" data-a="phase" data-v="${ph.k}" ${cur?'aria-current="step"':""} ${state==="locked"?"disabled":""}>
        <span class="n" aria-hidden="true">${state==="done" ? "✓" : i+1}</span>
        <span class="t"><span class="lbl">${esc(ph.l)}</span><span class="stt">${stt}</span></span></button></li>`;
    }).join("") + `</ol></nav>`;
  }

  // 칠판: 지금 할 일
  const meta = stepMeta(r, sel);
  let sub = "", nxt = "";
  if(curPh){
    if(curPh.steps.length > 1){
      sub = `<div class="subpath" aria-label="${esc(curPh.l)} 안의 활동">` + curPh.steps.map((st,i)=>{
        const state = stepState(r,p,st);
        return (i ? `<span class="arr" aria-hidden="true">→</span>` : "") +
          `<button type="button" data-a="step" data-v="${st}" aria-current="${st===sel}" ${state==="locked"?"disabled":""}>${state==="done"?"✓ ":""}${esc(stepMeta(r,st).s)}</button>`;
      }).join("") + `</div>`;
    }
    const steps = stepsOf(r), later = steps[steps.indexOf(sel)+1];
    const laterPh = later && phaseOfStep(r, later);
    if(later) nxt = laterPh.k !== curPh.k ? `다음 · <b>${esc(laterPh.l)}</b>` : `다음 · <b>${esc(stepMeta(r,later).s)}</b>`;
    else nxt = submitted(p) ? `다음 · <b>나의 생각 흐름 보기</b>` : `다음 · <b>보내면 끝나요</b>`;
  }
  const phNo = curPh ? phs.findIndex(x=>x.k===curPh.k) : -1;
  h += `<section class="board" aria-labelledby="board-t">
    <div class="eyebrow">${curPh ? `지금 할 일 · ${phs.length>1 ? `${phNo+1}단계 ` : ""}${esc(curPh.l)}` : "활동을 마쳤어요"}</div>
    <h2 id="board-t"><span aria-hidden="true">${meta.ic} </span>${esc(meta.title)}</h2><p>${esc(meta.desc)}</p>${sub}
    ${nxt ? `<div class="nxt">${nxt}</div>` : ""}</section>`;

  h += classFeedbackHTML(r);
  const open = r.open!==false;
  const views = {chat:stepChat, think:stepThink, write:(r,p,o) => stepWrite(r,p,o, isSplit(r) ? 0 : undefined), why:(r,p,o) => stepWrite(r,p,o,1), counter:stepCounter, read:stepRead, respond:stepRespond, reflect:stepReflect, revise:stepRevise, record:stepRecord,
                 ask:stepAsk, take:stepTake, back:stepBack, develop:stepDevelop, see:stepSee, compose:stepCompose, feedback:stepFeedback};
  h += `<div class="stage" id="stage">${views[sel](r, p, open)}</div>`;
  if(sel !== "record" && submitted(p)) h += `<div class="row end" style="margin-top:14px"><button class="linkbtn" type="button" data-a="step" data-v="record">나의 생각 흐름 보기</button></div>`;
  if(!submitted(p) && !["read","respond","take","back"].includes(sel)) h += writeMapHTML(r);   // 쓰는 동안: 흐린 게시판·생각 지도
  return h;
}
/* =========================================================
   📸 오늘의 필기: 필기 사진 여러 장 제출 → 선생님 확인 → 필요하면 재제출 요청
   - Supabase: 사진은 Storage ‘notes’ 보관함의 {활동id}/{학생id}/{시각}-{쪽}.jpg
     (서버 규칙: 학생은 자기 폴더만 올리고 보고 지우며, 선생님은 자기 활동의 사진만 본다)
   - 그 밖(미리보기 등): 작게 줄인 사진을 글 안에 저장
   ========================================================= */
const isNotes = r => r?.template === "notes";
const NOTE_MAX = r => Math.max(1, Math.min(12, Number(r?.noteCfg?.maxPages) || 3));
const noteRedoReq = p => p?.resubmitReq && p.resubmitReq.at > (p.notes?.submittedAt || 0) ? p.resubmitReq : null;
const NDRAFT = {};                    // 활동 id → 제출 전 고른 사진 [{blob, url, w, h}] (이 화면에만)
const NURL = {};                      // 저장된 사진 경로 → 잠깐 쓰는 주소
let NURL_Q = new Set(), NURL_T = null;
const useStorage = () => S.mode === "supa" && !S.preview && !!SB;
function noteSrc(img){
  if(!img) return "";
  if(img.d) return img.d;
  if(!img.p || !SB) return "";
  const c = NURL[img.p];
  if(c && c.exp > Date.now()) return c.url;
  if(!NURL_Q.has(img.p)){ NURL_Q.add(img.p); clearTimeout(NURL_T); NURL_T = setTimeout(loadNoteUrls, 30) }
  return "";
}
async function loadNoteUrls(){
  const paths = [...NURL_Q]; NURL_Q = new Set();
  for(let i = 0; i < paths.length; i += 100){
    const part = paths.slice(i, i + 100), now = Date.now();
    try{
      const r = await SB.storage.from("notes").createSignedUrls(part, 6 * 3600);
      const got = new Map((r.data || []).filter(x => x.signedUrl).map(x => [x.path, x.signedUrl]));
      part.forEach(p => { NURL[p] = got.has(p) ? {url:got.get(p), exp:now + 6*3600*1000 - 60000} : {url:"", exp:now + 60000, bad:true} });
    }catch(e){ part.forEach(p => { NURL[p] = {url:"", exp:now + 60000, bad:true} }) }
  }
  dataChanged();
}
async function shrinkImage(file, maxSide, q){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}) }
  catch(e){ bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file) }) }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, maxSide / Math.max(w0, h0)), w = Math.round(w0 * k), h = Math.round(h0 * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", q));
  if(!blob) throw new Error("이미지 변환 실패");
  return {blob, w, h};
}
const blobToDataURL = b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b) });
/* 📚 자료 사진: Supabase는 공개 보관함 ‘materials’의 {교사id}/…jpg, 그 밖(체험·미리보기)은 작게 줄여 글 안에 */
async function ctxAddFiles(files){
  const f = F("create"), room = 10 - (f.ctxImgs || []).length, list = [...files].filter(x => /^image\//.test(x.type)).slice(0, Math.max(0, room));
  if(!list.length){ toast(room <= 0 ? "사진은 10장까지 넣을 수 있어요." : "사진 파일만 넣을 수 있어요."); return }
  if(files.length > room) toast(`사진은 10장까지라 ${room}장만 넣었어요.`);
  S.ctxUploading = true; render();
  const live = S.mode === "supa" && SB && !S.demo && !S.preview && S.sbUid;
  try{
    for(const file of list){
      const {blob} = await shrinkImage(file, live ? 1600 : 1000, live ? 0.82 : 0.7);
      let url;
      if(live){
        const path = `${S.sbUid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}.jpg`;
        const up = await SB.storage.from("materials").upload(path, blob, {contentType:"image/jpeg", upsert:false});
        if(up.error) throw up.error;
        url = SB.storage.from("materials").getPublicUrl(path).data.publicUrl;
      }else url = await blobToDataURL(blob);
      f.ctxImgs = [...(f.ctxImgs || []), url].slice(0, 10); saveFormsSoon();
    }
  }catch(e){ toast("사진을 올리지 못했어요: " + (e?.message || "다시 해 보세요.")) }
  S.ctxUploading = false; render();
}
async function noteAddFiles(r, files){
  const list = NDRAFT[r.id] = NDRAFT[r.id] || [], max = NOTE_MAX(r);
  const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if(!arr.length){ toast("사진 파일을 골라 주세요."); return }
  S.noteBusy = "사진을 준비하는 중…"; render();
  let bad = 0, over = false;
  for(const f of arr){
    if(list.length >= max){ over = true; break }
    try{ const x = await shrinkImage(f, useStorage() ? 1800 : 1100, useStorage() ? 0.8 : 0.7); list.push({...x, url:URL.createObjectURL(x.blob)}) }
    catch(e){ bad++ }
  }
  S.noteBusy = "";
  if(over) toast(`한 번에 ${max}장까지 올릴 수 있어요.`);
  else if(bad) toast(`${bad}장은 열 수 없는 사진 형식이에요. ‘사진 찍기’로 다시 시도해 보세요.`);
  render();
}
async function noteSubmit(r){
  const list = NDRAFT[r.id] || [], p = myPost(r);
  if(!list.length){ toast("사진을 한 장 이상 골라 주세요."); return }
  if(r.open === false){ toast("마감된 활동이에요."); return }
  const imgs = [];
  S.noteBusy = "올리는 중… 화면을 닫지 마세요"; render();
  try{
    if(useStorage()){
      const sid = (await SB.rpc("my_student_id", {p_room:r.id})).data;
      if(!sid) throw new Error("no student");
      const stamp = Date.now().toString(36);
      for(let i = 0; i < list.length; i++){
        S.noteBusy = `올리는 중… (${i+1}/${list.length}) 화면을 닫지 마세요`; render();
        const path = `${r.id}/${sid}/${stamp}-${i+1}.jpg`;
        const up = await SB.storage.from("notes").upload(path, list[i].blob, {contentType:"image/jpeg", upsert:false});
        if(up.error) throw up.error;
        imgs.push({p:path, w:list[i].w, h:list[i].h});
      }
    }else{
      for(const x of list) imgs.push({d:await blobToDataURL(x.blob), w:x.w, h:x.h});
    }
  }catch(e){
    if(useStorage() && imgs.length) SB.storage.from("notes").remove(imgs.map(x => x.p));
    S.noteBusy = ""; toast("사진을 올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); render(); return;
  }
  const old = (p?.notes?.images || []).filter(x => x.p), now = Date.now();
  const history = p?.notes ? [...(p.notes.history || []), {count:p.notes.images.length, submittedAt:p.notes.submittedAt}].slice(-10) : [];
  const memo = (F("note:" + r.id).memo || "").trim().slice(0, 300);
  const ok = await savePost(r, {status:"submitted", submittedAt:p?.submittedAt || now, resubmitReq:null,
    notes:{images:imgs, memo, submittedAt:now, version:(p?.notes?.version || 0) + 1, history}});
  S.noteBusy = "";
  if(!ok){ if(useStorage()) SB.storage.from("notes").remove(imgs.map(x => x.p)); render(); return }
  if(useStorage() && old.length) SB.storage.from("notes").remove(old.map(x => x.p));       // 바꾼 예전 사진은 지운다
  list.forEach(x => URL.revokeObjectURL(x.url)); delete NDRAFT[r.id]; S.noteRedo = null;
  if(S.form["note:" + r.id]) S.form["note:" + r.id].memo = "";
  toast(p?.notes ? "새 사진으로 다시 제출했어요." : "제출했어요! 선생님이 확인할 거예요.");
  render();
}
function noteThumbs(p, imgs, max){

  const ids = asgIds(r), open = ids.filter(g => asgStatus(r.assign[g]) === "open"), later = ids.filter(g => asgStatus(r.assign[g]) === "ready" && r.assign[g].startAt);
  schedSync(r);
  const tail = later.length ? ` 예약한 ${later.length}개 그룹은 공개 시각에 알림이 가요.` : "";
  if(ids.length && !open.length){ toast("공개했어요." + tail); return }
  const d = await notifyStudents({...newRoomMsg(r), url:"#" + r.id, tag:"r-" + r.id, course:r.courseId, ...(ids.length ? {groups:open} : {})});   // 과목(그룹) 학생에게만
  toast("공개했어요." + pushNote(d) + tail);
}

/* 게시판 화면: 지금 할 일 한 줄 + 게시판 */
function roomBoard(r, p){
  const open = r.open !== false, phs = phasesOf(r);
  let cta;
  if(submitted(p)){
    const done = phs.filter(ph => phaseState(r,p,ph) === "done").length;
    cta = done >= phs.length || !open
      ? `<div class="cta done"><div><b>✓ 이 활동을 다 했어요</b><span>친구들의 생각을 둘러보고 댓글을 남겨 보세요.</span></div><button class="btn" type="button" data-a="open-record" data-id="${esc(r.id)}">🧭 나의 생각 흐름</button></div>`
      : `<div class="cta"><div><b>▶ 다음 할 일 · ${esc(phs[done].l)}</b><span>내 생각은 게시했어요. 이어서 해 볼까요?</span></div><button class="btn pri" type="button" data-a="to-stage">이어서 하기 →</button></div>`;
  }else if(!open){
    cta = `<div class="cta closed"><div><b>🔒 마감된 활동이에요</b><span>${p ? "쓰던 글은 게시되지 않았어요." : "더 이상 글을 쓸 수 없어요."}</span></div></div>`;
  }else if(!S.canWrite){
    cta = "";
  }else{
    cta = `<div class="cta todo"><div><b>✏️ ${p ? "쓰던 생각이 있어요" : "아직 내 생각을 올리지 않았어요"}</b><span>${r.reveal === "after" ? "내 생각을 게시하면 친구들의 생각이 열려요." : "내 생각을 써서 게시판에 올려 보세요."}${r.dueAt ? ` · ${esc(fmtDue(r.dueAt))}까지` : ""}</span></div>
      <button class="btn pri" type="button" data-a="to-stage">내 생각 쓰러 가기 →</button></div>`;
  }
  return cta + wallHTML(r, p);
}
/* 다음 활동으로 가는 버튼 */
function nextBtn(r, label){
  const steps = stepsOf(r), p = myPost(r), sel = selectedStep(r,p), nxt = steps[steps.indexOf(sel)+1] || (submitted(p) ? "record" : null);
  if(!nxt) return "";
  const ph = nxt !== "record" && phaseOfStep(r, nxt), cur = phaseOfStep(r, sel);
  const text = label || (nxt==="record" ? "나의 생각 흐름 보기" : (ph && cur && ph.k !== cur.k ? `다음: ${ph.l}` : `다음: ${stepMeta(r,nxt).s}`));
  return `<div class="next"><button class="btn pri" type="button" data-a="step" data-v="${nxt}">${esc(text)} →</button></div>`;
}

/* ---- 생각하기 · 내 생각과 이유 ---- */
function writeKey(r){ return "write:" + r.id }
function writeForm(r, p){
  return F(writeKey(r), () => ({
    _stance: p?.stance || ((p?.initial?.stance && stanceIdx(r,p.initial.stance)>=0) ? p.initial.stance : ""),
    _etype: p?.evidenceType || "",
    _other: p?.deeper?.other || "", _source: p?.deeper?.source || "",
    ...(p?.body || {})
  }));
}
function writeStatus(r){
  const f = F(writeKey(r)), all = effFields(r), min = minOf(r);
  if(S.writePart === 0){
    const first = all[0], ok = !!(f[first.k]||"").trim();
    return {n:cnt(f[first.k]), min:0, ok, msg: ok ? "좋아요. 이제 이유를 적어 볼까요?" : `‘${sField(r,first).q}’에 답을 적어 보세요.`};
  }
  const fields = all;
  const n = fields.reduce((a,x)=>a+cnt(f[x.k]),0);
  const empty = fields.find(x => !(f[x.k]||"").trim());
  let msg, ok = false;
  if((r.stances||[]).length && !f._stance) msg = "먼저 내 생각에 가까운 쪽을 골라 볼까요?";
  else if(empty) msg = `‘${sField(r,empty).q}’에 답을 적어 보세요.`;
  else if(n < min) msg = "자신의 생각이 잘 드러나도록 조금 더 써 볼까요?";
  else { msg = "다 썼어요. 제출할 수 있어요."; ok = true }
  return {n, min, ok, msg};
}
function statusHTML(r){
  const s = writeStatus(r), pct = s.min ? Math.min(100, s.n/s.min*100) : 100;
  const num = isBig(r) ? `<span class="mono small">${s.n} / 최소 ${s.min}자</span>` : "";
  return `<div class="status ${s.ok?"ok":""}" id="wstatus" aria-live="polite"><span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>
    ${num}<span>${s.ok?"✓ ":""}${esc(s.msg)}</span></div>`;
}
/* 앞 칸을 채우면 다음 칸이 열린다 (처음엔 최대 두 칸) */
function revealFields(r){
  const f = F(writeKey(r)), fields = effFields(r);
  fields.forEach((x,i) => {
    const el = document.getElementById("wq-"+x.k);
    if(!el) return;
    el.hidden = !(i < 2 || fields.slice(0,i).every(y => (f[y.k]||"").trim()) || (f[x.k]||"").trim());
  });
}
/* 생각 스케치: 중심 생각 + 키워드를 둥글게 놓고 선으로 잇는다 */
const skKeys = v => String(v||"").split(/[,\n，、]/).map(x => x.trim()).filter(Boolean);
function sketchMapHTML(b){
  const center = String(b?.center||"").trim(), keys = skKeys(b?.keys).slice(0, 8);
  const links = String(b?.links||"").split("\n").map(x => x.trim()).filter(Boolean).map(x => x.split(/\s*(?:→|->|=>|⇒)\s*/).filter(Boolean));
  if(!center && !keys.length && !links.length) return `<div class="skmap empty">중심 생각과 키워드를 적으면 여기에 생각 지도가 그려져요.</div>`;
  const n = keys.length, pos = keys.map((k,i) => { const a = -Math.PI/2 + i * 2*Math.PI / Math.max(n,1); return {k, x:50 + 36*Math.cos(a), y:50 + 36*Math.sin(a)} });
  return `<figure class="skmap" role="img" aria-label="생각 지도: 가운데 ${esc(center||"중심 생각")}, 키워드 ${esc(keys.join(", "))}">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${pos.map(p => `<line x1="50" y1="50" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`).join("")}</svg>
      <span class="sk-c">${esc(center || "?")}</span>${pos.map(p => `<span class="sk-k" style="left:${p.x.toFixed(1)}%;top:${p.y.toFixed(1)}%">${esc(p.k)}</span>`).join("")}</figure>
    ${links.length ? `<ul class="sk-links" aria-label="이어 보기">${links.map(l => `<li>${l.length > 1 ? l.map(x => `<span>${esc(x)}</span>`).join('<i aria-hidden="true">→</i>') : esc(l[0])}</li>`).join("")}</ul>` : ""}`;
}
function drawingHTML(url, alt){
  return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(url||"")) ? `<img class="dimg" src="${esc(url)}" alt="${esc(alt || "학생이 그린 그림")}" loading="lazy">` : "";
}
function fieldsHTML(r, body, {evidenceType}={}){
  if(toolOf(r) === "sketch") return sketchMapHTML(body);
  if(toolOf(r) === "draw") return (drawingHTML(body?.drawing) || `<p class="muted">아직 그린 그림이 없어요.</p>`) + (body?.note ? `<dl class="pf"><dt>${esc(fieldLabel(r, {k:"note", l:"그림 설명"}))}</dt><dd>${esc(body.note)}</dd></dl>` : "");
  let h = "";
  for(const f of effFields(r)){
    const v = body?.[f.k];
    if(!v) continue;
    const et = f.k==="reason" && evidenceType ? `<span class="chip">${esc(evidenceType)}</span>` : "";
    h += `<dl class="pf"><dt>${esc(fieldLabel(r,f))} ${et}</dt><dd>${esc(v)}</dd></dl>`;
  }
  return h || `<p class="muted">아직 쓴 내용이 없어요.</p>`;
}
function stepWrite(r, p, open, part){
  const f = featuresOf(r);
  S.writePart = part;
  // 제출한 뒤: 낸 글을 보여 주고, 필요하면 고치기
  if(submitted(p) && S.editing !== r.id){
    return `<div class="card"><h3>내가 낸 글</h3>
      ${p.stance ? `<div style="margin-bottom:10px">${stanceChip(r,p.stance)}</div>` : ""}${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="edit">고치기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();

  const key = writeKey(r);
  writeForm(r, p);
  let h = `<div class="card">`;
  if((r.stances||[]).length){
    h += `<fieldset class="q"><legend>내 생각은 어느 쪽에 가까운가요?</legend>${radios(key,"_stance",r.stances,{label:"내 입장", colors:r.stances.length, icons:stanceIcons(r)})}
      ${p?.initial?.stance ? `<p class="hint">처음 생각: ${esc(p.initial.stance)}. 바꿔도 괜찮아요.</p>` : ""}</fieldset>`;
  }
  const allF = effFields(r), shown = part === 0 ? allF.slice(0,1) : part === 1 ? allF.slice(1) : allF;
  if(part === 1){ const x0 = allF[0]; h += `<div class="q"><span class="hint">${esc(sField(r,x0).dl)}</span><p class="quote">${esc(F(key)[x0.k] || p?.body?.[x0.k] || "")}</p></div>` }
  for(const x of shown){
    const s = sField(r, x);
    if(x.k === "drawing"){ h += `<div class="q" id="wq-drawing"><span class="qlabel" style="font-weight:600">${esc(s.q)}</span><p class="hint">${esc(s.tip)}</p>${drawEditorHTML(key)}</div>`; continue }
    const qno = allF.length > 1 && allF.some(y => y.q) ? `<span class="wqn">${allF.indexOf(x) + 1}</span>` : "";   // 선생님이 만든 단계별 질문이면 번호를 붙인다
    h += `<div class="q" id="wq-${esc(x.k)}"><label for="${key}-${x.k}">${qno}${esc(s.q)}</label>
      ${s.frame ? `<p class="frame" aria-hidden="true">${esc(s.frame)}</p>` : (!STUDENT_FIELDS[x.k] && x.h ? `<p class="hint">${esc(x.h)}</p>` : "")}
      ${helpBox(`${key}-${x.k}`, s.tip, s.starters)}`;
    if(x.k==="reason" && f.evidenceType){
      h += ta(key, x.k, {rows:3}) + `<details class="help"><summary>＋ 어디에서 찾은 이유인가요? (선택)</summary>${radios(key,"_etype",f.evidenceTypes,{label:"이유의 종류"})}</details></div>`;
      continue;
    }
    h += ta(key, x.k, {rows: x.k==="claim" || x.k==="center" ? 2 : 3}) + `</div>`;
  }
  if(toolOf(r) === "sketch") h += `<div class="q"><span class="hint">내 생각 지도 미리 보기</span><div id="skprev">${sketchMapHTML(F(key))}</div></div>`;
  // 상위권을 위한 선택 영역: 기본 화면에는 접혀 있다
  if(depthOf(r) !== "quick" && part !== 0){
    h += `<details class="help" style="margin-top:18px"><summary>🔍 더 깊이 생각해보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:8px">
      ${question(key,"_other",{q:"나와 다른 관점에서 보면 어떨까요?", opt:true, rows:2, tip:"반대편이나 다른 사람의 자리에서 한 번 생각해 보세요.", starters:[{show:"다른 관점에서 보면 ___라고 볼 수도 있다.", ins:"다른 관점에서 보면 "}]})}
      ${question(key,"_source",{q:"내 생각을 받쳐 주는 자료가 있나요?", opt:true, rows:2, tip:"교과서, 사료, 통계 중 하나면 충분해요.", starters:[{show:"교과서(자료)를 보면 ___", ins:"자료를 보면 "}]})}
    </div></details>`;
  }
  const editing = S.editing === r.id;
  const label = part === 0 ? "다음: 이유 쓰기" : editing ? "고친 글 저장" : (f.counter ? "다음으로" : (isEssay(r) ? "다음: 글쓰기" : "내 생각 보내기"));
  h += `<div class="foot">${statusHTML(r)}<div class="row">
      ${part === 1 ? `<button class="linkbtn" type="button" data-a="step" data-v="write">← 앞으로</button>` : ""}

/* 내 생각을 보내기 전의 생각 지도: 인원 분포 + 내가 고른 쪽에 '내 생각이 들어갈 자리' */
function writeMapHTML(r){ return `<div id="wmap">${wallHTML(r, myPost(r))}</div>` }

/* ---- 생각하기 · 나와 다른 생각 (깊이 있는 활동, 여기서 제출) ---- */

/* ---- 함께 생각하기 · 친구 생각 살펴보기 ---- */
function displayName(r, author, ps){

const finalBody = p => p.revision?.body || p.body || {};
const isImg = v => /^data:image\//.test(String(v||""));

const cellv = v => isImg(v) ? "(그림)" : (v || "");
function postHead(r, p, ps){
  return `<div class="post-h"><strong>${esc(displayName(r,p.author,ps))}</strong>${p.stance ? stanceChip(r,p.stance) : ""}

}
function previewText(r, p){
  if(p.revision?.essay || p.essay?.text) return p.revision?.essay || p.essay.text;
  if(isRelay(r)) return (p.questions||[])[0]?.text || "";
  const b = finalBody(p);
  const k = effFields(r).find(x => b[x.k] && !isImg(b[x.k]));
  return k ? b[k.k] : "";
}
/* 내가 볼 수 있는 답글: 예전 읽기 메모는 글쓴이와 선생님만 */
function visibleReplies(p){
  return repliesOf(p.id).filter(x => x.kind !== "note" || isTeacher() || isMe(p.author) || isMe(x.author));
}
function replyHTML(r, x, ps){
  const who = x.kind === "teacher" ? "선생님" : displayName(r, x.author, ps);
  const tag = isTeacher() ? ({rebuttal:"반박", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "")
                          : ({rebuttal:"답", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "");
  let body = "";
  if(x.kind === "answer"){
    body = `<p>${esc(x.text)}</p>` + (x.evidence ? `<div class="part"><em>이유</em><p>${esc(x.evidence)}</p></div>` : "");
  }else if(x.kind === "note"){
    body = MISSIONS.filter(m => x.answers?.[m.k]).map(m => `<div class="part"><em>${esc(m.q)}</em><p>${esc(x.answers[m.k])}</p></div>`).join("");
  }else if(x.kind === "rebuttal" && (x.differ || x.agree)){
    body = (x.agree ? `<div class="part"><em>공감하는 부분</em><p>${esc(x.agree)}</p></div>` : "")
         + `<div class="part"><em>생각이 다른 부분</em><p>${esc(x.differ)}</p></div>`
         + `<div class="part"><em>그렇게 생각하는 이유${x.evidenceType?` · ${esc(x.evidenceType)}`:""}</em><p>${esc(x.evidence)}</p></div>`
         + `<div class="part"><em>내 의견</em><p>${esc(x.text)}</p></div>`;
  }else{

  return `<div class="reply${cls}"><div class="rh"><b>${esc(who)}</b>${tag?`<span>${tag}</span>`:""}<span>${fmt(x.createdAt)}</span></div>${body}</div>`;

function repliesBlock(r, p, ps){

}
const REPLY_HELP = {
  tip:"“나는 이 의견에 동의한다/동의하지 않는다. 왜냐하면…”으로 시작해 보세요.",
  starters:[{show:"나는 이 생각에 ___한다. 왜냐하면 ___ 때문이다.", ins:"나는 이 생각에 "},
            {show:"친구의 의견에서 ___한 점은 공감하지만, 나는 ___라고 생각한다.", ins:"친구의 의견에서 "}]
};
function commentForm(r, p, label){

    <div class="row end"><button class="btn sm pri" type="button" data-a="save-comment" data-id="${esc(p.id)}">올리기</button></div></div>`;
}
function readCard(r, p, mine, ps, {pickable=true}={}){
  const f = featuresOf(r), isOpen = S.openPost === p.id, reps = visibleReplies(p);

    return `<article class="post wcard${picked?" diff":""}${p===mine?" mine":""}${p===mine && S.landed===r.id?" land":""}" style="${wallTone(r,p)}">${padHead(r,p,ps)}${picked?`<p class="small" style="color:var(--accent);font-weight:600">✓ 내가 고른 생각</p>`:""}${wallCardBody(r,p,ps)}</article>`;

      h += `<div class="pad-cmt"><textarea id="com-${esc(p.id)}" data-form="com:${esc(p.id)}" data-k="text" rows="1" maxlength="500" placeholder="${p === mine ? "친구 댓글에 답하기" : "댓글 추가"}" aria-label="댓글">${esc(F("com:"+p.id).text||"")}</textarea><button class="btn sm pri" type="button" data-a="save-comment" data-id="${esc(p.id)}">올리기</button></div>`;
    }
  }else if(open && p !== mine && mine?.readAt){                       // 한마디를 남긴 뒤에는 다른 친구 글에도 자유롭게 한마디 더 (선택)
    if(f.deep && f.rebuttal && f.meet) h += `<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-a="go-respond" data-id="${esc(p.id)}">이 생각에 답해보기 →</button></div>`;
    else if(f.comment) h += commentForm(r, p, "한마디 더 남기기 (선택)");
  }
  return h + `<div class="row end" style="margin-top:10px"><button class="linkbtn" type="button" data-a="close-post">접기</button></div></article>`;
}
/* ---- 우리 반 게시판: 패들렛처럼 카드로 모아 보기. ‘제출 후 공개’ 활동은 내 생각을 게시하기 전까지 흐리게 ---- */
const wallTone = (r, p) => {                                     // 쪽지 색: 토론은 입장 색, 그 밖에는 글마다 옅은 6색 중 하나 (늘 같은 색)
  const si = (r.stances || []).indexOf(p.stance);
  if(si >= 0) return `--wc:var(--${SC[si % 4]}-soft)`;
  let h = 0; for(const c of String(p.id || p.author)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return `--wc:var(--pad${h % 6})`;
};
/* ❤️ 하트: replies에 kind "heart" 한 줄(학생마다 글마다 하나, on으로 켜고 끈다) */
const heartsOf = pid => S.replies.filter(x => x.kind === "heart" && x.postId === pid && x.on !== false);
const myHeart = pid => S.replies.find(x => x.kind === "heart" && x.postId === pid && isMe(x.author));
const heartKey = name => { let h = 0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h.toString(36) };
function wallActs(r, p, {open=false}={}){
  const n = heartsOf(p.id).length, mh = myHeart(p.id), on = !!mh && mh.on !== false, own = isMe(p.author), reps = visibleReplies(p).length;
  const canHeart = (!isTeacher() || S.preview) && !!S.name && !own && S.canWrite;
  const ttl = own ? "내 글이에요" : !canHeart ? "하트" : on ? "하트 취소" : "하트 누르기";
  return `<div class="wact"><button class="hbtn${on ? " on" : ""}" type="button" data-a="heart" data-id="${esc(p.id)}" aria-pressed="${on}" ${canHeart ? "" : "disabled"} title="${ttl}" aria-label="${ttl} (${n}개)"><span class="hh" aria-hidden="true">${on ? "❤️" : "🤍"}</span><span>${n}</span></button>
    <span class="sp"></span><button class="cbtn" type="button" data-a="${open ? "focus-com" : "open-post"}" data-id="${esc(p.id)}" data-c="1" aria-label="댓글 ${reps}개"><span aria-hidden="true">💬</span> ${reps}</button></div>`;
}
/* 패들렛 쪽지: 동그란 이름표 · 이름 · 시간 / 굵은 첫 줄 + 내용 / ❤️ · 💬 / ＋ 댓글 추가 */
function padHead(r, p, ps){
  const nm = displayName(r, p.author, ps), sa = splitAuthor(nm), ini = nm === "나" ? "나" : /^익명/.test(nm) ? "?" : (sa.name || nm).trim().slice(0, 1);

  return `<div class="pad-h"><span class="ava" style="--av:var(--${SC[h%4]})" aria-hidden="true">${esc(ini)}</span><span class="who"><b>${esc(nm)}</b><span>${esc(fmtRel(p.updatedAt||p.createdAt))}${p.revision ? " · 다시 쓴 글" : ""}</span></span>${p.stance ? stanceChip(r,p.stance) : ""}</div>`;
}
function padText(r, p){
  if(p.revision?.essay || p.essay?.text || isRelay(r)) return {title:"", text:previewText(r, p)};
  const b = finalBody(p), vals = effFields(r).map(x => b[x.k]).filter(v => v && !isImg(v)).map(v => String(v).trim()).filter(Boolean);
  if(vals.length >= 2 && vals[0].length <= 70) return {title:vals[0], text:vals.slice(1).join("\n")};
  return {title:"", text:vals.join("\n")};
}
function wallCardBody(r, p, ps, extra = ""){

    ${title ? `<b class="pad-title">${esc(title)}</b>` : ""}${text ? `<p class="wtxt">${esc(text)}</p>` : ""}${extra ? `<p class="small muted">${extra}</p>` : ""}</div>
    ${wallActs(r, p)}${canCom ? `<button class="pad-add" type="button" data-a="open-post" data-id="${esc(p.id)}" data-c="1"><span aria-hidden="true">＋</span> 댓글 추가</button>` : ""}`;

function wallCard(r, p, mine, ps){

  return `<article class="post wcard${p===mine?" mine":""}${p===mine && S.landed===r.id?" land":""}" style="${wallTone(r,p)}">${padHead(r,p,ps)}${wallCardBody(r,p,ps)}</article>`;

const BLUR_TXT = ["나는 이 문제를 이렇게 생각한다. 왜냐하면 수업 시간에 배운 내용과 자료를 보면 알 수 있기 때문이다.",

  "다른 쪽에서 보면 또 다른 이유가 있을 수 있다. 예를 들어 그 당시 사람들의 입장에서 보면", "짧게 말하면 이렇다."];
const blurCard = (i, tone) => `<div class="post wcard blurred" style="--wc:var(--${tone || SC[i%4]}-soft)" aria-hidden="true"><div class="post-h"><strong>친구</strong></div><p class="wtxt">${BLUR_TXT[i%BLUR_TXT.length]}</p></div>`;
const wallLocked = (r, p) => r.reveal === "after" && !submitted(p);

      <button class="btn pri sm" type="button" data-a="to-stage">내 생각 쓰러 가기</button></div></div>` : ""}</div></section>`;

/* 우리 반의 생각 지도: 입장마다 영역을 나누고 인원과 생각 카드를 보여 준다 (휴대폰에서는 위아래로) */
function stanceMap(r, list, cardFn, {lockNote="", preview=""}={}){

}
function groupedPosts(r, list, cardFn){
  if((r.stances||[]).length) return stanceMap(r, list, cardFn);
  return `<div class="wall">${list.map(cardFn).join("")}</div>`;
}
function stepRead(r, p, open){
  const f = featuresOf(r), ps = postsOf(r.id), others = ps.filter(x => !isMe(x.author));
  const key = "meet:" + r.id, mform = F(key, () => ({diffPostId:p?.meet?.diffPostId||""}));
  const diffId = p?.meet?.diffPostId || mform.diffPostId;
  const diffPost = diffId && ps.find(x=>x.id===diffId);
  const diffName = diffPost ? displayName(r, diffPost.author, ps) : "";
  const hasSt = (r.stances||[]).length > 0;
  let h = p?.readAt ? "" : `<div class="card"><p><b>💬 친구 생각을 읽고, 마음에 남는 글에 댓글로 한마디 남겨 보세요.</b></p>
    <p class="muted small" style="margin-top:4px">${hasSt ? "나와 다른 입장의 글이면 더 좋아요. " : ""}글 아래 ‘＋ 댓글 추가’를 누르면 돼요.${f.deep && f.rebuttal ? " 댓글을 남긴 글에 다음 단계에서 근거를 들어 답해요." : " 한마디를 남기면 이 단계를 마쳐요."}</p></div>`;
  const card = x => readCard(r, x, p, ps, {pickable:false});
  if(hasSt) h += stanceMap(r, ps, card);
  else if(!others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += groupedPosts(r, submitted(p) ? [p, ...others] : others, card);   // 게시판: 내 카드가 맨 앞
  if(hasSt && !others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;

  // 이미 마친 경우: 고른 생각과 내 한마디
  if(p?.readAt){
    const ans = p.meet?.answers || {};
    let saved = diffPost ? `<div class="lbl">내가 고른 ${esc(diffName)}의 생각</div><p class="quote">${esc(previewText(r,diffPost))}</p>` : "";
    saved += MISSIONS.filter(m => ans[m.k]).map(m=>`<div class="lbl">${esc(m.q)}</div><p class="txt">${esc(ans[m.k])}</p>`).join("");
    if(saved) h += `<div class="card saved">${saved}</div>`;
    return h + nextBtn(r);
  }
  if(!open || !S.canWrite) return h;
  if(!others.length) return h + `<div class="next"><button class="btn" type="button" data-a="read-done">지금은 넘어가기 →</button></div>`;

  // 선택 질문 (교사가 켠 경우에만, 모두 선택)
  const extra = MISSIONS.filter(m => f.readMission.includes(m.k));
  const extraHTML = extra.length ? `<details class="help" style="margin-top:14px"><summary>➕ 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">${extra.map(m=>question(key, m.k, {q:m.q, rows:2, opt:true, tip:m.tip, starters:m.starters})).join("")}</div></details>` : "";
  const pickedQuote = diffPost ? `<div class="q"><span class="hint">내가 고른 ${esc(diffName)}의 생각</span><p class="quote">${esc(previewText(r,diffPost))}</p></div>` : "";

  // 댓글로 만나기: 일반은 첫 댓글을 남기면 바로 마침(save-comment). 깊이 있게(근거 들어 답하기)는 댓글 단 글을 골라 ‘다 읽었어요’
  if(f.deep && f.rebuttal || extra.length){
    return h + `<div class="card">${pickedQuote ? pickedQuote.replace("내가 고른", "내가 댓글을 남긴") : `<p class="muted">친구 글에 댓글을 하나 남기면 ‘다 읽었어요’를 누를 수 있어요.</p>`}${extraHTML}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="read-done" ${diffPost ? "" : "disabled"}>다 읽었어요</button></div></div>`;
  }
  return h;
}

/* ---- 함께 생각하기 · 친구 생각에 답하기 ---- */
function replyForm(r, p){
  const f = featuresOf(r), key = "reb:" + p.id;
  const quote = `<div class="q"><span class="hint">친구의 생각</span><p class="quote">${esc(finalBody(p).claim || previewText(r,p))}</p></div>`;
  const send = `<div class="row end"><button class="btn sm" type="button" data-a="close-post">취소</button>
      <button class="btn sm pri" type="button" data-a="save-rebuttal" data-id="${esc(p.id)}">답 남기기</button></div>`;
  if(!f.deep){
    // 기본: 내 의견 + 이유 두 칸
    return `<div class="rform">${quote}
      ${question(key,"text",{q:"이 생각에 대해 나는 어떻게 생각하나요?", rows:2, ...REPLY_HELP})}
      ${question(key,"evidence",{q:"그렇게 생각하는 이유는?", rows:2, tip:"수업 내용, 자료, 경험 중 하나를 들어 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      ${send}</div>`;
  }
  // 깊이 있게: 공감 / 다른 점 / 이유 / 내 의견
  return `<div class="rform">${quote}
    ${question(key,"agree",{q:"공감하는 부분이 있나요?", opt:true, rows:2, tip:"친구 생각에서 인정할 수 있는 점을 먼저 적어 보세요.", starters:[{show:"친구의 의견에서 ___한 점은 공감한다.", ins:"친구의 의견에서 "}]})}
    ${question(key,"differ",{q:"생각이 다른 부분은?", rows:2, tip:"친구 글의 어느 문장에서 생각이 갈리는지 찾아보세요.", starters:[{show:"하지만 나는 ___라고 생각한다.", ins:"하지만 나는 "}]})}
    <div class="q"><label for="${key}-evidence">그렇게 생각하는 이유는?</label>
      ${helpBox(`${key}-evidence`, "수업 내용, 자료, 통계, 사례 중 하나를 들어 보세요.", [{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}])}
      ${f.evidenceType ? `<p class="hint">어디에서 찾은 이유인가요? <span class="opt">(선택)</span></p>${radios(key,"etype",f.evidenceTypes,{label:"이유의 종류"})}` : ""}
      ${ta(key,"evidence",{rows:2})}</div>
    ${question(key,"text",{q:"그래서 나는 이렇게 생각해요", rows:2, ...REPLY_HELP})}
    ${send}</div>`;
}
function respondCard(r, p, ps){
  const isOpen = S.openPost === p.id;
  const mineCount = S.replies.filter(x=>x.postId===p.id && isMe(x.author) && x.kind==="rebuttal").length;
  let h = `<article class="post${isOpen?" open":""}">${postHead(r,p,ps)}`;
  if(!isOpen) return h + `<p class="preview">${esc(previewText(r,p))}</p>
    <div class="pmeta"><span>${mineCount ? "✓ 내가 답했어요" : ""}</span><button class="btn sm" type="button" data-a="open-post" data-id="${esc(p.id)}">답하기</button></div></article>`;
  h += fieldsHTML(r, finalBody(p), {evidenceType:p.evidenceType}) + repliesBlock(r, p, ps);
  if(r.open!==false && S.canWrite) h += replyForm(r, p);
  return h + `</article>`;
}
function stepRespond(r, p, open){
  const ps = postsOf(r.id), others = ps.filter(x=>!isMe(x.author));
  const diffId = p?.meet?.diffPostId;
  // 내가 고른 '가장 다른 글' → 입장이 다른 글 → 나머지 순서
  const rank = x => x.id===diffId ? 0 : (p?.stance && x.stance && x.stance!==p.stance ? 1 : 2);
  const targets = [...others].sort((a,b)=>rank(a)-rank(b));
  const n = myRepliesIn(r,["rebuttal"]).length;
  let h = `<div class="card"><p>글 하나를 골라 답해 보세요. ${diffId ? "내가 고른 ‘가장 다른 글’이 맨 위에 있어요." : ""}</p>
    ${n ? `<p class="small" style="margin-top:4px;color:var(--accent)">✓ 지금까지 ${n}개의 답을 남겼어요.</p>` : ""}</div>`;
  if(!targets.length) h += `<div class="empty">아직 답할 글이 없어요.</div>`;
  else h += `<div class="wall">${targets.map(x=>respondCard(r,x,ps)).join("")}</div>`;
  if(n || p?.respondSkipped) h += nextBtn(r);
  else if(open && S.canWrite) h += `<div class="next"><button class="btn" type="button" data-a="skip-respond">지금은 넘어가기 →</button></div>`;
  return h;
}

/* ---- 다시 생각하기 · 지금의 생각 ---- */
function firstThought(r, p){
  if(isRelay(r)) return {label:"내가 만든 질문", html:`<p class="qline">“${esc((p?.questions||[])[0]?.text||"")}”</p>`};
  if(p?.initial) return {label: p.initial.predict ? "내 예측" : "처음 생각", html:initialHTML(r, p.initial)};
  const t = p?.body?.claim || firstText(p?.body);
  return {label:"처음에 쓴 내 생각", html:`${p?.stance?`<div>${stanceChip(r,p.stance)}</div>`:""}<p class="txt">${esc(t)}</p>`};
}
function changeSaved(r, c){
  const d = DEGREES.find(x=>x.k===c.degree);
  return `${c.nowStance ? `<div>${stanceChip(r,c.nowStance)}</div>` : ""}<p class="txt">${esc(c.now)}</p>
    <p style="margin-top:8px"><span class="chip">${esc(d?d.l:"")}</span> ${(c.influences||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>
    ${c.biggest ? `<p class="txt small" style="margin-top:8px"><span class="muted">영향을 준 것 · </span>${esc(c.biggest)}</p>` : ""}`;
}
function stepReflect(r, p, open){
  const f = featuresOf(r);
  // 예전 '수업 후 다시 생각하기' 방식 (생각의 변화 기능이 꺼진 예측 방)
  if(!f.change){
    if(p?.revisit) return `<div class="card saved"><div class="lbl">수업 후 다시 생각하기</div><p class="txt">${esc(p.revisit)}</p></div>` + nextBtn(r);
    if(!open) return closedNote();
    const key = "rv:" + r.id, first = p?.initial ? firstThought(r, p) : null;
    return (first ? `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>` : "") + `<div class="card">${question(key,"text",{q:"수업을 듣고 나니 내 예측은 어땠나요?", rows:3, tip:"맞았는지보다, 무엇을 새로 알게 됐는지가 중요해요.", starters:[{show:"처음에는 ___라고 예측했는데, ___", ins:"처음에는 "}]})}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revisit">저장하기</button></div></div>`;
  }
  const first = firstThought(r, p), key = "chg:" + r.id, editing = S.form[key]?._edit;
  if(p?.change && !editing){
    return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div><div><div class="lbl">지금의 생각</div>${changeSaved(r,p.change)}</div></div>
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="change-edit">고치기</button>` : ""}` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({now:p?.change?.now||"", nowStance:p?.change?.nowStance||p?.stance||"", degree:p?.change?.degree||"", influences:p?.change?.influences||[], biggest:p?.change?.biggest||""}));
  return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>
    <p class="reassure">생각이 바뀌지 않아도 괜찮아요. 친구의 생각을 보고도 내 생각을 지킬 수 있어요.</p>
    <div class="card">
      <fieldset class="q"><legend>친구들의 생각을 본 뒤, 내 생각이 달라졌나요?</legend>${radios(key,"degree",DEGREE_CHOICES,{label:"생각의 변화"})}</fieldset>
      ${(r.stances||[]).length ? `<fieldset class="q"><legend>지금 내 입장은? <span class="opt">(처음과 같아도 괜찮아요)</span></legend>${radios(key,"nowStance",r.stances,{label:"지금 입장", colors:r.stances.length, icons:stanceIcons(r)})}</fieldset>` : ""}
      ${question(key,"now",{q:"지금 나는 어떻게 생각하나요?", rows:3, tip:"달라졌어도, 그대로여도 괜찮아요. 왜 그런지만 함께 적어 주세요.",
         starters:[{show:"처음에는 ___라고 생각했지만, 지금은 ___라고 생각한다.", ins:"처음에는 "},{show:"처음 생각과 크게 달라지지 않았다. 왜냐하면 ___ 때문이다.", ins:"처음 생각과 크게 달라지지 않았다. 왜냐하면 "},{show:"친구의 생각을 읽고 ___라는 점은 생각하지 못했다.", ins:"친구의 생각을 읽고 "}]})}
      ${f.deep ? `<details class="help" style="margin-top:14px"><summary>➕ 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">
         ${question(key,"biggest",{q:"생각에 가장 영향을 준 것은 무엇인가요?", opt:true, rows:2, tip:"친구의 글, 자료, 선생님 말씀 중 하나를 떠올려 보세요.", starters:[{show:"친구의 글을 읽고 ___을 알게 되었다.", ins:"친구의 글을 읽고 "}]})}
         <fieldset class="q"><legend>영향을 준 것 고르기 <span class="opt">(선택)</span></legend>${checks(key,"influences",INFLUENCES,{label:"영향을 준 것"})}</fieldset></div></details>` : ""}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-change">지금의 생각 남기기</button></div></div>`;
}

/* ---- 다시 생각하기 · 글 다시 쓰기 ---- */
function receivedSummary(r, p){
  const ps = postsOf(r.id);
  const show = repliesOf(p.id).filter(x => x.kind==="teacher" || x.kind==="rebuttal" || x.kind==="note" || x.kind==="comment");
  if(!show.length) return `<p class="muted small">아직 받은 답이나 피드백이 없어요.</p>`;
  return `<div class="replies">${show.map(x=>replyHTML(r,x,ps)).join("")}</div>`;
}
function stepRevise(r, p, open){
  const key = "rev:" + r.id, editing = S.form[key]?._edit;
  if(isEssay(r) && p?.essay){
    if(p.revision?.essay && !editing){
      return `<div class="card"><h3>고쳐 쓴 글</h3><p class="txt">${esc(p.revision.essay)}</p>
        ${(p.revision.edits||[]).length ? `<p style="margin-top:8px">${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
        ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
        <details class="card"><summary>처음 쓴 글 보기</summary><p class="txt" style="margin-top:10px">${esc(p.essay.text)}</p></details>` + nextBtn(r);
    }
    if(!open) return closedNote();
    F(key, () => ({essay:p.revision?.essay || p.essay.text, edits:p.revision?.edits || []}));
    return `<div class="compare"><div><div class="lbl">받은 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
      <div class="card"><div class="q"><label for="${key}-essay">글 고쳐 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요</span></label>${ta(key,"essay",{rows:12})}</div>
        <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
        <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">고친 글 저장</button></div></div>`;
  }
  if(p?.revision && !editing){
    return `<div class="card"><h3>다시 쓴 글</h3>${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}
      ${(p.revision.edits||[]).length ? `<p>${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
      <details class="card"><summary>처음 글 보기</summary><div style="margin-top:10px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></details>` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({...(p?.revision?.body || p?.body || {}), edits:p?.revision?.edits || []}));
  let form = "";
  for(const x of effFields(r)){
    const s = sField(r, x);
    form += question(key, x.k, {q:s.q, rows:3, tip:s.tip, starters:[]});
  }
  return `<div class="compare">
      <div><div class="lbl">처음 글</div><div style="margin-top:6px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></div>
      <div><div class="lbl">받은 답과 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
    <div class="card"><h3>다시 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요. 고치고 싶은 곳만 고치세요.</span></h3>${form}
      <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">다시 쓴 글 저장</button></div></div>`;
}

/* ---- 결과 화면: 나의 생각 흐름 (입력 없음, 자동 정리) ---- */
function thinkFlow(r, p){
  if(isRelay(r)) return relayFlow(r, p);
  const teacher = isTeacher(), reps = repliesOf(p.id), ps = postsOf(r.id), b = p.body || {}, fields = effFields(r);
  const L = (s, t) => teacher ? t : s;
  const node = (ic, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  if(p.chat?.log?.length) h += node("🎭", `${stepMeta(r,"chat").s} (질문 ${p.chat.log.filter(x=>x.role==="user").length}개)`, `<details class="chatfold"><summary class="muted small">대화 펼쳐 보기</summary>${chatLogHTML(r, p.chat.log)}</details>`);
  if(p.initial) h += node(p.initial.predict ? "🔮" : "💭", p.initial.predict ? "내 예측" : "처음 생각", `<div class="v">${initialHTML(r,p.initial)}</div>`);
  // 내가 말한 생각 + 이유
  if(fields.some(x=>x.k==="claim")){
    h += node("✏️", L((r.stances||[]).length ? "처음 입장 · 내 생각" : "내가 말한 생각","주장"), `<div class="v">${p.stance?stanceChip(r,p.stance)+" ":""}${esc(b.claim||"")}</div>`);
    if(b.reason) h += node("📚", L("내가 든 이유","근거"), `<div class="v">${p.evidenceType?`<span class="chip">${esc(p.evidenceType)}</span> `:""}${esc(b.reason)}</div>${b.warrant?`<div class="sub"><span class="muted">${L("도움이 되는 까닭","근거 설명")} · </span>${esc(b.warrant)}</div>`:""}`);
    const rest = fields.filter(x => !["claim","reason","warrant"].includes(x.k) && b[x.k]);
    if(rest.length) h += node("📝", L("그 밖에 쓴 내용","기타 서술"), rest.map(x=>`<div class="sub"><span class="muted">${esc(fieldLabel(r,x))} · </span>${esc(b[x.k])}</div>`).join(""));
  }else{
    h += node("✏️", L("내가 말한 생각","작성한 글"), `<div class="v">${fieldsHTML(r, b, {evidenceType:p.evidenceType})}</div>`);
  }
  if(p.deeper && (p.deeper.other || p.deeper.source)) h += node("🔍", L("더 깊이 생각한 것","심화(다른 관점·자료)"), `${p.deeper.other?`<div class="sub"><span class="muted">다른 관점 · </span>${esc(p.deeper.other)}</div>`:""}${p.deeper.source?`<div class="sub"><span class="muted">자료 · </span>${esc(p.deeper.source)}</div>`:""}`);
  if(p.essay?.text) h += node("📄", L("내가 쓴 글","작성한 글"), `<div class="v">${esc(p.essay.text)}</div>`);
  if(p.counter) h += node("🤔", L("나와 다른 생각 예상","예상 반론"), `<div class="v">${esc(p.counter.objection)}</div>${p.counter.response?`<div class="sub"><span class="muted">${L("내 대답","재반박")} · </span>${esc(p.counter.response)}</div>`:""}`);
  // 만난 다른 생각
  const diff = p.meet?.diffPostId && ps.find(x=>x.id===p.meet.diffPostId);
  const myReplies = S.replies.filter(x=>x.roomId===r.id && x.author===p.author && (x.kind==="rebuttal"||x.kind==="comment"));
  const meetAns = MISSIONS.filter(m => p.meet?.answers?.[m.k] && !(m.k==="reply" && myReplies.length));
  if(diff || meetAns.length){
    h += node("👥", L("친구의 생각","친구 글 읽기"),
      (diff ? `<div class="v"><span class="muted small">내가 고른 생각 · ${esc(displayName(r,diff.author,ps))}</span><p class="quote" style="margin-top:4px">${esc(previewText(r,diff))}</p></div>` : "") +
      meetAns.map(m=>`<div class="sub"><span class="muted">${esc(m.q)} · </span>${esc(p.meet.answers[m.k])}</div>`).join(""));
  }
  // 내가 한 답
  if(myReplies.length) h += node("💡", L("친구 생각을 읽고 내가 발견한 점","작성한 반박·댓글"), `<div class="sub muted">${myReplies.length}개</div><div class="replies">${replyHTML(r,myReplies[myReplies.length-1],ps)}</div>`);
  // 받은 반응과 피드백
  const got = reps.filter(x=>x.kind==="rebuttal"||x.kind==="comment"||x.kind==="note");
  if(got.length) h += node("👂", L("친구들이 남긴 답","받은 반박·댓글"), `<div class="sub muted">${got.length}개</div><div class="replies">${got.slice(-2).map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  const fb = reps.filter(x=>x.kind==="teacher");
  if(fb.length) h += node("🧑‍🏫", L("나에게 온 선생님 피드백","개인 피드백"), `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  // 지금의 생각
  if(p.revision?.essay) h += node("🔄", L("고쳐 쓴 글","최종 수정본"), `<div class="v">${esc(p.revision.essay)}</div>`, true);
  else if(p.revision) h += node("🔄", L("지금의 생각 · 다시 쓴 글","최종 수정본"), `<div class="v">${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}</div>${p.change?`<div class="sub"><span class="chip">${esc(DEGREES.find(d=>d.k===p.change.degree)?.l||"")}</span> ${esc(p.change.biggest||"")}</div>`:""}`, true);
  else if(p.change) h += node("🔄", L("지금의 생각","생각의 변화"), `${p.stance && p.change.nowStance ? `<div class="sub">처음에는 ${stanceChip(r,p.stance)} → 지금은 ${stanceChip(r,p.change.nowStance)}${p.stance===p.change.nowStance ? ' <span class="muted">· 입장은 그대로, 생각은 더 깊어졌어요</span>' : ' <span class="muted">· 생각이 달라졌어요</span>'}</div>` : ""}<div class="v">${changeSaved(r,p.change)}</div>`, true);
  else if(p.revisit) h += node("🔄", L("수업 후의 생각","수업 후 다시 생각하기"), `<div class="v">${esc(p.revisit)}</div>`, true);
  return h + `</ol>`;
}
function stepRecord(r, p){
  if(!submitted(p)) return `<div class="empty">글을 내면 나의 생각 흐름이 여기에 정리돼요.</div>`;
  let h = `<div class="card"><div class="flow-h"><h3>🧭 나의 생각 흐름</h3><p class="muted small">${esc(TEMPLATES[r.template]?.flowSummary || "처음 생각 → 친구의 생각 → 지금의 생각")}</p></div>${thinkFlow(r,p)}</div>`;
  // 빠른 활동: 만남 단계가 없어도 친구 글은 둘러볼 수 있다
  if(!featuresOf(r).meet && r.reveal !== "teacher"){
    const ps = postsOf(r.id), others = ps.filter(x=>!isMe(x.author));
    if(others.length) h += `<details class="card"><summary>친구들 생각 둘러보기 (${others.length}편)</summary><div style="margin-top:12px">${groupedPosts(r, others, x => readCard(r, x, p, ps, {pickable:false}))}</div></details>`;
  }
  return h + `<div class="row end"><button class="btn" type="button" data-a="mine">내 생각 기록 전체 보기</button></div>`;
}

/* ---- 질문으로 생각하기 · 질문 보기 ---- */
function stepSee(r, p, open){
  const q = QTYPES[r.qtype];
  return `<div class="card"><div class="eyebrow">🔎 오늘의 질문</div><p class="qline" style="font-size:20px;margin-top:6px">${esc(r.prompt)}</p>
    ${q ? `<p class="row" style="margin-top:10px">${qtypeChip(r.qtype)}<span class="muted small">${esc(q.d)}</span></p>` : ""}
    <div style="margin-top:10px">${qtypeHelp()}</div>
    <div class="foot"><span></span><button class="btn pri" type="button" data-a="see-done">내 생각 쓰러 가기</button></div></div>`;
}
/* ---- 논술 · 글쓰기 ---- */
const essayKey = r => "essay:" + r.id;
function essayStatusHTML(r){
  const t = F(essayKey(r)).text || "", n = cnt(t), min = r.minChars || 0, ok = t.trim() && n >= min;
  const pct = min ? Math.min(100, n/min*100) : 100;
  return `<div class="status ${ok?"ok":""}" id="estatus" aria-live="polite"><span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>
    ${min ? `<span class="mono small">${n} / 최소 ${min}자</span>` : ""}<span>${ok ? "✓ 보낼 수 있어요." : "정리한 생각과 근거를 이어서 써 보세요."}</span></div>`;
}
function stepCompose(r, p, open){
  const editing = S.form[essayKey(r)]?._edit;
  if(p?.essay?.text && !editing){
    return `<div class="card"><h3>내가 쓴 글</h3><p class="txt">${esc(p.essay.text)}</p>
      ${open && S.canWrite && !p.revision ? `<button class="linkbtn" type="button" data-a="essay-edit">고치기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  const key = essayKey(r), b = p?.body || {};
  F(key, () => ({text:p?.essay?.text || ""}));
  const outline = effFields(r).map(x => b[x.k] ? `${b[x.k]}` : "").filter(Boolean).join("\n\n");
  return `<details class="card" open><summary style="cursor:pointer;font-weight:600">내가 정리한 생각과 근거</summary><div style="margin-top:10px">${fieldsHTML(r, b, {evidenceType:p?.evidenceType})}</div></details>
    <div class="card"><div class="q"><label for="${key}-text">한 편의 글로 써 보세요</label>
      ${helpBox(`${key}-text`, "처음–가운데–끝으로 나누면 쉬워요. 정리한 내용을 불러와서 다듬어도 돼요.", [{show:"정리한 내용 불러오기", ins:outline},{show:"나는 ___라고 생각한다. 그 이유는 첫째, …", ins:"나는 "}])}
      ${ta(key,"text",{rows:12})}</div>
      <div class="foot">${essayStatusHTML(r)}<button class="btn pri" type="button" data-a="essay-save">글 보내기</button></div></div>`;
}
/* ---- 논술 · 피드백 보기 ---- */
function stepFeedback(r, p, open){
  const fb = repliesOf(p.id).filter(x => x.kind==="teacher"), ps = postsOf(r.id);
  if(fb.length) return `<div class="card"><h3>선생님 피드백</h3><div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div></div>` + nextBtn(r);
  return `<div class="empty">선생님이 글을 읽고 있어요. 피드백이 오면 여기에 보여요.</div>
    ${p.feedbackSkipped ? nextBtn(r) : (open && S.canWrite ? `<div class="next"><button class="btn" type="button" data-a="fb-skip">피드백 없이 다음으로 →</button></div>` : "")}`;
}

/* =========================================================
   질문이음 — 정해진 순서 없이 '질문 카드 풀'에서 원하는 질문을 이어받는다
   질문: posts 문서의 questions[] · 이어받은 생각: replies(kind "answer", qid) · 질문자의 반응: posts.reactions
   ========================================================= */
const RELAY_REACT = [
  {k:"curious", l:"💡 더 궁금해졌어요"},
  {k:"changed", l:"🔄 생각이 달라졌어요"},
  {k:"newidea", l:"✨ 새로운 생각을 얻었어요"}
];
const ASK_HELP = {tip:"‘왜’, ‘만약’, ‘어떻게’로 시작하면 질문이 잘 떠올라요.",
  starters:[{show:"왜 ___였을까?", ins:"왜 "},{show:"만약 ___였다면 어떻게 되었을까?", ins:"만약 "},{show:"어떻게 ___할 수 있었을까?", ins:"어떻게 "}]};
const fixedQtype = r => QTYPES[r.qtype] ? r.qtype : "";
const answersTo = (p, q) => S.replies.filter(x => x.kind==="answer" && x.postId===p.id && x.qid===q.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function relayPool(r){
  const out = [];
  postsOf(r.id).forEach(p => (p.questions||[]).forEach(q => out.push({p, q, answers:answersTo(p,q)})));
  return out;
}
function relayCard(r, it, ps, {action=false}={}){
  const mine = it.answers.some(a => isMe(a.author));
  return `<article class="qcard"><div class="eyebrow">🔎 질문${it.q.from ? " · 이어진 질문" : ""}</div>
    <p class="qt">“${esc(it.q.text)}”</p>
    <div class="meta">${qtypeChip(it.q.qtype)}<span>만든 친구: ${esc(displayName(r, it.p.author, ps))}</span><span>답 ${it.answers.length}개</span></div>
    ${action ? (mine ? `<p class="small" style="color:var(--accent);font-weight:600">✓ 내가 이어받은 질문</p>`
                     : `<button class="btn pri" type="button" data-a="take" data-id="${esc(it.p.id)}" data-q="${esc(it.q.id)}">이 질문 이어받기</button>`) : ""}</article>`;
}
function qtypeField(r, key){
  if(fixedQtype(r)) return `<p class="small">이번에는 ${qtypeChip(r.qtype)}을 만들어요. <span class="muted">${esc(QTYPES[r.qtype].d)}</span></p>`;
  return `<fieldset class="q"><legend>어떤 질문인가요? <span class="opt">(선택)</span></legend>
    ${radios(key,"qtype",Object.entries(QTYPES).map(([k,v])=>({k, l:`${v.mark} ${v.short}`})),{label:"질문 유형"})}${qtypeHelp("내 질문 점검하기")}</fieldset>`;
}
/* ① 질문 만들기: 입력창 하나 */
function stepAsk(r, p, open){
  const qs = p?.questions || [], key = "ask:" + r.id, ps = postsOf(r.id);
  if(qs.length && !S.form[key]?._edit){
    const it = {p, q:qs[0], answers:answersTo(p, qs[0])};
    return relayCard(r, it, ps) + (open && S.canWrite && !it.answers.length ? `<button class="linkbtn" type="button" data-a="ask-edit">질문 고치기</button>` : "") + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:qs[0]?.text||"", qtype:qs[0]?.qtype||""}));
  return `<div class="card">
    ${question(key,"text",{q:"💡 어떤 질문이 떠올랐나요?", rows:2, ph:"질문을 입력하세요", ...ASK_HELP})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><span class="muted small">질문을 보내면 친구들이 이어받아 답해요.</span>
      <button class="btn pri" type="button" data-a="ask-save">질문 보내기</button></div></div>`;
}
/* ② 질문 이어받기: 카드 풀에서 골라 답하기 */
function stepTake(r, p, open){
  const ps = postsOf(r.id), pool = relayPool(r).filter(it => !isMe(it.p.author));
  const sel = S.take && pool.find(it => it.p.id===S.take.pid && it.q.id===S.take.qid);
  const myAns = myRepliesIn(r, ["answer"]);
  if(sel && open && S.canWrite){
    const key = `ans:${sel.p.id}:${sel.q.id}`;
    return relayCard(r, sel, ps) + `<div class="card">
      ${question(key,"text",{q:"이 질문에 대한 내 생각은?", rows:2, tip:"정답을 맞히는 게 아니에요. 지금 떠오르는 생각을 적어 보세요.", starters:[{show:"나는 ___라고 생각한다.", ins:"나는 "},{show:"잘 모르겠지만 ___일 것 같다.", ins:"잘 모르겠지만 "}]})}
      ${question(key,"evidence",{q:"왜 그렇게 생각하나요?", opt:true, rows:2, tip:"수업 내용, 자료, 내 경험 중 하나를 떠올려 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      <div class="foot"><button class="linkbtn" type="button" data-a="take-cancel">다른 질문 고르기</button>
        <button class="btn pri" type="button" data-a="answer-save" data-id="${esc(sel.p.id)}" data-q="${esc(sel.q.id)}">내 생각 보내기</button></div></div>`;
  }
  // 아직 내가 답하지 않은 질문, 답이 적은 질문이 앞으로
  const rank = it => (it.answers.some(a=>isMe(a.author)) ? 1000 : 0) + it.answers.length;
  const sorted = [...pool].sort((a,b) => rank(a)-rank(b) || (a.q.at||0)-(b.q.at||0));
  let h = `<div class="card"><p><b>친구의 질문 하나를 골라 이어받아 보세요.</b></p>
    <p class="muted small" style="margin-top:4px">답이 적은 질문이 앞에 있어요.${myAns.length ? ` · 지금까지 ${myAns.length}개 이어받았어요.` : ""}</p></div>`;
  if(!sorted.length) h += `<div class="empty">아직 친구들이 만든 질문이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += `<div class="qgrid">${sorted.map(it => relayCard(r, it, ps, {action: open && S.canWrite})).join("")}</div>`;
  if(myAns.length) h += nextBtn(r);
  return h;
}
/* ③ 내 질문으로 돌아가기: 친구의 생각 → 나의 생각(반응) */
function stepBack(r, p, open){
  const ps = postsOf(r.id), qs = p?.questions || [], can = open && S.canWrite;
  const items = qs.map(q => ({q, answers:answersTo(p,q)})).filter(x => x.answers.length);
  if(!items.length){
    return `<div class="empty">아직 내 질문에 답한 친구가 없어요. 조금만 기다려 주세요.
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" type="button" data-a="step" data-v="take">그동안 다른 질문 이어받기</button></div></div>`;
  }
  let h = "";
  for(const {q, answers} of items){
    h += `<div class="card"><ol class="flow">
      <li><span class="ic" aria-hidden="true">🌱</span><div style="min-width:0"><div class="k">내가 만든 질문</div><p class="qline">“${esc(q.text)}”</p>${qtypeChip(q.qtype)}</div></li>
      ${answers.map(a => {
        const re = p.reactions?.[a.id], nk = "rn:" + a.id;
        return `<li><span class="ic" aria-hidden="true">👤</span><div style="min-width:0"><div class="k">${esc(displayName(r,a.author,ps))}의 생각</div>
          <div class="v">${esc(a.text)}</div>${a.evidence ? `<div class="sub"><span class="muted">이유 · </span>${esc(a.evidence)}</div>` : ""}
          <p class="small muted" style="margin-top:8px">💡 이 생각을 읽고 나는?</p><div class="react" role="group" aria-label="이 생각을 읽고 나는?">${RELAY_REACT.map(x => `<button type="button" data-a="react" data-id="${esc(a.id)}" data-v="${x.k}" aria-pressed="${re?.kind===x.k}" ${can?"":"disabled"}>${x.l}</button>`).join("")}</div>
          ${re?.note ? `<p class="small" style="margin-top:6px"><span class="muted">나의 생각 · </span>${esc(re.note)}</p>`
            : (re && can ? `<details class="help" style="margin-top:6px"><summary>✏️ 한 줄 덧붙이기 (선택)</summary>${ta(nk,"text",{rows:2, ph:"이 생각을 읽고 든 내 생각"})}<div class="row end" style="margin-top:6px"><button class="btn sm" type="button" data-a="react-note" data-id="${esc(a.id)}">덧붙이기</button></div></details>` : "")}
        </div></li>`;
      }).join("")}</ol></div>`;
  }
  if(Object.keys(p.reactions||{}).length) h += nextBtn(r);
  else h += `<p class="muted small" style="text-align:center">친구의 생각 하나를 읽고, 아래 세 가지 중 하나를 눌러 보세요.</p>`;
  return h;
}
/* ④ 질문 키우기: 새 질문은 다시 카드 풀로 */
function stepDevelop(r, p, open){
  const qs = p?.questions || [], ps = postsOf(r.id), last = qs[qs.length-1], key = "dev:" + r.id;
  if(qs.length > 1){
    return qs.slice(1).map(q => relayCard(r, {p, q, answers:answersTo(p,q)}, ps)).join("") + nextBtn(r);
  }
  if(p?.developSkipped && !S.form[key]?._open){
    return `<div class="card"><p class="muted">이번에는 질문 키우기를 넘어갔어요.</p>${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="dev-open">그래도 질문 키워 보기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:"", qtype:last?.qtype||""}));
  return `<div class="card">
    <div class="q"><span class="hint">처음 질문</span><p class="quote">${esc(last?.text||"")}</p></div>
    ${question(key,"text",{q:"🌿 친구의 생각을 보고 새로 궁금해진 것은?", rows:2, ph:"새 질문을 입력하세요", tip:"처음 질문을 더 깊게, 또는 더 넓게 바꿔 보세요.",
       starters:[{show:"그렇다면 ___는 어떨까?", ins:"그렇다면 "},{show:"왜 ___일까?", ins:"왜 "},{show:"만약 ___라면?", ins:"만약 "}]})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><button class="linkbtn" type="button" data-a="dev-skip">이번엔 넘어가기</button>
      <button class="btn pri" type="button" data-a="develop-save">새 질문 보내기</button></div></div>`;
}
/* 질문이음의 생각 흐름: 질문 씨앗 → 친구의 생각 → 나의 생각 → 새로운 질문 */
function relayFlow(r, p){
  const ps = postsOf(r.id), qs = p.questions || [], teacher = isTeacher();
  const node = (ic, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  qs.forEach((q, i) => {
    h += node(i ? "🌿" : "🌱", i ? "새롭게 생긴 질문" : "내가 만든 질문", `<p class="qline">“${esc(q.text)}”</p>${qtypeChip(q.qtype)}`, i>0 && i===qs.length-1);
    const ans = answersTo(p, q);
    if(ans.length) h += node("👤", "친구의 생각", ans.map(a => `<div class="sub"><b>${esc(displayName(r,a.author,ps))}</b> · ${esc(a.text)}${a.evidence?` <span class="muted">(${esc(a.evidence)})</span>`:""}</div>`).join(""));
    const re = ans.filter(a => p.reactions?.[a.id]);
    if(re.length) h += node("💡", "내가 발견한 점", re.map(a => { const x = p.reactions[a.id]; return `<div class="sub">${esc(RELAY_REACT.find(k=>k.k===x.kind)?.l||"")}${x.note?` · ${esc(x.note)}`:""}</div>` }).join(""));
  });
  const taken = S.replies.filter(x => x.roomId===r.id && x.kind==="answer" && x.author===p.author);
  if(taken.length) h += node("🔗", teacher ? "이어받아 답한 질문" : "내가 이어받은 질문", taken.map(a => {
    const owner = ps.find(x=>x.id===a.postId), q = owner?.questions?.find(y=>y.id===a.qid);
    return `<div class="sub"><span class="muted">“${esc(q?.text||"")}” → </span>${esc(a.text)}</div>`;
  }).join(""));
  const fb = repliesOf(p.id).filter(x=>x.kind==="teacher");
  if(fb.length) h += node("🧑‍🏫", "선생님 피드백", `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  return h + `</ol>`;
}

/* 향후 사고 보조(AI) 자리: 각 단계의 question() 옆 도움말(helpBox)에 '생각을 더 깊게 해 볼 질문' 같은
   보조 제안을 붙일 수 있도록 도움말을 한곳에서 만든다. 지금은 구현하지 않는다. */

/* =========================================================
   10. 방 — 교사: 현황판 + 학생별 사고 과정 (학습 용어 사용)
   ========================================================= */
function barRow(label, n, total){
  const pct = total ? Math.round(n/total*100) : 0;
  return `<div class="bar"><span>${esc(label)}</span><span class="track" role="img" aria-label="${esc(label)} ${n}명 / ${total}명"><i style="width:${pct}%"></i></span><span class="num">${n} / ${total}</span></div>`;
}
/* 참여 통계: 활동에 실제로 있는 단계만 센다 */
/* 이 활동을 해야 하는 학생(이름표): 과목에 수강 학생이 정해져 있으면 그 학생만, 그룹을 고르면 그 그룹 학생만 */
function courseRoster(r, gid = ""){
  const c = courseOf(r.courseId);
  if(S.mode !== "supa" || !c || !Array.isArray(c.members)) return null;            // 수강 학생을 정하지 않았으면 예전 방식
  if(S.roster === undefined){ if(!S.rosterLoading){ S.rosterLoading = true; loadRoster().then(() => { S.rosterLoading = false; render() }) } return [] }
  let ids = new Set(c.members);
  const gm = g => groupsOf(c).find(x => x.id === g)?.members, ag = asgIds(r);
  if(gid && Array.isArray(gm(gid))) ids = new Set(gm(gid));
  else if(!gid && ag.length && ag.every(g => Array.isArray(gm(g)))) ids = new Set(ag.flatMap(g => gm(g)));   // 일부 그룹에만 배포한 활동
  return (S.roster || []).filter(x => ids.has(x.id)).map(rosterLabel);
}
/* 👀 조회 기록: 학생이 활동을 열면 room_view()로 한 번 남기고, 선생님은 room_viewers()로 본다 (30초마다 새로) */
const VIEWED = new Set();
function markViewed(r){
  if(S.mode !== "supa" || S.demo || S.preview || isTeacher() || !S.name || !SB || VIEWED.has(r.id)) return;
  VIEWED.add(r.id); rpcSafe("room_view", {p_room:r.id});
}
const viewsOn = () => S.demo || (S.mode === "supa" && !!SB);
function viewersOf(r){                                                   // 이름표 → {first, last, n}
  const m = new Map();
  if(S.demo){ (S.demoViews?.[r.id] || []).forEach(v => m.set(v.who, {first:v.at, last:v.at, n:1})); return m }
  if(S.mode !== "supa" || !SB) return m;
  S.views = S.views || {};
  const c = S.views[r.id];
  if(!c?.loading && (!c || Date.now() - c.at > 30000)){
    S.views[r.id] = {list:c?.list || [], at:c?.at || 0, loading:true};
    rpcSafe("room_viewers", {p_room:r.id}).then(res => { S.views[r.id] = {list:Array.isArray(res?.data) ? res.data : (c?.list || []), at:Date.now()}; if(S.view === "room" && S.roomId === r.id) render() });
  }
  if(S.roster === undefined && !S.rosterLoading){ S.rosterLoading = true; loadRoster().then(() => { S.rosterLoading = false; render() }) }
  const byId = new Map((S.roster || []).map(x => [x.id, rosterLabel(x)]));
  (S.views[r.id]?.list || []).forEach(v => { const n = byId.get(v.student_id); if(n) m.set(n, {first:Date.parse(v.first_at), last:Date.parse(v.last_at), n:v.n}) });
  return m;
}
function teacherStats(r){
  const gs = S.gsel && S.gselRoom === r.id;                       // 그룹별 보기: 활동 전체 명단·학생 수는 쓰지 않는다
  const cr = courseRoster(r, gs ? S.gsel : "");
  const all = allPostsOf(r.id), sub = all.filter(submitted), roster = cr || (gs ? [] : (tnote(r).roster || []));
  const total = cr ? cr.length : gs ? 0 : (roster.length || Number(r.classSize) || 0);
  const steps = stepsOf(r);
  const complete = all.filter(p => steps.every(st => stepDone(r,p,st)));
  const st = {all, sub, total, roster, complete:complete.length, participants:all.length,
    inProgress: all.length - complete.length, notJoined: total ? Math.max(0, total - all.length) : null};
  if(steps.includes("reflect")) st.reflected = all.filter(p => stepDone(r,p,"reflect")).length;
  if(steps.includes("revise")) st.revised = all.filter(p => p.revision).length;
  return st;
}
/* 학생 한 명의 진행 상태 */
function progressOf(r, p){
  if(!p) return {label:"미참여", cls:"none", pct:0, cur:""};
  const steps = stepsOf(r), done = steps.filter(st => stepDone(r,p,st)).length;
  if(done === steps.length) return {label:"완료", cls:"done", pct:100, cur:""};
  const cur = steps.find(st => !stepDone(r,p,st));
  const i = steps.indexOf(cur);
  return {label: !submitted(p) ? `첫 응답 작성 중 · ${STEP[cur].t}` : `${i+1}단계 진행 중 · ${STEP[cur].t}`, cls:"", pct:Math.round(done/steps.length*100), cur};
}
const TTABS = [["overview","개요"],["progress","참여 현황"],["students","학생 생각"],["change","생각의 변화"],["feedback","피드백"],["settings","설정"]];

      <span class="mmeta">${esc([r.grade, r.subject, r.unit].filter(Boolean).join(" / "))}${r.duration?` · ⏱ ${esc(r.duration)}분`:""}</span></div>

      <button class="btn sm m-only" type="button" data-a="qr" data-id="${esc(r.id)}" title="QR 코드와 링크 복사">🔗 링크·QR</button>
      <button class="btn sm" type="button" data-a="preview" data-id="${esc(r.id)}">👀 <span class="lt">학생 화면 </span>미리보기</button>
      ${isNotes(r) ? "" : `<button class="btn sm" type="button" data-a="present" data-id="${esc(r.id)}">📽 <span class="lt">수업에서 </span>함께 보기</button>`}
      <span class="sp"></span><span class="ab2">

      ${statusButtons(r, true)}${statusOf(r) !== "archived" && statusOf(r) !== "draft" ? `<button class="btn sm" type="button" data-a="status" data-id="${esc(r.id)}" data-v="archived" title="${STATUS.archived.d}">🗄 보관</button>` : ""}
      <button class="btn sm danger" type="button" data-a="del-ask" data-id="${esc(r.id)}">🗑 삭제</button></span>
    </div></section>`;
  if(!isNotes(r)) h += tmrPanel(r);                                    // ⏱ 수업 타이머 (오늘의 필기는 과제라 뺀다)

  if(isNotes(r)) return h + viewNotesTeacher(r);                    // 오늘의 필기: 학생별 사진 확인
  // 상단 요약: 활동에 맞는 숫자만
  const k = [];
  if(viewsOn()){ st.vw = viewersOf(r); const ok = n => !st.roster.length || st.roster.includes(n);
    st.viewed = new Set([...st.vw.keys(), ...st.all.map(p => p.author)].filter(ok)).size;

  k.push(`<div class="kpi"><b>${st.participants}${st.total?`<small> / ${st.total}</small>`:""}</b><span>참여</span></div>`);

  if(st.notJoined !== null) k.push(`<div class="kpi"><b>${st.notJoined}</b><span>미참여</span></div>`);
  if(st.reflected !== undefined) k.push(`<div class="kpi"><b>${st.reflected}</b><span>${featuresOf(r).change ? "생각 변화 기록" : "돌아보기 완료"}</span></div>`);

  const body = {overview:tabOverview, progress:tabProgress, students:tabStudents, change:tabChange, feedback:tabFeedback, settings:tabSettings}[tab] || tabOverview;

/* 상태 버튼: 작성 중 → 공개 / 진행 중 → 마감 / 마감 → 다시 열기 / 보관 → 보관 해제 */
function statusButtons(r, big){
  const s = statusOf(r), c = big ? "btn sm" : "btn sm";
