/* 활동·기능에 따라 칠판 문구를 바꾼다 */
function stepMeta(r, st){
  const m = {...STEP[st]}, t = TEMPLATES[r.template] || {}, f = featuresOf(r);
  if(t.titles?.[st]) m.title = t.titles[st];
  if(t.stepNames?.[st]) m.s = t.stepNames[st];
  if(st === "chat"){ const nm = personaOf(r).name, c = nm.slice(-1).charCodeAt(0), j = c >= 0xAC00 && c <= 0xD7A3 && (c-0xAC00)%28 ? "과" : "와"; m.title = `${nm}에게 물어볼까요?`; m.s = `${nm}${j} 대화` }
  if(t.descs?.[st]) m.desc = t.descs[st];
  if(st==="think" && f.predict){ m.title = "먼저 예측해 볼까요?"; m.desc = "자료나 친구 생각을 보기 전에, 어떻게 될지 짐작해 보세요. 틀려도 괜찮아요."; m.s = "예측하기" }
  if(st==="read" && (r.stances||[]).length){ m.title = "우리 반의 생각을 둘러볼까요?"; m.desc = "내 생각과 다른 의견을 하나 골라 보세요." }
  if(st==="why" && TEMPLATES[r.template]?.labels?.reason) m.title = TEMPLATES[r.template].labels.reason.q;
  if(st==="take" && S.take){ m.title = "이 질문에 답해 보세요"; m.desc = "내 생각과 그렇게 생각한 이유를 적어 주세요." }
  if(st==="reflect" && f.predict && !f.change){ m.title = "내 예측과 비교해 볼까요?"; m.desc = "맞았는지보다 새로 알게 된 것이 중요해요." }
  return m;
}

  g.strokeStyle = "#b9c8e0"; g.lineWidth = 2; for(let y = 90; y < 780; y += 36){ g.beginPath(); g.moveTo(30, y); g.lineTo(570, y); g.stroke() }

const YT_RE = /https?:\/\/(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?[^\s<]*?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})([^\s<]*)/g;
const ytStart = q => { const m = /[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/.exec(q || ""); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0 };
function ytCards(text){
  const seen = new Set(), out = [];
  String(text || "").replace(YT_RE, (u, id, rest) => { if(!seen.has(id) && seen.size < 3){ seen.add(id); out.push(`<span class="yt"><button type="button" class="yt-play" data-a="yt-play" data-v="${id}" data-s="${ytStart(rest)}" aria-label="유튜브 영상 재생"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="yt-btn" aria-hidden="true"></span></button></span>`) } return u });

}

const statusOf = r => { const s = STATUS[r?.status] ? r.status : (r?.open === false ? "closed" : "open"); return s === "open" && pastDue(r) ? "closed" : s };
/* 마감 시각 표시: 오늘 18:00 · 내일 9:00 · 10월 12일(월) 18:00 */
function fmtDue(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date(), z = n => String(n).padStart(2,"0"), hm = `${d.getHours()}:${z(d.getMinutes())}`;
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(d) - day(now)) / 864e5);
  if(diff === 0) return `오늘 ${hm}`;
  if(diff === 1) return `내일 ${hm}`;
  return `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]}) ${hm}`;
}
const dueChip = r => !r?.dueAt ? "" : pastDue(r) ? `<span class="chip due over">${ic("alarm", "sm")} ${esc(fmtDue(r.dueAt))} 마감됨</span>`
  : `<span class="chip due${r.dueAt - Date.now() < 864e5 ? " soon" : ""}">${ic("alarm", "sm")} ${esc(fmtDue(r.dueAt))}까지</span>`;
const statusChip = r => `<span class="chip st-${statusOf(r)}" title="${STATUS[statusOf(r)].d}">${STATUS[statusOf(r)].l}</span>`;
const visibleToStudents = r => ["open","closed"].includes(statusOf(r));
const tnote = r => S.tnotes.find(x => x.id === r.id) || {};             // 교사만 읽는 메모·명단

/* ---- 수업(Course) · 그룹(Group) · 배포(Assignment) ----
   room은 그대로 ‘활동’이다. 활동에 courseId(어느 수업)와 assign{그룹id:{status,startAt,dueAt}}(어느 그룹에 배포)을 더한다.
   courseId·assign이 없는 예전 활동은 ‘미분류’로 지금처럼 동작한다. 학생 응답(post)에는 groupId만 더한다. */
const courseOf = id => S.courses.find(c => c.id === id) || null;
const groupsOf = c => (c && Array.isArray(c.groups)) ? c.groups : [];
const groupName = (cid, gid) => groupsOf(courseOf(cid)).find(g => g.id === gid)?.name || (gid === "_none" ? "그룹 미지정" : "삭제된 그룹");
const courseIcName = c => /온라인|공동|원격/.test(c?.title||"") ? "world" : subjIcName(c?.subject || c?.title);
const courseIcon = (c, size = "md") => ic(courseIcName(c), size);
const asgIds = r => r && r.assign ? Object.keys(r.assign).filter(g => r.assign[g]) : [];
const ASG = {ready:{l:"시작 전", ic:"circle-dashed"}, open:{l:"진행 중", ic:"circle-dot"}, closed:{l:"종료", ic:"circle-check"}};
/* 그룹별 상태: 교사가 고른 상태 + (있으면) 시작·마감 시각 */
function asgStatus(a){
  if(!a) return "open";
  const s = a.status || "open", now = Date.now();
  if(s === "closed") return "closed";
  if(a.dueAt && now > a.dueAt) return "closed";
  if(s === "ready") return a.startAt && now >= a.startAt ? "open" : "ready";
  if(a.startAt && now < a.startAt) return "ready";
  return "open";
}
const asgChip = st => `<span class="chip as-${st}">${ic(ASG[st].ic, "sm")} ${ASG[st].l}</span>`;
/* 학생이 고른 그룹은 수업마다 이 기기에 기억한다 */
/* 선생님이 학생으로 그룹을 정한 과목인가 (그룹에 학생 명단이 있으면) */
const groupByTeacher = c => groupsOf(c).some(g => Array.isArray(g.members) && g.members.length);
function myGroup(cid){
  if(!cid) return "";
  const cc = courseOf(cid);
  if(cc && !isTeacher() && !S.preview && S.mySids && groupByTeacher(cc)){   // 선생님이 정한 그룹: 내가 들어 있는 그룹 (없으면 "_none")
    const g = groupsOf(cc).find(g => (g.members || []).some(id => S.mySids.has(id)));
    return g ? g.id : "_none";
  }
  const g = lsGet(groupKey(cid)) || lsGet("nonjae.group." + cid) || "";   // 학생마다 따로 (예전 값도 읽는다)
  const c = courseOf(cid);
  if(c && groupsOf(c).some(x => x.id === g)) return g;
  const auto = c && !isTeacher() ? autoGroup(c) : "";             // 그룹 이름이 내 학급(1-3)이나 학교와 같으면 저절로
  if(auto){ setMyGroup(cid, auto); return auto }
  return "";
}
/* 학번으로 학급 알아보기: 10301 → 1-3 · 11005 → 1-10 · 1301 → 1-3 (학교가 있으면 ‘학교 1-3’) */
function classOf(number, school){
  const n = String(number || "").trim(); let c = "";
  if(/^\d{5}$/.test(n)) c = `${n[0]}-${+n.slice(1, 3)}`;
  else if(/^\d{4}$/.test(n)) c = `${n[0]}-${+n[1]}`;
  return c ? (school ? `${school} ${c}` : c) : (school || "기타");
}
const normG = t => String(t || "").replace(/학년/g, "-").replace(/[\s반]/g, "").toLowerCase();
function autoGroup(c){
  if(!S.name) return "";
  const a = splitAuthor(S.name), cls = a.number ? classOf(a.number, "") : "";
  const keys = [cls !== "기타" ? cls : "", a.school, a.school && cls ? a.school + cls : ""].filter(Boolean).map(normG);
  const hit = groupsOf(c).filter(g => keys.includes(normG(g.name)));
  return hit.length === 1 ? hit[0].id : "";
}
const groupKey = cid => "nonjae.group." + cid + (S.name && !isTeacher() ? "." + heartKey(S.name) : "");
function setMyGroup(cid, gid){ if(cid) lsSet(groupKey(cid), gid || "") }
/* 학생에게 보이는 활동: 우리 그룹의 배포 상태를 활동 상태에 반영한 복사본 */
function forMe(r){
  if(r && !isTeacher() && pastDue(r) && r.open !== false && (!r.status || r.status === "open")) r = {...r, status:"closed", open:false};   // 마감 시각이 지났다
  if(!r || isTeacher() || S.preview || !asgIds(r).length || !courseOf(r.courseId)) return r;
  const gid = myGroup(r.courseId);
  if(!gid) return {...r, _needGroup:true};
  if(!r.assign[gid]) return {...r, _notAssigned:gid};
  const st = asgStatus(r.assign[gid]);
  if(statusOf(r) !== "open") return {...r, _gid:gid};
  if(st === "closed") return {...r, _gid:gid, status:"closed", open:false};
  if(st === "ready") return {...r, _gid:gid, _ready:true};
  return {...r, _gid:gid};
}
function groupPickHTML(c, ids, msg){
  const gs = groupsOf(c).filter(g => !ids || ids.includes(g.id));
  return `<div class="card"><div class="q"><label>${esc(msg || "어느 그룹인가요?")}</label><p class="hint">${esc(c.title)} · 한 번만 고르면 다음부터는 묻지 않아요.</p>
    <div class="gpick">${gs.map(g => `<button class="btn" type="button" data-a="pick-group" data-c="${esc(c.id)}" data-v="${esc(g.id)}">${esc(g.name)}</button>`).join("")}</div></div></div>`;
}
/* 학생·교사 공유 링크: 활동 링크(#활동id[/그룹id]) · 수업 링크(#c:수업id[/그룹id]) — 예전 #활동id 링크는 그대로 */
function linkFor(kind, id, g){ const b = shareBase(); return b ? b + "#" + (kind === "course" ? "c:" : "") + id + (g ? "/" + g : "") : "" }
const lastActivity = r => Math.max(r.updatedAt||0, r.createdAt||0, ...S.posts.filter(p=>p.roomId===r.id).map(p=>p.updatedAt||p.createdAt||0), ...S.replies.filter(x=>x.roomId===r.id).map(x=>x.createdAt||0));
/* 최근 활동 시간: 방금 · 17분 전 · 오늘 15:42 · 어제 · 10월 1일 */
function fmtRel(ts){
  if(!ts) return "–";
  const now = new Date(), d = new Date(ts), m = Math.floor((now - d)/60000);
  if(m < 1) return "방금"; if(m < 60) return m + "분 전";
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if(diff === 0) return `오늘 ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
  if(diff === 1) return "어제";
  if(d.getFullYear() === now.getFullYear()) return `${d.getMonth()+1}월 ${d.getDate()}일`;
  return fmtDate(ts);
}
const room = () => forMe(S.rooms.find(r => r.id === S.roomId));      // 학생에게는 우리 그룹의 배포 상태가 반영된 활동
const submitted = p => !!p && p.status !== "draft";                       // 예전 글(status 없음)은 제출로 본다
const inGsel = p => !S.gsel || !isTeacher() || S.gselRoom !== p.roomId || (S.gsel === "_none" ? !p.groupId : p.groupId === S.gsel);   // 교사: 그룹별 결과 보기
const allPostsOf = id => S.posts.filter(p => p.roomId === id && inGsel(p)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const postsOf = id => allPostsOf(id).filter(submitted);
const repliesOf = pid => S.replies.filter(r => r.postId === pid && r.kind !== "heart").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
/* 👥 학생 한 명이 여러 선생님 과목을 들을 때: 선생님마다 명단 이름표가 다를 수 있다
   S.idents = [{tid, sid, name}] (my_students), DOC_TID = 문서별 선생님 → 글을 쓸 때 그 활동 선생님의 이름표를 쓴다 */
const DOC_TID = new Map();
const isMe = a => !!a && (a === S.name || !!S.myNames?.has(a));
function meFor(roomId){
  const t = DOC_TID.get("rooms/" + roomId), id = t && (S.idents || []).find(x => x.tid === t);
  return id?.name || S.name;
}
const myPost = r => S.name ? S.posts.find(p => p.roomId === r.id && isMe(p.author)) : null;
const postId = r => "p-" + r.id + "-" + hash(S.name);
const roomsSorted = () => [...S.rooms].filter(r => isTeacher() || (visibleToStudents(r) && (!S.course || r.courseId === S.course))).sort((a,b)=> String(a.year||"").localeCompare(String(b.year||"")) || (a.createdAt||0)-(b.createdAt||0));
const stanceIdx = (r,s) => (r.stances||[]).indexOf(s);
const isBig = r => (r.minChars||0) >= 300;                                // 분량이 중요한 활동(논술)만 숫자를 보여 준다

/* =========================================================
   3. 방 설정 해석 — 예전 방도 활동 유형의 기본 깊이로 동작
   ========================================================= */
function toolOf(r){
  if(r.tool && TOOLS[r.tool]) return r.tool;
  const keys = (r.fields||[]).map(f=>f.k);
  if(keys.includes("claim")) return "claimEvidence";
  if(keys.includes("guess")) return "predict";
  if(keys.includes("content")) return "source";
  return TEMPLATES[r.template]?.tool || "free";
}
function depthOf(r){ return DEPTHS[r.depth] ? r.depth : (TEMPLATES[r.template]?.depth || "normal") }
/* 이 활동이 실제로 거치는 단계: 생각 / 생각 → 만남 / 생각 → 만남 → 변화 (저장된 기능 기준) */
const STAGE_L = ["생각", "만남", "변화"];
function depthLabel(r){
  if(isNotes(r)) return "";
  const f = featuresOf(r), n = !f.meet ? 1 : (f.change || f.revise) ? 3 : 2;
  return STAGE_L.slice(0, n).join(" → ");
}
function featuresOf(r){
  const f = {...DEPTHS[depthOf(r)].features, ...(r.features||{})};
  if(f.meet === undefined) f.meet = true;                  // 2차 버전 방에는 meet 값이 없다
  f.rebuttal = r.interact === "rebuttal";                  // 상호작용 설정이 기준
  f.comment = !!r.interact && r.interact !== "none";
  if(!Array.isArray(f.readMission)) f.readMission = [];
  if(!Array.isArray(f.evidenceTypes) || !f.evidenceTypes.length) f.evidenceTypes = EVIDENCE_TYPES;
  if(r.reveal === "teacher"){ f.meet = false; f.readMission = [] }   // 친구 글을 못 보면 만남 단계도 없다
  if(f.feedback === undefined) f.feedback = true;
  f.deep = depthOf(r) === "deep";
  f.predict = !!f.predict;        // 예측하고 확인하기 (선택 기능)
  f.develop = !!f.develop;        // 질문이음: 기본 깊이에서도 질문 키우기
  return f;
}
/* 실제 작성 칸: 저장된 칸 + (근거 설명 기능이 켜졌다면) 근거 설명 칸 */
function effFields(r){
  const f = featuresOf(r);
  const list = [...(r.fields || TOOLS[toolOf(r)].fields)];
  if(f.warrant && list.some(x=>x.k==="reason") && !list.some(x=>x.k==="warrant")){
    const i = list.findIndex(x=>x.k==="reason");
    list.splice(i+1, 0, {k:"warrant", l:"근거 설명", h:"이 근거가 왜 주장을 뒷받침하는지"});
  }
  return list.map(x => FRAMES[x.k] ? {...x, l:FRAMES[x.k].l} : x);
}
/* 학생에게 보이는 질문·이름·도움말 (교사가 원하면 학습 용어를 함께) */
function sField(r, x){
  const base = STUDENT_FIELDS[x.k], over = TEMPLATES[r.template]?.labels?.[x.k];
  const sf = base ? {...base, ...(over||{})} : null, terms = featuresOf(r).terms && TERM[x.k];
  if(x.q) return {...(sf || {starters:[]}), q:x.q, dl:x.l || x.q, tip:x.h || sf?.tip || ""};   // 선생님이 직접 적은 단계별 질문
  if(!sf) return {q:x.l, dl:x.l, tip:x.h, starters:[]};
  return {...sf, q: sf.q + (terms ? ` (${TERM[x.k]})` : ""), dl: sf.dl + (terms ? ` (${TERM[x.k]})` : "")};
}
const fieldLabel = (r, x) => isTeacher() ? x.l : sField(r, x).dl;

function bodyComplete(r, body, stance){
  if((r.stances||[]).length && !stance) return false;
  const fields = effFields(r);
  if(!fields.every(x => (body?.[x.k]||"").trim())) return false;
  return fields.reduce((a,x)=>a+cnt(body[x.k]),0) >= minOf(r);
}
const isEssay = r => r.template === "essay" && (TEMPLATES.essay.flow.includes("compose"));
function minOf(r){ return isEssay(r) ? 0 : (r.minChars||0) }

/* ---- 세부 활동과 3단계: 활동마다 자기 flow를 갖고, 켜진 기능에 맞는 단계만 남긴다 ---- */
const isRelay = r => r.template === "relay";
/* 감상·성찰: '생각'과 '이유'를 두 화면으로 나눠 쓴다 (칸이 둘 이상일 때) */
const isSplit = r => !!TEMPLATES[r.template]?.splitWrite && (r.fields || TOOLS[toolOf(r)].fields).length > 1;
function stepsOf(r){
  const f = featuresOf(r), t = TEMPLATES[r.template] || TEMPLATES.reflect, d = depthOf(r);
  if(isRelay(r)){
    const s = ["ask","take"];
    if(d !== "quick") s.push("back");
    if(d === "deep" || f.develop) s.push("develop");   // 질문 키우기는 깊이 있게 활동에서 (넘어갈 수 있다)
    return s;
  }
  const on = {
    think:   f.initial || f.predict,
    write:   true,
    counter: f.counter,
    read:    f.meet,
    respond: f.meet && f.rebuttal && f.deep,     // 일반 활동은 친구 생각 만나기 안에서 한마디로 끝난다
    reflect: f.change || !!r.revisit || f.predict,
    revise:  f.revise,
    see:     true,
    why:     isSplit(r),
    compose: true,
    chat:    true,
    feedback: f.feedback
  };
  return t.flow.filter(st => on[st]);
}
/* 진행 표시: 활동마다 고유한 단계 이름(phaseDefs)을 쓰고, 없으면 공통 3단계 */
function phasesOf(r){
  const st = stepsOf(r), t = TEMPLATES[r.template] || {}, lab = t.phases || {};
  const defs = t.phaseDefs || PHASES.map(ph => ({...ph, l: lab[ph.k] || ph.l}));
  return defs.map(ph => ({...ph, steps: ph.steps.filter(s => st.includes(s))})).filter(ph => ph.steps.length);
}
const phaseOfStep = (r, st) => phasesOf(r).find(ph => ph.steps.includes(st));
function myRepliesIn(r, kinds, author = S.name){ return S.replies.filter(x => x.roomId===r.id && x.author===author && kinds.includes(x.kind)) }
function stepDone(r, p, st){
  if(st === "see") return !!p || !!S.form["seen:"+r.id];
  if(!p) return false;
  switch(st){
    case "think":   return !!p.initial || submitted(p);
    case "write":   return submitted(p) || (isSplit(r) ? !!(p.body?.[effFields(r)[0].k]||"").trim() : bodyComplete(r, p.body, p.stance));
    case "why":     return submitted(p);
    case "counter": return !!p.counter?.objection;
    case "read":    return !!p.readAt;
    case "respond": return myRepliesIn(r,["rebuttal"],p.author).length > 0 || !!p.respondSkipped;   // 넘어가기도 마친 것으로
    case "reflect": return !!p.change || (!featuresOf(r).change && !!p.revisit);
    case "revise":  return !!p.revision;
    case "ask":     return (p.questions||[]).length > 0;
    case "take":    return myRepliesIn(r,["answer"],p.author).length > 0;
    case "back":    return Object.keys(p.reactions||{}).length > 0;
    case "develop": return (p.questions||[]).length > 1 || !!p.developSkipped;
    case "compose": return !!p.essay?.text;
    case "feedback": return repliesOf(p.id).some(x => x.kind==="teacher") || !!p.feedbackSkipped;
    case "chat":    return !!p.chat?.done;
    default:        return false;
  }
}
function stepState(r, p, st){
  if(["read","respond","reflect","revise","take","back","develop","feedback"].includes(st) && !submitted(p)) return "locked";
  if((st==="counter" || st==="compose" || st==="why") && !stepDone(r,p,"write")) return "locked";
  if(st==="write" && stepsOf(r).includes("chat") && !stepDone(r,p,"chat") && !submitted(p)) return "locked";   // 대화를 마친 뒤 정리
  if(st==="develop" && stepsOf(r).includes("back") && !stepDone(r,p,"back")) return "locked";
  return stepDone(r,p,st) ? "done" : "open";
}
function phaseState(r, p, ph){
  if(ph.steps.every(s => stepState(r,p,s)==="done")) return "done";
  if(stepState(r,p,ph.steps[0])==="locked") return "locked";
  return "open";
}
/* 지금 할 차례: 아직 하지 않은 첫 활동. 모두 끝났으면 결과 화면(record) */
function currentStep(r, p){
  return stepsOf(r).find(st => stepState(r,p,st)==="open") || (submitted(p) ? "record" : stepsOf(r)[0]);
}
function selectedStep(r, p){
  const chosen = S.step[r.id];
  if(chosen === "record" && submitted(p)) return "record";
  if(chosen && stepsOf(r).includes(chosen) && stepState(r,p,chosen)!=="locked") return chosen;
  return currentStep(r, p);
}
function goStep(r, st){ S.step[r.id] = st; S.anim = true; S.openPost = null }
function goNext(r){ delete S.step[r.id]; S.anim = true; S.openPost = null }

/* =========================================================
   서식 있는 글상자: 굵게·기울임·밑줄·취소선·목록
   저장 모양: 서식이 없으면 그냥 글(예전과 똑같다). 서식이 있으면 ⁣ … ⁤ 로 감싼 글 안에 <b> <i> <u> <s> 만 쓴다.
   보여 줄 때는 글 조각(텍스트 노드)을 직접 만들어서 넣기 때문에 다른 HTML은 절대 들어갈 수 없다.
   ========================================================= */
const RT_S = "⁣", RT_E = "⁤";
const rtHas = s => typeof s === "string" && s.indexOf(RT_S) >= 0;
const rtDec = t => t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
const rtEnc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* 서식을 뺀 글: 글자 수·AI에 보낼 글·CSV 저장 등에 쓴다 */
function rtPlain(s){
  if(!rtHas(s)) return s;
  return s.replace(/⁣([\s\S]*?)(?:⁤|$)/g, (_, x) => rtDec(x.replace(/<\/?[bius]>/g, "")));
}
function rtFrag(src){
  const frag = document.createDocumentFragment(), stack = [{tag:"", el:frag}], re = /<(\/?)([bius])>/g;
  const top = () => stack[stack.length - 1].el;
  const text = t => {
    t = rtDec(t); if(!t) return;
    let k = 0; t.replace(/https?:\/\/[^\s<]+/g, (u, off) => {
      const m = u.match(/[.,)\]!?。]+$/), url = m ? u.slice(0, -m[0].length) : u;
      if(off > k) top().append(t.slice(k, off));
      const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.className = "autolink"; a.textContent = url; top().append(a);
      k = off + url.length; return u });
    if(k < t.length) top().append(t.slice(k));
  };
  let pos = 0, m;
  while((m = re.exec(src))){
    text(src.slice(pos, m.index)); pos = re.lastIndex;
    if(!m[1]){ const el = document.createElement(m[2]); top().append(el); stack.push({tag:m[2], el}) }
    else { const at = stack.map(x => x.tag).lastIndexOf(m[2]); if(at > 0) stack.length = at }
  }
  text(src.slice(pos));
  return frag;
}
function rtScan(root){
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.nodeValue.indexOf(RT_S) >= 0 && !(n.parentElement && n.parentElement.closest("textarea,script,style,[contenteditable]")) ? 1 : 3});
  const list = []; while(w.nextNode()) list.push(w.currentNode);
  for(const n of list){
    const v = n.nodeValue, frag = document.createDocumentFragment(), re = /⁣([\s\S]*?)(?:⁤|$)/g; let pos = 0, m;
    while((m = re.exec(v))){ if(m.index > pos) frag.append(v.slice(pos, m.index)); frag.append(rtFrag(m[1])); pos = re.lastIndex }
    if(pos < v.length) frag.append(v.slice(pos));
    n.replaceWith(frag);
  }
}
new MutationObserver(ms => {
  for(const m of ms){
    if(m.type === "characterData"){ if(m.target.nodeValue.indexOf(RT_S) >= 0) rtScan(m.target.parentNode) }
    else m.addedNodes.forEach(n => { if(n.nodeType === 1){ if(n.textContent.indexOf(RT_S) >= 0) rtScan(n) } else if(n.nodeType === 3 && n.nodeValue.indexOf(RT_S) >= 0) rtScan(n.parentNode) });
  }
}).observe(document.documentElement, {childList:true, subtree:true, characterData:true});

/* 글상자 안(HTML) ↔ 저장하는 글 */
function rtToEditor(v){
  v = v || "";
  if(rtHas(v)){ const m = v.match(/⁣([\s\S]*?)(?:⁤|$)/); return (m ? m[1] : "").replace(/\n/g, "<br>") }
  return esc(v).replace(/\n/g, "<br>");
}
function rtSerialize(ed){
  const toks = []; let fmt = false, lineStart = true;
  const put = t => { if(!t) return; toks.push(["t", t]); lineStart = t.endsWith("\n") };
  const nl = () => { if(!lineStart) put("\n") };
  const mark = (tag, fn) => { fmt = true; toks.push(["g", `<${tag}>`]); fn(); toks.push(["g", `</${tag}>`]) };
  const walk = n => {
    if(n.nodeType === 3){ put(n.nodeValue.replace(/ /g, " ").replace(/[⁣⁤]/g, "")); return }
    if(n.nodeType !== 1) return;
    const tg = n.tagName;
    if(tg === "BR"){ put("\n"); return }
    const st = n.style || {}, wraps = [];
    if(tg === "B" || tg === "STRONG" || st.fontWeight === "bold" || +st.fontWeight >= 600) wraps.push("b");
    if(tg === "I" || tg === "EM" || st.fontStyle === "italic") wraps.push("i");
    if(tg === "U" || /underline/.test(st.textDecorationLine || st.textDecoration || "")) wraps.push("u");
    if(tg === "S" || tg === "STRIKE" || tg === "DEL" || /line-through/.test(st.textDecorationLine || st.textDecoration || "")) wraps.push("s");
    const inner = () => {
      if(tg === "UL" || tg === "OL"){ let k = 0; for(const li of n.children){ nl(); put(tg === "UL" ? "- " : `${++k}. `); [...li.childNodes].forEach(walk); nl() } return }
      const block = /^(DIV|P|LI|H[1-6]|BLOCKQUOTE)$/.test(tg);
      if(block) nl(); [...n.childNodes].forEach(walk); if(block) nl();
    };
    const run = i => i < wraps.length ? mark(wraps[i], () => run(i + 1)) : inner();
    run(0);
  };
  [...ed.childNodes].forEach(walk);
  while(toks.length && toks[toks.length - 1][0] === "t" && /^\n*$/.test(toks[toks.length - 1][1])) toks.pop();
  if(toks.length && toks[toks.length - 1][0] === "t") toks[toks.length - 1][1] = toks[toks.length - 1][1].replace(/\n+$/, "");
  const plain = toks.filter(t => t[0] === "t").map(t => t[1]).join("");
  if(!plain.trim()) return "";
  if(!fmt) return plain;
  return RT_S + toks.map(t => t[0] === "t" ? rtEnc(t[1]) : t[1]).join("") + RT_E;
}
function rteHTML(key, k, {rows = 3, ph = "", id} = {}){
  const iid = id || `${key}-${k}`, v = F(key)[k] || "", h = Math.max(4.6, rows * 1.7 + 1.6);
  const b = (c, t, l, extra = "") => `<button type="button" data-rt="${c}" title="${l}" aria-label="${l}" aria-pressed="false"${extra}>${t}</button>`;
  return `<div class="rte" data-rte><div class="rte-bar" role="toolbar" aria-label="글 서식">
      ${b("bold", "<b>B</b>", "굵게 (Ctrl+B)")}${b("italic", "<i>I</i>", "기울임 (Ctrl+I)")}${b("underline", "<u>U</u>", "밑줄 (Ctrl+U)")}${b("strikeThrough", "<s>S</s>", "취소선")}<span class="rte-sep" aria-hidden="true"></span>
      ${b("insertUnorderedList", ic("list", "sm"), "글머리 기호 목록")}${b("insertOrderedList", ic("list-numbers", "sm"), "번호 목록")}<span class="rte-sep" aria-hidden="true"></span>${b("removeFormat", ic("eraser", "sm") + " <span class='small'>서식 지우기</span>", "서식 지우기")}</div>
    <div class="rte-ed" id="${esc(iid)}" contenteditable="true" role="textbox" aria-multiline="true" data-form="${esc(key)}" data-k="${esc(k)}" data-rich="1" data-ph="${esc(ph)}" style="min-height:${h}em">${rtToEditor(v)}</div>
    <div class="rte-ft"><span class="rte-st" aria-live="polite">${rteNote(false)}</span>${key === "create" ? "" : `<button type="button" class="linkbtn" data-a="rte-save">${ic("device-floppy", "sm")} 임시저장</button>`}</div></div>`;
}
const rteNote = (saved, at) => (S.preview || S.demo) ? "미리보기에서는 저장되지 않아요" : saved ? `${ic("check", "sm")} 자동 저장됨${at ? " · " + at : ""}` : "쓰는 대로 이 기기에 자동 저장돼요";
function rteMarkSaved(manual){
  const d = new Date(), at = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  document.querySelectorAll(".rte-st").forEach(x => { x.innerHTML = rteNote(true, manual ? at + " (임시저장)" : at) });
}
function rtExec(btn){
  const ed = btn.closest("[data-rte]")?.querySelector(".rte-ed"); if(!ed) return;
  ed.focus();
  try{ document.execCommand("styleWithCSS", false, false) }catch(e){}
  document.execCommand(btn.dataset.rt, false, null);
  ed.dispatchEvent(new Event("input", {bubbles:true}));
  rteState();
}
function rteState(){
  const ed = document.activeElement?.closest?.(".rte-ed"); if(!ed) return;
  ed.closest("[data-rte]").querySelectorAll("[data-rt]").forEach(b => { let on = false; if(!/removeFormat/.test(b.dataset.rt)) try{ on = document.queryCommandState(b.dataset.rt) }catch(e){} b.setAttribute("aria-pressed", String(on)) });
}
document.addEventListener("mousedown", e => { if(e.target.closest("[data-rt]")) e.preventDefault() });           // 눌러도 글 쓰던 자리를 놓치지 않는다
document.addEventListener("click", e => { const b = e.target.closest("[data-rt]"); if(b){ e.preventDefault(); rtExec(b) } });
document.addEventListener("selectionchange", rteState);
document.addEventListener("paste", e => {                                                                       // 붙여 넣을 때는 글자만 (다른 곳의 서식·HTML은 들이지 않는다)
  const ed = e.target.closest?.(".rte-ed"); if(!ed) return;
  e.preventDefault(); const t = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, t);
});

/* 입력 요소 만들기 */
function ta(key, k, {rows=3, ph="", id, rich=false}={}){
  if(rich) return rteHTML(key, k, {rows, ph, id});
  const iid = id || `${key}-${k}`;
  return `<textarea id="${esc(iid)}" data-form="${esc(key)}" data-k="${esc(k)}" rows="${rows}" placeholder="${esc(ph)}">${esc(F(key)[k]||"")}</textarea>`;
}
/* 💡 어떻게 쓰지? — 접혀 있는 도움말 + 누르면 들어가는 문장 시작 */
function helpBox(targetId, tip, starters){
  if(!tip && !(starters||[]).length) return "";
  const btns = (starters||[]).map(s => `<button type="button" class="starter" data-a="starter" data-target="${esc(targetId)}" data-text="${esc(s.ins)}">${esc(s.show)}</button>`).join("");
  return `<details class="help"><summary>${ic("bulb", "sm")} 어떻게 쓰지?</summary><div class="help-body">${tip?`<p>${esc(tip)}</p>`:""}
    ${btns ? `<p class="muted small">이렇게 시작해도 좋아요. 누르면 쓰기 칸에 들어가요.</p><div class="starters">${btns}</div>` : ""}</div></details>`;
}
function radios(key, k, options, {label, colors=0, icons}={}){
  const cur = F(key)[k];
  return `<div class="choices" role="radiogroup" aria-label="${esc(label||"")}">` + options.map((o,i)=>{
    const v = typeof o === "string" ? o : o.k, l = typeof o === "string" ? o : o.l, oi = typeof o === "object" && o.ic ? ic(o.ic, "sm") + " " : "";
    const colored = i < colors;
    const style = colored ? `style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)"` : "";
    const shp = colored ? `<span class="shp" aria-hidden="true">${(icons && icons[i]) || ic(SHAPES[i%4], "sm")}</span>` : "";
    return `<label class="choice" ${style}><input type="radio" name="${esc(key+"-"+k)}" data-form="${esc(key)}" data-k="${esc(k)}" value="${esc(v)}" ${cur===v?"checked":""}><span>${shp}${oi}${esc(l)}</span></label>`;
  }).join("") + `</div>`;
}
function checks(key, k, options, {label}={}){
  const cur = new Set(F(key)[k] || []);
  return `<div class="choices" role="group" aria-label="${esc(label||"")}">` + options.map(o =>
    `<label class="choice"><input type="checkbox" data-form="${esc(key)}" data-k="${esc(k)}" data-multi value="${esc(o)}" ${cur.has(o)?"checked":""}><span>${esc(o)}</span></label>`
  ).join("") + `</div>`;
}
/* 입장 뱃지: 1 파랑 · 2 빨강 · 3 초록 · 4 보라 (입장 색 --s1~--s4와 같다. 이름 글자와 함께 보여 색만으로 구분하지 않는다) */
function stanceIcon(r, i){ return ic(SHAPES[i%4], "sm") }
function stanceIcons(r){ return (r.stances||[]).map((_,i) => stanceIcon(r,i)) }
function stanceChip(r, s){
  const i = stanceIdx(r, s);
  if(i < 0) return s ? `<span class="chip">${esc(s)}</span>` : "";
  return `<span class="chip st" style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)"><span class="shp" aria-hidden="true">${stanceIcon(r,i)}</span>${esc(s)}</span>`;
}
/* 질문 하나: 질문 → 문장 틀 → 💡 → 쓰기 칸 */
function question(key, k, {q, frame, tip, starters, rows=3, ph="", opt=false}){
  const id = `${key}-${k}`;
  return `<div class="q"><label for="${esc(id)}">${esc(q)}${opt?` <span class="opt">(선택)</span>`:""}</label>
    ${frame ? `<p class="frame" aria-hidden="true">${esc(frame)}</p>` : ""}
    ${helpBox(id, tip, starters)}${ta(key, k, {rows, ph, rich:true})}</div>`;
}

/* =========================================================
   5. 저장소 — db 모드 / 로컬(미리보기) 모드
   ========================================================= */
async function write(dbFn, localFn){
  if(S.preview){ localFn(); render(); return true }        // 학생 화면 미리보기: 실제 데이터에 저장하지 않음
  if(S.mode === "db" || S.mode === "supa"){
    try{ await dbFn(S.db); return true }
    catch(e){ toast(errMsg(e)); return false }
  }
  localFn(); render(); return true;
}
/* 선생님 피드백(개인·우리 반 전체)은 편집자만 쓸 수 있는 treplies에 저장한다.
   예전 replies 안의 선생님 피드백은 이 버전 이전에 쓴 것만 선생님 글로 인정한다(학생이 ‘선생님’ 글을 흉내 내지 못하게). */
const LEGACY_FB_BEFORE = Date.parse("2026-10-08T01:40:00+09:00");   // 이 버전을 올린 시각
const fbMigrated = () => !!S.config.find(c => c.id === "app")?.fbMigrated;
// 선생님이 이 버전을 한 번 열면 예전 선생님 피드백을 treplies로 옮겨 두고(fbMigrated), 그 뒤로는 replies 안의 ‘선생님 글’은 보여 주지 않는다
const trustedReply = x => !(x.kind === "teacher" || x.kind === "class") || (!fbMigrated() && (x.createdAt || 0) < LEGACY_FB_BEFORE);
async function migrateTeacherFeedback(){
  if(!Auth.teacher || S.mode !== "db" || fbMigrated() || S._fbMig || !S.loaded.replies || !S.loaded.treplies || !S.loaded.config) return;
  S._fbMig = true;
  const have = new Set((S._trep || []).map(x => x.id));
  const old = (S._rep || []).filter(x => (x.kind === "teacher" || x.kind === "class") && (x.createdAt || 0) < LEGACY_FB_BEFORE && !have.has(x.id));
  try{
    for(const x of old){ const {id, ...d} = x; await S.db.doc("treplies/" + id).set(d) }
    const cur = S.config.find(c => c.id === "app") || {}; const {id, ...cfg} = cur;
    await S.db.doc("config/app").set({...cfg, fbMigrated:true, updatedAt:Date.now()});
  }catch(e){ S._fbMig = false }
}
const mergedReplies = () => [...(S._rep || []).filter(trustedReply), ...(S._trep || []).map(x => ({...x, _t:1}))];
const REVEAL_SEEN = {};
function sub(col){
  S.db.collection(col).onSnapshot(snap => {
    let rows = snap.docs.map(d => ({id:d.id, ...d.data()})), name = col;
    if(col === "replies" || col === "treplies"){ S[col === "replies" ? "_rep" : "_trep"] = rows; S.loaded[col] = true; rows = mergedReplies(); name = "replies" }
    if(S.preview && S.preview.shadow && ["rooms","posts","replies"].includes(name)){ S.preview.shadow[name] = rows; S.loaded[name] = true; return }   // 미리보기 중엔 실제 값만 따로 받아 둔다
    if(name === "rooms" && !Auth.teacher && S.db?.reload){             // 선생님이 ‘친구 글(사진) 보기’를 열면 친구 글을 새로 받아 온다
      const opened = rows.some(r => (r.reveal || "after") !== "teacher" && REVEAL_SEEN[r.id] === "teacher");
      rows.forEach(r => { REVEAL_SEEN[r.id] = r.reveal || "after" });
      if(opened) S.db.reload("posts");
    }
    S[name] = rows;
    if(name === "attend" && (S.modal?.type === "attend" || S.modal?.type === "msg")){      // 출석부를 고치는 동안은 다시 그리지 않는다 (스크롤·입력 중인 칸이 그대로)
      const first = !S.loaded.attend; S.loaded.attend = true; const a = document.activeElement;
      if(first || (S.modal.type === "msg" && !(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)))) renderModal();
      return }
    if(name === "replies") checkNewFeedback();
    S.loaded[name] = true;
    if(name === "config" && S._rep) S.replies = mergedReplies();     // fbMigrated가 바뀌면 다시 거른다
    migrateTeacherFeedback();
    dataChanged();
  }, () => toast("실시간 연결이 끊겼어요. 새로고침해 주세요."));
}
/* 새로운 선생님 피드백이 내 글에 도착하면 알려 준다 */
function checkNewFeedback(){
  if(!S.name || isTeacher()) return;
  const mineIds = new Set(S.posts.filter(p=>isMe(p.author)).map(p=>p.id));
  const fb = S.replies.filter(x => x.kind==="teacher" && mineIds.has(x.postId)).map(x=>x.id);
  const cls = S.replies.filter(x => x.kind==="class").map(x=>x.id);
  fb.push(...cls);
  if(S.seenTeacher && fb.some(id => !S.seenTeacher.has(id))) toast(cls.some(id => !S.seenTeacher.has(id)) ? "선생님이 우리 반 전체에게 피드백을 보냈어요." : "선생님 피드백이 도착했어요.");
  S.seenTeacher = new Set(fb);
}
/* 입력 중에는 다시 그리지 않고, 입력이 끝나면 그린다 */
function dataChanged(){
  if(S.hashRoom) applyHash();
  checkNews();
  if(S.view === "create") return;
  const a = document.activeElement;
  if(a && (/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) || a.isContentEditable) && a.type!=="radio" && a.type!=="checkbox" && a.type!=="range" && document.getElementById("app").contains(a)){ S.pending = true; return }
  if(drawingNow()){ S.pending = true; return }                        // 그리는 중에는 화면을 다시 그리지 않는다
  render();
}
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if(S.pending && !(a && (/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) || a.isContentEditable))){ S.pending = false; render() }
}, 0));

/* 내 글 저장: 없으면 '작성 중(draft)'으로 만들고, 있으면 합친다 */
async function savePost(r, patch){
  const ex = myPost(r), id = ex?.id || postId(r);
  const base = ex ? (({id, ...rest}) => rest)(ex)
                  : {roomId:r.id, author:meFor(r.id), stance:null, body:{}, revisit:"", status:"draft", createdAt:Date.now()};
  const data = {...base, ...patch, updatedAt:Date.now()};
  let gid = ex?.groupId || r._gid || (r.courseId ? myGroup(r.courseId) : "");
  if(gid === "_none") gid = "";
  if(gid && !data.groupId) data.groupId = gid;                 // 그룹별 결과를 위해 응답에 그룹을 붙인다
  return write(db => db.doc("posts/"+id).set(data),
               () => { S.posts = S.posts.filter(p=>p.id!==id).concat({id, ...data}) });
}
async function addReply(data){
  const col = (data.kind === "teacher" || data.kind === "class") ? "treplies" : "replies";   // 선생님 피드백은 편집자만 쓰는 곳에
  return write(db => db.collection(col).add(data),
               () => { S.replies.push({id:"x"+Math.random().toString(36).slice(2), ...data}) });
}

const HOST_THEME = document.documentElement.getAttribute("data-theme");   // 보는 곳(앱)이 정해 둔 값
/* 화면 밝기: 라이트 ↔ 다크 한 번 누르면 바로 바뀐다 (처음에는 기기 설정을 따른다) */
const curTheme = () => { const v = lsGet("nonjae.theme"); return v === "light" || v === "dark" ? v : (HOST_THEME === "dark" || HOST_THEME === "light" ? HOST_THEME : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) };
function applyTheme(v){
  document.documentElement.setAttribute("data-theme", v);
  document.querySelectorAll('[data-a="theme-set"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === v)));   // 라이트(해) · 다크(달) 중 지금 것을 표시

async function init(){

    try{ [db, user] = await Promise.all([claude.use("db"), claude.use("user")]) }catch(e){}
  }
  if(IS_DEMO){
    /* 🧪 체험 모드: 로그인 없이 예시 반 데이터로 교사 화면을 써 본다. 아무것도 저장되지 않는다 */
    S.mode = "local"; S.demo = true; Auth.set(true);
    demoData();
  }else if(db){
    S.mode = "db"; S.db = db;
    Auth.set(user ? await user.canEdit() : false);                // 교사 인증: 플랫폼이 확인한 편집 권한

    ["rooms","posts","replies","treplies","config","courses"].forEach(sub);
    if(S.canTeach) ["tnotes","ttemplates","attend"].forEach(sub);
  }else if(SUPABASE_URL && SUPABASE_ANON_KEY && await initSupa()){
    /* Supabase 연결 완료 (GitHub 등) */
  }else{
    S.mode = "local"; Auth.set(true);                              // 저장소가 없는 파일 미리보기(혼자 쓰는 화면)는 교사로 연다
    S.rooms = SAMPLE_ROOMS.map(r => ({...r, createdAt:Date.now()}));
    S.loaded = {rooms:1, posts:1, replies:1, courses:1};
  }
  if(S.demo && !lsGet("nonjae.tourdone")) S.tour = 0;               // 체험 모드 첫 방문: 둘러보기부터
  S.role = Auth.teacher ? "teacher" : "student";                    // 예전의 ‘학생 화면/교사 화면’ 기억값은 쓰지 않는다
  loadForms();
  applyHash();
  render();
  getSample().then(() => { if(S.view === "room") render() });
  checkVersion(); setInterval(checkVersion, 15 * 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) checkVersion() });
}
/* 학생 링크(#활동id)로 들어오면 그 활동을 바로 연다 */
function applyHash(){
  if(!S.hashRoom || (S.mode !== "local" && (!S.loaded.rooms || !S.loaded.courses))) return;
  const h = decodeURIComponent(S.hashRoom);
  if(h === "teacher"){ if(!Auth.teacher) S.wantTeacher = true; S.view = "home"; S.hashRoom = ""; return }   // 교사 로그인 주소
  if(h.startsWith("c:")){                                   // 수업 링크: #c:수업id[/그룹id]
    const [cid, gid] = h.slice(2).split("/"), c = courseOf(cid);
    if(c){
      if(gid && groupsOf(c).some(g => g.id === gid)) setMyGroup(cid, gid);
      if(Auth.teacher) S.mcourse = cid; else S.course = cid;
      S.view = "home";
    }
    S.hashRoom = ""; return;
  }
  const [rid, gid] = h.split("/"), r = S.rooms.find(x => x.id === rid);   // 활동 링크: #활동id[/그룹id] (예전 링크 그대로)
  if(r){ S.view = "room"; S.roomId = r.id; if(gid && r.courseId) setMyGroup(r.courseId, gid) }
  else if(S.mode === "supa" && !Auth.teacher && rid && !S.guestProbed?.has(rid)) guestProbe(rid);   // 아직 못 보는 활동이면 ‘이름만 넣고 들어오는 활동’인지 확인
  S.hashRoom = "";
}

/* 📚 자료: 처음엔 펼쳐 두고(학생이 자료를 읽고 쓰는 것이 핵심), 접으면 그 활동은 접힌 채로 기억 */
const ctxImgsOf = r => (Array.isArray(r.ctxImgs) ? r.ctxImgs : []).filter(Boolean).slice(0, 10);

}
/* ⏱ 수업 타이머: room.timer = {dur, endsAt, left, at}
   - 선생님이 활동 화면에서 시작하면 학생 화면 맨 위에 남은 시간이 보인다 (과제처럼 쓸 때는 켜지 않으면 그만)
   - 진행: endsAt만 / 멈춤: left(남은 ms) / 끝: endsAt이 지남 (학생에게는 끝난 뒤 10분까지만 보임) */
const TMR_CHIPS = [10, 30, 60, 180, 300, 600, 900, 1200];      // 초 (10초 ~ 20분)
const secL = sec => sec < 60 ? `${sec}초` : sec % 60 ? `${Math.floor(sec / 60)}분 ${sec % 60}초` : `${sec / 60}분`;
function tmrOf(r){
  const t = r?.timer; if(!t || !(t.dur > 0)) return null;
  const now = Date.now();
  if(t.left != null) return {st:"paused", left:Math.max(0, t.left), dur:t.dur};
  const left = Math.min(t.dur, (t.endsAt || 0) - now);                 // 기기 시계가 조금 늦어도 처음 시간보다 길게 보이지 않게
  if(left > 0) return {st:"run", left, dur:t.dur};
  return {st:"end", left:0, dur:t.dur, ago:now - (t.endsAt || 0)};

const mmss = ms => { const s = Math.ceil(Math.max(0, ms) / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` };
function tmrCls(t){ return t.st === "end" ? "end" : t.st === "paused" ? "paused" : t.left <= 60000 ? "warn" : "" }
/* 학생 화면 맨 위 띠 */
function tmrBarStudent(r){
  const t = tmrOf(r); if(!t || (t.st === "end" && t.ago > 10 * 60000)) return "";
  const msg = t.st === "end" ? `${ic("alarm")} 시간이 다 됐어요! 쓰던 생각을 마무리해 주세요.` : t.st === "paused" ? `${ic("player-pause")} 선생님이 타이머를 잠시 멈췄어요` : `${ic("clock")} 남은 시간`;
  return `<div class="tmrbar ${tmrCls(t)}" data-tmr="${esc(r.id)}" role="timer" aria-live="off"><span class="tmr-l">${msg}</span>${t.st === "end" ? "" : `<b class="tmr-t">${mmss(t.left)}</b>`}<i class="tmr-p" style="width:${Math.round(t.left / t.dur * 100)}%"></i></div>`;
}
/* 선생님 활동 화면: 시작·멈춤·더하기·끝내기 */
function tmrPanel(r){
  const t = tmrOf(r), id = esc(r.id), dur = Number(r.duration) > 0 ? Number(r.duration) : 0;
  const chips = [...new Set([...TMR_CHIPS, ...(dur && dur <= 90 ? [dur * 60] : [])])].sort((a, b) => a - b).map(sec => `<button class="btn sm${sec === dur * 60 ? " pri" : ""}" type="button" data-a="tmr-start" data-id="${id}" data-s="${sec}"${sec === dur * 60 ? ' title="활동을 만들 때 적은 예상 시간"' : ""}>${secL(sec)}</button>`).join("");
  const custom = `<span class="tmr-custom"><input type="number" id="tmr-min" min="0" max="120" step="1" placeholder="분" aria-label="타이머 분" data-form="tmr" data-k="m" value="${esc(F("tmr").m || "")}"><span class="muted small">분</span><input type="number" id="tmr-sec" min="0" max="59" step="10" placeholder="초" aria-label="타이머 초" data-form="tmr" data-k="s" value="${esc(F("tmr").s || "")}"><span class="muted small">초</span><button class="btn sm" type="button" data-a="tmr-start" data-id="${id}">시작</button></span>`;
  if(!t || t.st === "end") return `<section class="tmrpanel${t ? " end" : ""}" data-tmr="${id}"><span class="tmr-h">${t ? `${ic("alarm")} <b>시간 종료</b>` : `${ic("clock")} <b>수업 타이머</b>`}</span>
    <span class="tmr-chips">${chips}${custom}</span>${t ? `<button class="linkbtn" type="button" data-a="tmr-stop" data-id="${id}">타이머 닫기</button>` : `<span class="muted small tmr-tip">누르면 바로 시작되고, 학생 화면 맨 위에도 남은 시간이 보여요.</span>`}</section>`;
  return `<section class="tmrpanel on ${tmrCls(t)}" data-tmr="${id}"><span class="tmr-h">${ic("clock")} ${t.st === "paused" ? "멈춤" : "남은 시간"}</span><b class="tmr-t">${mmss(t.left)}</b>
    <span class="tmr-chips"><button class="btn sm" type="button" data-a="tmr-add" data-id="${id}" data-v="30">+30초</button><button class="btn sm" type="button" data-a="tmr-add" data-id="${id}" data-v="60">+1분</button>
    ${t.st === "paused" ? `<button class="btn sm pri" type="button" data-a="tmr-resume" data-id="${id}">${ic("player-play")} 이어서</button>` : `<button class="btn sm" type="button" data-a="tmr-pause" data-id="${id}">${ic("player-pause")} 잠시 멈춤</button>`}
    <button class="btn sm" type="button" data-a="tmr-stop" data-id="${id}">${ic("player-stop")} 끝내기</button></span><i class="tmr-p" style="width:${Math.round(t.left / t.dur * 100)}%"></i></section>`;
}
async function setTimer(r, timer){

/* 1초마다 숫자만 바꾸고, 진행→끝처럼 상태가 바뀔 때만 다시 그린다 */
const TMR_SEEN = {};
setInterval(() => {
  document.querySelectorAll("[data-tmr]").forEach(el => {
    const r = S.rooms.find(x => x.id === el.dataset.tmr), t = tmrOf(r), key = t ? t.st + tmrCls(t) : "";
    if(TMR_SEEN[el.dataset.tmr] !== undefined && TMR_SEEN[el.dataset.tmr] !== key){ TMR_SEEN[el.dataset.tmr] = key; render(); return }
    TMR_SEEN[el.dataset.tmr] = key;
    if(!t) return;
    const tt = el.querySelector(".tmr-t"); if(tt) tt.textContent = mmss(t.left);
    const pp = el.querySelector(".tmr-p"); if(pp) pp.style.width = Math.round(t.left / t.dur * 100) + "%";
  });

function roomHead(r, {sourceOpen=true, rules=false}={}){

/* =========================================================
   9. 방 — 학생: 3단계 + 칠판 + 지금 할 일
   ========================================================= */
function viewRoomStudent(r){
  if(!visibleToStudents(r) && !S.preview) return `<button class="linkbtn back" type="button" data-a="home">${ic("arrow-left", "sm")} 활동 목록</button><div class="empty">아직 공개되지 않았거나 보관된 활동이에요.</div>`;
  if(r._needGroup) return roomHead(r) + `<div class="stage" id="stage">${groupPickHTML(courseOf(r.courseId), asgIds(r))}</div>`;
  if(r._notAssigned) return roomHead(r) + `<div class="stage" id="stage"><div class="empty">이 활동은 우리 그룹(${esc(groupName(r.courseId, r._notAssigned))})에는 아직 열리지 않았어요.<br><button class="linkbtn" type="button" data-a="regroup" data-c="${esc(r.courseId)}">그룹을 잘못 골랐다면 다시 고르기</button></div></div>`;
  if(r._ready){ const a = r.assign[r._gid]; return roomHead(r) + `<div class="stage" id="stage"><div class="empty">${ic("hourglass")} 아직 시작 전인 활동이에요.${a?.startAt ? `<br>${esc(fmt(a.startAt))}에 열려요.` : " 선생님이 시작하면 참여할 수 있어요."}</div></div>` }
  const p = myPost(r);
  if(!S.name) return roomHead(r) + `<div class="stage" id="stage">${nameForm()}</div>`;
  markViewed(r);                                                       // 👀 들어와 본 것만으로도 ‘조회’로 남긴다
  if(isNotes(r)) return viewNotesStudent(r, p);                      // 오늘의 필기: 사진 제출 화면
  if(S.work !== r.id) return roomHead(r, {sourceOpen:false}) + roomTabs(r, "board") + roomBoard(r, p);   // 처음에는 우리 반 게시판
  const sel = selectedStep(r, p), phs = phasesOf(r);
  const curPh = sel === "record" ? null : phaseOfStep(r, sel);
  let h = roomHead(r, {sourceOpen: curPh ? curPh.k === "think" : false}) + roomTabs(r, "work");

  // 큰 3단계 (단계가 하나뿐인 빠른 활동에서는 생략)
  if(phs.length > 1){
    h += `<nav class="phases" aria-label="활동 단계"><ol>` + phs.map((ph,i)=>{
      const state = phaseState(r,p,ph), cur = curPh && ph.k === curPh.k;
      const stt = state==="done" ? "마쳤어요" : state==="locked" ? "글을 낸 뒤 열려요" : (cur ? "지금 하는 중" : "");
      return `<li class="${state}"><button type="button" data-a="phase" data-v="${ph.k}" ${cur?'aria-current="step"':""} ${state==="locked"?"disabled":""}>
        <span class="n" aria-hidden="true">${state==="done" ? ic("check", "sm") : i+1}</span>
        <span class="t"><span class="lbl">${esc(ph.l)}</span><span class="stt">${stt}</span></span></button></li>`;
    }).join("") + `</ol></nav>`;
  }

  // 칠판: 지금 할 일
  const meta = stepMeta(r, sel);
  let sub = "", nxt = "";
  if(curPh){
    if(curPh.steps.length > 1){

/* =========================================================

async function loadNoteUrls(){
  const paths = [...NURL_Q]; NURL_Q = new Set();
  for(let i = 0; i < paths.length; i += 100){
    const part = paths.slice(i, i + 100), now = Date.now();
    try{
      const r = await SB.storage.from("notes").createSignedUrls(part, 6 * 3600);
      const got = new Map((r.data || []).filter(x => x.signedUrl).map(x => [x.path, x.signedUrl]));
      part.forEach(p => { NURL[p] = got.has(p) ? {url:got.get(p), exp:now + 6*3600*1000 - 60000} : {url:"", exp:now + 60000, bad:true} });
    }catch(e){ part.forEach(p => { NURL[p] = {url:"", exp:now + 60000, bad:true} }) }

async function shrinkImage(file, maxSide, q){
  let bmp;

  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", q));
  if(!blob) throw new Error("이미지 변환 실패");
  return {blob, w, h};

async function ctxAddFiles(files){

  if(!list.length){ toast(room <= 0 ? "사진은 10장까지 넣을 수 있어요." : "사진 파일만 넣을 수 있어요."); return }
  if(files.length > room) toast(`사진은 10장까지라 ${room}장만 넣었어요.`);
  S.ctxUploading = true; render();
  const live = S.mode === "supa" && SB && !S.demo && !S.preview && S.sbUid;
  try{
    for(const file of list){
      const {blob} = await shrinkImage(file, live ? 1600 : 1000, live ? 0.82 : 0.7);
      let url;
      if(live){
        const path = `${S.sbUid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}.jpg`;
        const up = await SB.storage.from("materials").upload(path, blob, {contentType:"image/jpeg", upsert:false});
        if(up.error) throw up.error;
        url = SB.storage.from("materials").getPublicUrl(path).data.publicUrl;
      }else url = await blobToDataURL(blob);
      f.ctxImgs = [...(f.ctxImgs || []), url].slice(0, 10); saveFormsSoon();
    }
  }catch(e){ toast("사진을 올리지 못했어요: " + (e?.message || "다시 해 보세요.")) }
  S.ctxUploading = false; render();
}
async function noteAddFiles(r, files){
  const list = NDRAFT[r.id] = NDRAFT[r.id] || [], max = NOTE_MAX(r);
  const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));

  S.noteBusy = "사진을 준비하는 중…"; render();

  for(const f of arr){

    h += `<fieldset class="q"><legend>내 생각은 어느 쪽에 가까운가요?</legend>${radios(key,"_stance",r.stances,{label:"내 입장", colors:r.stances.length, icons:stanceIcons(r)})}
      ${p?.initial?.stance ? `<p class="hint">처음 생각: ${esc(p.initial.stance)}. 바꿔도 괜찮아요.</p>` : ""}</fieldset>`;
  }
  const allF = effFields(r), shown = part === 0 ? allF.slice(0,1) : part === 1 ? allF.slice(1) : allF;
  if(part === 1){ const x0 = allF[0]; h += `<div class="q"><span class="hint">${esc(sField(r,x0).dl)}</span><p class="quote">${esc(F(key)[x0.k] || p?.body?.[x0.k] || "")}</p></div>` }
  for(const x of shown){
    const s = sField(r, x);
    if(x.k === "drawing"){ h += `<div class="q" id="wq-drawing"><span class="qlabel" style="font-weight:600">${esc(s.q)}</span><p class="hint">${esc(s.tip)}</p>${drawEditorHTML(key)}</div>`; continue }
    const qno = allF.length > 1 && allF.some(y => y.q) ? `<span class="wqn">${allF.indexOf(x) + 1}</span>` : "";   // 선생님이 만든 단계별 질문이면 번호를 붙인다
    h += `<div class="q" id="wq-${esc(x.k)}"><label for="${key}-${x.k}">${qno}${esc(s.q)}</label>
      ${s.frame ? `<p class="frame" aria-hidden="true">${esc(s.frame)}</p>` : (!STUDENT_FIELDS[x.k] && x.h ? `<p class="hint">${esc(x.h)}</p>` : "")}
      ${helpBox(`${key}-${x.k}`, s.tip, s.starters)}`;
    if(x.k==="reason" && f.evidenceType){
      h += ta(key, x.k, {rows:3, rich:true}) + `<details class="help"><summary>${ic("plus", "sm")} 어디에서 찾은 이유인가요? (선택)</summary>${radios(key,"_etype",f.evidenceTypes,{label:"이유의 종류"})}</details></div>`;
      continue;
    }
    h += ta(key, x.k, {rows: x.k==="claim" || x.k==="center" ? 2 : 3, rich:true}) + `</div>`;
  }
  if(toolOf(r) === "sketch") h += `<div class="q"><span class="hint">내 생각 지도 미리 보기</span><div id="skprev">${sketchMapHTML(F(key))}</div></div>`;
  // 상위권을 위한 선택 영역: 기본 화면에는 접혀 있다
  if(depthOf(r) !== "quick" && part !== 0){
    h += `<details class="help" style="margin-top:18px"><summary>${ic("search", "sm")} 더 깊이 생각해보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:8px">
      ${question(key,"_other",{q:"나와 다른 관점에서 보면 어떨까요?", opt:true, rows:2, tip:"반대편이나 다른 사람의 자리에서 한 번 생각해 보세요.", starters:[{show:"다른 관점에서 보면 ___라고 볼 수도 있다.", ins:"다른 관점에서 보면 "}]})}
      ${question(key,"_source",{q:"내 생각을 받쳐 주는 자료가 있나요?", opt:true, rows:2, tip:"교과서, 사료, 통계 중 하나면 충분해요.", starters:[{show:"교과서(자료)를 보면 ___", ins:"자료를 보면 "}]})}
    </div></details>`;
  }
  const editing = S.editing === r.id;
  const label = part === 0 ? "다음: 이유 쓰기" : editing ? "고친 글 저장" : (f.counter ? "다음으로" : (isEssay(r) ? "다음: 글쓰기" : "내 생각 보내기"));
  h += `<div class="foot">${statusHTML(r)}<div class="row">
      ${part === 1 ? `<button class="linkbtn" type="button" data-a="step" data-v="write">${ic("arrow-left", "sm")} 앞으로</button>` : ""}
      ${editing ? `<button class="btn" type="button" data-a="cancel-edit">취소</button>` : ""}
      <button class="btn pri" type="button" data-a="save-write" id="wsubmit" data-part="${part ?? ""}">${label}</button></div></div>`;
  h += `</div>`;
  return h;
}

/* 내 생각을 보내기 전의 생각 지도: 인원 분포 + 내가 고른 쪽에 '내 생각이 들어갈 자리' */

/* ---- 생각하기 · 나와 다른 생각 (깊이 있는 활동, 여기서 제출) ---- */
function stepCounter(r, p, open){

/* ---- 함께 생각하기 · 친구 생각 살펴보기 ---- */
function displayName(r, author, ps){

}
const finalBody = p => p.revision?.body || p.body || {};
const isImg = v => /^data:image\//.test(String(v||""));
const firstText = b => Object.values(b||{}).find(v => typeof v === "string" && v.trim() && !isImg(v)) || "";   // 그림 데이터는 글로 보여 주지 않는다
const cellv = v => isImg(v) ? "(그림)" : (v || "");
function postHead(r, p, ps){
  return `<div class="post-h"><strong>${esc(displayName(r,p.author,ps))}</strong>${p.stance ? stanceChip(r,p.stance) : ""}
    ${p.revision ? `<span class="chip">다시 쓴 글</span>` : ""}<span>${fmt(p.updatedAt||p.createdAt)}</span>

}
function previewText(r, p){
  if(p.revision?.essay || p.essay?.text) return p.revision?.essay || p.essay.text;

}
/* 내가 볼 수 있는 답글: 예전 읽기 메모는 글쓴이와 선생님만 */
function visibleReplies(p){
  return repliesOf(p.id).filter(x => x.kind !== "note" || isTeacher() || isMe(p.author) || isMe(x.author));
}
function replyHTML(r, x, ps){
  const who = x.kind === "teacher" ? "선생님" : displayName(r, x.author, ps);
  const tag = isTeacher() ? ({rebuttal:"반박", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "")
                          : ({rebuttal:"답", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "");
  let body = "";
  if(x.kind === "answer"){
    body = `<p>${esc(x.text)}</p>` + (x.evidence ? `<div class="part"><em>이유</em><p>${esc(x.evidence)}</p></div>` : "");
  }else if(x.kind === "note"){
    body = MISSIONS.filter(m => x.answers?.[m.k]).map(m => `<div class="part"><em>${esc(m.q)}</em><p>${esc(x.answers[m.k])}</p></div>`).join("");
  }else if(x.kind === "rebuttal" && (x.differ || x.agree)){
    body = (x.agree ? `<div class="part"><em>공감하는 부분</em><p>${esc(x.agree)}</p></div>` : "")
         + `<div class="part"><em>생각이 다른 부분</em><p>${esc(x.differ)}</p></div>`
         + `<div class="part"><em>그렇게 생각하는 이유${x.evidenceType?` · ${esc(x.evidenceType)}`:""}</em><p>${esc(x.evidence)}</p></div>`
         + `<div class="part"><em>내 의견</em><p>${esc(x.text)}</p></div>`;
  }else{
    body = `<p>${x.kind === "teacher" ? lnk(x.text) : esc(x.text)}</p>` + (x.evidence ? `<div class="part"><em>이유${x.evidenceType?` · ${esc(x.evidenceType)}`:""}</em><p>${esc(x.evidence)}</p></div>` : "");
  }

  return `<div class="reply${cls}"><div class="rh"><b>${esc(who)}</b>${tag?`<span>${tag}</span>`:""}<span>${fmt(x.createdAt)}</span></div>${body}</div>`;
}
function repliesBlock(r, p, ps){
  const list = visibleReplies(p);
  return list.length ? `<div class="replies">${list.map(x=>replyHTML(r,x,ps)).join("")}</div>` : "";
}
const REPLY_HELP = {
  tip:"“나는 이 의견에 동의한다/동의하지 않는다. 왜냐하면…”으로 시작해 보세요.",
  starters:[{show:"나는 이 생각에 ___한다. 왜냐하면 ___ 때문이다.", ins:"나는 이 생각에 "},
            {show:"친구의 의견에서 ___한 점은 공감하지만, 나는 ___라고 생각한다.", ins:"친구의 의견에서 "}]
};
function commentForm(r, p, label){

    <div class="row end"><button class="btn sm pri" type="button" data-a="save-comment" data-id="${esc(p.id)}">올리기</button></div></div>`;
}
function readCard(r, p, mine, ps, {pickable=true}={}){
  const f = featuresOf(r), isOpen = S.openPost === p.id, reps = visibleReplies(p);

  }

      h += `<div class="pad-cmt"><textarea id="com-${esc(p.id)}" data-form="com:${esc(p.id)}" data-k="text" rows="1" maxlength="500" placeholder="${p === mine ? "친구 댓글에 답하기" : "댓글 추가"}" aria-label="댓글">${esc(F("com:"+p.id).text||"")}</textarea><button class="btn sm pri" type="button" data-a="save-comment" data-id="${esc(p.id)}">올리기</button></div>`;
    }
  }else if(open && p !== mine && mine?.readAt){                       // 한마디를 남긴 뒤에는 다른 친구 글에도 자유롭게 한마디 더 (선택)
    if(f.deep && f.rebuttal && f.meet) h += `<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-a="go-respond" data-id="${esc(p.id)}">이 생각에 답해보기 ${ic("arrow-right")}</button></div>`;
    else if(f.comment) h += commentForm(r, p, "한마디 더 남기기 (선택)");

  return h + `<div class="row end" style="margin-top:10px"><button class="linkbtn" type="button" data-a="close-post">접기</button></div></article>`;
}
/* ---- 우리 반 게시판: 패들렛처럼 카드로 모아 보기. ‘제출 후 공개’ 활동은 내 생각을 게시하기 전까지 흐리게 ---- */
const wallTone = (r, p) => {                                     // 쪽지 색: 토론은 입장 색, 그 밖에는 글마다 옅은 6색 중 하나 (늘 같은 색)
  const si = (r.stances || []).indexOf(p.stance);
  if(si >= 0) return `--wc:var(--${SC[si % 4]}-soft)`;
  let h = 0; for(const c of String(p.id || p.author)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return `--wc:var(--pad${h % 6})`;
};
/* ❤️ 하트: replies에 kind "heart" 한 줄(학생마다 글마다 하나, on으로 켜고 끈다) */
const heartsOf = pid => S.replies.filter(x => x.kind === "heart" && x.postId === pid && x.on !== false);
const myHeart = pid => S.replies.find(x => x.kind === "heart" && x.postId === pid && isMe(x.author));
const heartKey = name => { let h = 0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h.toString(36) };
function wallActs(r, p, {open=false}={}){
  const n = heartsOf(p.id).length, mh = myHeart(p.id), on = !!mh && mh.on !== false, own = isMe(p.author), reps = visibleReplies(p).length;
  const canHeart = (!isTeacher() || S.preview) && !!S.name && !own && S.canWrite;
  const ttl = own ? "내 글이에요" : !canHeart ? "하트" : on ? "하트 취소" : "하트 누르기";
  return `<div class="wact"><button class="hbtn${on ? " on" : ""}" type="button" data-a="heart" data-id="${esc(p.id)}" aria-pressed="${on}" ${canHeart ? "" : "disabled"} title="${ttl}" aria-label="${ttl} (${n}개)"><span class="hh" aria-hidden="true">${ic("heart")}</span><span>${n}</span></button>
    <span class="sp"></span><button class="cbtn" type="button" data-a="${open ? "focus-com" : "open-post"}" data-id="${esc(p.id)}" data-c="1" aria-label="댓글 ${reps}개">${ic("message-circle")} ${reps}</button></div>`;
}
/* 패들렛 쪽지: 동그란 이름표 · 이름 · 시간 / 굵은 첫 줄 + 내용 / ❤️ · 💬 / ＋ 댓글 추가 */
function padHead(r, p, ps){

  return `<div class="pad-h"><span class="ava" style="--av:var(--${SC[h%4]})" aria-hidden="true">${esc(ini)}</span><span class="who"><b>${esc(nm)}</b><span>${esc(fmtRel(p.updatedAt||p.createdAt))}${p.revision ? " · 다시 쓴 글" : ""}</span></span>${p.stance ? stanceChip(r,p.stance) : ""}</div>`;
}
function padText(r, p){
  if(p.revision?.essay || p.essay?.text || isRelay(r)) return {title:"", text:previewText(r, p)};
  const b = finalBody(p), vals = effFields(r).map(x => b[x.k]).filter(v => v && !isImg(v)).map(v => String(v).trim()).filter(Boolean);
  if(vals.length >= 2 && vals[0].length <= 70) return {title:vals[0], text:vals.slice(1).join("\n")};

}
function wallCardBody(r, p, ps, extra = ""){

    ${title ? `<b class="pad-title">${esc(title)}</b>` : ""}${text ? `<p class="wtxt">${esc(text)}</p>` : ""}${extra ? `<p class="small muted">${extra}</p>` : ""}</div>
    ${wallActs(r, p)}${canCom ? `<button class="pad-add" type="button" data-a="open-post" data-id="${esc(p.id)}" data-c="1">${ic("plus", "sm")} 댓글 추가</button>` : ""}`;

function wallCard(r, p, mine, ps){

  return `<article class="post wcard${p===mine?" mine":""}${p===mine && S.landed===r.id?" land":""}" style="${wallTone(r,p)}">${padHead(r,p,ps)}${wallCardBody(r,p,ps)}</article>`;

const BLUR_TXT = ["나는 이 문제를 이렇게 생각한다. 왜냐하면 수업 시간에 배운 내용과 자료를 보면 알 수 있기 때문이다.",
  "처음에는 잘 몰랐지만 자료를 다시 읽어 보니 생각이 조금 달라졌다.", "이 의견에 동의한다. 근거는 두 가지가 있다.",
  "다른 쪽에서 보면 또 다른 이유가 있을 수 있다. 예를 들어 그 당시 사람들의 입장에서 보면", "짧게 말하면 이렇다."];
const blurCard = (i, tone) => `<div class="post wcard blurred" style="--wc:var(--${tone || SC[i%4]}-soft)" aria-hidden="true"><div class="post-h"><strong>친구</strong></div><p class="wtxt">${BLUR_TXT[i%BLUR_TXT.length]}</p></div>`;
const wallLocked = (r, p) => r.reveal === "after" && !submitted(p);
function wallHTML(r, p){
  if(r.reveal === "teacher") return `<section class="wall-sec" aria-label="우리 반 게시판"><div class="wall-h"><span class="eyebrow">${ic("layout-board", "sm")} 우리 반 게시판</span></div>
    <div class="empty">이 활동의 글은 선생님만 볼 수 있어요.</div></section>`;
  const ps = postsOf(r.id), hasSt = (r.stances||[]).length > 0, locked = wallLocked(r, p);
  const list = locked ? ps.filter(x => x !== p) : [...ps].sort((a,b) => (b===p) - (a===p) || (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  const head = `<div class="wall-h"><span class="eyebrow">${ic("layout-board", "sm")} 우리 반 게시판</span><span class="muted small">생각 ${list.length}개</span></div>`;
  if(!list.length && !hasSt) return `<section class="wall-sec" aria-label="우리 반 게시판">${head}<div class="empty">아직 올라온 생각이 없어요.${locked ? " 첫 번째로 게시해 보세요!" : ""}</div></section>`;
  if(!locked){
    const card = x => wallCard(r, x, p, ps);
    return `<section class="wall-sec" aria-label="우리 반 게시판">${hasSt ? stanceMap(r, list, card) : head + `<div class="wall">${list.map(card).join("")}</div>`}</section>`;
  }
  // 잠김: 실제 글 대신 흐린 자리 카드만 그린다 (화면 코드에도 친구 글이 들어가지 않는다)
  const pick = F(writeKey(r))._stance;
  const inner = hasSt
    ? stanceMap(r, list, null, {preview:pick})                              // 입장별 인원과 ‘내 생각이 들어갈 자리’만
    : head + `<div class="wall">${list.slice(0, 12).map((x,i) => blurCard(i)).join("")}</div>`;
  const blur = hasSt ? `<div class="wall blurred" style="margin-top:12px">${list.slice(0, 8).map((x,i) => blurCard(i, SC[Math.max(0,(r.stances||[]).indexOf(x.stance))%4])).join("")}</div>` : "";
  return `<section class="wall-sec" aria-label="우리 반 게시판">${hasSt ? inner : ""}<div class="wall-lock">${hasSt ? blur : inner}
    ${list.length ? `<div class="wall-veil"><div><b>${ic("lock")} 내 생각을 게시하면<br>친구들의 생각 ${list.length}개가 보여요</b>
      <button class="btn pri sm" type="button" data-a="to-stage">내 생각 쓰러 가기</button></div></div>` : ""}</div></section>`;
}
/* 우리 반의 생각 지도: 입장마다 영역을 나누고 인원과 생각 카드를 보여 준다 (휴대폰에서는 위아래로) */
function stanceMap(r, list, cardFn, {lockNote="", preview=""}={}){
  const n = list.length || 0, st = r.stances || [], LIMIT = 4;
  return `<section class="smap" aria-label="우리 반의 생각 지도">
    <div class="smap-h"><span class="eyebrow">우리 반의 생각 지도</span><span class="muted small">${n}명 참여</span></div>
    <div class="smap-cols" style="--n:${st.length}">${st.map((s,i)=>{
      const items = list.filter(p=>p.stance===s).sort((a,b) => (isMe(b.author)) - (isMe(a.author)));
      const pct = n ? Math.round(items.length/n*100) : 0, more = S.mapMore?.[r.id+":"+i];
      const shown = cardFn && !more ? items.slice(0, LIMIT) : items;
      const ghost = preview === s ? `<div class="post ghost land" style="--c:var(--${SC[i%4]})">${ic("pencil", "sm")} 내 생각이 여기에 들어가요</div>` : "";
      return `<div class="smap-col" style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)">
        <div class="smap-top"><span class="ic" aria-hidden="true">${stanceIcon(r,i)}</span><b>${esc(s)}</b><span class="num">${items.length}<small>명</small></span></div>
        <div class="smap-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
        ${ghost}
        ${cardFn ? (items.length ? shown.map(cardFn).join("") : `<p class="smap-empty">아직 이 입장의 생각이 없어요.</p>`) : ""}
        ${cardFn && !more && items.length > LIMIT ? `<button class="btn sm smap-more" type="button" data-a="map-more" data-v="${i}">생각 ${items.length-LIMIT}개 더 보기</button>` : ""}</div>`;
    }).join("")}</div>
    ${lockNote ? `<p class="smap-lock">${esc(lockNote)}</p>` : ""}</section>`;
}
function groupedPosts(r, list, cardFn){
  if((r.stances||[]).length) return stanceMap(r, list, cardFn);
  return `<div class="wall">${list.map(cardFn).join("")}</div>`;
}
function stepRead(r, p, open){
  const f = featuresOf(r), ps = postsOf(r.id), others = ps.filter(x => !isMe(x.author));
  const key = "meet:" + r.id, mform = F(key, () => ({diffPostId:p?.meet?.diffPostId||""}));
  const diffId = p?.meet?.diffPostId || mform.diffPostId;
  const diffPost = diffId && ps.find(x=>x.id===diffId);
  const diffName = diffPost ? displayName(r, diffPost.author, ps) : "";
  const hasSt = (r.stances||[]).length > 0;
  let h = p?.readAt ? "" : `<div class="card"><p><b>${ic("message-circle")} 친구 생각을 읽고, 마음에 남는 글에 댓글로 한마디 남겨 보세요.</b></p>
    <p class="muted small" style="margin-top:4px">${hasSt ? "나와 다른 입장의 글이면 더 좋아요. " : ""}글 아래 ‘댓글 추가’를 누르면 돼요.${f.deep && f.rebuttal ? " 댓글을 남긴 글에 다음 단계에서 근거를 들어 답해요." : " 한마디를 남기면 이 단계를 마쳐요."}</p></div>`;
  const card = x => readCard(r, x, p, ps, {pickable:false});
  if(hasSt) h += stanceMap(r, ps, card);
  else if(!others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += groupedPosts(r, submitted(p) ? [p, ...others] : others, card);   // 게시판: 내 카드가 맨 앞
  if(hasSt && !others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;

  // 이미 마친 경우: 고른 생각과 내 한마디
  if(p?.readAt){
    const ans = p.meet?.answers || {};
    let saved = diffPost ? `<div class="lbl">내가 고른 ${esc(diffName)}의 생각</div><p class="quote">${esc(previewText(r,diffPost))}</p>` : "";
    saved += MISSIONS.filter(m => ans[m.k]).map(m=>`<div class="lbl">${esc(m.q)}</div><p class="txt">${esc(ans[m.k])}</p>`).join("");
    if(saved) h += `<div class="card saved">${saved}</div>`;
    return h + nextBtn(r);
  }
  if(!open || !S.canWrite) return h;
  if(!others.length) return h + `<div class="next"><button class="btn" type="button" data-a="read-done">지금은 넘어가기 ${ic("arrow-right")}</button></div>`;

  // 선택 질문 (교사가 켠 경우에만, 모두 선택)
  const extra = MISSIONS.filter(m => f.readMission.includes(m.k));
  const extraHTML = extra.length ? `<details class="help" style="margin-top:14px"><summary>${ic("plus", "sm")} 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">${extra.map(m=>question(key, m.k, {q:m.q, rows:2, opt:true, tip:m.tip, starters:m.starters})).join("")}</div></details>` : "";
  const pickedQuote = diffPost ? `<div class="q"><span class="hint">내가 고른 ${esc(diffName)}의 생각</span><p class="quote">${esc(previewText(r,diffPost))}</p></div>` : "";

  // 댓글로 만나기: 일반은 첫 댓글을 남기면 바로 마침(save-comment). 깊이 있게(근거 들어 답하기)는 댓글 단 글을 골라 ‘다 읽었어요’
  if(f.deep && f.rebuttal || extra.length){
    return h + `<div class="card">${pickedQuote ? pickedQuote.replace("내가 고른", "내가 댓글을 남긴") : `<p class="muted">친구 글에 댓글을 하나 남기면 ‘다 읽었어요’를 누를 수 있어요.</p>`}${extraHTML}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="read-done" ${diffPost ? "" : "disabled"}>다 읽었어요</button></div></div>`;
  }
  return h;
}

/* ---- 함께 생각하기 · 친구 생각에 답하기 ---- */
function replyForm(r, p){
  const f = featuresOf(r), key = "reb:" + p.id;
  const quote = `<div class="q"><span class="hint">친구의 생각</span><p class="quote">${esc(finalBody(p).claim || previewText(r,p))}</p></div>`;
  const send = `<div class="row end"><button class="btn sm" type="button" data-a="close-post">취소</button>
      <button class="btn sm pri" type="button" data-a="save-rebuttal" data-id="${esc(p.id)}">답 남기기</button></div>`;
  if(!f.deep){
    // 기본: 내 의견 + 이유 두 칸
    return `<div class="rform">${quote}
      ${question(key,"text",{q:"이 생각에 대해 나는 어떻게 생각하나요?", rows:2, ...REPLY_HELP})}
      ${question(key,"evidence",{q:"그렇게 생각하는 이유는?", rows:2, tip:"수업 내용, 자료, 경험 중 하나를 들어 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      ${send}</div>`;
  }
  // 깊이 있게: 공감 / 다른 점 / 이유 / 내 의견
  return `<div class="rform">${quote}
    ${question(key,"agree",{q:"공감하는 부분이 있나요?", opt:true, rows:2, tip:"친구 생각에서 인정할 수 있는 점을 먼저 적어 보세요.", starters:[{show:"친구의 의견에서 ___한 점은 공감한다.", ins:"친구의 의견에서 "}]})}
    ${question(key,"differ",{q:"생각이 다른 부분은?", rows:2, tip:"친구 글의 어느 문장에서 생각이 갈리는지 찾아보세요.", starters:[{show:"하지만 나는 ___라고 생각한다.", ins:"하지만 나는 "}]})}
    <div class="q"><label for="${key}-evidence">그렇게 생각하는 이유는?</label>
      ${helpBox(`${key}-evidence`, "수업 내용, 자료, 통계, 사례 중 하나를 들어 보세요.", [{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}])}
      ${f.evidenceType ? `<p class="hint">어디에서 찾은 이유인가요? <span class="opt">(선택)</span></p>${radios(key,"etype",f.evidenceTypes,{label:"이유의 종류"})}` : ""}
      ${ta(key,"evidence",{rows:2, rich:true})}</div>
    ${question(key,"text",{q:"그래서 나는 이렇게 생각해요", rows:2, ...REPLY_HELP})}
    ${send}</div>`;
}
function respondCard(r, p, ps){
  const isOpen = S.openPost === p.id;
  const mineCount = S.replies.filter(x=>x.postId===p.id && isMe(x.author) && x.kind==="rebuttal").length;
  let h = `<article class="post${isOpen?" open":""}">${postHead(r,p,ps)}`;
  if(!isOpen) return h + `<p class="preview">${esc(previewText(r,p))}</p>
    <div class="pmeta"><span>${mineCount ? `${ic("check", "sm")} 내가 답했어요` : ""}</span><button class="btn sm" type="button" data-a="open-post" data-id="${esc(p.id)}">답하기</button></div></article>`;
  h += fieldsHTML(r, finalBody(p), {evidenceType:p.evidenceType}) + repliesBlock(r, p, ps);
  if(r.open!==false && S.canWrite) h += replyForm(r, p);
  return h + `</article>`;
}
function stepRespond(r, p, open){
  const ps = postsOf(r.id), others = ps.filter(x=>!isMe(x.author));
  const diffId = p?.meet?.diffPostId;
  // 내가 고른 '가장 다른 글' → 입장이 다른 글 → 나머지 순서
  const rank = x => x.id===diffId ? 0 : (p?.stance && x.stance && x.stance!==p.stance ? 1 : 2);
  const targets = [...others].sort((a,b)=>rank(a)-rank(b));
  const n = myRepliesIn(r,["rebuttal"]).length;
  let h = `<div class="card"><p>글 하나를 골라 답해 보세요. ${diffId ? "내가 고른 ‘가장 다른 글’이 맨 위에 있어요." : ""}</p>
    ${n ? `<p class="small" style="margin-top:4px;color:var(--accent)">${ic("check", "sm")} 지금까지 ${n}개의 답을 남겼어요.</p>` : ""}</div>`;
  if(!targets.length) h += `<div class="empty">아직 답할 글이 없어요.</div>`;
  else h += `<div class="wall">${targets.map(x=>respondCard(r,x,ps)).join("")}</div>`;
  if(n || p?.respondSkipped) h += nextBtn(r);
  else if(open && S.canWrite) h += `<div class="next"><button class="btn" type="button" data-a="skip-respond">지금은 넘어가기 ${ic("arrow-right")}</button></div>`;
  return h;
}

/* ---- 다시 생각하기 · 지금의 생각 ---- */
function firstThought(r, p){
  if(isRelay(r)) return {label:"내가 만든 질문", html:`<p class="qline">“${esc((p?.questions||[])[0]?.text||"")}”</p>`};
  if(p?.initial) return {label: p.initial.predict ? "내 예측" : "처음 생각", html:initialHTML(r, p.initial)};
  const t = p?.body?.claim || firstText(p?.body);
  return {label:"처음에 쓴 내 생각", html:`${p?.stance?`<div>${stanceChip(r,p.stance)}</div>`:""}<p class="txt">${esc(t)}</p>`};
}
function changeSaved(r, c){
  const d = DEGREES.find(x=>x.k===c.degree);
  return `${c.nowStance ? `<div>${stanceChip(r,c.nowStance)}</div>` : ""}<p class="txt">${esc(c.now)}</p>
    <p style="margin-top:8px"><span class="chip">${esc(d?d.l:"")}</span> ${(c.influences||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>
    ${c.biggest ? `<p class="txt small" style="margin-top:8px"><span class="muted">영향을 준 것 · </span>${esc(c.biggest)}</p>` : ""}`;
}
function stepReflect(r, p, open){
  const f = featuresOf(r);
