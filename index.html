<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각이음</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생각이음">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1D6A4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* =========================================================
   생각이음 — 생각을 잇다, 생각이 자라다
   레이아웃: 좁은 단일 열(학생) / 넓은 2열(교사 현황).
   칠판(지금 할 일) + 줄 노트(작성 칸) + 입장별 색과 모양.
   ========================================================= */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE6; --line:#D2D9D2; --fg:#18201C; --muted:#56635D;
  --accent:#1D6A4F; --accent-ink:#FFFFFF; --accent-soft:#DCECE4;
  --board:#1F3A2F; --chalk:#EEF4EF; --chalk-dim:#B9CCC1;
  --paper:#FFFFFF; --rule:#E3E9E3;
  --s1:#2C5DB0; --s1-soft:#E2E9F6; --s2:#B0432D; --s2-soft:#F5E3DE; --s3:#2E7D46; --s3-soft:#DDEFE3; --s4:#6A48A6; --s4-soft:#EBE5F4;
  --warn:#8F5400; --warn-soft:#FAEFD9; --help:#FFF8E1; --help-line:#E9D9A6;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --sunk:#0B100E; --line:#2B3631; --fg:#E2E9E5; --muted:#97A59E;
  --accent:#5BC097; --accent-ink:#06130D; --accent-soft:#183128;
  --board:#183026; --chalk:#E9F1EC; --chalk-dim:#A6BCB0;
  --paper:#131A17; --rule:#212B26;
  --s1:#81A7EE; --s1-soft:#1A2437; --s2:#EE8D78; --s2-soft:#38211B; --s3:#7CCB95; --s3-soft:#15291C; --s4:#B89CEA; --s4-soft:#29213D;
  --warn:#E8AF5E; --warn-soft:#32250F; --help:#2A2414; --help-line:#4A3F1E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --sunk:#0B100E; --line:#2B3631; --fg:#E2E9E5; --muted:#97A59E;
  --accent:#5BC097; --accent-ink:#06130D; --accent-soft:#183128;
  --board:#183026; --chalk:#E9F1EC; --chalk-dim:#A6BCB0;
  --paper:#131A17; --rule:#212B26;
  --s1:#81A7EE; --s1-soft:#1A2437; --s2:#EE8D78; --s2-soft:#38211B; --s3:#7CCB95; --s3-soft:#15291C; --s4:#B89CEA; --s4-soft:#29213D;
  --warn:#E8AF5E; --warn-soft:#32250F; --help:#2A2414; --help-line:#4A3F1E; color-scheme:dark;
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;word-break:keep-all;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 72px;padding-inline:16px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- 상단 ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:700}
.brand span{color:var(--muted);font-size:14px;font-family:var(--f-display)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:14px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{font-size:14px;color:var(--muted)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:5px 12px;font-size:14px}
.btn.danger{color:var(--s2);border-color:var(--s2)}
.btn.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.end{justify-content:flex-end}

/* ---------- 알림 ---------- */
.notice{background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:20px}
.notice b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);z-index:10;animation:rise .2s ease-out}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* ---------- 칩 ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--fg);font-weight:500;white-space:nowrap}
.chip.tpl{background:var(--accent-soft);color:var(--accent)}
.chip.closed{color:var(--muted)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chip.st{background:var(--cs);color:var(--c);font-weight:600}
.chip.st .shp{font-size:10px}

/* ---------- 홈 ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.home-head h1{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.3}
.home-head p{margin-top:6px;color:var(--muted);max-width:60ch}
.list{display:grid;gap:12px}
.intro3{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-family:var(--f-display);font-size:16px}
.intro3 b{color:var(--accent);font-family:var(--f-body)}
.rcard{display:grid;grid-template-columns:96px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.rcard:hover{border-color:var(--accent)}
.year{font-family:var(--f-mono);font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.35}
.rcard h2{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.4}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.dist{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk);margin-top:10px;max-width:320px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.legend .shp{color:var(--c);font-size:10px}

/* ---------- 방 머리 ---------- */
.back{margin-bottom:14px}
.room-head .rmeta{margin:0 0 10px}
.room-head h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.3}
.prompt{font-family:var(--f-display);font-size:19px;line-height:1.75;margin-top:12px;max-width:62ch}
details.source{margin-top:14px;background:var(--sunk);border-radius:10px;padding:10px 16px;max-width:72ch}
details.source summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:32px;display:flex;align-items:center}
details.source p{margin-top:4px;font-size:15px}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}

/* ---------- 3단계 진행 표시: 생각 ━ 만남 ━ 변화 ---------- */
.phases{margin-top:24px}
.phases ol{display:flex;list-style:none;margin:0;padding:0}
.phases li{flex:1;display:flex;align-items:center;min-width:0}
.phases li + li::before{content:"";flex:0 0 14px;height:3px;background:var(--line);margin:0 4px;border-radius:2px}
.phases li.done + li::before{background:var(--accent)}
.phases button{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer}
.phases button:disabled{cursor:not-allowed;background:var(--bg)}
.phases .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:600;font-size:14px}
.phases .t{display:grid;min-width:0}
.phases .lbl{font-weight:600;font-size:15px;line-height:1.3;word-break:keep-all}
.phases .stt{font-size:12.5px;color:var(--muted)}
.phases .done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phases .locked .lbl{color:var(--muted)}
.phases [aria-current="step"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.phases [aria-current="step"] .n{border-color:var(--fg)}

/* ---------- 칠판: 지금 할 일 ---------- */
.board{margin-top:14px;background:var(--board);color:var(--chalk);border-radius:12px;padding:20px 22px;display:grid;gap:6px}
.board .eyebrow{color:var(--chalk-dim)}
.board h2{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.35}
.board p{color:var(--chalk-dim);font-size:15px;max-width:60ch}
.board .nxt{font-size:14px;color:var(--chalk-dim);margin-top:4px}
.board .nxt b{color:var(--chalk);font-weight:600}
.subpath{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:6px;font-size:14px}
.subpath button{border:0;background:none;color:var(--chalk-dim);cursor:pointer;padding:4px 2px;min-height:32px;font-size:14px}
.subpath button[aria-current="true"]{color:var(--chalk);font-weight:600;text-decoration:underline;text-underline-offset:4px}
.subpath button:disabled{opacity:.55;cursor:not-allowed}
.subpath .arr{color:var(--chalk-dim)}

/* ---------- 단계 내용 ---------- */
.stage{margin-top:18px;display:grid;gap:16px}
.stage.anim{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card > h3{font-size:16px;font-weight:600;margin-bottom:10px}
.q{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0}
.q + .q{margin-top:22px}
.q > label,.q > legend{font-size:17px;font-weight:600;padding:0;line-height:1.45}
.q .hint{font-size:14px;color:var(--muted)}
.frame{font-family:var(--f-display);font-size:16px;color:var(--muted)}
.opt{font-weight:400;color:var(--muted);font-size:13.5px}

/* 💡 어떻게 쓰지? */
details.help summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--warn);font-weight:600;min-height:32px;padding:2px 0}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{margin-bottom:6px}
.help-body{background:var(--help);border:1px solid var(--help-line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:14.5px}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starter{border:1px dashed var(--help-line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;text-align:left;min-height:38px;font-family:var(--f-display)}
.starter:hover{border-style:solid}

/* 줄 노트 입력 칸 */
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.7}
textarea{resize:vertical;min-height:88px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.7em - 1px),var(--rule) calc(1.7em - 1px),var(--rule) 1.7em);
  background-attachment:local;background-position:0 10px}
input[type=number]{max-width:140px}

/* 선택 칩 (라디오·체크박스) */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;display:inline-flex}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice > span{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:15px;cursor:pointer}
.choice input:checked + span{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft));color:var(--c,var(--accent));font-weight:600}
.choice input:checked + span::before{content:"✓";font-size:13px}
.choice input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.choice .shp{font-size:11px}

/* 작성 상태 (압박 없이) */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:15px;color:var(--muted)}
.status .meter{flex:0 0 100px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.status .meter i{display:block;height:100%;background:var(--muted)}
.status.ok{color:var(--accent);font-weight:600}
.status.ok .meter i{background:var(--accent)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.next{display:flex;justify-content:flex-end}
.quote{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.saved{display:grid;gap:10px}
.saved .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.reassure{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:15px}

/* ---------- 친구 글 ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.col{display:grid;gap:12px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--c);padding-bottom:6px;border-bottom:2px solid var(--c)}
.col-h em{font-style:normal;font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:13px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.post.open{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.post.diff{border-style:dashed;border-color:var(--accent)}
.post-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.post-h strong{color:var(--fg);font-weight:600}
.preview{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.pf{margin:0 0 10px}
.pf dt{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pf dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.replies{margin-top:12px;display:grid;gap:10px}
.reply{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:15px}
.reply.rebut{border-color:var(--s2)}
.reply.teacher{border-color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0}
.reply.note{border-color:var(--s3)}
.reply .rh{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.reply .rh b{color:var(--fg);font-weight:600}
.reply p{white-space:pre-wrap;overflow-wrap:anywhere}
.reply .part{margin-top:4px}
.reply .part em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted);display:block}
.rform{margin-top:12px;display:grid;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.rform .q + .q{margin-top:6px}
.rform .q > label{font-size:16px}

/* ---------- 나의 생각 흐름 ---------- */
.flow{list-style:none;margin:0;padding:0}
.flow li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:22px}
.flow li:not(:last-child)::after{content:"↓";position:absolute;left:14px;bottom:0;color:var(--muted);font-size:14px;line-height:22px}
.flow .ic{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:19px}
.flow li.final .ic{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.flow .k{font-size:13.5px;font-weight:600;color:var(--accent);margin-top:2px}
.flow .v{margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.flow .sub{margin-top:6px;font-size:14px}

/* ---------- 교사 현황 ---------- */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 4.5em;align-items:center;gap:10px;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent)}
.bar .num{text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.big3{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:12px}
.big3 div{display:grid}
.big3 b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.big3 span{font-size:13px;color:var(--muted)}
.sprog{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sprog span{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sprog span.on{border-color:var(--accent);color:var(--accent)}
.sprog span.on::before{content:"✓ "}

/* ---------- 내 기록 ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pcard summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;gap:4px}
.pcard summary::-webkit-details-marker{display:none}
.pcard summary .t{font-family:var(--f-display);font-weight:700;font-size:18px}
.pcard[open] summary{border-bottom:1px solid var(--line)}
.pbody{padding:16px 18px;display:grid;gap:14px}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.compare > div{background:var(--sunk);border-radius:10px;padding:12px 14px;min-width:0}
.compare .lbl{font-size:13px;font-weight:600;color:var(--muted)}

/* ---------- 만들기 ---------- */
.depths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.depth{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.depth b{font-size:17px;display:flex;align-items:center;gap:8px}
.depth .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.depth .fl{font-size:13.5px;color:var(--fg);font-family:var(--f-display)}
.depth .use{font-size:13px;color:var(--muted)}
.depth[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid .wide{grid-column:1/-1}
.form-grid .q + .q{margin-top:0}
.form-grid .q > label{font-size:15px}
details.adv{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.adv > summary{cursor:pointer;padding:14px 20px;font-weight:600;min-height:48px;display:flex;align-items:center;gap:8px;list-style:none}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::after{content:"펼치기 ▾";margin-left:auto;flex:0 0 auto;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px}
details.adv[open] > summary::after{content:"접기 ▴"}
details.adv > summary:hover::after{filter:brightness(.96)}
details.adv > div{padding:4px 20px 20px;display:grid;gap:18px}
.feat{display:grid;gap:10px}
.feat > label{display:flex;align-items:flex-start;gap:10px;font-size:15px;min-height:32px}
.feat input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.feat .sub{margin:-2px 0 4px 30px}
.preview-steps{background:var(--board);color:var(--chalk);border-radius:10px;padding:14px 16px;font-size:15px;display:grid;gap:4px}
.preview-steps .eyebrow{color:var(--chalk-dim)}
.preview-steps .detail{color:var(--chalk-dim);font-size:14px}

/* ---------- 질문 카드 (질문으로 생각하기 · 질문이음) ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 44px}
.qcard .qt{font-family:var(--f-display);font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.qcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}
.qcard .btn{justify-self:start}
.qline{font-family:var(--f-display);font-size:17px;line-height:1.55}
.react{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.react button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;cursor:pointer}
.react button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.react button:disabled{cursor:default}

/* ---------- 만들기: 목표와 활동 ---------- */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.goal{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15px;min-height:52px}
.goal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.tcard{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.tcard b{font-size:16px}
.tcard span{font-size:13.5px;color:var(--muted)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}

/* ---------- 우리 반의 생각 지도 (토론) ---------- */
.smap{display:grid;gap:10px;min-width:0}
.smap-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.smap-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;align-items:start}
.smap-col{display:grid;gap:10px;min-width:0;align-content:start;background:var(--cs);border-radius:14px;padding:12px}
.smap-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;color:var(--c)}
.smap-top .ic{font-size:22px;line-height:1}
.smap-top b{font-size:17px}
.smap-top .num{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;color:var(--fg)}
.smap-top .num small{font-size:13px;color:var(--muted);font-family:var(--f-body)}
.smap-bar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.smap-bar i{display:block;height:100%;background:var(--c)}
.smap-col .post{box-shadow:0 1px 3px rgba(0,0,0,.06)}
.smap-col .post.mine{border-color:var(--c);border-width:2px}
.smap-empty{font-size:14px;color:var(--muted);padding:4px 2px}
.smap-lock{font-size:14px;color:var(--muted);text-align:center}
@media (max-width:720px){ .smap-cols{grid-template-columns:1fr} }

/* ---------- 화면 밝기 ---------- */
.top-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.theme{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--sunk)}
.theme button{width:36px;height:34px;border:0;border-radius:999px;background:none;cursor:pointer;font-size:16px;padding:0;opacity:.55;transition:background .15s,opacity .15s}
.theme button[aria-pressed="true"]{background:var(--surface);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.theme button:active{transform:scale(.92)}
.theme summary::-webkit-details-marker{display:none}
.theme-menu{position:absolute;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:2px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20}
.theme-menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;min-height:38px}
.theme-menu button:hover{background:var(--sunk)}
.theme-menu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* 내 생각이 들어갈 자리 · 막 들어간 내 카드 */
.post.ghost{border:2px dashed var(--c,var(--accent));background:var(--surface);color:var(--muted);font-size:14px;text-align:center;padding:12px}
.land{animation:land .35s ease-out}
@keyframes land{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.smap-more{justify-self:center}
/* 나의 생각 흐름: 번호로 순서를 보여 준다 */
.flow{counter-reset:fl}
.flow > li{counter-increment:fl}
.flow .k::before{content:counter(fl);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}
.flow-h{display:grid;gap:2px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.flow-h h3{font-family:var(--f-display);font-size:20px}
.stance-ins{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.stance-ins span{font-size:20px}

/* ---------- 교사: 내 활동 ---------- */
.mtools{display:grid;gap:10px;margin-bottom:16px}
.mtools input[type=search]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-size:16px}
.mfilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mfilters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:36px;font-size:14px;cursor:pointer}
.mfilters button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg);font-weight:600}
.mfilters select{width:auto;min-height:36px;padding:4px 10px;font-size:14px;border-radius:999px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px;min-width:0;align-content:start}
.mcard h2{font-family:var(--f-display);font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.mcard h2 button{all:unset;cursor:pointer}
.mcard h2 button:hover{text-decoration:underline;text-underline-offset:4px}
.mcard h2 button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mmeta{font-size:13.5px;color:var(--muted)}
.mstats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.mstats b{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mprog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mprog i{display:block;height:100%;background:var(--accent)}
.macts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
.macts .sp{flex:1}
.chip.st-open::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chip.st-open{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.st-closed{background:var(--sunk);color:var(--muted)}
.chip.st-draft{background:var(--warn-soft);color:var(--warn);font-weight:600}
.chip.st-archived{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.setup{background:var(--warn-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px;margin-bottom:16px}
.setup .row input{flex:1;min-width:200px}

/* ---------- 교사: 활동 관리 ---------- */
.ahead{display:grid;gap:8px}
.ahead h1{font-family:var(--f-display);font-size:28px;line-height:1.3}
.abar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.abar .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-mono);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi b small{font-size:15px;color:var(--muted)}
.kpi span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;min-height:44px;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.tabbody{margin-top:18px;display:grid;gap:16px}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable .pbar{width:120px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.ptable .pbar i{display:block;height:100%;background:var(--accent)}
.pstat{font-weight:600}
.pstat.done{color:var(--accent)}
.pstat.none{color:var(--muted);font-weight:400}
.namebtn{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);text-align:left}
.tscroll{overflow-x:auto}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.chcard .arrow{color:var(--muted);font-size:13px}
.trans{display:grid;gap:6px}
.trans div{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
.classfb{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 16px}
.classfb summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.classfb .item{margin-top:8px;white-space:pre-wrap}
.classfb .item small{display:block;color:var(--muted)}
.pinbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.lockbox{border:0;padding:0;margin:0;min-width:0;position:relative}
.lockbox[disabled]{opacity:.62}
.lockmsg{font-size:13.5px;color:var(--warn);font-weight:600;margin:0 0 8px}
.lockinfo{display:grid;gap:4px}
.preview-banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;font-size:14.5px}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;padding:20px;max-width:520px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:18px}
.modal textarea{min-height:160px;font-family:var(--f-mono);font-size:13px;background-image:none}
#qrbox{background:#ffffff;padding:14px;border-radius:12px;justify-self:center;min-width:120px;min-height:120px;display:grid;place-items:center;color:#18201C}
.linkline{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
/* 수업에서 함께 보기 */
body.presenting .top,body.presenting .notice{display:none}
.present{display:grid;gap:22px;padding-block:8px 40px}
.present .pbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.present h1{font-family:var(--f-display);font-size:clamp(26px,4vw,44px);line-height:1.35;max-width:30ch}
.present .lead{font-size:clamp(18px,2.2vw,24px);font-weight:600}
.pbars{display:grid;gap:14px}
.pbars .pb{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:14px;align-items:center;font-size:clamp(17px,2vw,22px)}
.pbars .tr{height:28px;border-radius:14px;background:var(--sunk);overflow:hidden}
.pbars .tr i{display:block;height:100%;background:var(--c)}
.pbars .pct{font-family:var(--f-mono);font-size:clamp(22px,3vw,34px);font-variant-numeric:tabular-nums}
.pquotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pquote{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:8px}
.pquote .who{font-size:14px}
.pquote p{font-family:var(--f-display);font-size:clamp(18px,2vw,22px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:640px){ .ptable .pbar{width:70px} .mgrid{grid-template-columns:1fr} }

/* ---------- 반응형 ---------- */
@media (max-width:640px){
  .rcard{grid-template-columns:1fr;gap:4px}
  .room-head h1{font-size:25px}
  .prompt{font-size:17px}
  .board{padding:16px}
  .board h2{font-size:21px}
  .card{padding:16px}
  .foot .btn.pri{width:100%}
  .bar{grid-template-columns:6.5em 1fr 4em}
  .phases button{flex-direction:column;align-items:flex-start;gap:4px;padding:8px}
  .phases .n{width:26px;height:26px;font-size:13px}
  .phases .lbl{font-size:14px}
  .phases .stt{display:none}
  .phases li + li::before{flex-basis:8px;margin:0 2px}
  /* 휴대폰: 카드의 주요 버튼을 화면 아래쪽에 붙여 둔다 */
  .card .foot{position:sticky;bottom:0;z-index:2;background:var(--surface);margin:18px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-radius:0 0 12px 12px}
  .qcard .qt{font-size:18px}
  /* 휴대폰 상단: 로고·밝기 한 줄, 버튼은 한 줄로 밀어서 보기 */
  .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding-bottom:12px;margin-bottom:16px}
  .top-end{display:contents}
  .brand{grid-row:1;grid-column:1}
  .brand b{font-size:22px}
  .brand span{display:none}
  #theme{grid-row:1;grid-column:2}
  .top-r{grid-row:2;grid-column:1/-1;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .top-r::-webkit-scrollbar{display:none}
  .top-r > *{flex:0 0 auto;white-space:nowrap}
  .top-r .btn{min-height:38px;padding:6px 12px;font-size:14px}
  .wall{grid-template-columns:1fr}
  .sstats{width:100%}
  .sstats > div{flex:1;min-width:0}
  .sgrid{grid-template-columns:1fr}
  .npbtn{flex:1 1 100%}
  .ngrid{grid-template-columns:repeat(2,1fr)}
  .lb-img img{max-height:62vh}
  .cta .btn{width:100%}
  .wall-sec{margin-top:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v9: 교사 수업 운영 도구 ---------- */
.mrow2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mrow2 label{font-size:13px;color:var(--muted)}
.mrow2 select{width:auto;min-height:36px;padding:4px 10px;font-size:14px;border-radius:999px}
.mrow2 .sp{flex:1}
.vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.vtoggle button{border:0;background:none;padding:5px 12px;min-height:36px;font-size:14px;cursor:pointer;color:var(--muted)}
.vtoggle button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.mrates{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
.mrates .mprog{height:6px}
.mrates .mono{color:var(--fg)}
.mtable td,.mtable th{vertical-align:middle}
.mtable .acts{white-space:nowrap;text-align:right}
.mtable .acts .btn{margin-left:4px}
.mtable td.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.chip[title]{cursor:help}
.stools{display:grid;gap:10px}
.stools input[type=search]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-size:16px}
input[type=datetime-local]{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--fg);font:inherit;max-width:100%}
/* ---------- 교사 관리 ---------- */
.tadm{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tadm-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tadm-row.off{opacity:.7;background:var(--sunk)}
.tadm-st{grid-column:1/2}
.tadm-act{grid-row:1/3;grid-column:2}
/* ---------- 앱 설치 안내 ---------- */
.isteps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.isteps li{display:grid;grid-template-columns:28px 34px 1fr;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.5}
.isteps .in{width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.isteps .ic{font-size:22px;text-align:center}
.btn.inst{border-color:var(--accent);color:var(--accent)}
/* ---------- 오늘의 필기 ---------- */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}

/* 활동·기능에 따라 칠판 문구를 바꾼다 */
function stepMeta(r, st){
  const m = {...STEP[st]}, t = TEMPLATES[r.template] || {}, f = featuresOf(r);
  if(t.titles?.[st]) m.title = t.titles[st];
  if(t.stepNames?.[st]) m.s = t.stepNames[st];
  if(st === "chat"){ const nm = personaOf(r).name, c = nm.slice(-1).charCodeAt(0), j = c >= 0xAC00 && c <= 0xD7A3 && (c-0xAC00)%28 ? "과" : "와"; m.title = `${nm}에게 물어볼까요?`; m.s = `${nm}${j} 대화` }
  if(t.descs?.[st]) m.desc = t.descs[st];
  if(st==="think" && f.predict){ m.title = "먼저 예측해 볼까요?"; m.desc = "자료나 친구 생각을 보기 전에, 어떻게 될지 짐작해 보세요. 틀려도 괜찮아요."; m.s = "예측하기" }
  if(st==="read" && (r.stances||[]).length){ m.title = "우리 반의 생각을 둘러볼까요?"; m.desc = "내 생각과 다른 의견을 하나 골라 보세요." }
  if(st==="why" && TEMPLATES[r.template]?.labels?.reason) m.title = TEMPLATES[r.template].labels.reason.q;
  if(st==="take" && S.take){ m.title = "이 질문에 답해 보세요"; m.desc = "내 생각과 그렇게 생각한 이유를 적어 주세요." }
  if(st==="reflect" && f.predict && !f.change){ m.title = "내 예측과 비교해 볼까요?"; m.desc = "맞았는지보다 새로 알게 된 것이 중요해요." }
  return m;
}

function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(s){ let h=2166136261; for(const c of s){ h^=c.codePointAt(0); h=Math.imul(h,16777619) } return (h>>>0).toString(36) }
function fmt(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.` }
const cnt = v => String(v||"").replace(/\s/g,"").length;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2800);
}
function errMsg(e){
  const c = e && e.code;
  if(c==="invalid_argument") return "이 보기에서는 저장할 권한이 없어요. 선생님께 참여 권한을 요청하세요.";
  if(c==="quota_exceeded") return "저장 공간이 가득 찼어요. 오래된 활동을 지워 주세요.";
  return "저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.";
}

                open:{l:"진행 중", d:"학생이 참여하고 제출할 수 있어요."},

/* 마감 일시(dueAt)가 지나면 ‘진행 중’ 활동은 저절로 ‘마감’이 된다 */
const pastDue = r => !!(r?.dueAt && Date.now() >= r.dueAt);
const statusOf = r => { const s = STATUS[r?.status] ? r.status : (r?.open === false ? "closed" : "open"); return s === "open" && pastDue(r) ? "closed" : s };
/* 마감 시각 표시: 오늘 18:00 · 내일 9:00 · 10월 12일(월) 18:00 */
function fmtDue(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date(), z = n => String(n).padStart(2,"0"), hm = `${d.getHours()}:${z(d.getMinutes())}`;
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(d) - day(now)) / 864e5);
  if(diff === 0) return `오늘 ${hm}`;
  if(diff === 1) return `내일 ${hm}`;
  return `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]}) ${hm}`;
}
const dueChip = r => !r?.dueAt ? "" : pastDue(r) ? `<span class="chip due over">⏰ ${esc(fmtDue(r.dueAt))} 마감됨</span>`
  : `<span class="chip due${r.dueAt - Date.now() < 864e5 ? " soon" : ""}">⏰ ${esc(fmtDue(r.dueAt))}까지</span>`;
const statusChip = r => `<span class="chip st-${statusOf(r)}" title="${STATUS[statusOf(r)].d}">${STATUS[statusOf(r)].l}</span>`;
const visibleToStudents = r => ["open","closed"].includes(statusOf(r));

/* ---- 수업(Course) · 그룹(Group) · 배포(Assignment) ----
   room은 그대로 ‘활동’이다. 활동에 courseId(어느 수업)와 assign{그룹id:{status,startAt,dueAt}}(어느 그룹에 배포)을 더한다.
   courseId·assign이 없는 예전 활동은 ‘미분류’로 지금처럼 동작한다. 학생 응답(post)에는 groupId만 더한다. */
const courseOf = id => S.courses.find(c => c.id === id) || null;
const groupsOf = c => (c && Array.isArray(c.groups)) ? c.groups : [];
const groupName = (cid, gid) => groupsOf(courseOf(cid)).find(g => g.id === gid)?.name || (gid === "_none" ? "그룹 미지정" : "삭제된 그룹");
const courseIcon = c => c?.icon || (/온라인|공동|원격/.test(c?.title||"") ? "🌐" : "📘");
const asgIds = r => r && r.assign ? Object.keys(r.assign).filter(g => r.assign[g]) : [];
const ASG = {ready:{l:"시작 전", ic:"○"}, open:{l:"진행 중", ic:"●"}, closed:{l:"종료", ic:"●"}};
/* 그룹별 상태: 교사가 고른 상태 + (있으면) 시작·마감 시각 */
function asgStatus(a){
  if(!a) return "open";
  const s = a.status || "open", now = Date.now();
  if(s === "closed") return "closed";
  if(a.dueAt && now > a.dueAt) return "closed";
  if(s === "ready") return a.startAt && now >= a.startAt ? "open" : "ready";
  if(a.startAt && now < a.startAt) return "ready";
  return "open";
}
const asgChip = st => `<span class="chip as-${st}">${ASG[st].ic} ${ASG[st].l}</span>`;
/* 학생이 고른 그룹은 수업마다 이 기기에 기억한다 */
function myGroup(cid){
  if(!cid) return "";
  const g = lsGet("nonjae.group." + cid) || "";
  const c = courseOf(cid);
  return c && groupsOf(c).some(x => x.id === g) ? g : "";
}
function setMyGroup(cid, gid){ if(cid) lsSet("nonjae.group." + cid, gid || "") }
/* 학생에게 보이는 활동: 우리 그룹의 배포 상태를 활동 상태에 반영한 복사본 */
function forMe(r){
  if(r && !isTeacher() && pastDue(r) && r.open !== false && (!r.status || r.status === "open")) r = {...r, status:"closed", open:false};   // 마감 시각이 지났다
  if(!r || isTeacher() || S.preview || !asgIds(r).length || !courseOf(r.courseId)) return r;
  const gid = myGroup(r.courseId);
  if(!gid) return {...r, _needGroup:true};
  if(!r.assign[gid]) return {...r, _notAssigned:gid};
  const st = asgStatus(r.assign[gid]);
  if(statusOf(r) !== "open") return {...r, _gid:gid};
  if(st === "closed") return {...r, _gid:gid, status:"closed", open:false};
  if(st === "ready") return {...r, _gid:gid, _ready:true};
  return {...r, _gid:gid};
}

}

const lastActivity = r => Math.max(r.updatedAt||0, r.createdAt||0, ...S.posts.filter(p=>p.roomId===r.id).map(p=>p.updatedAt||p.createdAt||0), ...S.replies.filter(x=>x.roomId===r.id).map(x=>x.createdAt||0));

function fmtRel(ts){
  if(!ts) return "–";
  const now = new Date(), d = new Date(ts), m = Math.floor((now - d)/60000);
  if(m < 1) return "방금"; if(m < 60) return m + "분 전";
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();

  if(d.getFullYear() === now.getFullYear()) return `${d.getMonth()+1}월 ${d.getDate()}일`;

}

/* =========================================================
   3. 방 설정 해석 — 예전 방도 활동 유형의 기본 깊이로 동작
   ========================================================= */
function toolOf(r){
  if(r.tool && TOOLS[r.tool]) return r.tool;
  const keys = (r.fields||[]).map(f=>f.k);
  if(keys.includes("claim")) return "claimEvidence";
  if(keys.includes("guess")) return "predict";
  if(keys.includes("content")) return "source";
  return TEMPLATES[r.template]?.tool || "free";
}
function depthOf(r){ return DEPTHS[r.depth] ? r.depth : (TEMPLATES[r.template]?.depth || "normal") }
function featuresOf(r){
  const f = {...DEPTHS[depthOf(r)].features, ...(r.features||{})};
  if(f.meet === undefined) f.meet = true;                  // 2차 버전 방에는 meet 값이 없다
  f.rebuttal = r.interact === "rebuttal";                  // 상호작용 설정이 기준
  f.comment = !!r.interact && r.interact !== "none";
  if(!Array.isArray(f.readMission)) f.readMission = [];
  if(!Array.isArray(f.evidenceTypes) || !f.evidenceTypes.length) f.evidenceTypes = EVIDENCE_TYPES;
  if(r.reveal === "teacher"){ f.meet = false; f.readMission = [] }   // 친구 글을 못 보면 만남 단계도 없다
  if(f.feedback === undefined) f.feedback = true;
  f.deep = depthOf(r) === "deep";
  f.predict = !!f.predict;        // 예측하고 확인하기 (선택 기능)
  f.develop = !!f.develop;        // 질문이음: 기본 깊이에서도 질문 키우기
  return f;
}
/* 실제 작성 칸: 저장된 칸 + (근거 설명 기능이 켜졌다면) 근거 설명 칸 */
function effFields(r){
  const f = featuresOf(r);
  const list = [...(r.fields || TOOLS[toolOf(r)].fields)];
  if(f.warrant && list.some(x=>x.k==="reason") && !list.some(x=>x.k==="warrant")){
    const i = list.findIndex(x=>x.k==="reason");
    list.splice(i+1, 0, {k:"warrant", l:"근거 설명", h:"이 근거가 왜 주장을 뒷받침하는지"});
  }
  return list.map(x => FRAMES[x.k] ? {...x, l:FRAMES[x.k].l} : x);
}
/* 학생에게 보이는 질문·이름·도움말 (교사가 원하면 학습 용어를 함께) */
function sField(r, x){
  const base = STUDENT_FIELDS[x.k], over = TEMPLATES[r.template]?.labels?.[x.k];
  const sf = base ? {...base, ...(over||{})} : null, terms = featuresOf(r).terms && TERM[x.k];
  if(!sf) return {q:x.l, dl:x.l, tip:x.h, starters:[]};
  return {...sf, q: sf.q + (terms ? ` (${TERM[x.k]})` : ""), dl: sf.dl + (terms ? ` (${TERM[x.k]})` : "")};
}
const fieldLabel = (r, x) => isTeacher() ? x.l : sField(r, x).dl;

function bodyComplete(r, body, stance){
  if((r.stances||[]).length && !stance) return false;
  const fields = effFields(r);
  if(!fields.every(x => (body?.[x.k]||"").trim())) return false;
  return fields.reduce((a,x)=>a+cnt(body[x.k]),0) >= minOf(r);
}
const isEssay = r => r.template === "essay" && (TEMPLATES.essay.flow.includes("compose"));
function minOf(r){ return isEssay(r) ? 0 : (r.minChars||0) }

/* ---- 세부 활동과 3단계: 활동마다 자기 flow를 갖고, 켜진 기능에 맞는 단계만 남긴다 ---- */
const isRelay = r => r.template === "relay";
/* 감상·성찰: '생각'과 '이유'를 두 화면으로 나눠 쓴다 (칸이 둘 이상일 때) */
const isSplit = r => !!TEMPLATES[r.template]?.splitWrite && (r.fields || TOOLS[toolOf(r)].fields).length > 1;
function stepsOf(r){
  const f = featuresOf(r), t = TEMPLATES[r.template] || TEMPLATES.reflect, d = depthOf(r);
  if(isRelay(r)){
    const s = ["ask","take"];
    if(d !== "quick") s.push("back");
    if(d === "deep" || f.develop) s.push("develop");   // 질문 키우기는 깊이 있게 활동에서 (넘어갈 수 있다)
    return s;
  }
  const on = {
    think:   f.initial || f.predict,
    write:   true,
    counter: f.counter,
    read:    f.meet,
    respond: f.meet && f.rebuttal && f.deep,     // 일반 활동은 친구 생각 만나기 안에서 한마디로 끝난다
    reflect: f.change || !!r.revisit || f.predict,
    revise:  f.revise,
    see:     true,
    why:     isSplit(r),
    compose: true,
    chat:    true,
    feedback: f.feedback
  };
  return t.flow.filter(st => on[st]);
}
/* 진행 표시: 활동마다 고유한 단계 이름(phaseDefs)을 쓰고, 없으면 공통 3단계 */
function phasesOf(r){
  const st = stepsOf(r), t = TEMPLATES[r.template] || {}, lab = t.phases || {};
  const defs = t.phaseDefs || PHASES.map(ph => ({...ph, l: lab[ph.k] || ph.l}));
  return defs.map(ph => ({...ph, steps: ph.steps.filter(s => st.includes(s))})).filter(ph => ph.steps.length);
}
const phaseOfStep = (r, st) => phasesOf(r).find(ph => ph.steps.includes(st));
function myRepliesIn(r, kinds, author = S.name){ return S.replies.filter(x => x.roomId===r.id && x.author===author && kinds.includes(x.kind)) }
function stepDone(r, p, st){
  if(st === "see") return !!p || !!S.form["seen:"+r.id];
  if(!p) return false;
  switch(st){
    case "think":   return !!p.initial || submitted(p);
    case "write":   return submitted(p) || (isSplit(r) ? !!(p.body?.[effFields(r)[0].k]||"").trim() : bodyComplete(r, p.body, p.stance));
    case "why":     return submitted(p);
    case "counter": return !!p.counter?.objection;
    case "read":    return !!p.readAt;
    case "respond": return myRepliesIn(r,["rebuttal"],p.author).length > 0 || !!p.respondSkipped;   // 넘어가기도 마친 것으로
    case "reflect": return !!p.change || (!featuresOf(r).change && !!p.revisit);
    case "revise":  return !!p.revision;
    case "ask":     return (p.questions||[]).length > 0;
    case "take":    return myRepliesIn(r,["answer"],p.author).length > 0;
    case "back":    return Object.keys(p.reactions||{}).length > 0;
    case "develop": return (p.questions||[]).length > 1 || !!p.developSkipped;
    case "compose": return !!p.essay?.text;
    case "feedback": return repliesOf(p.id).some(x => x.kind==="teacher") || !!p.feedbackSkipped;
    case "chat":    return !!p.chat?.done;
    default:        return false;
  }
}
function stepState(r, p, st){
  if(["read","respond","reflect","revise","take","back","develop","feedback"].includes(st) && !submitted(p)) return "locked";
  if((st==="counter" || st==="compose" || st==="why") && !stepDone(r,p,"write")) return "locked";
  if(st==="write" && stepsOf(r).includes("chat") && !stepDone(r,p,"chat") && !submitted(p)) return "locked";   // 대화를 마친 뒤 정리
  if(st==="develop" && stepsOf(r).includes("back") && !stepDone(r,p,"back")) return "locked";
  return stepDone(r,p,st) ? "done" : "open";
}
function phaseState(r, p, ph){
  if(ph.steps.every(s => stepState(r,p,s)==="done")) return "done";
  if(stepState(r,p,ph.steps[0])==="locked") return "locked";
  return "open";
}
/* 지금 할 차례: 아직 하지 않은 첫 활동. 모두 끝났으면 결과 화면(record) */
function currentStep(r, p){
  return stepsOf(r).find(st => stepState(r,p,st)==="open") || (submitted(p) ? "record" : stepsOf(r)[0]);
}
function selectedStep(r, p){
  const chosen = S.step[r.id];
  if(chosen === "record" && submitted(p)) return "record";
  if(chosen && stepsOf(r).includes(chosen) && stepState(r,p,chosen)!=="locked") return chosen;
  return currentStep(r, p);
}
function goStep(r, st){ S.step[r.id] = st; S.anim = true; S.openPost = null }
function goNext(r){ delete S.step[r.id]; S.anim = true; S.openPost = null }

/* =========================================================
   4. 입력 상태 — 모든 폼은 S.form[key] 에 담기고, 이 기기에 임시 저장
   ========================================================= */
function F(key, init){ if(!S.form[key]) S.form[key] = init ? init() : {}; return S.form[key] }
function formKey(){ return "nonjae.form." + hash(S.name || "-") }
function loadForms(){ try{ S.form = JSON.parse(lsGet(formKey()) || "{}") || {} }catch(e){ S.form = {} } }
let formTimer;
function saveFormsSoon(){ if(S.preview) return; clearTimeout(formTimer); formTimer = setTimeout(()=> lsSet(formKey(), JSON.stringify(S.form)), 500) }
function dropForm(key){ delete S.form[key]; saveFormsSoon() }

/* 입력 요소 만들기 */
function ta(key, k, {rows=3, ph="", id}={}){
  const iid = id || `${key}-${k}`;
  return `<textarea id="${esc(iid)}" data-form="${esc(key)}" data-k="${esc(k)}" rows="${rows}" placeholder="${esc(ph)}">${esc(F(key)[k]||"")}</textarea>`;
}
/* 💡 어떻게 쓰지? — 접혀 있는 도움말 + 누르면 들어가는 문장 시작 */
function helpBox(targetId, tip, starters){
  if(!tip && !(starters||[]).length) return "";
  const btns = (starters||[]).map(s => `<button type="button" class="starter" data-a="starter" data-target="${esc(targetId)}" data-text="${esc(s.ins)}">${esc(s.show)}</button>`).join("");
  return `<details class="help"><summary>💡 어떻게 쓰지?</summary><div class="help-body">${tip?`<p>${esc(tip)}</p>`:""}
    ${btns ? `<p class="muted small">이렇게 시작해도 좋아요. 누르면 쓰기 칸에 들어가요.</p><div class="starters">${btns}</div>` : ""}</div></details>`;
}
function radios(key, k, options, {label, colors=0, icons}={}){
  const cur = F(key)[k];
  return `<div class="choices" role="radiogroup" aria-label="${esc(label||"")}">` + options.map((o,i)=>{
    const v = typeof o === "string" ? o : o.k, l = typeof o === "string" ? o : o.l;
    const colored = i < colors;
    const style = colored ? `style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)"` : "";
    const shp = colored ? `<span class="shp" aria-hidden="true">${(icons && icons[i]) || SHAPES[i%4]}</span>` : "";
    return `<label class="choice" ${style}><input type="radio" name="${esc(key+"-"+k)}" data-form="${esc(key)}" data-k="${esc(k)}" value="${esc(v)}" ${cur===v?"checked":""}><span>${shp}${esc(l)}</span></label>`;
  }).join("") + `</div>`;
}
function checks(key, k, options, {label}={}){
  const cur = new Set(F(key)[k] || []);
  return `<div class="choices" role="group" aria-label="${esc(label||"")}">` + options.map(o =>
    `<label class="choice"><input type="checkbox" data-form="${esc(key)}" data-k="${esc(k)}" data-multi value="${esc(o)}" ${cur.has(o)?"checked":""}><span>${esc(o)}</span></label>`
  ).join("") + `</div>`;
}
/* 입장 뱃지: 1 파랑 · 2 빨강 · 3 초록 · 4 보라 (입장 색 --s1~--s4와 같다. 이름 글자와 함께 보여 색만으로 구분하지 않는다) */
const BADGES = ["🔵","🔴","🟢","🟣"];
function stanceIcon(r, i){ return BADGES[i%4] }
function stanceIcons(r){ return (r.stances||[]).map((_,i) => stanceIcon(r,i)) }
function stanceChip(r, s){
  const i = stanceIdx(r, s);
  if(i < 0) return s ? `<span class="chip">${esc(s)}</span>` : "";
  return `<span class="chip st" style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)"><span class="shp" aria-hidden="true">${stanceIcon(r,i)}</span>${esc(s)}</span>`;
}
/* 질문 하나: 질문 → 문장 틀 → 💡 → 쓰기 칸 */
function question(key, k, {q, frame, tip, starters, rows=3, ph="", opt=false}){
  const id = `${key}-${k}`;
  return `<div class="q"><label for="${esc(id)}">${esc(q)}${opt?` <span class="opt">(선택)</span>`:""}</label>
    ${frame ? `<p class="frame" aria-hidden="true">${esc(frame)}</p>` : ""}
    ${helpBox(id, tip, starters)}${ta(key, k, {rows, ph})}</div>`;
}

/* =========================================================
   5. 저장소 — db 모드 / 로컬(미리보기) 모드
   ========================================================= */
async function write(dbFn, localFn){
  if(S.preview){ localFn(); render(); return true }        // 학생 화면 미리보기: 실제 데이터에 저장하지 않음
  if(S.mode === "db" || S.mode === "supa"){
    try{ await dbFn(S.db); return true }
    catch(e){ toast(errMsg(e)); return false }
  }
  localFn(); render(); return true;
}
/* 선생님 피드백(개인·우리 반 전체)은 편집자만 쓸 수 있는 treplies에 저장한다.
   예전 replies 안의 선생님 피드백은 이 버전 이전에 쓴 것만 선생님 글로 인정한다(학생이 ‘선생님’ 글을 흉내 내지 못하게). */
const LEGACY_FB_BEFORE = Date.parse("2026-10-08T01:40:00+09:00");   // 이 버전을 올린 시각
const fbMigrated = () => !!S.config.find(c => c.id === "app")?.fbMigrated;
// 선생님이 이 버전을 한 번 열면 예전 선생님 피드백을 treplies로 옮겨 두고(fbMigrated), 그 뒤로는 replies 안의 ‘선생님 글’은 보여 주지 않는다
const trustedReply = x => !(x.kind === "teacher" || x.kind === "class") || (!fbMigrated() && (x.createdAt || 0) < LEGACY_FB_BEFORE);
async function migrateTeacherFeedback(){
  if(!Auth.teacher || S.mode !== "db" || fbMigrated() || S._fbMig || !S.loaded.replies || !S.loaded.treplies || !S.loaded.config) return;
  S._fbMig = true;
  const have = new Set((S._trep || []).map(x => x.id));
  const old = (S._rep || []).filter(x => (x.kind === "teacher" || x.kind === "class") && (x.createdAt || 0) < LEGACY_FB_BEFORE && !have.has(x.id));
  try{
    for(const x of old){ const {id, ...d} = x; await S.db.doc("treplies/" + id).set(d) }
    const cur = S.config.find(c => c.id === "app") || {}; const {id, ...cfg} = cur;
    await S.db.doc("config/app").set({...cfg, fbMigrated:true, updatedAt:Date.now()});
  }catch(e){ S._fbMig = false }
}
const mergedReplies = () => [...(S._rep || []).filter(trustedReply), ...(S._trep || []).map(x => ({...x, _t:1}))];
function sub(col){
  S.db.collection(col).onSnapshot(snap => {
    let rows = snap.docs.map(d => ({id:d.id, ...d.data()})), name = col;
    if(col === "replies" || col === "treplies"){ S[col === "replies" ? "_rep" : "_trep"] = rows; S.loaded[col] = true; rows = mergedReplies(); name = "replies" }
    if(S.preview && S.preview.shadow && ["rooms","posts","replies"].includes(name)){ S.preview.shadow[name] = rows; S.loaded[name] = true; return }   // 미리보기 중엔 실제 값만 따로 받아 둔다
    S[name] = rows;
    if(name === "replies") checkNewFeedback();
    S.loaded[name] = true;
    if(name === "config" && S._rep) S.replies = mergedReplies();     // fbMigrated가 바뀌면 다시 거른다
    migrateTeacherFeedback();
    dataChanged();
  }, () => toast("실시간 연결이 끊겼어요. 새로고침해 주세요."));
}
/* 새로운 선생님 피드백이 내 글에 도착하면 알려 준다 */
function checkNewFeedback(){
  if(!S.name || isTeacher()) return;
  const mineIds = new Set(S.posts.filter(p=>p.author===S.name).map(p=>p.id));
  const fb = S.replies.filter(x => x.kind==="teacher" && mineIds.has(x.postId)).map(x=>x.id);
  const cls = S.replies.filter(x => x.kind==="class").map(x=>x.id);
  fb.push(...cls);
  if(S.seenTeacher && fb.some(id => !S.seenTeacher.has(id))) toast(cls.some(id => !S.seenTeacher.has(id)) ? "선생님이 우리 반 전체에게 피드백을 보냈어요." : "선생님 피드백이 도착했어요.");
  S.seenTeacher = new Set(fb);
}
/* 입력 중에는 다시 그리지 않고, 입력이 끝나면 그린다 */
function dataChanged(){
  if(S.hashRoom) applyHash();
  if(S.view === "create") return;
  const a = document.activeElement;
  if(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && a.type!=="radio" && a.type!=="checkbox" && a.type!=="range" && document.getElementById("app").contains(a)){ S.pending = true; return }
  if(drawingNow()){ S.pending = true; return }                        // 그리는 중에는 화면을 다시 그리지 않는다
  render();
}
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if(S.pending && !(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))){ S.pending = false; render() }
}, 0));

/* 내 글 저장: 없으면 '작성 중(draft)'으로 만들고, 있으면 합친다 */
async function savePost(r, patch){
  const ex = myPost(r), id = ex?.id || postId(r);
  const base = ex ? (({id, ...rest}) => rest)(ex)
                  : {roomId:r.id, author:S.name, stance:null, body:{}, revisit:"", status:"draft", createdAt:Date.now()};
  const data = {...base, ...patch, updatedAt:Date.now()};
  const gid = ex?.groupId || r._gid || (r.courseId ? myGroup(r.courseId) : "");
  if(gid && !data.groupId) data.groupId = gid;                 // 그룹별 결과를 위해 응답에 그룹을 붙인다
  return write(db => db.doc("posts/"+id).set(data),
               () => { S.posts = S.posts.filter(p=>p.id!==id).concat({id, ...data}) });
}
async function addReply(data){
  const col = (data.kind === "teacher" || data.kind === "class") ? "treplies" : "replies";   // 선생님 피드백은 편집자만 쓰는 곳에
  return write(db => db.collection(col).add(data),
               () => { S.replies.push({id:"x"+Math.random().toString(36).slice(2), ...data}) });
}

const HOST_THEME = document.documentElement.getAttribute("data-theme");   // 보는 곳(앱)이 정해 둔 값
/* 화면 밝기: 라이트 ↔ 다크 한 번 누르면 바로 바뀐다 (처음에는 기기 설정을 따른다) */
const curTheme = () => { const v = lsGet("nonjae.theme"); return v === "light" || v === "dark" ? v : (HOST_THEME === "dark" || HOST_THEME === "light" ? HOST_THEME : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) };
function applyTheme(v){
  document.documentElement.setAttribute("data-theme", v);
  document.querySelectorAll('[data-a="theme-set"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === v)));   // ☀️ 라이트 · 🌙 다크 중 지금 것을 표시
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", v === "dark" ? "#0F1412" : "#1D6A4F");
}
function setTheme(v){ lsSet("nonjae.theme", v); applyTheme(v) }
applyTheme(curTheme());

async function init(){
  let db = null, user = null;
  if(window.claude && typeof claude.use === "function"){
    try{ [db, user] = await Promise.all([claude.use("db"), claude.use("user")]) }catch(e){}
  }
  if(db){
    S.mode = "db"; S.db = db;
    Auth.set(user ? await user.canEdit() : false);                // 교사 인증: 플랫폼이 확인한 편집 권한
    const cw = user ? await user.can("data.write") : null;
    S.canWrite = cw !== false;
    ["rooms","posts","replies","treplies","config","courses"].forEach(sub);
    if(S.canTeach) ["tnotes","ttemplates"].forEach(sub);
  }else if(SUPABASE_URL && SUPABASE_ANON_KEY && await initSupa()){
    /* Supabase 연결 완료 (GitHub 등) */
  }else{
    S.mode = "local"; Auth.set(true);                              // 저장소가 없는 파일 미리보기(혼자 쓰는 화면)는 교사로 연다
    S.rooms = SAMPLE_ROOMS.map(r => ({...r, createdAt:Date.now()}));
    S.loaded = {rooms:1, posts:1, replies:1, courses:1};
  }
  S.role = Auth.teacher ? "teacher" : "student";                    // 예전의 ‘학생 화면/교사 화면’ 기억값은 쓰지 않는다
  loadForms();
  applyHash();
  render();
  getSample().then(() => { if(S.view === "room") render() });
}
/* 학생 링크(#활동id)로 들어오면 그 활동을 바로 연다 */
function applyHash(){
  if(!S.hashRoom || (S.mode !== "local" && (!S.loaded.rooms || !S.loaded.courses))) return;
  const h = decodeURIComponent(S.hashRoom);
  if(h === "teacher"){ if(!Auth.teacher) S.wantTeacher = true; S.view = "home"; S.hashRoom = ""; return }   // 교사 로그인 주소
  if(h.startsWith("c:")){                                   // 수업 링크: #c:수업id[/그룹id]
    const [cid, gid] = h.slice(2).split("/"), c = courseOf(cid);
    if(c){
      if(gid && groupsOf(c).some(g => g.id === gid)) setMyGroup(cid, gid);
      if(Auth.teacher) S.mcourse = cid; else S.course = cid;
      S.view = "home";
    }
    S.hashRoom = ""; return;
  }
  const [rid, gid] = h.split("/"), r = S.rooms.find(x => x.id === rid);   // 활동 링크: #활동id[/그룹id] (예전 링크 그대로)
  if(r){ S.view = "room"; S.roomId = r.id; if(gid && r.courseId) setMyGroup(r.courseId, gid) }
  S.hashRoom = "";
}

/* =========================================================
   6. 렌더 — 공통
   ========================================================= */
function render(){
  if(typeof dueKey === "function") DUE_KEY = dueKey();
  renderTop();
  const app = document.getElementById("app");
  let h = "";
  document.body.classList.toggle("presenting", S.view === "present");
  if(S.preview) h += `<div class="preview-banner" role="status"><span>👀 <b>학생 화면 미리보기 중</b> · 실제 학생 데이터에는 영향을 주지 않습니다. 여기서 쓴 내용은 저장되지 않아요.</span><button class="btn sm pri" type="button" data-a="preview-exit">교사 화면으로 돌아가기</button></div>`;

/* ---- 학생 첫 화면: 과목·선생님별로 모아 보기, 할 일 먼저 ---- */
const SUBJ_IC = [[/국어|문학|독서|언어|작문|화법/,"📖"],[/수학|미적|확률|기하|대수/,"➗"],[/영어|English/i,"🔤"],[/물리|화학|생명|지구|과학/,"🔬"],
  [/한국사|역사|세계사|동아시아/,"📜"],[/사회|지리|정치|경제|법|윤리|도덕|사상/,"🏛️"],[/음악/,"🎵"],[/미술/,"🎨"],[/체육/,"⚽"],[/정보|코딩|인공지능/,"💻"],[/일본어|중국어|독일어|프랑스어|스페인어/,"🌏"]];
const subjIcon = t => (SUBJ_IC.find(([re]) => re.test(t||"")) || [0,"📘"])[1];
const subjKey = r => ((r.subject||"").trim() || "-") + "|" + (r.teacherName||"");
const subjLabel = r => `${(r.subject||"").trim() || "과목 미정"}${r.teacherName ? ` · ${r.teacherName} 선생님` : ""}`;
const subjTone = k => { let h = 0; for(const c of k) h = (h*31 + c.charCodeAt(0)) >>> 0; return SC[h%4] };
function homeState(r){
  const mine = myPost(r), open = r.open !== false && statusOf(r) === "open";
  if(isNotes(r)){
    if(mine?.notes && noteRedoReq(mine)) return {k:"todo", l:"↻ 다시 제출해 주세요", o:0};
    if(mine?.notes) return {k:"done", l:"✓ 제출 완료", o:3};
    return open ? {k:"todo", l:"📸 아직 안 냈어요", o:0} : {k:"closed", l:"🔒 마감", o:4};
  }
  if(submitted(mine)){
    const phs = phasesOf(r), done = phs.filter(ph => phaseState(r,mine,ph) === "done").length;
    if(done >= phs.length || !open) return {k:"done", l:"✓ 다 했어요", o:3};
    return {k:"doing", l:`▶ ${phs[done].l} 하는 중`, o:1};
  }
  if(!open) return {k:"closed", l:"🔒 마감", o:4};
  return mine ? {k:"todo", l:"✏️ 쓰는 중", o:0} : {k:"todo", l:"✏️ 아직 안 했어요", o:0};
}
const HSORTS = [["todo","할 일 먼저"],["new","새로 올라온 순"],["due","마감 가까운 순"],["subject","과목 순"]];
function viewHomeStudent(crs, rooms){

  list.sort({todo:(a,b) => a.st.o - b.st.o || (a.r.dueAt||9e15) - (b.r.dueAt||9e15) || byNew(a,b), new:byNew,
             due:(a,b) => (a.r.dueAt && a.st.o < 3 ? a.r.dueAt : 9e15) - (b.r.dueAt && b.st.o < 3 ? b.r.dueAt : 9e15) || byNew(a,b),
             subject:(a,b) => koCmp(subjLabel(a.r), subjLabel(b.r)) || a.st.o - b.st.o || byNew(a,b)}[sort]);
  const cnt = k => items.filter(x => x.st.k === k).length;
  let h = `<section class="shome">

      <h1>${crs ? `${courseIcon(crs)} ${esc(crs.title)}` : nm ? `${esc(nm)}님, 안녕하세요 👋` : "안녕하세요 👋"}</h1>
      <p>${crs ? (myGroup(crs.id) ? `${esc(groupName(crs.id, myGroup(crs.id)))} · ` : "") + `이 수업의 활동만 보여요. <button class="linkbtn" type="button" data-a="course-all">모든 활동 보기</button>` : "오늘 함께 생각할 활동이에요. 하나를 골라 들어가 보세요."}</p></div>
      <div class="sstats"><div class="todo"><b>${cnt("todo")}</b><span>해야 할 활동</span></div><div><b>${cnt("doing")}</b><span>하는 중</span></div><div><b>${cnt("done")}</b><span>다 했어요</span></div></div></div>`;
  if(!rooms.length) return h + `<div class="empty">아직 열린 활동이 없어요. 선생님이 활동을 올리면 여기에 나타나요.</div></section>`;
  if(subs.length > 1) h += `<div class="stabs" role="tablist" aria-label="과목·선생님">

  h += `<div class="sbar"><span class="muted small">${cur ? esc(subjLabel(subs.find(([k]) => k === cur)[1])) + " · " : ""}활동 ${list.length}개</span>

  h += `<div class="sgrid">${list.map(({r, st, k}) => {

    return `<button class="scard ${st.k}" type="button" data-a="open" data-id="${esc(r.id)}" style="--c:var(--${subjTone(k)});--cs:var(--${subjTone(k)}-soft)">

    </button>`}).join("")}</div></section>`;
  return h;

function noteSrc(img){
  if(!img) return "";

  const c = NURL[img.p];

async function loadNoteUrls(){
  const paths = [...NURL_Q]; NURL_Q = new Set();
  for(let i = 0; i < paths.length; i += 100){
    const part = paths.slice(i, i + 100), now = Date.now();
    try{
      const r = await SB.storage.from("notes").createSignedUrls(part, 6 * 3600);
      const got = new Map((r.data || []).filter(x => x.signedUrl).map(x => [x.path, x.signedUrl]));
      part.forEach(p => { NURL[p] = got.has(p) ? {url:got.get(p), exp:now + 6*3600*1000 - 60000} : {url:"", exp:now + 60000, bad:true} });

async function shrinkImage(file, maxSide, q){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}) }
  catch(e){ bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file) }) }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, maxSide / Math.max(w0, h0)), w = Math.round(w0 * k), h = Math.round(h0 * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", q));
  if(!blob) throw new Error("이미지 변환 실패");
  return {blob, w, h};
}
