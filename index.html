    h += `<div class="q" id="wq-${esc(x.k)}"><label for="${key}-${x.k}">${esc(s.q)}</label>
      ${s.frame ? `<p class="frame" aria-hidden="true">${esc(s.frame)}</p>` : (!STUDENT_FIELDS[x.k] && x.h ? `<p class="hint">${esc(x.h)}</p>` : "")}
      ${helpBox(`${key}-${x.k}`, s.tip, s.starters)}`;
    if(x.k==="reason" && f.evidenceType){
      h += ta(key, x.k, {rows:3}) + `<details class="help"><summary>＋ 어디에서 찾은 이유인가요? (선택)</summary>${radios(key,"_etype",f.evidenceTypes,{label:"이유의 종류"})}</details></div>`;
      continue;
    }
    h += ta(key, x.k, {rows: x.k==="claim" || x.k==="center" ? 2 : 3}) + `</div>`;
  }
  if(toolOf(r) === "sketch") h += `<div class="q"><span class="hint">내 생각 지도 미리 보기</span><div id="skprev">${sketchMapHTML(F(key))}</div></div>`;
  // 상위권을 위한 선택 영역: 기본 화면에는 접혀 있다
  if(depthOf(r) !== "quick" && part !== 0){
    h += `<details class="help" style="margin-top:18px"><summary>🔍 더 깊이 생각해보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:8px">
      ${question(key,"_other",{q:"나와 다른 관점에서 보면 어떨까요?", opt:true, rows:2, tip:"반대편이나 다른 사람의 자리에서 한 번 생각해 보세요.", starters:[{show:"다른 관점에서 보면 ___라고 볼 수도 있다.", ins:"다른 관점에서 보면 "}]})}
      ${question(key,"_source",{q:"내 생각을 받쳐 주는 자료가 있나요?", opt:true, rows:2, tip:"교과서, 사료, 통계 중 하나면 충분해요.", starters:[{show:"교과서(자료)를 보면 ___", ins:"자료를 보면 "}]})}
    </div></details>`;
  }
  const editing = S.editing === r.id;
  const label = part === 0 ? "다음: 이유 쓰기" : editing ? "고친 글 저장" : (f.counter ? "다음으로" : (isEssay(r) ? "다음: 글쓰기" : "내 생각 보내기"));
  h += `<div class="foot">${statusHTML(r)}<div class="row">
      ${part === 1 ? `<button class="linkbtn" type="button" data-a="step" data-v="write">← 앞으로</button>` : ""}
      ${editing ? `<button class="btn" type="button" data-a="cancel-edit">취소</button>` : ""}
      <button class="btn pri" type="button" data-a="save-write" id="wsubmit" data-part="${part ?? ""}">${label}</button></div></div>`;
  h += `</div>`;
  return h;
}

/* 내 생각을 보내기 전의 생각 지도: 인원 분포 + 내가 고른 쪽에 '내 생각이 들어갈 자리' */
function writeMapHTML(r){ return `<div id="wmap">${wallHTML(r, myPost(r))}</div>` }

/* ---- 생각하기 · 나와 다른 생각 (깊이 있는 활동, 여기서 제출) ---- */
function stepCounter(r, p, open){
  const key = "counter:" + r.id, editing = S.form[key]?._edit;
  const mine = p?.body?.claim || firstText(p?.body);
  if(p?.counter && !editing){
    return `<div class="card saved">
      <div class="lbl">나와 다른 생각</div><p class="txt">${esc(p.counter.objection)}</p>
      ${p.counter.response ? `<div class="lbl">내가 할 대답</div><p class="txt">${esc(p.counter.response)}</p>` : ""}
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="counter-edit">고치기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({objection:p?.counter?.objection||"", response:p?.counter?.response||""}));
  return `<div class="card">
    ${mine ? `<div class="q"><span class="hint">내 생각</span><p class="quote">${esc(mine)}</p></div>` : ""}
    ${question(key,"objection",{q:"나와 다른 생각을 가진 사람은 어떻게 생각할까요?", rows:2,
       tip:"내 주장에 반대하는 사람이라면 어떤 이야기를 할지 생각해 보세요.",
       starters:[{show:"나와 다른 생각을 가진 사람은 ___라고 말할 것이다.", ins:"나와 다른 생각을 가진 사람은 "}]})}
    ${question(key,"response",{q:"그 사람에게 나는 뭐라고 답할까요?", opt:true, rows:2,
       tip:"인정할 부분이 있다면 먼저 인정해도 좋아요.",
       starters:[{show:"그 말도 일리가 있지만, ___", ins:"그 말도 일리가 있지만, "}]})}
    <div class="foot"><button class="linkbtn" type="button" data-a="step" data-v="write">← 내 생각 다시 보기</button>
      <button class="btn pri" type="button" data-a="save-counter">${submitted(p) ? "저장하기" : (isEssay(r) ? "다음: 글쓰기" : "내 생각 보내기")}</button></div></div>`;
}

/* ---- 함께 생각하기 · 친구 생각 살펴보기 ---- */
function displayName(r, author, ps){
  if(author === S.name && !isTeacher()) return "나";
  if(r.anonymous && !isTeacher()){
    const authors = [...new Set(ps.map(x=>x.author))], i = authors.indexOf(author);
    return i < 0 ? "익명" : "익명 " + (i+1);
  }
  return author;
}
const finalBody = p => p.revision?.body || p.body || {};
const isImg = v => /^data:image\//.test(String(v||""));
const firstText = b => Object.values(b||{}).find(v => typeof v === "string" && v.trim() && !isImg(v)) || "";   // 그림 데이터는 글로 보여 주지 않는다
const cellv = v => isImg(v) ? "(그림)" : (v || "");
function postHead(r, p, ps){
  return `<div class="post-h"><strong>${esc(displayName(r,p.author,ps))}</strong>${p.stance ? stanceChip(r,p.stance) : ""}
    ${p.revision ? `<span class="chip">다시 쓴 글</span>` : ""}<span>${fmt(p.updatedAt||p.createdAt)}</span>
    ${isTeacher() && r.anonymous ? `<span>· 학생들에게는 익명</span>` : ""}</div>`;
}
function previewText(r, p){
  if(p.revision?.essay || p.essay?.text) return p.revision?.essay || p.essay.text;
  if(isRelay(r)) return (p.questions||[])[0]?.text || "";
  const b = finalBody(p);
  const k = effFields(r).find(x => b[x.k] && !isImg(b[x.k]));
  return k ? b[k.k] : "";
}
/* 내가 볼 수 있는 답글: 예전 읽기 메모는 글쓴이와 선생님만 */
function visibleReplies(p){
  return repliesOf(p.id).filter(x => x.kind !== "note" || isTeacher() || p.author === S.name || x.author === S.name);
}
function replyHTML(r, x, ps){
  const who = x.kind === "teacher" ? "선생님" : displayName(r, x.author, ps);
  const tag = isTeacher() ? ({rebuttal:"반박", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "")
                          : ({rebuttal:"답", teacher:"피드백", note:"읽기 메모", comment:"댓글", answer:"이어받은 생각"}[x.kind] || "");
  let body = "";
  if(x.kind === "answer"){
    body = `<p>${esc(x.text)}</p>` + (x.evidence ? `<div class="part"><em>이유</em><p>${esc(x.evidence)}</p></div>` : "");
  }else if(x.kind === "note"){
    body = MISSIONS.filter(m => x.answers?.[m.k]).map(m => `<div class="part"><em>${esc(m.q)}</em><p>${esc(x.answers[m.k])}</p></div>`).join("");
  }else if(x.kind === "rebuttal" && (x.differ || x.agree)){
    body = (x.agree ? `<div class="part"><em>공감하는 부분</em><p>${esc(x.agree)}</p></div>` : "")
         + `<div class="part"><em>생각이 다른 부분</em><p>${esc(x.differ)}</p></div>`
         + `<div class="part"><em>그렇게 생각하는 이유${x.evidenceType?` · ${esc(x.evidenceType)}`:""}</em><p>${esc(x.evidence)}</p></div>`
         + `<div class="part"><em>내 의견</em><p>${esc(x.text)}</p></div>`;
  }else{
    body = `<p>${esc(x.text)}</p>` + (x.evidence ? `<div class="part"><em>이유${x.evidenceType?` · ${esc(x.evidenceType)}`:""}</em><p>${esc(x.evidence)}</p></div>` : "");
  }
  const cls = {rebuttal:" rebut", teacher:" teacher", note:" note"}[x.kind] || "";
  return `<div class="reply${cls}"><div class="rh"><b>${esc(who)}</b>${tag?`<span>${tag}</span>`:""}<span>${fmt(x.createdAt)}</span></div>${body}</div>`;
}
function repliesBlock(r, p, ps){
  const list = visibleReplies(p);
  return list.length ? `<div class="replies">${list.map(x=>replyHTML(r,x,ps)).join("")}</div>` : "";
}
const REPLY_HELP = {
  tip:"“나는 이 의견에 동의한다/동의하지 않는다. 왜냐하면…”으로 시작해 보세요.",
  starters:[{show:"나는 이 생각에 ___한다. 왜냐하면 ___ 때문이다.", ins:"나는 이 생각에 "},
            {show:"친구의 의견에서 ___한 점은 공감하지만, 나는 ___라고 생각한다.", ins:"친구의 의견에서 "}]
};
function commentForm(r, p, label){
  const key = "com:" + p.id;
  return `<div class="rform">${question(key,"text",{q:label, rows:2, ...REPLY_HELP})}
    <div class="row end"><button class="btn sm pri" type="button" data-a="save-comment" data-id="${esc(p.id)}">올리기</button></div></div>`;
}
function readCard(r, p, mine, ps, {pickable=true}={}){
  const f = featuresOf(r), isOpen = S.openPost === p.id, reps = visibleReplies(p);
  const diffId = mine?.meet?.diffPostId || S.form["meet:"+r.id]?.diffPostId;
  const picked = diffId === p.id;
  if(!isOpen){
    return `<article class="post wcard${picked?" diff":""}${p===mine?" mine":""}${p===mine && S.landed===r.id?" land":""}" style="${p===mine ? "" : wallTone(r,p)}">${postHead(r,p,ps)}${picked?`<p class="small" style="color:var(--accent);font-weight:600">✓ 내가 고른 생각</p>`:""}${wallCardBody(r,p,ps)}</article>`;
  }
  let h = `<article class="post open${picked?" diff":""}${p===mine?" mine":""}">${postHead(r,p,ps)}${picked?`<p class="small" style="color:var(--accent);font-weight:600;margin:-4px 0 6px">✓ 내가 고른 생각</p>`:""}`;
  h += fieldsHTML(r, finalBody(p), {evidenceType:p.evidenceType}) + repliesBlock(r, p, ps);
  const open = r.open!==false && S.canWrite;
  if(open && pickable && p !== mine && !mine?.readAt){
    h += `<div class="row" style="margin-top:12px"><button class="btn sm${picked?" picked":""}" type="button" data-a="pick-diff" data-id="${esc(p.id)}" aria-pressed="${picked}">${picked?"✓ 이 생각을 골랐어요":"이 생각을 고를래요"}</button></div>`;
  }
  // 한마디를 남긴 뒤에는 다른 친구 글에도 자유롭게 한마디 더 (선택)
  if(open && p !== mine && (mine?.readAt || !pickable)){
    if(f.deep && f.rebuttal && f.meet) h += `<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-a="go-respond" data-id="${esc(p.id)}">이 생각에 답해보기 →</button></div>`;
    else if(f.comment) h += commentForm(r, p, "한마디 더 남기기 (선택)");
  }
  return h + `<div class="row end" style="margin-top:10px"><button class="linkbtn" type="button" data-a="close-post">접기</button></div></article>`;
}
/* ---- 우리 반 게시판: 패들렛처럼 카드로 모아 보기. ‘제출 후 공개’ 활동은 내 생각을 게시하기 전까지 흐리게 ---- */
const wallTone = (r, p) => {
  const i = (r.stances||[]).indexOf(p.stance);
  if(i >= 0) return `--wc:var(--${SC[i%4]}-soft)`;
  let h = 0; for(const c of String(p.author||p.id)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return `--wc:var(--${SC[h%4]}-soft)`;
};
function wallCardBody(r, p, ps, extra = ""){
  const img = Object.values(finalBody(p)).find(isImg), txt = previewText(r, p), reps = visibleReplies(p).length;
  return `${img ? `<img class="wimg" src="${esc(img)}" alt="${esc(displayName(r,p.author,ps))}의 그림" loading="lazy">` : ""}
    ${txt ? `<p class="wtxt">${esc(txt)}</p>` : ""}
    <div class="pmeta"><span>${reps ? `💬 ${reps}` : ""}${extra}</span><button class="btn sm" type="button" data-a="open-post" data-id="${esc(p.id)}">펼쳐 읽기</button></div>`;
}
function wallCard(r, p, mine, ps){
  if(S.openPost === p.id) return readCard(r, p, mine, ps, {pickable:false});
  return `<article class="post wcard${p===mine?" mine":""}${p===mine && S.landed===r.id?" land":""}" style="${p===mine ? "" : wallTone(r,p)}">${postHead(r,p,ps)}${wallCardBody(r,p,ps)}</article>`;
}
const BLUR_TXT = ["나는 이 문제를 이렇게 생각한다. 왜냐하면 수업 시간에 배운 내용과 자료를 보면 알 수 있기 때문이다.",
  "처음에는 잘 몰랐지만 자료를 다시 읽어 보니 생각이 조금 달라졌다.", "이 의견에 동의한다. 근거는 두 가지가 있다.",
  "다른 쪽에서 보면 또 다른 이유가 있을 수 있다. 예를 들어 그 당시 사람들의 입장에서 보면", "짧게 말하면 이렇다."];
const blurCard = (i, tone) => `<div class="post wcard blurred" style="--wc:var(--${tone || SC[i%4]}-soft)" aria-hidden="true"><div class="post-h"><strong>친구</strong></div><p class="wtxt">${BLUR_TXT[i%BLUR_TXT.length]}</p></div>`;
const wallLocked = (r, p) => r.reveal === "after" && !submitted(p);
function wallHTML(r, p){
  if(r.reveal === "teacher") return `<section class="wall-sec" aria-label="우리 반 게시판"><div class="wall-h"><span class="eyebrow">📌 우리 반 게시판</span></div>
    <div class="empty">이 활동의 글은 선생님만 볼 수 있어요.</div></section>`;
  const ps = postsOf(r.id), hasSt = (r.stances||[]).length > 0, locked = wallLocked(r, p);
  const list = locked ? ps.filter(x => x !== p) : [...ps].sort((a,b) => (b===p) - (a===p) || (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  const head = `<div class="wall-h"><span class="eyebrow">📌 우리 반 게시판</span><span class="muted small">생각 ${list.length}개</span></div>`;
  if(!list.length && !hasSt) return `<section class="wall-sec" aria-label="우리 반 게시판">${head}<div class="empty">아직 올라온 생각이 없어요.${locked ? " 첫 번째로 게시해 보세요!" : ""}</div></section>`;
  if(!locked){
    const card = x => wallCard(r, x, p, ps);
    return `<section class="wall-sec" aria-label="우리 반 게시판">${hasSt ? stanceMap(r, list, card) : head + `<div class="wall">${list.map(card).join("")}</div>`}</section>`;
  }
  // 잠김: 실제 글 대신 흐린 자리 카드만 그린다 (화면 코드에도 친구 글이 들어가지 않는다)
  const pick = F(writeKey(r))._stance;
  const inner = hasSt
    ? stanceMap(r, list, null, {preview:pick})                              // 입장별 인원과 ‘내 생각이 들어갈 자리’만
    : head + `<div class="wall">${list.slice(0, 12).map((x,i) => blurCard(i)).join("")}</div>`;
  const blur = hasSt ? `<div class="wall blurred" style="margin-top:12px">${list.slice(0, 8).map((x,i) => blurCard(i, SC[Math.max(0,(r.stances||[]).indexOf(x.stance))%4])).join("")}</div>` : "";
  return `<section class="wall-sec" aria-label="우리 반 게시판">${hasSt ? inner : ""}<div class="wall-lock">${hasSt ? blur : inner}
    ${list.length ? `<div class="wall-veil"><div><b>🔒 내 생각을 게시하면<br>친구들의 생각 ${list.length}개가 보여요</b>
      <button class="btn pri sm" type="button" data-a="to-stage">내 생각 쓰러 가기</button></div></div>` : ""}</div></section>`;
}
/* 우리 반의 생각 지도: 입장마다 영역을 나누고 인원과 생각 카드를 보여 준다 (휴대폰에서는 위아래로) */
function stanceMap(r, list, cardFn, {lockNote="", preview=""}={}){
  const n = list.length || 0, st = r.stances || [], LIMIT = 4;
  return `<section class="smap" aria-label="우리 반의 생각 지도">
    <div class="smap-h"><span class="eyebrow">우리 반의 생각 지도</span><span class="muted small">${n}명 참여</span></div>
    <div class="smap-cols" style="--n:${st.length}">${st.map((s,i)=>{
      const items = list.filter(p=>p.stance===s).sort((a,b) => (b.author===S.name) - (a.author===S.name));
      const pct = n ? Math.round(items.length/n*100) : 0, more = S.mapMore?.[r.id+":"+i];
      const shown = cardFn && !more ? items.slice(0, LIMIT) : items;
      const ghost = preview === s ? `<div class="post ghost land" style="--c:var(--${SC[i%4]})">✏️ 내 생각이 여기에 들어가요</div>` : "";
      return `<div class="smap-col" style="--c:var(--${SC[i%4]});--cs:var(--${SC[i%4]}-soft)">
        <div class="smap-top"><span class="ic" aria-hidden="true">${stanceIcon(r,i)}</span><b>${esc(s)}</b><span class="num">${items.length}<small>명</small></span></div>
        <div class="smap-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
        ${ghost}
        ${cardFn ? (items.length ? shown.map(cardFn).join("") : `<p class="smap-empty">아직 이 입장의 생각이 없어요.</p>`) : ""}
        ${cardFn && !more && items.length > LIMIT ? `<button class="btn sm smap-more" type="button" data-a="map-more" data-v="${i}">생각 ${items.length-LIMIT}개 더 보기</button>` : ""}</div>`;
    }).join("")}</div>
    ${lockNote ? `<p class="smap-lock">${esc(lockNote)}</p>` : ""}</section>`;
}
function groupedPosts(r, list, cardFn){
  if((r.stances||[]).length) return stanceMap(r, list, cardFn);
  return `<div class="wall">${list.map(cardFn).join("")}</div>`;
}
function stepRead(r, p, open){
  const f = featuresOf(r), ps = postsOf(r.id), others = ps.filter(x => x.author !== S.name);
  const key = "meet:" + r.id, mform = F(key, () => ({diffPostId:p?.meet?.diffPostId||""}));
  const diffId = p?.meet?.diffPostId || mform.diffPostId;
  const diffPost = diffId && ps.find(x=>x.id===diffId);
  const diffName = diffPost ? displayName(r, diffPost.author, ps) : "";
  const hasSt = (r.stances||[]).length > 0;
  let h = `<div class="card"><p><b>${hasSt ? "내 생각과 다른 의견을 하나 골라 보세요." : "내 생각과 다른 친구의 생각을 하나 찾아보세요."}</b></p>
    <p class="muted small" style="margin-top:4px">생각 카드를 펼쳐 읽고 ‘이 생각을 고를래요’를 누르면 돼요.</p></div>`;
  if(hasSt) h += stanceMap(r, ps, x => readCard(r, x, p, ps));
  else if(!others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += groupedPosts(r, submitted(p) ? [p, ...others] : others, x => readCard(r, x, p, ps));   // 게시판: 내 카드가 맨 앞
  if(hasSt && !others.length) h += `<div class="empty">아직 다른 친구의 글이 없어요. 잠시 뒤 다시 와 보세요.</div>`;

  // 이미 마친 경우: 고른 생각과 내 한마디
  if(p?.readAt){
    const ans = p.meet?.answers || {};
    let saved = diffPost ? `<div class="lbl">내가 고른 ${esc(diffName)}의 생각</div><p class="quote">${esc(previewText(r,diffPost))}</p>` : "";
    saved += MISSIONS.filter(m => ans[m.k]).map(m=>`<div class="lbl">${esc(m.q)}</div><p class="txt">${esc(ans[m.k])}</p>`).join("");
    if(saved) h += `<div class="card saved">${saved}</div>`;
    return h + nextBtn(r);
  }
  if(!open || !S.canWrite) return h;
  if(!others.length) return h + `<div class="next"><button class="btn" type="button" data-a="read-done">지금은 넘어가기 →</button></div>`;

  // 선택 질문 (교사가 켠 경우에만, 모두 선택)
  const extra = MISSIONS.filter(m => f.readMission.includes(m.k));
  const extraHTML = extra.length ? `<details class="help" style="margin-top:14px"><summary>➕ 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">${extra.map(m=>question(key, m.k, {q:m.q, rows:2, opt:true, tip:m.tip, starters:m.starters})).join("")}</div></details>` : "";
  const pickedQuote = diffPost ? `<div class="q"><span class="hint">내가 고른 ${esc(diffName)}의 생각</span><p class="quote">${esc(previewText(r,diffPost))}</p></div>` : "";

  // 깊이 있게: 고른 뒤 '친구 생각에 답해보기' 단계로
  if(f.deep && f.rebuttal){
    return h + `<div class="card">${pickedQuote || `<p class="muted">친구의 생각을 하나 고르면, 다음 단계에서 그 생각에 답해 볼 수 있어요.</p>`}${extraHTML}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="read-done">다 읽었어요</button></div></div>`;
  }
  // 일반: 고른 생각에 한마디
  if(!diffPost) return h + `<div class="empty">친구의 생각을 하나 고르면, 여기에 한마디 쓸 칸이 열려요.</div>`;
  return h + `<div class="card">${pickedQuote}
    ${question(key,"reply",{q:"친구의 생각을 읽고 한마디 답해 보세요.", rows:2, ...MEET_HELP})}
    ${extraHTML}
    <div class="foot"><button class="linkbtn" type="button" data-a="unpick">다른 생각 고르기</button>
      <button class="btn pri" type="button" data-a="meet-reply">한마디 남기기</button></div></div>`;
}

/* ---- 함께 생각하기 · 친구 생각에 답하기 ---- */
function replyForm(r, p){
  const f = featuresOf(r), key = "reb:" + p.id;
  const quote = `<div class="q"><span class="hint">친구의 생각</span><p class="quote">${esc(finalBody(p).claim || previewText(r,p))}</p></div>`;
  const send = `<div class="row end"><button class="btn sm" type="button" data-a="close-post">취소</button>
      <button class="btn sm pri" type="button" data-a="save-rebuttal" data-id="${esc(p.id)}">답 남기기</button></div>`;
  if(!f.deep){
    // 기본: 내 의견 + 이유 두 칸
    return `<div class="rform">${quote}
      ${question(key,"text",{q:"이 생각에 대해 나는 어떻게 생각하나요?", rows:2, ...REPLY_HELP})}
      ${question(key,"evidence",{q:"그렇게 생각하는 이유는?", rows:2, tip:"수업 내용, 자료, 경험 중 하나를 들어 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      ${send}</div>`;
  }
  // 깊이 있게: 공감 / 다른 점 / 이유 / 내 의견
  return `<div class="rform">${quote}
    ${question(key,"agree",{q:"공감하는 부분이 있나요?", opt:true, rows:2, tip:"친구 생각에서 인정할 수 있는 점을 먼저 적어 보세요.", starters:[{show:"친구의 의견에서 ___한 점은 공감한다.", ins:"친구의 의견에서 "}]})}
    ${question(key,"differ",{q:"생각이 다른 부분은?", rows:2, tip:"친구 글의 어느 문장에서 생각이 갈리는지 찾아보세요.", starters:[{show:"하지만 나는 ___라고 생각한다.", ins:"하지만 나는 "}]})}
    <div class="q"><label for="${key}-evidence">그렇게 생각하는 이유는?</label>
      ${helpBox(`${key}-evidence`, "수업 내용, 자료, 통계, 사례 중 하나를 들어 보세요.", [{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}])}
      ${f.evidenceType ? `<p class="hint">어디에서 찾은 이유인가요? <span class="opt">(선택)</span></p>${radios(key,"etype",f.evidenceTypes,{label:"이유의 종류"})}` : ""}
      ${ta(key,"evidence",{rows:2})}</div>
    ${question(key,"text",{q:"그래서 나는 이렇게 생각해요", rows:2, ...REPLY_HELP})}
    ${send}</div>`;
}
function respondCard(r, p, ps){
  const isOpen = S.openPost === p.id;
  const mineCount = S.replies.filter(x=>x.postId===p.id && x.author===S.name && x.kind==="rebuttal").length;
  let h = `<article class="post${isOpen?" open":""}">${postHead(r,p,ps)}`;
  if(!isOpen) return h + `<p class="preview">${esc(previewText(r,p))}</p>
    <div class="pmeta"><span>${mineCount ? "✓ 내가 답했어요" : ""}</span><button class="btn sm" type="button" data-a="open-post" data-id="${esc(p.id)}">답하기</button></div></article>`;
  h += fieldsHTML(r, finalBody(p), {evidenceType:p.evidenceType}) + repliesBlock(r, p, ps);
  if(r.open!==false && S.canWrite) h += replyForm(r, p);
  return h + `</article>`;
}
function stepRespond(r, p, open){
  const ps = postsOf(r.id), others = ps.filter(x=>x.author!==S.name);
  const diffId = p?.meet?.diffPostId;
  // 내가 고른 '가장 다른 글' → 입장이 다른 글 → 나머지 순서
  const rank = x => x.id===diffId ? 0 : (p?.stance && x.stance && x.stance!==p.stance ? 1 : 2);
  const targets = [...others].sort((a,b)=>rank(a)-rank(b));
  const n = myRepliesIn(r,["rebuttal"]).length;
  let h = `<div class="card"><p>글 하나를 골라 답해 보세요. ${diffId ? "내가 고른 ‘가장 다른 글’이 맨 위에 있어요." : ""}</p>
    ${n ? `<p class="small" style="margin-top:4px;color:var(--accent)">✓ 지금까지 ${n}개의 답을 남겼어요.</p>` : ""}</div>`;
  if(!targets.length) h += `<div class="empty">아직 답할 글이 없어요.</div>`;
  else h += `<div class="wall">${targets.map(x=>respondCard(r,x,ps)).join("")}</div>`;
  if(n || p?.respondSkipped) h += nextBtn(r);
  else if(open && S.canWrite) h += `<div class="next"><button class="btn" type="button" data-a="skip-respond">지금은 넘어가기 →</button></div>`;
  return h;
}

/* ---- 다시 생각하기 · 지금의 생각 ---- */
function firstThought(r, p){
  if(isRelay(r)) return {label:"내가 만든 질문", html:`<p class="qline">“${esc((p?.questions||[])[0]?.text||"")}”</p>`};
  if(p?.initial) return {label: p.initial.predict ? "내 예측" : "처음 생각", html:initialHTML(r, p.initial)};
  const t = p?.body?.claim || firstText(p?.body);
  return {label:"처음에 쓴 내 생각", html:`${p?.stance?`<div>${stanceChip(r,p.stance)}</div>`:""}<p class="txt">${esc(t)}</p>`};
}
function changeSaved(r, c){
  const d = DEGREES.find(x=>x.k===c.degree);
  return `${c.nowStance ? `<div>${stanceChip(r,c.nowStance)}</div>` : ""}<p class="txt">${esc(c.now)}</p>
    <p style="margin-top:8px"><span class="chip">${esc(d?d.l:"")}</span> ${(c.influences||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>
    ${c.biggest ? `<p class="txt small" style="margin-top:8px"><span class="muted">영향을 준 것 · </span>${esc(c.biggest)}</p>` : ""}`;
}
function stepReflect(r, p, open){
  const f = featuresOf(r);
  // 예전 '수업 후 다시 생각하기' 방식 (생각의 변화 기능이 꺼진 예측 방)
  if(!f.change){
    if(p?.revisit) return `<div class="card saved"><div class="lbl">수업 후 다시 생각하기</div><p class="txt">${esc(p.revisit)}</p></div>` + nextBtn(r);
    if(!open) return closedNote();
    const key = "rv:" + r.id, first = p?.initial ? firstThought(r, p) : null;
    return (first ? `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>` : "") + `<div class="card">${question(key,"text",{q:"수업을 듣고 나니 내 예측은 어땠나요?", rows:3, tip:"맞았는지보다, 무엇을 새로 알게 됐는지가 중요해요.", starters:[{show:"처음에는 ___라고 예측했는데, ___", ins:"처음에는 "}]})}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revisit">저장하기</button></div></div>`;
  }
  const first = firstThought(r, p), key = "chg:" + r.id, editing = S.form[key]?._edit;
  if(p?.change && !editing){
    return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div><div><div class="lbl">지금의 생각</div>${changeSaved(r,p.change)}</div></div>
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="change-edit">고치기</button>` : ""}` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({now:p?.change?.now||"", nowStance:p?.change?.nowStance||p?.stance||"", degree:p?.change?.degree||"", influences:p?.change?.influences||[], biggest:p?.change?.biggest||""}));
  return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>
    <p class="reassure">생각이 바뀌지 않아도 괜찮아요. 친구의 생각을 보고도 내 생각을 지킬 수 있어요.</p>
    <div class="card">
      <fieldset class="q"><legend>친구들의 생각을 본 뒤, 내 생각이 달라졌나요?</legend>${radios(key,"degree",DEGREE_CHOICES,{label:"생각의 변화"})}</fieldset>
      ${(r.stances||[]).length ? `<fieldset class="q"><legend>지금 내 입장은? <span class="opt">(처음과 같아도 괜찮아요)</span></legend>${radios(key,"nowStance",r.stances,{label:"지금 입장", colors:r.stances.length, icons:stanceIcons(r)})}</fieldset>` : ""}
      ${question(key,"now",{q:"지금 나는 어떻게 생각하나요?", rows:3, tip:"달라졌어도, 그대로여도 괜찮아요. 왜 그런지만 함께 적어 주세요.",
         starters:[{show:"처음에는 ___라고 생각했지만, 지금은 ___라고 생각한다.", ins:"처음에는 "},{show:"처음 생각과 크게 달라지지 않았다. 왜냐하면 ___ 때문이다.", ins:"처음 생각과 크게 달라지지 않았다. 왜냐하면 "},{show:"친구의 생각을 읽고 ___라는 점은 생각하지 못했다.", ins:"친구의 생각을 읽고 "}]})}
      ${f.deep ? `<details class="help" style="margin-top:14px"><summary>➕ 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">
         ${question(key,"biggest",{q:"생각에 가장 영향을 준 것은 무엇인가요?", opt:true, rows:2, tip:"친구의 글, 자료, 선생님 말씀 중 하나를 떠올려 보세요.", starters:[{show:"친구의 글을 읽고 ___을 알게 되었다.", ins:"친구의 글을 읽고 "}]})}
         <fieldset class="q"><legend>영향을 준 것 고르기 <span class="opt">(선택)</span></legend>${checks(key,"influences",INFLUENCES,{label:"영향을 준 것"})}</fieldset></div></details>` : ""}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-change">지금의 생각 남기기</button></div></div>`;
}

/* ---- 다시 생각하기 · 글 다시 쓰기 ---- */
function receivedSummary(r, p){
  const ps = postsOf(r.id);
  const show = repliesOf(p.id).filter(x => x.kind==="teacher" || x.kind==="rebuttal" || x.kind==="note" || x.kind==="comment");
  if(!show.length) return `<p class="muted small">아직 받은 답이나 피드백이 없어요.</p>`;
  return `<div class="replies">${show.map(x=>replyHTML(r,x,ps)).join("")}</div>`;
}
function stepRevise(r, p, open){
  const key = "rev:" + r.id, editing = S.form[key]?._edit;
  if(isEssay(r) && p?.essay){
    if(p.revision?.essay && !editing){
      return `<div class="card"><h3>고쳐 쓴 글</h3><p class="txt">${esc(p.revision.essay)}</p>
        ${(p.revision.edits||[]).length ? `<p style="margin-top:8px">${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
        ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
        <details class="card"><summary>처음 쓴 글 보기</summary><p class="txt" style="margin-top:10px">${esc(p.essay.text)}</p></details>` + nextBtn(r);
    }
    if(!open) return closedNote();
    F(key, () => ({essay:p.revision?.essay || p.essay.text, edits:p.revision?.edits || []}));
    return `<div class="compare"><div><div class="lbl">받은 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
      <div class="card"><div class="q"><label for="${key}-essay">글 고쳐 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요</span></label>${ta(key,"essay",{rows:12})}</div>
        <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
        <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">고친 글 저장</button></div></div>`;
  }
  if(p?.revision && !editing){
    return `<div class="card"><h3>다시 쓴 글</h3>${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}
      ${(p.revision.edits||[]).length ? `<p>${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
      <details class="card"><summary>처음 글 보기</summary><div style="margin-top:10px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></details>` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({...(p?.revision?.body || p?.body || {}), edits:p?.revision?.edits || []}));
  let form = "";
  for(const x of effFields(r)){
    const s = sField(r, x);
    form += question(key, x.k, {q:s.q, rows:3, tip:s.tip, starters:[]});
  }
  return `<div class="compare">
      <div><div class="lbl">처음 글</div><div style="margin-top:6px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></div>
      <div><div class="lbl">받은 답과 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
    <div class="card"><h3>다시 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요. 고치고 싶은 곳만 고치세요.</span></h3>${form}
      <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">다시 쓴 글 저장</button></div></div>`;
}

/* ---- 결과 화면: 나의 생각 흐름 (입력 없음, 자동 정리) ---- */
function thinkFlow(r, p){
  if(isRelay(r)) return relayFlow(r, p);
  const teacher = isTeacher(), reps = repliesOf(p.id), ps = postsOf(r.id), b = p.body || {}, fields = effFields(r);
  const L = (s, t) => teacher ? t : s;
  const node = (ic, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  if(p.chat?.log?.length) h += node("🎭", `${stepMeta(r,"chat").s} (질문 ${p.chat.log.filter(x=>x.role==="user").length}개)`, `<details class="chatfold"><summary class="muted small">대화 펼쳐 보기</summary>${chatLogHTML(r, p.chat.log)}</details>`);
  if(p.initial) h += node(p.initial.predict ? "🔮" : "💭", p.initial.predict ? "내 예측" : "처음 생각", `<div class="v">${initialHTML(r,p.initial)}</div>`);
  // 내가 말한 생각 + 이유
  if(fields.some(x=>x.k==="claim")){
    h += node("✏️", L((r.stances||[]).length ? "처음 입장 · 내 생각" : "내가 말한 생각","주장"), `<div class="v">${p.stance?stanceChip(r,p.stance)+" ":""}${esc(b.claim||"")}</div>`);
    if(b.reason) h += node("📚", L("내가 든 이유","근거"), `<div class="v">${p.evidenceType?`<span class="chip">${esc(p.evidenceType)}</span> `:""}${esc(b.reason)}</div>${b.warrant?`<div class="sub"><span class="muted">${L("도움이 되는 까닭","근거 설명")} · </span>${esc(b.warrant)}</div>`:""}`);
    const rest = fields.filter(x => !["claim","reason","warrant"].includes(x.k) && b[x.k]);
    if(rest.length) h += node("📝", L("그 밖에 쓴 내용","기타 서술"), rest.map(x=>`<div class="sub"><span class="muted">${esc(fieldLabel(r,x))} · </span>${esc(b[x.k])}</div>`).join(""));
  }else{
    h += node("✏️", L("내가 말한 생각","작성한 글"), `<div class="v">${fieldsHTML(r, b, {evidenceType:p.evidenceType})}</div>`);
  }
  if(p.deeper && (p.deeper.other || p.deeper.source)) h += node("🔍", L("더 깊이 생각한 것","심화(다른 관점·자료)"), `${p.deeper.other?`<div class="sub"><span class="muted">다른 관점 · </span>${esc(p.deeper.other)}</div>`:""}${p.deeper.source?`<div class="sub"><span class="muted">자료 · </span>${esc(p.deeper.source)}</div>`:""}`);
  if(p.essay?.text) h += node("📄", L("내가 쓴 글","작성한 글"), `<div class="v">${esc(p.essay.text)}</div>`);
  if(p.counter) h += node("🤔", L("나와 다른 생각 예상","예상 반론"), `<div class="v">${esc(p.counter.objection)}</div>${p.counter.response?`<div class="sub"><span class="muted">${L("내 대답","재반박")} · </span>${esc(p.counter.response)}</div>`:""}`);
  // 만난 다른 생각
  const diff = p.meet?.diffPostId && ps.find(x=>x.id===p.meet.diffPostId);
  const myReplies = S.replies.filter(x=>x.roomId===r.id && x.author===p.author && (x.kind==="rebuttal"||x.kind==="comment"));
  const meetAns = MISSIONS.filter(m => p.meet?.answers?.[m.k] && !(m.k==="reply" && myReplies.length));
  if(diff || meetAns.length){
    h += node("👥", L("친구의 생각","친구 글 읽기"),
      (diff ? `<div class="v"><span class="muted small">내가 고른 생각 · ${esc(displayName(r,diff.author,ps))}</span><p class="quote" style="margin-top:4px">${esc(previewText(r,diff))}</p></div>` : "") +
      meetAns.map(m=>`<div class="sub"><span class="muted">${esc(m.q)} · </span>${esc(p.meet.answers[m.k])}</div>`).join(""));
  }
  // 내가 한 답
  if(myReplies.length) h += node("💡", L("친구 생각을 읽고 내가 발견한 점","작성한 반박·댓글"), `<div class="sub muted">${myReplies.length}개</div><div class="replies">${replyHTML(r,myReplies[myReplies.length-1],ps)}</div>`);
  // 받은 반응과 피드백
  const got = reps.filter(x=>x.kind==="rebuttal"||x.kind==="comment"||x.kind==="note");
  if(got.length) h += node("👂", L("친구들이 남긴 답","받은 반박·댓글"), `<div class="sub muted">${got.length}개</div><div class="replies">${got.slice(-2).map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  const fb = reps.filter(x=>x.kind==="teacher");
  if(fb.length) h += node("🧑‍🏫", L("나에게 온 선생님 피드백","개인 피드백"), `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  // 지금의 생각
  if(p.revision?.essay) h += node("🔄", L("고쳐 쓴 글","최종 수정본"), `<div class="v">${esc(p.revision.essay)}</div>`, true);
  else if(p.revision) h += node("🔄", L("지금의 생각 · 다시 쓴 글","최종 수정본"), `<div class="v">${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}</div>${p.change?`<div class="sub"><span class="chip">${esc(DEGREES.find(d=>d.k===p.change.degree)?.l||"")}</span> ${esc(p.change.biggest||"")}</div>`:""}`, true);
  else if(p.change) h += node("🔄", L("지금의 생각","생각의 변화"), `${p.stance && p.change.nowStance ? `<div class="sub">처음에는 ${stanceChip(r,p.stance)} → 지금은 ${stanceChip(r,p.change.nowStance)}${p.stance===p.change.nowStance ? ' <span class="muted">· 입장은 그대로, 생각은 더 깊어졌어요</span>' : ' <span class="muted">· 생각이 달라졌어요</span>'}</div>` : ""}<div class="v">${changeSaved(r,p.change)}</div>`, true);
  else if(p.revisit) h += node("🔄", L("수업 후의 생각","수업 후 다시 생각하기"), `<div class="v">${esc(p.revisit)}</div>`, true);
  return h + `</ol>`;
}
function stepRecord(r, p){
  if(!submitted(p)) return `<div class="empty">글을 내면 나의 생각 흐름이 여기에 정리돼요.</div>`;
  let h = `<div class="card"><div class="flow-h"><h3>🧭 나의 생각 흐름</h3><p class="muted small">${esc(TEMPLATES[r.template]?.flowSummary || "처음 생각 → 친구의 생각 → 지금의 생각")}</p></div>${thinkFlow(r,p)}</div>`;
  // 빠른 활동: 만남 단계가 없어도 친구 글은 둘러볼 수 있다
  if(!featuresOf(r).meet && r.reveal !== "teacher"){
    const ps = postsOf(r.id), others = ps.filter(x=>x.author!==S.name);
    if(others.length) h += `<details class="card"><summary>친구들 생각 둘러보기 (${others.length}편)</summary><div style="margin-top:12px">${groupedPosts(r, others, x => readCard(r, x, p, ps, {pickable:false}))}</div></details>`;
  }
  return h + `<div class="row end"><button class="btn" type="button" data-a="mine">내 생각 기록 전체 보기</button></div>`;
}

/* ---- 질문으로 생각하기 · 질문 보기 ---- */
function stepSee(r, p, open){
  const q = QTYPES[r.qtype];
  return `<div class="card"><div class="eyebrow">🔎 오늘의 질문</div><p class="qline" style="font-size:20px;margin-top:6px">${esc(r.prompt)}</p>
    ${q ? `<p class="row" style="margin-top:10px">${qtypeChip(r.qtype)}<span class="muted small">${esc(q.d)}</span></p>` : ""}
    <div style="margin-top:10px">${qtypeHelp()}</div>
    <div class="foot"><span></span><button class="btn pri" type="button" data-a="see-done">내 생각 쓰러 가기</button></div></div>`;
}
/* ---- 논술 · 글쓰기 ---- */
const essayKey = r => "essay:" + r.id;
function essayStatusHTML(r){
  const t = F(essayKey(r)).text || "", n = cnt(t), min = r.minChars || 0, ok = t.trim() && n >= min;
  const pct = min ? Math.min(100, n/min*100) : 100;
  return `<div class="status ${ok?"ok":""}" id="estatus" aria-live="polite"><span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>
    ${min ? `<span class="mono small">${n} / 최소 ${min}자</span>` : ""}<span>${ok ? "✓ 보낼 수 있어요." : "정리한 생각과 근거를 이어서 써 보세요."}</span></div>`;
}
function stepCompose(r, p, open){
  const editing = S.form[essayKey(r)]?._edit;
  if(p?.essay?.text && !editing){
    return `<div class="card"><h3>내가 쓴 글</h3><p class="txt">${esc(p.essay.text)}</p>
      ${open && S.canWrite && !p.revision ? `<button class="linkbtn" type="button" data-a="essay-edit">고치기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  const key = essayKey(r), b = p?.body || {};
  F(key, () => ({text:p?.essay?.text || ""}));
  const outline = effFields(r).map(x => b[x.k] ? `${b[x.k]}` : "").filter(Boolean).join("\n\n");
  return `<details class="card" open><summary style="cursor:pointer;font-weight:600">내가 정리한 생각과 근거</summary><div style="margin-top:10px">${fieldsHTML(r, b, {evidenceType:p?.evidenceType})}</div></details>
    <div class="card"><div class="q"><label for="${key}-text">한 편의 글로 써 보세요</label>
      ${helpBox(`${key}-text`, "처음–가운데–끝으로 나누면 쉬워요. 정리한 내용을 불러와서 다듬어도 돼요.", [{show:"정리한 내용 불러오기", ins:outline},{show:"나는 ___라고 생각한다. 그 이유는 첫째, …", ins:"나는 "}])}
      ${ta(key,"text",{rows:12})}</div>
      <div class="foot">${essayStatusHTML(r)}<button class="btn pri" type="button" data-a="essay-save">글 보내기</button></div></div>`;
}
/* ---- 논술 · 피드백 보기 ---- */
function stepFeedback(r, p, open){
  const fb = repliesOf(p.id).filter(x => x.kind==="teacher"), ps = postsOf(r.id);
  if(fb.length) return `<div class="card"><h3>선생님 피드백</h3><div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div></div>` + nextBtn(r);
  return `<div class="empty">선생님이 글을 읽고 있어요. 피드백이 오면 여기에 보여요.</div>
    ${p.feedbackSkipped ? nextBtn(r) : (open && S.canWrite ? `<div class="next"><button class="btn" type="button" data-a="fb-skip">피드백 없이 다음으로 →</button></div>` : "")}`;
}

/* =========================================================
   질문이음 — 정해진 순서 없이 '질문 카드 풀'에서 원하는 질문을 이어받는다
   질문: posts 문서의 questions[] · 이어받은 생각: replies(kind "answer", qid) · 질문자의 반응: posts.reactions
   ========================================================= */
const RELAY_REACT = [
  {k:"curious", l:"💡 더 궁금해졌어요"},
  {k:"changed", l:"🔄 생각이 달라졌어요"},
  {k:"newidea", l:"✨ 새로운 생각을 얻었어요"}
];
const ASK_HELP = {tip:"‘왜’, ‘만약’, ‘어떻게’로 시작하면 질문이 잘 떠올라요.",
  starters:[{show:"왜 ___였을까?", ins:"왜 "},{show:"만약 ___였다면 어떻게 되었을까?", ins:"만약 "},{show:"어떻게 ___할 수 있었을까?", ins:"어떻게 "}]};
const fixedQtype = r => QTYPES[r.qtype] ? r.qtype : "";
const answersTo = (p, q) => S.replies.filter(x => x.kind==="answer" && x.postId===p.id && x.qid===q.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function relayPool(r){
  const out = [];
  postsOf(r.id).forEach(p => (p.questions||[]).forEach(q => out.push({p, q, answers:answersTo(p,q)})));
  return out;
}
function relayCard(r, it, ps, {action=false}={}){
  const mine = it.answers.some(a => a.author === S.name);
  return `<article class="qcard"><div class="eyebrow">🔎 질문${it.q.from ? " · 이어진 질문" : ""}</div>
    <p class="qt">“${esc(it.q.text)}”</p>
    <div class="meta">${qtypeChip(it.q.qtype)}<span>만든 친구: ${esc(displayName(r, it.p.author, ps))}</span><span>답 ${it.answers.length}개</span></div>
    ${action ? (mine ? `<p class="small" style="color:var(--accent);font-weight:600">✓ 내가 이어받은 질문</p>`
                     : `<button class="btn pri" type="button" data-a="take" data-id="${esc(it.p.id)}" data-q="${esc(it.q.id)}">이 질문 이어받기</button>`) : ""}</article>`;
}
function qtypeField(r, key){
  if(fixedQtype(r)) return `<p class="small">이번에는 ${qtypeChip(r.qtype)}을 만들어요. <span class="muted">${esc(QTYPES[r.qtype].d)}</span></p>`;
  return `<fieldset class="q"><legend>어떤 질문인가요? <span class="opt">(선택)</span></legend>
    ${radios(key,"qtype",Object.entries(QTYPES).map(([k,v])=>({k, l:`${v.mark} ${v.short}`})),{label:"질문 유형"})}${qtypeHelp("내 질문 점검하기")}</fieldset>`;
}
/* ① 질문 만들기: 입력창 하나 */
function stepAsk(r, p, open){
  const qs = p?.questions || [], key = "ask:" + r.id, ps = postsOf(r.id);
  if(qs.length && !S.form[key]?._edit){
    const it = {p, q:qs[0], answers:answersTo(p, qs[0])};
    return relayCard(r, it, ps) + (open && S.canWrite && !it.answers.length ? `<button class="linkbtn" type="button" data-a="ask-edit">질문 고치기</button>` : "") + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:qs[0]?.text||"", qtype:qs[0]?.qtype||""}));
  return `<div class="card">
    ${question(key,"text",{q:"💡 어떤 질문이 떠올랐나요?", rows:2, ph:"질문을 입력하세요", ...ASK_HELP})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><span class="muted small">질문을 보내면 친구들이 이어받아 답해요.</span>
      <button class="btn pri" type="button" data-a="ask-save">질문 보내기</button></div></div>`;
}
/* ② 질문 이어받기: 카드 풀에서 골라 답하기 */
function stepTake(r, p, open){
  const ps = postsOf(r.id), pool = relayPool(r).filter(it => it.p.author !== S.name);
  const sel = S.take && pool.find(it => it.p.id===S.take.pid && it.q.id===S.take.qid);
  const myAns = myRepliesIn(r, ["answer"]);
  if(sel && open && S.canWrite){
    const key = `ans:${sel.p.id}:${sel.q.id}`;
    return relayCard(r, sel, ps) + `<div class="card">
      ${question(key,"text",{q:"이 질문에 대한 내 생각은?", rows:2, tip:"정답을 맞히는 게 아니에요. 지금 떠오르는 생각을 적어 보세요.", starters:[{show:"나는 ___라고 생각한다.", ins:"나는 "},{show:"잘 모르겠지만 ___일 것 같다.", ins:"잘 모르겠지만 "}]})}
      ${question(key,"evidence",{q:"왜 그렇게 생각하나요?", opt:true, rows:2, tip:"수업 내용, 자료, 내 경험 중 하나를 떠올려 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      <div class="foot"><button class="linkbtn" type="button" data-a="take-cancel">다른 질문 고르기</button>
        <button class="btn pri" type="button" data-a="answer-save" data-id="${esc(sel.p.id)}" data-q="${esc(sel.q.id)}">내 생각 보내기</button></div></div>`;
  }
  // 아직 내가 답하지 않은 질문, 답이 적은 질문이 앞으로
  const rank = it => (it.answers.some(a=>a.author===S.name) ? 1000 : 0) + it.answers.length;
  const sorted = [...pool].sort((a,b) => rank(a)-rank(b) || (a.q.at||0)-(b.q.at||0));
  let h = `<div class="card"><p><b>친구의 질문 하나를 골라 이어받아 보세요.</b></p>
    <p class="muted small" style="margin-top:4px">답이 적은 질문이 앞에 있어요.${myAns.length ? ` · 지금까지 ${myAns.length}개 이어받았어요.` : ""}</p></div>`;
  if(!sorted.length) h += `<div class="empty">아직 친구들이 만든 질문이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += `<div class="qgrid">${sorted.map(it => relayCard(r, it, ps, {action: open && S.canWrite})).join("")}</div>`;
  if(myAns.length) h += nextBtn(r);
  return h;
}
/* ③ 내 질문으로 돌아가기: 친구의 생각 → 나의 생각(반응) */
function stepBack(r, p, open){
  const ps = postsOf(r.id), qs = p?.questions || [], can = open && S.canWrite;
  const items = qs.map(q => ({q, answers:answersTo(p,q)})).filter(x => x.answers.length);
  if(!items.length){
    return `<div class="empty">아직 내 질문에 답한 친구가 없어요. 조금만 기다려 주세요.
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" type="button" data-a="step" data-v="take">그동안 다른 질문 이어받기</button></div></div>`;
  }
  let h = "";
  for(const {q, answers} of items){
    h += `<div class="card"><ol class="flow">
      <li><span class="ic" aria-hidden="true">🌱</span><div style="min-width:0"><div class="k">내가 만든 질문</div><p class="qline">“${esc(q.text)}”</p>${qtypeChip(q.qtype)}</div></li>
      ${answers.map(a => {
        const re = p.reactions?.[a.id], nk = "rn:" + a.id;
        return `<li><span class="ic" aria-hidden="true">👤</span><div style="min-width:0"><div class="k">${esc(displayName(r,a.author,ps))}의 생각</div>
          <div class="v">${esc(a.text)}</div>${a.evidence ? `<div class="sub"><span class="muted">이유 · </span>${esc(a.evidence)}</div>` : ""}
          <p class="small muted" style="margin-top:8px">💡 이 생각을 읽고 나는?</p><div class="react" role="group" aria-label="이 생각을 읽고 나는?">${RELAY_REACT.map(x => `<button type="button" data-a="react" data-id="${esc(a.id)}" data-v="${x.k}" aria-pressed="${re?.kind===x.k}" ${can?"":"disabled"}>${x.l}</button>`).join("")}</div>
          ${re?.note ? `<p class="small" style="margin-top:6px"><span class="muted">나의 생각 · </span>${esc(re.note)}</p>`
            : (re && can ? `<details class="help" style="margin-top:6px"><summary>✏️ 한 줄 덧붙이기 (선택)</summary>${ta(nk,"text",{rows:2, ph:"이 생각을 읽고 든 내 생각"})}<div class="row end" style="margin-top:6px"><button class="btn sm" type="button" data-a="react-note" data-id="${esc(a.id)}">덧붙이기</button></div></details>` : "")}
        </div></li>`;
      }).join("")}</ol></div>`;
  }
  if(Object.keys(p.reactions||{}).length) h += nextBtn(r);
  else h += `<p class="muted small" style="text-align:center">친구의 생각 하나를 읽고, 아래 세 가지 중 하나를 눌러 보세요.</p>`;
  return h;
}
/* ④ 질문 키우기: 새 질문은 다시 카드 풀로 */
function stepDevelop(r, p, open){
  const qs = p?.questions || [], ps = postsOf(r.id), last = qs[qs.length-1], key = "dev:" + r.id;
  if(qs.length > 1){
    return qs.slice(1).map(q => relayCard(r, {p, q, answers:answersTo(p,q)}, ps)).join("") + nextBtn(r);
  }
  if(p?.developSkipped && !S.form[key]?._open){
    return `<div class="card"><p class="muted">이번에는 질문 키우기를 넘어갔어요.</p>${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="dev-open">그래도 질문 키워 보기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:"", qtype:last?.qtype||""}));
  return `<div class="card">
    <div class="q"><span class="hint">처음 질문</span><p class="quote">${esc(last?.text||"")}</p></div>
    ${question(key,"text",{q:"🌿 친구의 생각을 보고 새로 궁금해진 것은?", rows:2, ph:"새 질문을 입력하세요", tip:"처음 질문을 더 깊게, 또는 더 넓게 바꿔 보세요.",
       starters:[{show:"그렇다면 ___는 어떨까?", ins:"그렇다면 "},{show:"왜 ___일까?", ins:"왜 "},{show:"만약 ___라면?", ins:"만약 "}]})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><button class="linkbtn" type="button" data-a="dev-skip">이번엔 넘어가기</button>
      <button class="btn pri" type="button" data-a="develop-save">새 질문 보내기</button></div></div>`;
}
/* 질문이음의 생각 흐름: 질문 씨앗 → 친구의 생각 → 나의 생각 → 새로운 질문 */
function relayFlow(r, p){
  const ps = postsOf(r.id), qs = p.questions || [], teacher = isTeacher();
  const node = (ic, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  qs.forEach((q, i) => {
    h += node(i ? "🌿" : "🌱", i ? "새롭게 생긴 질문" : "내가 만든 질문", `<p class="qline">“${esc(q.text)}”</p>${qtypeChip(q.qtype)}`, i>0 && i===qs.length-1);
    const ans = answersTo(p, q);
    if(ans.length) h += node("👤", "친구의 생각", ans.map(a => `<div class="sub"><b>${esc(displayName(r,a.author,ps))}</b> · ${esc(a.text)}${a.evidence?` <span class="muted">(${esc(a.evidence)})</span>`:""}</div>`).join(""));
    const re = ans.filter(a => p.reactions?.[a.id]);
    if(re.length) h += node("💡", "내가 발견한 점", re.map(a => { const x = p.reactions[a.id]; return `<div class="sub">${esc(RELAY_REACT.find(k=>k.k===x.kind)?.l||"")}${x.note?` · ${esc(x.note)}`:""}</div>` }).join(""));
  });
  const taken = S.replies.filter(x => x.roomId===r.id && x.kind==="answer" && x.author===p.author);
  if(taken.length) h += node("🔗", teacher ? "이어받아 답한 질문" : "내가 이어받은 질문", taken.map(a => {
    const owner = ps.find(x=>x.id===a.postId), q = owner?.questions?.find(y=>y.id===a.qid);
    return `<div class="sub"><span class="muted">“${esc(q?.text||"")}” → </span>${esc(a.text)}</div>`;
  }).join(""));
  const fb = repliesOf(p.id).filter(x=>x.kind==="teacher");
  if(fb.length) h += node("🧑‍🏫", "선생님 피드백", `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  return h + `</ol>`;
}

/* 향후 사고 보조(AI) 자리: 각 단계의 question() 옆 도움말(helpBox)에 '생각을 더 깊게 해 볼 질문' 같은
   보조 제안을 붙일 수 있도록 도움말을 한곳에서 만든다. 지금은 구현하지 않는다. */

/* =========================================================
   10. 방 — 교사: 현황판 + 학생별 사고 과정 (학습 용어 사용)
   ========================================================= */
function barRow(label, n, total){
  const pct = total ? Math.round(n/total*100) : 0;
  return `<div class="bar"><span>${esc(label)}</span><span class="track" role="img" aria-label="${esc(label)} ${n}명 / ${total}명"><i style="width:${pct}%"></i></span><span class="num">${n} / ${total}</span></div>`;
}
/* 참여 통계: 활동에 실제로 있는 단계만 센다 */
function teacherStats(r){
  const gs = S.gsel && S.gselRoom === r.id;                       // 그룹별 보기: 활동 전체 명단·학생 수는 쓰지 않는다
  const all = allPostsOf(r.id), sub = all.filter(submitted), roster = gs ? [] : (tnote(r).roster || []);
  const total = gs ? 0 : (roster.length || Number(r.classSize) || 0);
  const steps = stepsOf(r);
  const complete = all.filter(p => steps.every(st => stepDone(r,p,st)));
  const st = {all, sub, total, roster, complete:complete.length, participants:all.length,
    inProgress: all.length - complete.length, notJoined: total ? Math.max(0, total - all.length) : null};
  if(steps.includes("reflect")) st.reflected = all.filter(p => stepDone(r,p,"reflect")).length;
  if(steps.includes("revise")) st.revised = all.filter(p => p.revision).length;
  return st;
}
/* 학생 한 명의 진행 상태 */
function progressOf(r, p){
  if(!p) return {label:"미참여", cls:"none", pct:0, cur:""};
  const steps = stepsOf(r), done = steps.filter(st => stepDone(r,p,st)).length;
  if(done === steps.length) return {label:"완료", cls:"done", pct:100, cur:""};
  const cur = steps.find(st => !stepDone(r,p,st));
  const i = steps.indexOf(cur);
  return {label: !submitted(p) ? `첫 응답 작성 중 · ${STEP[cur].t}` : `${i+1}단계 진행 중 · ${STEP[cur].t}`, cls:"", pct:Math.round(done/steps.length*100), cur};
}
const TTABS = [["overview","개요"],["progress","참여 현황"],["students","학생 생각"],["change","생각의 변화"],["feedback","피드백"],["settings","설정"]];
function viewRoomTeacher(r){

      <span class="mmeta">${esc([r.grade, r.subject, r.unit].filter(Boolean).join(" / "))}${r.duration?` · ⏱ ${esc(r.duration)}분`:""}</span></div>
    <h1>${esc(r.title)}</h1>
    <div class="abar">

  // 상단 요약: 활동에 맞는 숫자만
  const k = [];
  k.push(`<div class="kpi"><b>${st.participants}${st.total?`<small> / ${st.total}</small>`:""}</b><span>참여</span></div>`);

  if(st.reflected !== undefined) k.push(`<div class="kpi"><b>${st.reflected}</b><span>${featuresOf(r).change ? "생각 변화 기록" : "돌아보기 완료"}</span></div>`);
  k.push(`<div class="kpi"><b>${st.complete}</b><span>모든 단계 완료</span></div>`);
  h += `<div class="kpis">${k.join("")}</div>`;
  h += `<nav class="tabs" role="tablist" aria-label="활동 관리">${TTABS.map(([k2,l]) => `<button type="button" role="tab" data-a="ttab" data-v="${k2}" aria-selected="${tab===k2}">${l}</button>`).join("")}</nav>`;
  const body = {overview:tabOverview, progress:tabProgress, students:tabStudents, change:tabChange, feedback:tabFeedback, settings:tabSettings}[tab] || tabOverview;
  return h + `<div class="tabbody">${body(r, st)}</div>`;
}
/* 상태 버튼: 작성 중 → 공개 / 진행 중 → 마감 / 마감 → 다시 열기 / 보관 → 보관 해제 */

  if(!isRelay(r) && !fields.some(x=>x.k==="claim")) rows.push(["글 작성", st.sub.length]);

  return h;

/* ---- 탭: 참여 현황 (학생별 진행) ---- */
function tabProgress(r, st){

/* ---- 탭: 생각의 변화 ---- */
function tabChange(r, st){
  const ps = st.sub, f = featuresOf(r);
  if(isRelay(r)){

  if(isEssay(r)){

      ${rev.length ? `<div class="chgrid">${rev.map(p=>`<div class="chcard"><b>${esc(p.author)}</b><span class="arrow">처음 글</span><p class="preview">${esc(p.essay?.text||"")}</p><span class="arrow">↓ 피드백 뒤 고쳐 쓴 글</span><p class="preview">${esc(p.revision.essay||finalBody(p).claim||"")}</p></div>`).join("")}</div>` : `<div class="empty">아직 고쳐 쓴 학생이 없어요.</div>`}`;
  }

  const hasSt = (r.stances||[]).length > 0;
  const firstSt = p => p.initial?.stance && stanceIdx(r,p.initial.stance)>=0 ? p.initial.stance : p.stance;
  const lastSt = p => p.change?.nowStance || p.stance;
  const moved = withC.filter(p => hasSt && firstSt(p) && lastSt(p) && firstSt(p)!==lastSt(p));
  const kept = withC.filter(p => !moved.includes(p));
  const deepened = kept.filter(p => p.change && p.change.degree !== "none" && (p.change.now||"").trim());
  const deg = k => withC.filter(p => p.change?.degree === k).length;
  let h = `<div class="kpis">
    <div class="kpi"><b>${withC.length}<small> / ${ps.length}</small></b><span>생각을 돌아본 학생</span></div>
    ${hasSt ? `<div class="kpi"><b>${moved.length}</b><span>입장이 바뀐 학생</span></div><div class="kpi"><b>${deepened.length}</b><span>입장은 같고 생각이 깊어진 학생</span></div>` : ""}

    h += `<section class="card"><h3>입장 이동</h3><div class="trans">${Object.values(tr).sort((x,y)=>y.n-x.n).map(x=>`<div>${stanceChip(r,x.a)} <span aria-hidden="true">→</span><span class="sr">에서</span> ${stanceChip(r,x.b)} <b class="mono">${x.n}명</b>${x.a===x.b?' <span class="muted small">(입장 유지)</span>':''}</div>`).join("")}</div></section>`;
  }
  h += `<section><h3 style="font-size:16px;margin-bottom:10px">학생별: 처음 생각 → 지금의 생각</h3><div class="chgrid">${withC.map(p => {
    const first = firstThought(r,p), d = DEGREES.find(x=>x.k===p.change?.degree), ci = changeInfo(r, p);
    return `<div class="chcard"><div class="row"><b>${esc(p.author)}</b>${ci ? changeChip(ci) : d?`<span class="chip">${esc(d.l)}</span>`:""}</div>

function presentThought(r, p){ return p.change?.now || p.revision?.essay || p.essay?.text || (isRelay(r) ? (p.questions||[])[0]?.text : "") || finalBody(p).claim || previewText(r,p) }
function presentModes(r, sub){

  return m;
}

      return `<div class="pquote"><span class="who muted">익명 학생 ${ci ? changeChip(ci) : ""}</span><span class="muted small">처음 생각</span><p style="font-size:clamp(16px,1.6vw,19px)">${esc((p.initial?.text || p.body?.claim || firstText(p.body)).slice(0,160))}</p><span class="muted small">↓ 지금의 생각</span><p>${esc(p.change.now||"")}</p></div>` }).join("")}</div>

  }else if(mode === "questions"){

    h += `<p class="lead">우리 반이 만든 질문 <span class="muted">(${qs.length}개)</span></p><div class="pquotes">${qs.map(x => `<div class="pquote"><span class="who muted">익명 학생의 ${x.i ? "키운 질문" : "질문"}</span><p>“${esc(x.q.text)}”</p></div>`).join("")}</div>`;
  }else if(mode === "random"){
    let p = sub.find(x => x.id === S.prand);
    if(!p){ p = sub[Math.floor(Math.random()*n)]; S.prand = p.id }
    h += quote(p, true) + `<div class="pnav"><button class="btn pri" type="button" data-a="prand">🎲 다른 학생 생각 보기</button></div>`;
  }
  return h + `</div>`;
}

/* =========================================================
   Supabase 연결 (GitHub Pages 등)
   - 학생: 로그인 없이 익명 세션 → 학번·이름·개인 코드로 본인 확인(claim_student)
   - 교사: 구글 로그인 + teachers 표에 등록된 이메일만 교사(whoami)
   - 교사마다 자기 활동·학생 명단·학생 글만 본다. 학생은 코드로 확인된 선생님 반의 활동만 본다
   - 권한은 Supabase 규칙(RLS)이 서버에서 지킨다. 앱의 저장 방식(collection/doc)은 그대로 쓴다.
   ========================================================= */
let SB = null;
function loadScript(src){
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc) });
}
async function initSupa(){
  try{
    if(!window.supabase) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{flowType:"pkce", persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    let {data:{session}} = await SB.auth.getSession();
    if(!session){
      const r = await SB.auth.signInAnonymously();
      if(r.error) throw r.error;
      session = r.data.session;
    }
    if(/[?&]code=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);   // 구글 로그인에서 돌아온 주소 정리
    const ref = decodeURIComponent((location.hash || "").slice(1)).replace(/^c:/, "").split("/")[0];   // 학생 링크의 활동·수업 → 그 선생님 반 학생인지 묻는다
    if(session && !session.user?.is_anonymous) await SB.rpc("teacher_checkin");      // 구글로 들어온 교사: 교사 목록에 기록(처음·마지막 접속)
    const who = (await SB.rpc("whoami", {p_ref: ref && ref !== "teacher" ? ref : null})).data || {};
    S.mode = "supa";
    Auth.set(!!who.teacher);
    S.sbEmail = who.email || ""; S.isAdmin = !!who.admin; S.sbBlocked = !!who.blocked;
    S.sbAnon = !!session?.user?.is_anonymous;
    S.sbName = who.teacher ? (session?.user?.user_metadata?.full_name || session?.user?.user_metadata?.name || "") : "";
    if(!who.teacher){ S.name = who.student_name || ""; lsSet("nonjae.name", S.name) }
    S.canWrite = !!who.teacher || !!who.student_name;
    S.db = supaDB(SB);
    ["rooms","posts","replies","treplies","config","courses"].forEach(sub);
    if(Auth.teacher) ["tnotes","ttemplates"].forEach(sub);
    return true;
  }catch(e){
    S.supaError = (e && e.message) || "연결 실패";
    return false;
  }
}
/* 앱이 쓰는 저장 방식(collection/doc)을 Supabase의 docs 표 위에 그대로 옮긴다 */
function supaDB(sb){
  const live = {};                                        // 모음별 화면 데이터 → 내 저장도 바로 반영
  const errOf = e => Object.assign(new Error(e?.message || "db"), {code: /row-level security|permission|violates|denied/i.test(e?.message || "") ? "invalid_argument" : "unavailable"});
  const chk = r => { if(r.error) throw errOf(r.error); return r };
  const local = (col, fn) => (live[col] || []).forEach(l => { fn(l.map); l.emit() });
  const docRef = path => {
    const i = path.indexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
    return {
      set: async data => { chk(await sb.from("docs").upsert({col, id, data})); local(col, m => m.set(id, JSON.parse(JSON.stringify(data)))) },
      update: async patch => { chk(await sb.rpc("doc_merge", {p_col:col, p_id:id, p_patch:patch})); local(col, m => { if(m.has(id)) m.set(id, {...m.get(id), ...JSON.parse(JSON.stringify(patch))}) }) },
      delete: async () => { chk(await sb.from("docs").delete().eq("col", col).eq("id", id)); local(col, m => m.delete(id)) }
    };
  };
  return {
    doc: docRef,
    collection: col => ({
      add: async data => {
        const id = "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        chk(await sb.from("docs").insert({col, id, data}));
        local(col, m => m.set(id, JSON.parse(JSON.stringify(data))));
        return {id};
      },
      onSnapshot(cb, onErr){
        const map = new Map(); let ready = false, t = null;
        const emit = () => { if(!ready) return; clearTimeout(t); t = setTimeout(() => cb({docs:[...map.entries()].map(([id, d]) => ({id, data:() => d}))}), 40) };
        (live[col] = live[col] || []).push({map, emit});
        (async () => {
          try{
            for(let from = 0; ; from += 1000){
              const r = chk(await sb.from("docs").select("id,data").eq("col", col).range(from, from + 999));
              r.data.forEach(x => map.set(x.id, x.data));
              if(r.data.length < 1000) break;
            }
            ready = true; emit();
          }catch(e){ onErr && onErr(e) }
        })();
        sb.channel("docs-" + col + "-" + Math.random().toString(36).slice(2, 8))
          .on("postgres_changes", {event:"INSERT", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); emit() })
          .on("postgres_changes", {event:"UPDATE", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); emit() })
          .on("postgres_changes", {event:"DELETE", schema:"public", table:"docs"}, p => { if(p.old && p.old.col === col){ map.delete(p.old.id); emit() } })
          .subscribe();
        return () => {};
      }
    })
  };
}

const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(n = 6){ const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => CODE_ABC[x % CODE_ABC.length]).join("") }
function parseRoster(text){
  const ok = [], bad = [];
  String(text || "").split(/\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/[\t,]+|\s+/).filter(Boolean), i = parts.findIndex(x => /^\d{3,10}$/.test(x));
    if(i < 0){ bad.push(line); return }
    const name = parts.filter((_, j) => j !== i).join(" ").trim();
    if(!name){ bad.push(line); return }
    ok.push({number:parts[i], name});
  });
  return {ok, bad};
}

/* =========================================================
   생각 스케치 · 손으로 그리기 — 펜 · 색 · 굵기 · 지우개 · 되돌리기 · 전체 지우기
   마우스·트랙패드·손가락·스타일러스를 모두 Pointer Events 하나로 받는다(펜은 필압 반영).
   그림은 흰 바탕 JPEG(약 170KB 이하)로 줄여 학생 글(body.drawing)에 함께 저장한다.
   ========================================================= */
const DRAW_COLORS = [["#1F2937","검정"],["#2C5DB0","파랑"],["#B0432D","빨강"],["#2E7D46","초록"],["#D97706","주황"],["#6A48A6","보라"]];
const DRAW = {};
const dstate = key => DRAW[key] || (DRAW[key] = {tool:"pen", color:DRAW_COLORS[0][0], width:6, strokes:[], base:null, img:null, active:null});
function drawEditorHTML(key){
  const d = dstate(key);
  return `<div class="draw" data-draw="${esc(key)}">
    <div class="dtools" role="toolbar" aria-label="그리기 도구">
      <span class="seg3"><button type="button" data-dt="pen" aria-pressed="${d.tool==="pen"}">✏️ 펜</button><button type="button" data-dt="eraser" aria-pressed="${d.tool==="eraser"}">🧽 지우개</button></span>
      <span class="dcolors" role="group" aria-label="펜 색">${DRAW_COLORS.map(([c,l]) => `<button type="button" class="dcol" data-dc="${c}" style="--c:${c}" aria-label="${l}" title="${l}" aria-pressed="${d.color===c}"></button>`).join("")}</span>
      <label class="dwidth">굵기 <input type="range" min="2" max="30" step="1" value="${d.width}" data-dw aria-label="펜 굵기"><span class="dprev" aria-hidden="true" style="--w:${d.width}px;--c:${d.tool==="eraser" ? "#ccc" : d.color}"></span></label>
      <span class="sp"></span>
      <button type="button" class="btn sm" data-dact="undo">↶ 되돌리기</button><button type="button" class="btn sm" data-dact="clear">전체 지우기</button>
    </div>
    <canvas class="dcanvas" width="1200" height="800" role="img" aria-label="그림판: 손가락, 펜, 마우스로 그려요"></canvas>
    <p class="hint">손가락·펜·마우스로 그릴 수 있어요. 그린 내용은 이 기기에 바로 저장되고, ‘내 생각 보내기’를 누르면 제출돼요.</p></div>`;
}
function drawStroke(ctx, st, from = 1){
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const col = st.tool === "eraser" ? "#ffffff" : st.color, p = st.pts;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  if(p.length === 1){ ctx.beginPath(); ctx.arc(p[0][0], p[0][1], p[0][2]/2, 0, Math.PI*2); ctx.fill(); return }
  for(let i = Math.max(1, from); i < p.length; i++){
    ctx.lineWidth = (p[i-1][2] + p[i][2]) / 2;
    ctx.beginPath(); ctx.moveTo(p[i-1][0], p[i-1][1]); ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
  }
}
const drawBox = key => [...document.querySelectorAll(".draw[data-draw]")].find(b => b.dataset.draw === key);
function drawRedraw(key){
  const box = drawBox(key); if(!box) return;
  const cv = box.querySelector("canvas"), ctx = cv.getContext("2d"), d = dstate(key);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cv.width, cv.height);
  if(d.img && d.img.complete && d.img.naturalWidth) ctx.drawImage(d.img, 0, 0, cv.width, cv.height);
  d.strokes.forEach(st => drawStroke(ctx, st));
}
/* 화면을 다시 그린 뒤: 저장해 둔 그림(이 기기 또는 낸 글)을 바탕으로 깔고 선을 다시 그린다 */
function drawMount(){
  document.querySelectorAll(".draw[data-draw]").forEach(box => {
    const key = box.dataset.draw, d = dstate(key), saved = F(key).drawing || "";
    if(d.base === null){ d.base = isImg(saved) ? saved : ""; d.strokes = [] }
    if(d.base && !d.img){ d.img = new Image(); d.img.onload = () => drawRedraw(key); d.img.src = d.base }
    drawRedraw(key);
  });
}
function drawExport(key){
  const box = drawBox(key), d = dstate(key); if(!box) return;
  let url = "";
  if(d.base || d.strokes.length){
    const cv = box.querySelector("canvas"), out = document.createElement("canvas");
    for(const [sc, q] of [[0.75, 0.82], [0.65, 0.72], [0.5, 0.65], [0.4, 0.55]]){
      out.width = Math.round(cv.width*sc); out.height = Math.round(cv.height*sc);
      const c = out.getContext("2d"); c.fillStyle = "#ffffff"; c.fillRect(0, 0, out.width, out.height); c.drawImage(cv, 0, 0, out.width, out.height);
      url = out.toDataURL("image/jpeg", q);
      if(url.length < 170000) break;                 // 저장소 문서 한 개 크기(256KB) 안에 넉넉히
    }
  }
  F(key).drawing = url; saveFormsSoon(); refreshWriteStatus();
}
function drawPt(cv, e, d){
  const rc = cv.getBoundingClientRect(), k = cv.width / rc.width;
  const pr = e.pointerType === "pen" && e.pressure > 0 ? 0.45 + e.pressure * 1.1 : 1;     // 스타일러스 필압
  return [(e.clientX - rc.left) * k, (e.clientY - rc.top) * (cv.height / rc.height), d.width * (d.tool === "eraser" ? 2.5 : 1) * pr * k];
}
const drawingNow = () => Object.values(DRAW).some(d => d.active);
document.addEventListener("pointerdown", e => {
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const key = cv.closest(".draw").dataset.draw, d = dstate(key);
  if(d.active || (e.pointerType === "mouse" && e.button !== 0)) return;   // 손가락 두 개는 첫 손가락만
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId) }catch(err){}
  const st = {tool:d.tool, color:d.color, pts:[drawPt(cv, e, d)]};
  d.active = {id:e.pointerId, st}; d.strokes.push(st);
  drawStroke(cv.getContext("2d"), st);
});
document.addEventListener("pointermove", e => {
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const d = dstate(cv.closest(".draw").dataset.draw);
  if(!d.active || d.active.id !== e.pointerId) return;
  e.preventDefault();
  const evs = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [], from = d.active.st.pts.length;
  (evs.length ? evs : [e]).forEach(x => d.active.st.pts.push(drawPt(cv, x, d)));
  drawStroke(cv.getContext("2d"), d.active.st, from);
});
function drawEnd(e){
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const key = cv.closest(".draw").dataset.draw, d = dstate(key);
  if(!d.active || d.active.id !== e.pointerId) return;
  d.active = null; drawExport(key);
  if(S.pending && !drawingNow()){ S.pending = false; render() }      // 그리는 동안 미뤄 둔 화면 갱신
}
document.addEventListener("pointerup", drawEnd);
document.addEventListener("pointercancel", drawEnd);
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-dt],[data-dc],[data-dact]"); if(!b) return;
  const box = b.closest(".draw"); if(!box) return;
  const key = box.dataset.draw, d = dstate(key);
  if(b.dataset.dt) d.tool = b.dataset.dt;
  if(b.dataset.dc){ d.color = b.dataset.dc; d.tool = "pen" }
  if(b.dataset.dact === "undo"){
    if(!d.strokes.length){ toast(d.base ? "전에 저장한 그림은 ‘전체 지우기’로 지울 수 있어요." : "되돌릴 선이 없어요."); return }
    d.strokes.pop(); drawRedraw(key); drawExport(key);
  }
  if(b.dataset.dact === "clear"){
    if(!d.strokes.length && !d.base) return;
    if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "한 번 더 누르면 지워요"; setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = "전체 지우기" } }, 3000); return }
    d.strokes = []; d.base = ""; d.img = null; drawRedraw(key); drawExport(key);
    delete b.dataset.sure; b.textContent = "전체 지우기"; toast("그림을 모두 지웠어요.");
  }
  box.querySelectorAll("[data-dt]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.dt === d.tool)));
  box.querySelectorAll("[data-dc]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.dc === d.color && d.tool === "pen")));
  const pv = box.querySelector(".dprev"); if(pv) pv.style.setProperty("--c", d.tool === "eraser" ? "#ccc" : d.color);
});
document.addEventListener("input", e => {
  if(!e.target.matches || !e.target.matches("[data-dw]")) return;
  const box = e.target.closest(".draw"), d = dstate(box.dataset.draw);
  d.width = Number(e.target.value) || 6;
  box.querySelector(".dprev")?.style.setProperty("--w", d.width + "px");
});

async function saveAssign(r, assign){
  return write(db => db.doc("rooms/"+r.id).update({assign, updatedAt:Date.now()}), () => { r.assign = assign; r.updatedAt = Date.now() });
}

/* =========================================================
   10-0. 교사: 학생 생각 살펴보기 — 검색 · 필터 · 정렬 · 보기 방식 · 이전/다음
   학생 정보는 지금처럼 ‘번호와 이름’ 문자열(author) 하나만 쓴다. 번호는 그 문자열에서 읽어 낸다.
   ========================================================= */
/* "2반 14번 김지우" → 14 · "10314 김지우" → 10314 · 번호가 없으면 "" */
function studentNo(name){
  const s = String(name||""), m = s.match(/(\d+)\s*번/);
  if(m) return m[1];
  const m2 = s.match(/^\s*(\d+)(?!\s*반)/);
  return m2 ? m2[1] : "";
}
function cleanName(name){
  const s = String(name||"");
  const t = s.replace(/\d+\s*학년/g,"").replace(/\d+\s*반/g,"").replace(/\d+\s*번/g,"").replace(/^\s*\d+[.)\-\s]*/,"").replace(/\s+/g," ").trim();
  return t || s;
}
const numKey = name => (String(name||"").match(/\d+/g)||[]).map(Number);
function cmpNum(a, b){
  const x = numKey(a), y = numKey(b);
  if(!x.length || !y.length) return (!x.length) - (!y.length);
  for(let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i] ?? -1) - (y[i] ?? -1); if(d) return d }
  return 0;
}
const koCmp = (a, b) => String(a).localeCompare(String(b), "ko");
const eul = w => { const c = String(w).trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? ((c-0xAC00)%28 ? "을" : "를") : "를" };

/* 학생 카드·표에 보일 단계 표시: 이 활동에 실제로 있는 단계만 */
const MARK_L = {chat:"AI 대화", think:"처음 생각", why:"이유", counter:"예상 반론", read:"친구 생각", respond:"답하기", revise:"다시 쓰기", compose:"글쓰기",
                ask:"질문", take:"이어받아 답", back:"답 확인", develop:"질문 키우기"};
function marksOf(r){
  const fields = effFields(r), f = featuresOf(r), out = [];
  stepsOf(r).forEach(s => {
    if(s === "see" || s === "feedback") return;           // 피드백은 따로 칸을 둔다
    if(s === "write"){
      const hasC = fields.some(x=>x.k==="claim"), hasR = fields.some(x=>x.k==="reason");
      if(hasC) out.push({k:"claim", l:"주장", ok:p => !!(finalBody(p).claim||"").trim()});
      else out.push({k:"write", l: isEssay(r) ? "생각 정리" : toolOf(r) === "sketch" ? "스케치" : toolOf(r) === "draw" ? "그림" : toolOf(r) === "chatReflect" ? "대화 정리" : "생각 쓰기", ok:p => stepDone(r,p,"write")});
      if(hasR && !stepsOf(r).includes("why")) out.push({k:"reason", l:"근거", ok:p => !!(finalBody(p).reason||"").trim()});
      return;
    }
    if(s === "reflect"){ out.push({k:s, l: f.change ? "생각 변화" : "돌아보기", ok:p => stepDone(r,p,s)}); return }
    out.push({k:s, l: MARK_L[s] || STEP[s].t, ok:p => stepDone(r,p,s)});
  });
  return out;
}
function sstatus(r, p){
  if(!p) return {k:"none", l:"미참여", ic:"⚪"};
  if(stepsOf(r).every(s => stepDone(r,p,s))) return {k:"done", l:"완료", ic:"🟢"};
  if(!submitted(p)) return {k:"draft", l:"쓰는 중", ic:"🟡"};
  return {k:"doing", l:"진행 중", ic:"🟡"};
}
/* 생각의 변화: 바뀌지 않았다고 생각하지 않은 것이 아니다 → ‘유지’ ‘깊어짐’도 따로 보여 준다 */
function changeInfo(r, p){
  if(!p || !p.change) return null;
  const hasSt = (r.stances||[]).length > 0;
  const a = p.initial?.stance && stanceIdx(r, p.initial.stance) >= 0 ? p.initial.stance : p.stance, b = p.change.nowStance || p.stance;
  if(hasSt && a && b && a !== b) return {k:"moved", ic:"🟩", l:"입장이 바뀜", score:4};
  const deg = p.change.degree;
  if(deg === "much") return hasSt ? {k:"deep", ic:"🟩", l:"같은 입장이지만 생각이 크게 깊어짐", score:3} : {k:"much", ic:"🟩", l:"크게 달라짐", score:3};
  if(deg === "some") return hasSt ? {k:"deep", ic:"🟨", l:"같은 입장이지만 근거가 깊어짐", score:2} : {k:"some", ic:"🟨", l:"조금 달라짐", score:2};
  return {k:"keep", ic:"🟦", l:"생각을 유지함", score:1};
}
const changeChip = ci => `<span class="chip cchip"><span aria-hidden="true">${ci.ic}</span> ${esc(ci.l)}</span>`;

/* 학생 한 명 = 응답(post) 또는 명단에만 있는 이름 */
function studentEntries(r, st){
  const seen = new Set(), marks = marksOf(r), pins = r.pins || [];
  const out = st.all.map(p => { seen.add(p.author); return {name:p.author, p} });
  (st.roster||[]).forEach(n => { if(!seen.has(n)){ seen.add(n); out.push({name:n, p:null}) } });
  out.forEach(e => {
    const p = e.p;
    e.no = studentNo(e.name); e.st = sstatus(r, p);
    e.marks = marks.map(m => ({l:m.l, ok: p ? m.ok(p) : false}));
    e.missing = p ? stepsOf(r).filter(s => !stepDone(r,p,s)).length : 99;
    e.fb = p ? repliesOf(p.id).filter(x=>x.kind==="teacher").length : 0;
    e.ci = changeInfo(r, p);
    e.pin = p ? pins.indexOf(p.id) : -1;
    e.ts = p ? (p.updatedAt||p.createdAt||0) : 0;
  });
  return out;
}
/* 필터: 지금 데이터로 판단할 수 있는 것만 */
function sfilters(r, st){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"all", l:"전체", t:() => true},
    {k:"todo", l:"미완료", t:e => !!e.p && e.st.k !== "done"},
    {k:"nojoin", l:"미참여", t:e => !e.p, show:(st.roster||[]).length > 0},
    {k:"fbneed", l:"피드백 필요", t:e => !!e.p && submitted(e.p) && !e.fb, show:f.feedback},
    {k:"pinned", l:"발표 후보", t:e => e.pin >= 0},
    {k:"noread", l:"친구 생각 미확인", t:e => !!e.p && !stepDone(r,e.p,"read"), show:steps.includes("read")},
    {k:"nochange", l: f.change ? "생각 변화 미작성" : "돌아보기 미작성", t:e => !!e.p && !stepDone(r,e.p,"reflect"), show:steps.includes("reflect")},
    {k:"noreason", l:"근거 없음", t:e => !!e.p && !(finalBody(e.p).reason||"").trim(), show:hasReason}
  ].filter(x => x.show !== false);
}
function ssorts(r){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"no", l:"번호순", c:() => 0},
    {k:"name", l:"이름순", c:(a,b) => koCmp(cleanName(a.name), cleanName(b.name))},
    {k:"recent", l:"최근 작성순", c:(a,b) => b.ts - a.ts},
    {k:"todo", l:"남은 단계 많은 순", c:(a,b) => b.missing - a.missing},
    {k:"change", l:"생각 변화가 큰 순", c:(a,b) => (b.ci?.score ?? 0) - (a.ci?.score ?? 0), show:steps.includes("reflect") && f.change},
    {k:"noreason", l:"근거 없는 학생 먼저", c:(a,b) => !!(finalBody(a.p).reason||"").trim() - !!(finalBody(b.p).reason||"").trim(), show:hasReason},
    {k:"noread", l:"친구 생각 안 본 학생 먼저", c:(a,b) => stepDone(r,a.p,"read") - stepDone(r,b.p,"read"), show:steps.includes("read")},
    {k:"nofb", l:"피드백 없는 학생 먼저", c:(a,b) => (!!a.fb) - (!!b.fb), show:f.feedback}
  ].filter(x => x.show !== false);
}
function studentView(r, st){
  const all = studentEntries(r, st), fl = sfilters(r, st), so = ssorts(r);
  if(!fl.some(x => x.k === S.sf)) S.sf = "all";
  if(!so.some(x => x.k === S.ss)) S.ss = "no";
  const flt = fl.find(x => x.k === S.sf), srt = so.find(x => x.k === S.ss), q = (S.sq||"").trim().toLowerCase().replace(/\s+/g," ");
  let list = all.filter(flt.t);
  if(q) list = list.filter(e => e.name.toLowerCase().replace(/\s+/g," ").includes(q) || (e.no && e.no === q.replace(/번$/,"")));
  list.sort((a,b) => cmpNum(a.name, b.name) || koCmp(a.name, b.name));                 // 기본: 번호순
  if(srt.k !== "no") list.sort((a,b) => (srt.k === "name" ? 0 : (!a.p) - (!b.p)) || srt.c(a,b));   // 미참여는 맨 뒤
  return {all, list, fl, so};
}

/* 학생 상세: 지금 필터·정렬 순서대로 이전/다음 */
function studentDetail(r, st, p){
  const v = studentView(r, st), list = v.list.filter(e => e.p), i = list.findIndex(e => e.p.id === p.id);
  if(i >= 0) S.sidx = i;
  const pos = Math.min(S.sidx||0, list.length);
  const prev = i >= 0 ? list[i-1] : list[pos-1], next = i >= 0 ? list[i+1] : list[pos];   // 필터에서 빠진 학생(예: 방금 피드백을 받음)은 원래 자리 기준
  const fl = v.fl.find(x => x.k === S.sf), no = studentNo(p.author);

      <button class="btn sm" type="button" data-a="snav" data-id="${next ? esc(next.p.id) : ""}" ${next ? "" : "disabled"}>다음 →</button></div></div>

}
/* 발표 목록(큐): 기존 pins 배열을 그대로 순서로 쓴다 */
function pinList(r){ const ps = allPostsOf(r.id); return (r.pins||[]).map(id => ps.find(p => p.id === id)).filter(Boolean) }

/* ---- 개요: 지금 수업에서 볼 것 · 입장 분포 · 참여/완료 · 교사 확인 필요 ---- */
const NEXT_HINT = {read:"이제 친구 생각을 살펴보도록 안내하기 좋습니다.", respond:"이제 친구 생각에 답하도록 안내하기 좋습니다.", reflect:"이제 생각의 변화를 적도록 안내하기 좋습니다.",
  revise:"이제 글을 다시 다듬도록 안내하기 좋습니다.", counter:"이제 다른 생각을 예상해 보도록 안내하기 좋습니다.", why:"이제 이유를 쓰도록 안내하기 좋습니다.",
  compose:"이제 글쓰기로 넘어가도록 안내하기 좋습니다.", take:"이제 친구 질문을 이어받도록 안내하기 좋습니다.", back:"이제 내 질문에 달린 답을 확인하도록 안내하기 좋습니다.",
  develop:"이제 질문을 한 단계 키워 보도록 안내하기 좋습니다.", feedback:"이제 개인 피드백을 보내면 학생들이 확인하고 다음 단계로 갈 수 있습니다."};
function lessonHints(r, st){
  const P = st.participants, out = [];
  if(!P) return [st.total ? `${st.total}명 중 아직 아무도 참여하지 않았습니다. 학생 링크나 QR 코드를 공유해 보세요.` : "아직 참여한 학생이 없습니다. 학생 링크나 QR 코드를 공유해 보세요."];
  out.push(st.total ? `${st.total}명 중 ${P}명이 참여했습니다.${st.notJoined ? ` 아직 ${st.notJoined}명이 활동을 시작하지 않았습니다.` : " 모두 참여했습니다."}` : `${P}명이 참여했습니다.`);
  if(P < 3) return out;                                       // 학생이 적으면 판단 문장을 만들지 않는다
  const fields = effFields(r), sub = st.sub;
  if(!isRelay(r) && fields.some(x=>x.k==="reason") && sub.length >= 3){
    const nr = sub.filter(p => !(finalBody(p).reason||"").trim()).length;
    if(nr / sub.length >= 0.3){ out.push(`제출한 ${sub.length}명 중 ${nr}명이 근거를 쓰지 않았습니다. 근거를 보완하도록 안내하기 좋습니다.`); return out }
  }
  const sc = stepsOf(r).filter(s => s !== "see").map(s => ({s, l: MARK_L[s] || (s==="write" ? "첫 생각 쓰기" : s==="reflect" ? "생각 변화 기록" : STEP[s].t), n: st.all.filter(p => s === "write" ? submitted(p) : stepDone(r,p,s)).length}));   // 글쓰기는 ‘제출’까지 해야 마친 것으로
  const k = sc.findIndex(x => x.n / P < 0.8);
  if(k < 0) out.push(st.complete / P >= 0.8 ? `대부분의 학생이 모든 단계를 마쳤습니다. ${stepsOf(r).includes("reflect") ? "생각의 변화를 함께 나누며 마무리하기 좋습니다." : "결과를 함께 보며 정리하기 좋습니다."}` : "대부분의 학생이 마지막 단계까지 왔습니다.");
  else if(k === 0) out.push(`${P}명 중 ${sc[0].n}명이 ${sc[0].l}${eul(sc[0].l)} 마쳤습니다. 아직 쓰는 학생이 있으니 조금 더 시간을 주세요.`);
  else out.push(`${P}명 중 ${sc[k-1].n}명이 ${sc[k-1].l}까지 마쳤습니다. ${NEXT_HINT[sc[k].s] || `이제 ‘${sc[k].l}’ 단계로 안내하기 좋습니다.`}`);
  return out;
}
function hintCard(r, st){
  return `<section class="card hintcard"><h3>💡 지금 수업에서 볼 것</h3>${lessonHints(r, st).map(x => `<p>${esc(x)}</p>`).join("")}</section>`;
}
function stanceCard(r, st){
  const sts = r.stances || [], sub = st.sub, n = sub.length;
  if(!sts.length) return "";
  const rows = sts.map((s,i) => ({s, i, c: sub.filter(p => p.stance === s).length}));
  let interp = "";
  if(n >= 5){
    const cs = rows.map(x => x.c).sort((a,b) => b-a), top = cs[0]/n, second = (cs[1]||0)/n;
    if(top >= 0.7) interp = "한쪽 입장이 많습니다. 다른 입장의 근거를 함께 살펴보면 생각을 넓히기 좋습니다.";
    else if(top - second <= 0.2) interp = sts.length === 2 ? "의견이 비교적 균형 있게 나뉘어 있습니다. 서로의 근거를 비교하며 전체 토론으로 넘어가기 좋습니다." : "여러 입장이 고르게 나뉘어 있습니다. 입장별 근거를 비교하며 전체 토론으로 넘어가기 좋습니다.";
    else interp = "입장이 나뉘어 있습니다. 서로 다른 근거를 비교해 보기 좋습니다.";
  }
  return `<section class="card"><div class="cardh"><h3>입장 분포 <span class="muted small" style="font-weight:400">제출 ${n}명</span></h3><button class="btn sm" type="button" data-a="present" data-id="${esc(r.id)}" data-mode="stance">📽 수업에서 함께 보기</button></div>
    <div class="sdist">${rows.map(x => { const pct = n ? Math.round(x.c/n*100) : 0;

const STEP_MIN = {chat:10, think:3, write:7, why:4, counter:4, read:5, respond:5, reflect:4, revise:6, see:1, compose:10, feedback:3, ask:3, take:5, back:3, develop:3};
function estMinutes(r){
  const sum = stepsOf(r).reduce((a,s) => a + (s==="write" && depthOf(r)==="quick" ? 5 : (STEP_MIN[s]||3)), 0);
  const r5 = x => Math.max(5, Math.round(x/5)*5), lo = r5(sum); let hi = r5(sum*1.4); if(hi <= lo) hi = lo + 5;
  return [lo, hi];
}

function manageFiltered(){
  const q = (S.mq||"").trim().toLowerCase(), dur = MDURS.find(x => x[0] === S.mdur);
  const cf = S.mcourse;
  const cache = new Map(), stOf = r => { if(!cache.has(r.id)) cache.set(r.id, teacherStats(r)); return cache.get(r.id) };
  const list = [...S.rooms].filter(r => {
    const st = statusOf(r);
    if(S.mf === "all" ? st === "archived" : st !== S.mf) return false;
    if(S.msub && (r.subject||"") !== S.msub) return false;
    if(S.mgrade && (r.grade||"") !== S.mgrade) return false;
    if(cf && (cf === "_none" ? !!courseOf(r.courseId) : r.courseId !== cf)) return false;      // 수업별
    if(dur && !(Number(r.duration) > 0 && dur[2](Number(r.duration)))) return false;     // 시간이 적힌 활동만
    if(!q) return true;
    const t = TEMPLATES[r.template] || {};
    return [r.title, r.subject, r.unit, r.grade, t.label, t.mode, r.prompt, courseOf(r.courseId)?.title].filter(Boolean).join(" ").toLowerCase().includes(q);
  });
  // 정렬: 값을 알 수 없는 활동(학생 수 미설정 등)은 뒤로
  const nl = (f, dir) => (a, b) => { const x = f(a), y = f(b); if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1; return dir * (x - y) };
  const part = r => { const st = stOf(r); return st.total ? st.participants / st.total : null };
  const comp = r => { const st = stOf(r); return st.participants ? st.complete / st.participants : null };
  const recent = (a,b) => lastActivity(b) - lastActivity(a);
  const cmp = {recent, created:(a,b) => (b.createdAt||0) - (a.createdAt||0), partHigh:nl(part,-1), partLow:nl(part,1),
    notJoined:nl(r => stOf(r).notJoined, -1), compHigh:nl(comp,-1), title:(a,b) => koCmp(a.title||"", b.title||"")}[S.msort] || recent;
  list.sort((a,b) => cmp(a,b) || recent(a,b));

}

async function saveTnote(r, patch){
  const cur = (({id, ...rest}) => rest)(tnote(r));
  const data = {...cur, ...patch, updatedAt:Date.now()};
  return write(db => db.doc("tnotes/"+r.id).set(data), () => { S.tnotes = S.tnotes.filter(x=>x.id!==r.id).concat({id:r.id, ...data}) });
}
async function setStatus(r, st){
  const patch = {status:st, open: st==="open", updatedAt:Date.now()};
  if(st === "open" && pastDue(r)) patch.dueAt = null;                  // 마감 시각이 지난 활동을 다시 열면 마감 시각을 지운다
  return write(db => db.doc("rooms/"+r.id).update(patch), () => Object.assign(r, patch));
}

    qtype:r.qtype||t.qtype||"", reveal:r.reveal||t.reveal, anonymous:!!r.anonymous, minChars:String(r.minChars||0),
    stances:(r.stances||[]).join(", "), nst:(r.stances||[]).length,
    initial:f.initial, predict:f.predict, evidenceType:f.evidenceType, evidenceTypes:f.evidenceTypes, warrant:f.warrant, counter:f.counter,

  (r.stances||[]).forEach((x,i) => form["st"+i] = x);
