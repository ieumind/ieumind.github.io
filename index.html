/* =========================================================
   Supabase 연결 (GitHub Pages 등)
   - 학생: 로그인 없이 익명 세션 → 학번·이름·개인 코드로 본인 확인(claim_student)
   - 교사: 구글 로그인 + teachers 표에 등록된 이메일만 교사(whoami)
   - 교사마다 자기 활동·학생 명단·학생 글만 본다. 학생은 코드로 확인된 선생님 반의 활동만 본다
   - 권한은 Supabase 규칙(RLS)이 서버에서 지킨다. 앱의 저장 방식(collection/doc)은 그대로 쓴다.
   ========================================================= */
/* 🔄 새 버전 알림: 배포 때마다 APP_VERSION과 version.json의 v를 같은 값으로 올린다.
   GitHub Pages는 화면을 10분쯤 기억하므로, 옛 화면이면 아래쪽에 ‘새로고침’ 띠를 띄우고 주소를 바꿔 새로 받는다 */
const APP_VERSION = "2026-10-13f";
async function checkVersion(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) return;
    const j = await r.json();
    if(j.v && j.v !== APP_VERSION){
      S.newVer = j.v;
      let el = document.getElementById("upd");
      if(!el){ el = document.createElement("div"); el.id = "upd"; el.className = "updbar"; el.setAttribute("role", "status"); document.body.appendChild(el) }
      el.innerHTML = `<span>🔄 생각이음 새 버전이 나왔어요.</span><button class="btn sm pri" type="button" data-a="app-reload">새로고침</button>`;
    }
  }catch(e){}
}
let SB = null;
/* Supabase RPC를 안전하게: supabase-js의 rpc()는 .catch가 없는 객체를 돌려주므로 await + try로 감싼다 (실패해도 앱이 멈추지 않게) */
async function rpcSafe(fn, args){ try{ return await SB.rpc(fn, args) }catch(e){ return {data:null, error:e} } }
/* Edge Function 부르기: 오래 걸리면 기다리지 않고 {timeout:true} */
async function invokeSafe(name, body, ms = 30000){
  try{ return await Promise.race([SB.functions.invoke(name, {body}), new Promise(r => setTimeout(() => r({timeout:true}), ms))]) }
  catch(e){ return {data:null, error:e} }
}
function loadScript(src){
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc) });
}
async function initSupa(){
  try{
    if(!window.supabase) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{flowType:"pkce", persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    let {data:{session}} = await SB.auth.getSession();
    if(!session){
      const r = await SB.auth.signInAnonymously();
      if(r.error) throw r.error;
      session = r.data.session;
    }
    if(/[?&]code=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);   // 구글 로그인에서 돌아온 주소 정리
    const ref = decodeURIComponent((location.hash || "").slice(1)).replace(/^c:/, "").split("/")[0];   // 학생 링크의 활동·수업 → 그 선생님 반 학생인지 묻는다
    if(session && !session.user?.is_anonymous) await SB.rpc("teacher_checkin");      // 구글로 들어온 교사: 교사 목록에 기록(처음·마지막 접속)
    const who = (await SB.rpc("whoami", {p_ref: ref && ref !== "teacher" ? ref : null})).data || {};
    S.mode = "supa";
    Auth.set(!!who.teacher);
    S.sbEmail = who.email || ""; S.isAdmin = !!who.admin; S.sbBlocked = !!who.blocked; S.sbUid = session?.user?.id || "";
    S.sbAnon = !!session?.user?.is_anonymous;
    const meta = session?.user?.user_metadata || {};
    S.sbName = who.teacher ? (meta.display_name || meta.full_name || meta.name || "") : "";   // 선생님이 정한 이름이 먼저 (없으면 구글 이름)
    if(who.teacher && !meta.display_name && !lsGet("nonjae.tname.later")) S.modal = {type:"tname", first:true};   // 처음 로그인: 학생에게 보일 이름 정하기
    if(!who.teacher){ S.name = who.student_name || ""; lsSet("nonjae.name", S.name)
      if(S.name){ const ms = await rpcSafe("my_students");                // 연결된 선생님마다 내 학생 번호·이름표
        S.idents = Array.isArray(ms.data) ? ms.data : [];
        if(!S.idents.length){ const ids = await rpcSafe("my_student_ids"); S.mySids = new Set(Array.isArray(ids.data) ? ids.data : []) }   // 예전 서버
        else S.mySids = new Set(S.idents.map(x => x.sid));
        S.myNames = new Set(S.idents.map(x => x.name)) }
      if(lsGet("nonjae.joined")){ lsSet("nonjae.joined", ""); setTimeout(() => toast("새 선생님의 과목을 추가했어요. ‘내 과목’에서 볼 수 있어요."), 600) } }   // 선생님이 정한 그룹을 알아보려고 내 학생 번호(들)
    S.canWrite = !!who.teacher || !!who.student_name;
    S.db = supaDB(SB);
    ["rooms","posts","replies","treplies","config","courses"].forEach(sub);
    if(Auth.teacher) ["tnotes","ttemplates"].forEach(sub);
    return true;
  }catch(e){
    S.supaError = (e && e.message) || "연결 실패";
    return false;
  }
}
/* 앱이 쓰는 저장 방식(collection/doc)을 Supabase의 docs 표 위에 그대로 옮긴다 */
function supaDB(sb){
  const live = {}, refetch = {};                          // 모음별 화면 데이터 → 내 저장도 바로 반영 · 다시 받기
  const errOf = e => Object.assign(new Error(e?.message || "db"), {code: /row-level security|permission|violates|denied/i.test(e?.message || "") ? "invalid_argument" : "unavailable"});
  const chk = r => { if(r.error) throw errOf(r.error); return r };
  const local = (col, fn) => (live[col] || []).forEach(l => { fn(l.map); l.emit() });
  const docRef = path => {
    const i = path.indexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
    return {
      set: async data => { chk(await sb.from("docs").upsert({col, id, data})); local(col, m => m.set(id, JSON.parse(JSON.stringify(data)))) },
      update: async patch => { chk(await sb.rpc("doc_merge", {p_col:col, p_id:id, p_patch:patch})); local(col, m => { if(m.has(id)) m.set(id, {...m.get(id), ...JSON.parse(JSON.stringify(patch))}) }) },
      delete: async () => { chk(await sb.from("docs").delete().eq("col", col).eq("id", id)); local(col, m => m.delete(id)) }
    };
  };
  return {
    doc: docRef,
    reload: col => Promise.all((refetch[col] || []).map(f => f().catch(() => {}))),   // 볼 수 있는 범위가 바뀌었을 때 처음부터 다시 받기
    collection: col => ({
      add: async data => {
        const id = "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        chk(await sb.from("docs").insert({col, id, data}));
        local(col, m => m.set(id, JSON.parse(JSON.stringify(data))));
        return {id};
      },
      onSnapshot(cb, onErr){
        const map = new Map(); let ready = false, t = null;
        const emit = () => { if(!ready) return; clearTimeout(t); t = setTimeout(() => cb({docs:[...map.entries()].map(([id, d]) => ({id, data:() => d}))}), 40) };
        (live[col] = live[col] || []).push({map, emit});
        const fetchAll = async () => {
          const fresh = new Map();
          for(let from = 0; ; from += 1000){
            const r = chk(await sb.from("docs").select("id,data,tid").eq("col", col).range(from, from + 999));
            r.data.forEach(x => { fresh.set(x.id, x.data); if(x.tid) DOC_TID.set(col + "/" + x.id, x.tid) });
            if(r.data.length < 1000) break;
          }
          map.clear(); fresh.forEach((v, k) => map.set(k, v)); ready = true; emit();
        };
        (refetch[col] = refetch[col] || []).push(fetchAll);
        fetchAll().catch(e => { onErr && onErr(e) });
        sb.channel("docs-" + col + "-" + Math.random().toString(36).slice(2, 8))
          .on("postgres_changes", {event:"INSERT", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); if(p.new.tid) DOC_TID.set(col + "/" + p.new.id, p.new.tid); emit() })
          .on("postgres_changes", {event:"UPDATE", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); if(p.new.tid) DOC_TID.set(col + "/" + p.new.id, p.new.tid); emit() })
          .on("postgres_changes", {event:"DELETE", schema:"public", table:"docs"}, p => { if(p.old && p.old.col === col){ map.delete(p.old.id); emit() } })
          .subscribe();
        return () => {};
      }
    })
  };
}

const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* 명단 한 줄: ‘학번 이름’ 또는 ‘학교 학번 이름’ (학교 이름은 …고·…중·…학교로 끝나면 알아본다). 위 칸의 학교는 학교가 없는 줄에 쓴다 */

function parseRoster(text, defSchool = ""){
  const ok = [], bad = [];

    const parts = line.split(/[\t,]+|\s+/).filter(Boolean), i = parts.findIndex(x => /^\d{3,10}$/.test(x));

/* 화면을 다시 그린 뒤: 저장해 둔 그림(이 기기 또는 낸 글)을 바탕으로 깔고 선을 다시 그린다 */
function drawMount(){
  document.querySelectorAll(".draw[data-draw]").forEach(box => {
    const key = box.dataset.draw, d = dstate(key), saved = F(key).drawing || "";
    if(d.base === null){ d.base = isImg(saved) ? saved : ""; d.strokes = [] }
    if(d.base && !d.img){ d.img = new Image(); d.img.onload = () => drawRedraw(key); d.img.src = d.base }
    drawRedraw(key);
  });
}
function drawExport(key){
  const box = drawBox(key), d = dstate(key); if(!box) return;
  let url = "";
  if(d.base || d.strokes.length){
    const cv = box.querySelector("canvas"), out = document.createElement("canvas");
    for(const [sc, q] of [[0.75, 0.82], [0.65, 0.72], [0.5, 0.65], [0.4, 0.55]]){
      out.width = Math.round(cv.width*sc); out.height = Math.round(cv.height*sc);
      const c = out.getContext("2d"); c.fillStyle = "#ffffff"; c.fillRect(0, 0, out.width, out.height); c.drawImage(cv, 0, 0, out.width, out.height);
      url = out.toDataURL("image/jpeg", q);
      if(url.length < 170000) break;                 // 저장소 문서 한 개 크기(256KB) 안에 넉넉히
    }
  }
  F(key).drawing = url; saveFormsSoon(); refreshWriteStatus();
}
function drawPt(cv, e, d){
  const rc = cv.getBoundingClientRect(), k = cv.width / rc.width;
  const pr = e.pointerType === "pen" && e.pressure > 0 ? 0.45 + e.pressure * 1.1 : 1;     // 스타일러스 필압
  return [(e.clientX - rc.left) * k, (e.clientY - rc.top) * (cv.height / rc.height), d.width * (d.tool === "eraser" ? 2.5 : 1) * pr * k];
}
const drawingNow = () => Object.values(DRAW).some(d => d.active);
document.addEventListener("pointerdown", e => {
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const key = cv.closest(".draw").dataset.draw, d = dstate(key);
  if(d.active || (e.pointerType === "mouse" && e.button !== 0)) return;   // 손가락 두 개는 첫 손가락만
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId) }catch(err){}
  const st = {tool:d.tool, color:d.color, pts:[drawPt(cv, e, d)]};
  d.active = {id:e.pointerId, st}; d.strokes.push(st);
  drawStroke(cv.getContext("2d"), st);
});
document.addEventListener("pointermove", e => {
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const d = dstate(cv.closest(".draw").dataset.draw);
  if(!d.active || d.active.id !== e.pointerId) return;
  e.preventDefault();
  const evs = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [], from = d.active.st.pts.length;
  (evs.length ? evs : [e]).forEach(x => d.active.st.pts.push(drawPt(cv, x, d)));
  drawStroke(cv.getContext("2d"), d.active.st, from);
});
function drawEnd(e){
  const cv = e.target.closest && e.target.closest(".dcanvas"); if(!cv) return;
  const key = cv.closest(".draw").dataset.draw, d = dstate(key);
  if(!d.active || d.active.id !== e.pointerId) return;
  d.active = null; drawExport(key);
  if(S.pending && !drawingNow()){ S.pending = false; render() }      // 그리는 동안 미뤄 둔 화면 갱신
}
document.addEventListener("pointerup", drawEnd);
document.addEventListener("pointercancel", drawEnd);
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-dt],[data-dc],[data-dact]"); if(!b) return;
  const box = b.closest(".draw"); if(!box) return;
  const key = box.dataset.draw, d = dstate(key);
  if(b.dataset.dt) d.tool = b.dataset.dt;
  if(b.dataset.dc){ d.color = b.dataset.dc; d.tool = "pen" }
  if(b.dataset.dact === "undo"){
    if(!d.strokes.length){ toast(d.base ? "전에 저장한 그림은 ‘전체 지우기’로 지울 수 있어요." : "되돌릴 선이 없어요."); return }
    d.strokes.pop(); drawRedraw(key); drawExport(key);
  }
  if(b.dataset.dact === "clear"){
    if(!d.strokes.length && !d.base) return;
    if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "한 번 더 누르면 지워요"; setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = "전체 지우기" } }, 3000); return }
    d.strokes = []; d.base = ""; d.img = null; drawRedraw(key); drawExport(key);
    delete b.dataset.sure; b.textContent = "전체 지우기"; toast("그림을 모두 지웠어요.");
  }
  box.querySelectorAll("[data-dt]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.dt === d.tool)));
  box.querySelectorAll("[data-dc]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.dc === d.color && d.tool === "pen")));
  const pv = box.querySelector(".dprev"); if(pv) pv.style.setProperty("--c", d.tool === "eraser" ? "#ccc" : d.color);
});
document.addEventListener("input", e => {
  if(!e.target.matches || !e.target.matches("[data-dw]")) return;
  const box = e.target.closest(".draw"), d = dstate(box.dataset.draw);
  d.width = Number(e.target.value) || 6;
  box.querySelector(".dprev")?.style.setProperty("--w", d.width + "px");
});

  const none = raw.filter(p => !p.groupId).length;
  if(!ids.length && !extra.length) return "";
  if(S.gselRoom !== r.id){ S.gsel = ""; S.gselRoom = r.id }
  const btn = (k, l, n) => `<button type="button" data-a="gsel" data-v="${esc(k)}" aria-pressed="${S.gsel===k}">${esc(l)} <span class="mono">${n}</span></button>`;
  return `<div class="gsel" role="group" aria-label="결과를 볼 그룹"><span>결과 보기</span>${btn("", "전체", raw.length)}${[...ids, ...extra].map(g => btn(g, groupName(r.courseId, g), raw.filter(p => p.groupId === g).length)).join("")}${none ? btn("_none", "그룹 미지정", none) : ""}</div>

const dtv = ms => { if(!ms) return ""; const d = new Date(ms), z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}` };

      <span class="tm"><label>시작 <input type="datetime-local" data-asg="${esc(g)}" data-f="startAt" value="${dtv(a.startAt)}"></label><label>마감 <input type="datetime-local" data-asg="${esc(g)}" data-f="dueAt" value="${dtv(a.dueAt)}"></label>${st !== set ? `<span>지금: ${asgChip(st)}</span>` : ""}</span>

  if(S.asgAdd && rest.length) h += `<div class="card" style="margin-top:10px;background:var(--sunk)"><p><b>어느 그룹에 더 쓸까요?</b></p>

      <div class="row end" style="margin-top:8px"><button class="btn sm" type="button" data-a="asg-add-cancel">취소</button><button class="btn sm pri" type="button" data-a="asg-add">추가</button></div></div>`;
  return h + `<p class="muted small" style="margin-top:8px">그룹 링크로 들어온 학생은 그룹을 따로 고르지 않아요. 활동 링크 하나만 나눠 줘도 학생이 처음에 한 번 그룹을 고르면 돼요.</p></section>`;
}
async function saveAssign(r, assign){
  return write(db => db.doc("rooms/"+r.id).update({assign, updatedAt:Date.now()}), () => { r.assign = assign; r.updatedAt = Date.now() });
}

/* ---- 내 과목: 과목 고르기 · 과목 머리 ---- */
function courseRooms(cid){ return S.rooms.filter(r => statusOf(r) !== "archived" && (cid === "_none" ? !courseOf(r.courseId) : r.courseId === cid)) }
/* 교사 대시보드: 오늘 한눈 요약 · 과목 카드 · 고른 과목의 머리(공지 포함) */
const dayStart = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() };
const respToday = rs => { const ids = new Set(rs.map(r => r.id)), t0 = dayStart(); return S.posts.filter(p => ids.has(p.roomId) && p.status !== "draft" && Math.max(p.createdAt||0, p.updatedAt||0) >= t0).length };
function teacherTop(){
  const now = new Date(), live = S.rooms.filter(r => statusOf(r) !== "archived");
  const open = live.filter(r => statusOf(r) === "open"), soon = open.filter(r => r.dueAt && r.dueAt > Date.now() && r.dueAt - Date.now() < 864e5);
  const drafts = live.filter(r => statusOf(r) === "draft").length, today = respToday(live);
  const nm = S.demo ? "체험" : (S.sbName || "").trim();
  const tile = (ic, n, l, sub, cls = "", v = "") => `<button type="button" class="tstat ${cls}" data-a="tstat" data-v="${v}" title="${esc(l)} 보기"><span class="ic" aria-hidden="true">${ic}</span><span class="tl">${l}</span><b>${n}</b>${sub ? `<em>${sub}</em>` : "<em>&nbsp;</em>"}</button>`;
  return `<section class="thead"><div class="thead-hi"><div><div class="eyebrow">${now.getMonth()+1}월 ${now.getDate()}일 ${"일월화수목금토"[now.getDay()]}요일 · 교사 화면</div>

      <p>${open.length ? `지금 <b>${open.length}개</b> 활동이 열려 있어요.${soon.length ? ` 그중 <b>${soon.length}개</b>는 24시간 안에 마감돼요.` : ""}` : "열린 활동이 없어요. ‘+ 새 활동 만들기’로 시작해 보세요."}</p></div>
    <span class="row">${S.mode === "supa" ? `<button class="btn" type="button" data-a="roster-open">👥 학생 코드</button>` : ""}<button class="btn pri" type="button" data-a="create">+ 새 활동 만들기</button></span></div>
    <div class="tstats">${tile("📚", activeCourses().length, "내 과목", `활동 ${live.length}개`, "t1", "courses")}${tile("▶️", open.length, "진행 중", drafts ? `작성 중 ${drafts}` : "지금 열린 활동", "t2", "open")}${tile("⏰", soon.length, "곧 마감", "24시간 안", soon.length ? "t3 warn" : "t3", "soon")}${tile("✍️", today, "오늘 들어온 응답", "새 글·제출", today ? "t4 good" : "t4", "today")}</div></section>`;
}
/* 과목이 많을 때: 처음엔 3개만, ‘더 보기’로 전체 · 지난 학기 과목은 보관(archived)하면 목록과 학생 화면에서 빠진다 */
const COURSE_SHOW = 3;
const activeCourses = () => S.courses.filter(c => !c.archived);
/* 과목 순서: 사용자 지정(기본) · 오래된 순 · 최신순 — 고른 방식은 이 기기에 기억
   사용자 지정: 선생님은 과목 문서의 ord(여러 기기에서 같게), 학생은 이 기기의 순서 목록(nonjae.corder) */
const CSORTS = [["custom","사용자 지정"],["old","오래된 순"],["new","최신순"]];
const csortOf = () => { const v = lsGet("nonjae.csort"); return CSORTS.some(x => x[0] === v) ? v : "custom" };
function orderCourses(list, created, ordOf){
  const m = csortOf(), num = v => (typeof v === "number" && isFinite(v)) ? v : 1e9;
  if(m === "old") return [...list].sort((a, b) => created(a) - created(b));
  if(m === "new") return [...list].sort((a, b) => created(b) - created(a));
  return [...list].sort((a, b) => num(ordOf(a)) - num(ordOf(b)) || created(a) - created(b));
}
const stuOrder = () => { try{ const v = JSON.parse(lsGet("nonjae.corder") || "[]"); return Array.isArray(v) ? v : [] }catch(e){ return [] } };
function csortBar(){
  const m = csortOf();
  return `<span class="csort"><select id="c-sort" aria-label="과목 정렬">${CSORTS.map(([k, l]) => `<option value="${k}" ${m === k ? "selected" : ""}>${l}</option>`).join("")}</select>${m === "custom" ? `<button class="btn sm${S.corderEdit ? " pri" : ""}" type="button" data-a="corder-edit" aria-pressed="${!!S.corderEdit}">${S.corderEdit ? "✓ 다 바꿨어요" : "↔ 순서 바꾸기"}</button>` : ""}</span>`;
}
const mvBtns = k => `<span class="dmv"><button type="button" data-a="cmove" data-v="${esc(k)}" data-d="-1" aria-label="앞으로"><span class="pc-only">◀</span><span class="m-only">▲</span></button><span class="grip pc-only" aria-hidden="true">⠿ 끌어서 옮기기</span><button type="button" data-a="cmove" data-v="${esc(k)}" data-d="1" aria-label="뒤로"><span class="pc-only">▶</span><span class="m-only">▼</span></button></span>`;
/* 순서 바꾸기: keys = 지금 보이는 순서, from을 to 자리로 → 저장 */
async function courseReorder(keys, from, to){
  const i = keys.indexOf(from); if(i < 0 || to < 0 || to >= keys.length || i === to) return;
  const next = [...keys]; next.splice(i, 1); next.splice(to, 0, from);
  if(isTeacher()){
    const ch = next.map((id, n) => [courseOf(id), n]).filter(([c, n]) => c && c.ord !== n);
    ch.forEach(([c, n]) => { c.ord = n });                               // 화면부터 바로
    render();
    await Promise.all(ch.map(([c, n]) => write(db => db.doc("courses/" + c.id).update({ord:n}), () => {})));
  }else{ lsSet("nonjae.corder", JSON.stringify(next)); render() }
}
const moreBtn = (n, open, a) => n > 0 || open ? `<div class="dmore-row"><button class="btn sm" type="button" data-a="${a}" aria-expanded="${!!open}">${open ? "접기 ▴" : `＋ 과목 ${n}개 더 보기`}</button></div>` : "";

  return `<div class="sec-h2"><h2 class="sec-h">📚 내 과목 <span class="muted small">${act.length}개</span></h2><span class="row" style="gap:8px">${act.length > 1 ? csortBar() : ""}${arch.length ? `<button class="linkbtn small" type="button" data-a="courses-arch" aria-expanded="${!!S.archCourses}">🗄 보관한 과목 ${arch.length}개 ${S.archCourses ? "▴" : "▾"}</button>` : ""}</span></div>
    ${ed ? `<p class="small muted corder-tip"><span class="pc-only">카드를 끌어서 옮기거나 ◀ ▶ 를</span><span class="m-only">▲ ▼ 를</span> 눌러 순서를 바꿔요. 모든 기기에서 같은 순서로 보여요.</p>` : ""}
    <div class="dgrid${ed ? " dgrid-edit" : ""}">${shown.map(c => cc(c, ed)).join("")}
      ${ed ? "" : `${none.length ? card("_none", "s4", "🗂", "과목 없는 활동", "과목에 넣지 않은 활동이에요", none) : ""}
      <button type="button" class="dcard dadd" data-a="course-new"><span class="dt">＋ 새 과목</span><span class="dw">과목을 만들고 듣는 학생을 학급별로 골라요</span></button>`}</div>
    ${ed ? "" : moreBtn(act.length - shown.length, S.allCourses && act.length > COURSE_SHOW, "courses-more")}

/* 학생 카드·표에 보일 단계 표시: 이 활동에 실제로 있는 단계만 */
const MARK_L = {chat:"AI 대화", think:"처음 생각", why:"이유", counter:"예상 반론", read:"친구 생각", respond:"답하기", revise:"다시 쓰기", compose:"글쓰기",
                ask:"질문", take:"이어받아 답", back:"답 확인", develop:"질문 키우기"};
function marksOf(r){
  const fields = effFields(r), f = featuresOf(r), out = [];
  stepsOf(r).forEach(s => {
    if(s === "see" || s === "feedback") return;           // 피드백은 따로 칸을 둔다
    if(s === "write"){
      const hasC = fields.some(x=>x.k==="claim"), hasR = fields.some(x=>x.k==="reason");
      if(hasC) out.push({k:"claim", l:"주장", ok:p => !!(finalBody(p).claim||"").trim()});
      else out.push({k:"write", l: isEssay(r) ? "생각 정리" : toolOf(r) === "sketch" ? "스케치" : toolOf(r) === "draw" ? "그림" : toolOf(r) === "chatReflect" ? "대화 정리" : "생각 쓰기", ok:p => stepDone(r,p,"write")});
      if(hasR && !stepsOf(r).includes("why")) out.push({k:"reason", l:"근거", ok:p => !!(finalBody(p).reason||"").trim()});
      return;
    }
    if(s === "reflect"){ out.push({k:s, l: f.change ? "생각 변화" : "돌아보기", ok:p => stepDone(r,p,s)}); return }
    out.push({k:s, l: MARK_L[s] || STEP[s].t, ok:p => stepDone(r,p,s)});
  });
  return out;
}
function sstatus(r, p){
  if(!p) return {k:"none", l:"미참여", ic:"⚪"};
  if(stepsOf(r).every(s => stepDone(r,p,s))) return {k:"done", l:"완료", ic:"🟢"};
  if(!submitted(p)) return {k:"draft", l:"쓰는 중", ic:"🟡"};
  return {k:"doing", l:"진행 중", ic:"🟡"};
}
/* 생각의 변화: 바뀌지 않았다고 생각하지 않은 것이 아니다 → ‘유지’ ‘깊어짐’도 따로 보여 준다 */
function changeInfo(r, p){
  if(!p || !p.change) return null;
  const hasSt = (r.stances||[]).length > 0;
  const a = p.initial?.stance && stanceIdx(r, p.initial.stance) >= 0 ? p.initial.stance : p.stance, b = p.change.nowStance || p.stance;
  if(hasSt && a && b && a !== b) return {k:"moved", ic:"🟩", l:"입장이 바뀜", score:4};
  const deg = p.change.degree;
  if(deg === "much") return hasSt ? {k:"deep", ic:"🟩", l:"같은 입장이지만 생각이 크게 깊어짐", score:3} : {k:"much", ic:"🟩", l:"크게 달라짐", score:3};
  if(deg === "some") return hasSt ? {k:"deep", ic:"🟨", l:"같은 입장이지만 근거가 깊어짐", score:2} : {k:"some", ic:"🟨", l:"조금 달라짐", score:2};
  return {k:"keep", ic:"🟦", l:"생각을 유지함", score:1};
}
const changeChip = ci => `<span class="chip cchip"><span aria-hidden="true">${ci.ic}</span> ${esc(ci.l)}</span>`;

/* 학생 한 명 = 응답(post) 또는 명단에만 있는 이름 */
function studentEntries(r, st){
  const seen = new Set(), marks = marksOf(r), pins = r.pins || [];
  const out = st.all.map(p => { seen.add(p.author); return {name:p.author, p} });
  (st.roster||[]).forEach(n => { if(!seen.has(n)){ seen.add(n); out.push({name:n, p:null}) } });
  out.forEach(e => {
    const p = e.p;
    e.no = studentNo(e.name); e.st = sstatus(r, p);
    e.marks = marks.map(m => ({l:m.l, ok: p ? m.ok(p) : false}));
    e.missing = p ? stepsOf(r).filter(s => !stepDone(r,p,s)).length : 99;
    e.fb = p ? repliesOf(p.id).filter(x=>x.kind==="teacher").length : 0;
    e.ci = changeInfo(r, p);
    e.pin = p ? pins.indexOf(p.id) : -1;
    e.ts = p ? (p.updatedAt||p.createdAt||0) : 0;
  });
  return out;
}
/* 필터: 지금 데이터로 판단할 수 있는 것만 */
function sfilters(r, st){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"all", l:"전체", t:() => true},
    {k:"todo", l:"미완료", t:e => !!e.p && e.st.k !== "done"},
    {k:"nojoin", l:"미참여", t:e => !e.p, show:(st.roster||[]).length > 0},
    {k:"fbneed", l:"피드백 필요", t:e => !!e.p && submitted(e.p) && !e.fb, show:f.feedback},
    {k:"pinned", l:"발표 후보", t:e => e.pin >= 0},
    {k:"noread", l:"친구 생각 미확인", t:e => !!e.p && !stepDone(r,e.p,"read"), show:steps.includes("read")},
    {k:"nochange", l: f.change ? "생각 변화 미작성" : "돌아보기 미작성", t:e => !!e.p && !stepDone(r,e.p,"reflect"), show:steps.includes("reflect")},
    {k:"noreason", l:"근거 없음", t:e => !!e.p && !(finalBody(e.p).reason||"").trim(), show:hasReason}
  ].filter(x => x.show !== false);
}
function ssorts(r){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"no", l:"번호순", c:() => 0},
    {k:"name", l:"이름순", c:(a,b) => koCmp(cleanName(a.name), cleanName(b.name))},
    {k:"recent", l:"최근 작성순", c:(a,b) => b.ts - a.ts},
    {k:"todo", l:"남은 단계 많은 순", c:(a,b) => b.missing - a.missing},
    {k:"change", l:"생각 변화가 큰 순", c:(a,b) => (b.ci?.score ?? 0) - (a.ci?.score ?? 0), show:steps.includes("reflect") && f.change},
    {k:"noreason", l:"근거 없는 학생 먼저", c:(a,b) => !!(finalBody(a.p).reason||"").trim() - !!(finalBody(b.p).reason||"").trim(), show:hasReason},
    {k:"noread", l:"친구 생각 안 본 학생 먼저", c:(a,b) => stepDone(r,a.p,"read") - stepDone(r,b.p,"read"), show:steps.includes("read")},
    {k:"nofb", l:"피드백 없는 학생 먼저", c:(a,b) => (!!a.fb) - (!!b.fb), show:f.feedback}
  ].filter(x => x.show !== false);
}
function studentView(r, st){
  const all = studentEntries(r, st), fl = sfilters(r, st), so = ssorts(r);
  if(!fl.some(x => x.k === S.sf)) S.sf = "all";
  if(!so.some(x => x.k === S.ss)) S.ss = "no";
  const flt = fl.find(x => x.k === S.sf), srt = so.find(x => x.k === S.ss), q = (S.sq||"").trim().toLowerCase().replace(/\s+/g," ");
  let list = all.filter(flt.t);
  if(q) list = list.filter(e => e.name.toLowerCase().replace(/\s+/g," ").includes(q) || (e.no && e.no === q.replace(/번$/,"")));
  list.sort((a,b) => cmpNum(a.name, b.name) || koCmp(a.name, b.name));                 // 기본: 번호순
  if(srt.k !== "no") list.sort((a,b) => (srt.k === "name" ? 0 : (!a.p) - (!b.p)) || srt.c(a,b));   // 미참여는 맨 뒤
  return {all, list, fl, so};
}
function vtoggle(a, cur, opts){
  return `<span class="vtoggle" role="group" aria-label="보기 방식">${opts.map(([k,l]) => `<button type="button" data-a="${a}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</span>`;
}
function studentListHTML(r, st, v){
  const list = v.list;
  if(!list.length) return `<div class="empty">조건에 맞는 학생이 없습니다.<br><span class="small">검색어 또는 필터를 변경해 보세요.</span></div>`;
  if(S.sview === "grid") return studentTableHTML(r, list);
  return `<p class="muted small" style="margin-bottom:8px">${list.length}명 · ‘사고 과정 보기’를 누르면 자세히 보고, 이전·다음 학생으로 넘겨 볼 수 있어요.</p><div class="scards">${list.map(e => e.p ? teacherCard(r, e.p, st.sub)
    : `<article class="post nojoin"><div class="post-h"><strong>${esc(e.name)}</strong></div><div class="sline"><span class="sst none">⚪ 미참여</span><span class="muted small">아직 활동을 시작하지 않았어요.</span></div></article>`).join("")}</div>`;
}
/* 한눈에 보기: 35명이 어디까지 했는지 한 화면에서 */
function studentTableHTML(r, list){
  const marks = marksOf(r), f = featuresOf(r);
  const yn = ok => ok ? `<span class="yes">✓</span>` : `<span class="no">✕</span>`;
  const r0 = S.rooms.find(x => x.id === S.roomId), showG = r0 && !S.gsel && S.posts.some(p => p.roomId === r0.id && p.groupId);
  return `<div class="tscroll"><table class="ptable stable"><thead><tr><th>번호</th><th>학생</th>${showG ? "<th>그룹</th>" : ""}<th>상태</th>${marks.map(m=>`<th>${esc(m.l)}</th>`).join("")}${f.feedback?"<th>피드백</th>":""}<th>발표</th></tr></thead><tbody>
    ${list.map(e => {
      const cell = (inner, label) => e.p ? `<button class="cellbtn" type="button" data-a="open-post" data-id="${esc(e.p.id)}" aria-label="${esc(e.name)} ${label} — 자세히 보기">${inner}</button>` : inner;
      return `<tr class="${e.p?"":"nj"}"><td class="mono c">${esc(e.no||"–")}</td><td>${cell(`<b>${esc(cleanName(e.name))}</b>`, "")}</td>${showG ? `<td class="c small">${e.p?.groupId ? esc(groupName(r0.courseId, e.p.groupId)) : "–"}</td>` : ""}
        <td class="c">${cell(`<span class="sst ${e.st.k}">${e.st.ic} ${e.st.l}</span>`, e.st.l)}</td>
        ${e.marks.map(m => `<td class="c">${e.p ? cell(yn(m.ok), m.l + (m.ok ? " 완료" : " 아직")) : `<span class="no">–</span>`}</td>`).join("")}
        ${f.feedback ? `<td class="c">${e.p ? cell(yn(e.fb > 0), e.fb ? "피드백 보냄" : "피드백 아직") : `<span class="no">–</span>`}</td>` : ""}
        <td class="c">${e.p && submitted(e.p) ? `<button class="cellbtn" type="button" data-a="pin" data-id="${esc(e.p.id)}" aria-pressed="${e.pin>=0}" title="발표 목록에 넣기/빼기" aria-label="${esc(e.name)} 발표 목록 ${e.pin>=0?"빼기":"넣기"}">${e.pin>=0 ? `📽 ${e.pin+1}` : "＋"}</button>` : ""}</td></tr>`;
    }).join("")}</tbody></table></div>
    <p class="muted small" style="margin-top:8px">✓ 한 단계 · ✕ 아직 안 한 단계 · 칸을 누르면 그 학생의 생각 과정으로 가요.</p>`;
}
/* 학생 상세: 지금 필터·정렬 순서대로 이전/다음 */
function studentDetail(r, st, p){
  const v = studentView(r, st), list = v.list.filter(e => e.p), i = list.findIndex(e => e.p.id === p.id);
  if(i >= 0) S.sidx = i;
  const pos = Math.min(S.sidx||0, list.length);
  const prev = i >= 0 ? list[i-1] : list[pos-1], next = i >= 0 ? list[i+1] : list[pos];   // 필터에서 빠진 학생(예: 방금 피드백을 받음)은 원래 자리 기준
  const fl = v.fl.find(x => x.k === S.sf), no = studentNo(p.author);
  const where = i >= 0 ? `${i+1} / ${list.length}명` : "지금 필터에서 빠짐";
  return `<div class="snav"><button class="linkbtn" type="button" data-a="close-post">← 학생 목록</button>
    <div class="snav-c"><button class="btn sm" type="button" data-a="snav" data-id="${prev ? esc(prev.p.id) : ""}" ${prev ? "" : "disabled"}>← 이전</button>
      <span class="snav-who">${no ? `<b class="mono">${esc(no)}</b>번 ` : ""}<b>${esc(cleanName(p.author))}</b> <span class="muted small">${where}${S.sf !== "all" ? ` · ${esc(fl.l)}` : ""}${S.sq ? ` · ‘${esc(S.sq)}’ 검색` : ""}</span></span>
      <button class="btn sm" type="button" data-a="snav" data-id="${next ? esc(next.p.id) : ""}" ${next ? "" : "disabled"}>다음 →</button></div></div>
    ${teacherCard(r, p, st.sub, {next})}`;
}
/* 발표 목록(큐): 기존 pins 배열을 그대로 순서로 쓴다 */
function pinList(r){ const ps = allPostsOf(r.id); return (r.pins||[]).map(id => ps.find(p => p.id === id)).filter(Boolean) }
function queuePanel(r){
  const pins = pinList(r), open = S.qopen ?? pins.length > 0;
  return `<details class="queue" data-q ${open ? "open" : ""}><summary>📽 발표 목록 <b class="mono">${pins.length}</b> <span class="muted small" style="font-weight:400">발표 화면에서는 이름 없이 보여요</span></summary>
    ${pins.length ? `<ol class="qlist">${pins.map((p,i) => `<li><span class="qtxt"><b>${esc(cleanName(p.author))}</b> ${p.stance ? stanceChip(r,p.stance) : ""} <span class="muted">${esc(previewText(r,p).slice(0,70))}</span></span>
        <span class="qbtns"><button class="btn sm" type="button" data-a="pin-move" data-id="${esc(p.id)}" data-v="-1" ${i ? "" : "disabled"} aria-label="앞으로">↑</button><button class="btn sm" type="button" data-a="pin-move" data-id="${esc(p.id)}" data-v="1" ${i < pins.length-1 ? "" : "disabled"} aria-label="뒤로">↓</button><button class="btn sm" type="button" data-a="pin" data-id="${esc(p.id)}" aria-label="목록에서 빼기">✕</button></span></li>`).join("")}</ol>
      <div class="row"><button class="btn sm pri" type="button" data-a="present" data-id="${esc(r.id)}" data-mode="thoughts">발표 화면 열기</button><span class="sp"></span><button class="btn sm danger" type="button" data-a="pin-clear">전체 삭제</button></div>`
      : `<p class="muted small" style="margin:4px 0 6px">학생 카드나 ‘한눈에 보기’ 표에서 📽 를 눌러 발표할 생각을 골라 두세요. 고른 순서대로 발표 화면에서 한 명씩 넘겨 볼 수 있어요.</p>`}</details>`;
}

/* ---- 개요: 지금 수업에서 볼 것 · 입장 분포 · 참여/완료 · 교사 확인 필요 ---- */
const NEXT_HINT = {read:"이제 친구 생각을 살펴보도록 안내하기 좋습니다.", respond:"이제 친구 생각에 답하도록 안내하기 좋습니다.", reflect:"이제 생각의 변화를 적도록 안내하기 좋습니다.",
  revise:"이제 글을 다시 다듬도록 안내하기 좋습니다.", counter:"이제 다른 생각을 예상해 보도록 안내하기 좋습니다.", why:"이제 이유를 쓰도록 안내하기 좋습니다.",
  compose:"이제 글쓰기로 넘어가도록 안내하기 좋습니다.", take:"이제 친구 질문을 이어받도록 안내하기 좋습니다.", back:"이제 내 질문에 달린 답을 확인하도록 안내하기 좋습니다.",
  develop:"이제 질문을 한 단계 키워 보도록 안내하기 좋습니다.", feedback:"이제 개인 피드백을 보내면 학생들이 확인하고 다음 단계로 갈 수 있습니다."};
function lessonHints(r, st){
  const P = st.participants, out = [];
  if(!P) return [st.total ? `${st.total}명 중 아직 아무도 참여하지 않았습니다. 학생 링크나 QR 코드를 공유해 보세요.` : "아직 참여한 학생이 없습니다. 학생 링크나 QR 코드를 공유해 보세요."];
  out.push(st.total ? `${st.total}명 중 ${P}명이 참여했습니다.${st.notJoined ? ` 아직 ${st.notJoined}명이 활동을 시작하지 않았습니다.` : " 모두 참여했습니다."}` : `${P}명이 참여했습니다.`);
  if(P < 3) return out;                                       // 학생이 적으면 판단 문장을 만들지 않는다
  const fields = effFields(r), sub = st.sub;
  if(!isRelay(r) && fields.some(x=>x.k==="reason") && sub.length >= 3){
    const nr = sub.filter(p => !(finalBody(p).reason||"").trim()).length;
    if(nr / sub.length >= 0.3){ out.push(`제출한 ${sub.length}명 중 ${nr}명이 근거를 쓰지 않았습니다. 근거를 보완하도록 안내하기 좋습니다.`); return out }
  }
  const sc = stepsOf(r).filter(s => s !== "see").map(s => ({s, l: MARK_L[s] || (s==="write" ? "첫 생각 쓰기" : s==="reflect" ? "생각 변화 기록" : STEP[s].t), n: st.all.filter(p => s === "write" ? submitted(p) : stepDone(r,p,s)).length}));   // 글쓰기는 ‘제출’까지 해야 마친 것으로
  const k = sc.findIndex(x => x.n / P < 0.8);
  if(k < 0) out.push(st.complete / P >= 0.8 ? `대부분의 학생이 모든 단계를 마쳤습니다. ${stepsOf(r).includes("reflect") ? "생각의 변화를 함께 나누며 마무리하기 좋습니다." : "결과를 함께 보며 정리하기 좋습니다."}` : "대부분의 학생이 마지막 단계까지 왔습니다.");
  else if(k === 0) out.push(`${P}명 중 ${sc[0].n}명이 ${sc[0].l}${eul(sc[0].l)} 마쳤습니다. 아직 쓰는 학생이 있으니 조금 더 시간을 주세요.`);
  else out.push(`${P}명 중 ${sc[k-1].n}명이 ${sc[k-1].l}까지 마쳤습니다. ${NEXT_HINT[sc[k].s] || `이제 ‘${sc[k].l}’ 단계로 안내하기 좋습니다.`}`);
  return out;
}
function hintCard(r, st){
  return `<section class="card hintcard"><h3>💡 지금 수업에서 볼 것</h3>${lessonHints(r, st).map(x => `<p>${esc(x)}</p>`).join("")}</section>`;
}
function stanceCard(r, st){
  const sts = r.stances || [], sub = st.sub, n = sub.length;
  if(!sts.length) return "";
  const rows = sts.map((s,i) => ({s, i, c: sub.filter(p => p.stance === s).length}));
  let interp = "";
  if(n >= 5){
    const cs = rows.map(x => x.c).sort((a,b) => b-a), top = cs[0]/n, second = (cs[1]||0)/n;
    if(top >= 0.7) interp = "한쪽 입장이 많습니다. 다른 입장의 근거를 함께 살펴보면 생각을 넓히기 좋습니다.";
    else if(top - second <= 0.2) interp = sts.length === 2 ? "의견이 비교적 균형 있게 나뉘어 있습니다. 서로의 근거를 비교하며 전체 토론으로 넘어가기 좋습니다." : "여러 입장이 고르게 나뉘어 있습니다. 입장별 근거를 비교하며 전체 토론으로 넘어가기 좋습니다.";
    else interp = "입장이 나뉘어 있습니다. 서로 다른 근거를 비교해 보기 좋습니다.";
  }

function estMinutes(r){
  const sum = stepsOf(r).reduce((a,s) => a + (s==="write" && depthOf(r)==="quick" ? 5 : (STEP_MIN[s]||3)), 0);
  const r5 = x => Math.max(5, Math.round(x/5)*5), lo = r5(sum); let hi = r5(sum*1.4); if(hi <= lo) hi = lo + 5;
  return [lo, hi];
}

function manageFiltered(){
  const q = (S.mq||"").trim().toLowerCase(), dur = MDURS.find(x => x[0] === S.mdur);
  const cf = S.mcourse;
  const cache = new Map(), stOf = r => { if(!cache.has(r.id)) cache.set(r.id, teacherStats(r)); return cache.get(r.id) };
  const list = [...S.rooms].filter(r => {
    const st = statusOf(r);
    if(S.mf === "all" ? st === "archived" : st !== S.mf) return false;
    if(S.msub && (r.subject||"") !== S.msub) return false;

    if(cf && (cf === "_none" ? !!courseOf(r.courseId) : r.courseId !== cf)) return false;      // 수업별
    if(!cf && courseOf(r.courseId)?.archived) return false;                              // 보관한 과목의 활동은 그 과목 안에서만
    if(dur && !(Number(r.duration) > 0 && dur[2](Number(r.duration)))) return false;     // 시간이 적힌 활동만
    if(!q) return true;
    const t = TEMPLATES[r.template] || {};
    return [r.title, r.subject, r.unit, r.grade, t.label, t.mode, r.prompt, courseOf(r.courseId)?.title].filter(Boolean).join(" ").toLowerCase().includes(q);
  });
  // 정렬: 값을 알 수 없는 활동(학생 수 미설정 등)은 뒤로
  const nl = (f, dir) => (a, b) => { const x = f(a), y = f(b); if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1; return dir * (x - y) };
  const part = r => { const st = stOf(r); return st.total ? st.participants / st.total : null };
  const comp = r => { const st = stOf(r); return st.participants ? st.complete / st.participants : null };
  const recent = (a,b) => lastActivity(b) - lastActivity(a);
  const cmp = {recent, created:(a,b) => (b.createdAt||0) - (a.createdAt||0), partHigh:nl(part,-1), partLow:nl(part,1),
    notJoined:nl(r => stOf(r).notJoined, -1), compHigh:nl(comp,-1), title:(a,b) => koCmp(a.title||"", b.title||""),
    due:(a,b) => (a.dueAt && a.dueAt > Date.now() ? a.dueAt : 9e15) - (b.dueAt && b.dueAt > Date.now() ? b.dueAt : 9e15) || recent(a,b)}[S.msort] || recent;
  list.sort((a,b) => cmp(a,b) || recent(a,b));

  return list;
}

function copyText(t, okMsg){
  const fallback = () => { S.modal = {type:"text", title:"아래 내용을 복사해 주세요", note:"자동 복사가 안 되는 환경이에요. 길게 눌러 전체 선택한 뒤 복사하세요.", text:t}; render() };
  try{ navigator.clipboard.writeText(t).then(() => toast(okMsg), fallback) }catch(e){ fallback() }
}
async function saveTnote(r, patch){
  const cur = (({id, ...rest}) => rest)(tnote(r));
  const data = {...cur, ...patch, updatedAt:Date.now()};
  return write(db => db.doc("tnotes/"+r.id).set(data), () => { S.tnotes = S.tnotes.filter(x=>x.id!==r.id).concat({id:r.id, ...data}) });
}
async function setStatus(r, st){
  const patch = {status:st, open: st==="open", updatedAt:Date.now()};
  if(st === "open" && pastDue(r)) patch.dueAt = null;                  // 마감 시각이 지난 활동을 다시 열면 마감 시각을 지운다
  return write(db => db.doc("rooms/"+r.id).update(patch), () => Object.assign(r, patch));
}

/* 복제: 설정만 복사하고 학생 응답·댓글·피드백·참여 기록은 복사하지 않는다 */
async function duplicateRoom(r){
  const {id, status, open, createdAt, updatedAt, classSize, pins, ...rest} = r;
  const nid = "r-" + Date.now().toString(36), now = Date.now();
  const doc = {...JSON.parse(JSON.stringify(rest)), title:(r.title||"활동") + " - 복사본", status:"draft", open:false, createdAt:now, updatedAt:now, copiedFrom:r.id};
  if(doc.assign) doc.assign = Object.fromEntries(asgIds(r).map(g => [g, {status:"open"}]));     // 같은 그룹 배포만 복사 (상태·시간은 새로)
  const ok = await write(db => db.doc("rooms/"+nid).set(doc), () => { S.rooms.push({id:nid, ...doc}) });
  if(!ok) return null;
  if(tnote(r).memo) await saveTnote({id:nid}, {memo:tnote(r).memo});
  return {id:nid, ...doc};
}

    col.push(["친구에게 남긴 말·반론", p => S.replies.filter(x=>x.roomId===r.id && x.author===p.author && (x.kind==="rebuttal"||x.kind==="comment")).map(x=>x.text+(x.evidence?` (이유: ${x.evidence})`:"")).join("\n")]);

    col.push(["영향을 준 것", p => [p.change?.biggest, ...(p.change?.influences||[])].filter(Boolean).join(" / ")]);
    return [col.map(c=>c[0]), ...ch.map(p => col.map(([,fn]) => String(fn(p)||"")))];
  }
  if(kind === "feedback"){
    const rows = [["번호","학생","피드백","보낸 시각"]];

    return rows;
  }
  return exportRows(r);

function finalThought(r, p){
  if(isRelay(r)){ const qs = p.questions||[]; return {label: qs.length>1 ? "키운 질문" : "질문에 달린 답", text: qs.length>1 ? `“${qs[qs.length-1].text}”` : `${S.replies.filter(x=>x.kind==="answer"&&x.postId===p.id).length}개`} }
  if(p.revision) return {label:"지금의 생각 · 다시 쓴 글", text: p.revision.body.claim || firstText(p.revision.body)};
  if(p.change) return {label:"지금의 생각", text:p.change.now};
  if(p.revisit) return {label:"수업 후의 생각", text:p.revisit};
  return {label:"내가 낸 생각", text: p.body?.claim || firstText(p.body)};
}

/* =========================================================
   12. 교사: 새 활동 만들기 — 활동 깊이 + 고급 설정
   ========================================================= */
/* 활동 깊이를 고르면 세부 기능이 자동으로 맞춰진다 */
function applyDepth(k, f = F("create")){
  const d = DEPTHS[k], t = TEMPLATES[f.template || "debate2"], hasSt = t.stances.length > 0;
  const inter = hasSt ? d.interact.stance : d.interact.free;
  if(k !== "quick" && f.reveal === "teacher" && f.template !== "notes") f.reveal = "after";   // 학습 나눔은 선생님이 고를 때만 서로 보기     // 만남부터는 친구 글이 보여야 한다 (논술처럼 ‘선생님만 보기’로 시작하는 활동)
  else if(k === "quick" && t.reveal === "teacher") f.reveal = "teacher";
  Object.assign(f, {
    depth:k,
    initial:d.features.initial, evidenceType:d.features.evidenceType, warrant:d.features.warrant, counter:d.features.counter,
    meet:d.features.meet, missionDeep:d.features.readMission.length > 0,
    comment: inter !== "none", rebuttal: inter === "rebuttal",
    change:k === "deep" && d.features.change, feedback:d.features.feedback, revise:d.features.revise, terms:false,   // ② 생각→만남은 변화 단계 없이
    minChars: String(TOOLS[t.tool]?.only ? t.minChars : t.minChars && k !== "quick" ? t.minChars : (t.tool==="free" || t.tool==="feel" ? Math.min(d.minChars, 40) : d.minChars)),
    evidenceTypes: f.evidenceTypes || [...EVIDENCE_TYPES]
  });
}
/* 활동 유형은 입장·공개 방식·사고 도구·기본 깊이를 정한다 */
function applyTemplate(k){
  const t = TEMPLATES[k], f = F("create");
  Object.assign(f, {template:k, tool:t.tool, stances:t.stances.join(", "), reveal:t.reveal, anonymous:t.anonymous, qtype:t.qtype||"", predict:false, develop:false, nst:t.stances.length});

function onFormValue(el){
  const key = el.dataset.form, k = el.dataset.k, f = F(key);
  if(el.type === "checkbox" && el.hasAttribute("data-multi")){
    const set = new Set(f[k] || []); el.checked ? set.add(el.value) : set.delete(el.value); f[k] = [...set];
  }else if(el.type === "checkbox") f[k] = el.checked;
  else if(el.type === "radio"){ if(el.checked) f[k] = el.value }
  else f[k] = el.value;
  saveFormsSoon();
  return {key, k};
}
document.addEventListener("input", e => {
  const el = e.target;
  if(el.id === "roster-q"){ S.rosterQ = el.value; const box = el.closest(".modal"); if(box){ const at = el.selectionStart; render(); const n = document.getElementById("roster-q"); if(n){ n.focus(); n.setSelectionRange(at, at) } } return }
  if(el.id === "n-q"){ S.nq = el.value; const at = el.selectionStart; render(); const n = document.getElementById("n-q"); if(n){ n.focus(); n.setSelectionRange(at, at) } return }
  if(el.id === "mem-q" && S.form.course){ S.form.course.q = el.value; const box = document.getElementById("mem-list"); if(box) box.innerHTML = memListHTML(S.form.course); return }
  if(el.id === "m-q"){ S.mq = el.value; const box = document.getElementById("mlist"); if(box) box.innerHTML = manageList(); return }
  if(el.id === "s-q"){ S.sq = el.value; const r = room(), box = document.getElementById("slist"); if(r && box){ const st = teacherStats(r); box.innerHTML = studentListHTML(r, st, studentView(r, st)) } return }
  if(el.dataset.qi !== undefined && el.dataset.qf){                     // 단계별 질문 고치기 (다시 그리지 않는다)
    const f = F("create"), qs = qsOf(f).map(x => ({...x})), i = Number(el.dataset.qi);
    if(qs[i]){ qs[i][el.dataset.qf] = el.value; f.qs = qs; saveFormsSoon() } return }
  if(!el.dataset.form || el.type==="checkbox" || el.type==="radio" || el.tagName==="SELECT") return;
  const {key} = onFormValue(el);
  if(key.startsWith("write:")) refreshWriteStatus();
  if(key.startsWith("essay:")){ const r = room(), box = document.getElementById("estatus"); if(r && box) box.outerHTML = essayStatusHTML(r) }
});

document.addEventListener("dragover", e => { const el = e.target.closest?.("[data-ck]"); if(!el || !S.dragCk) return; e.preventDefault(); document.querySelectorAll(".dedit.over").forEach(x => x !== el && x.classList.remove("over")); if(el.dataset.ck !== S.dragCk) el.classList.add("over") });
document.addEventListener("drop", e => { const el = e.target.closest?.("[data-ck]"); if(!el || !S.dragCk) return; e.preventDefault(); const ks = S.corderKeys || [], from = S.dragCk; S.dragCk = null; courseReorder(ks, from, ks.indexOf(el.dataset.ck)) });
document.addEventListener("dragend", () => { S.dragCk = null; document.querySelectorAll(".dedit.dragging,.dedit.over").forEach(x => x.classList.remove("dragging", "over")) });
document.addEventListener("toggle", e => { const d = e.target; if(d?.dataset?.keep) S.advOpen = {...(S.advOpen || {}), [d.dataset.keep]: d.open};
  if(d?.dataset && "lazy" in d.dataset && d.open && !d.querySelector(".cport-body")) render() }, true);   // 펼칠 때 처음 계산
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.mem && S.form.course){ const f = S.form.course, sel = new Set(f.sel || []); el.checked ? sel.add(el.dataset.mem) : sel.delete(el.dataset.mem); f.sel = [...sel]; memRefresh(); return }
  if(el.dataset.memg && S.form.course){ const f = S.form.course; f.gm = f.gm || {}; if(el.value) f.gm[el.dataset.memg] = el.value; else delete f.gm[el.dataset.memg]; memRefresh(); return }
  if(el.dataset.combo){ setCombo(el.dataset.combo, el.type === "checkbox" ? el.checked : el.value); saveFormsSoon(); render(); document.getElementById(el.id)?.focus(); return }
  if(el.dataset.ctxFile !== undefined){ if(el.files?.length) ctxAddFiles(el.files); el.value = ""; return }
  if(el.dataset.noteFile){ const r = S.rooms.find(x => x.id === el.dataset.noteFile); if(r && el.files?.length) noteAddFiles(r, el.files); el.value = ""; return }
  if(el.id === "n-cls"){ S.ncls = el.value; render(); return }
  if(el.id === "c-sort"){ lsSet("nonjae.csort", el.value); if(el.value !== "custom") S.corderEdit = false; render(); document.getElementById("c-sort")?.focus(); return }
  if(el.id === "m-sub" || el.id === "m-grade"){ S[el.id === "m-sub" ? "msub" : "mgrade"] = el.value; render(); return }
  if(el.dataset.asg){                                        // 그룹별 시작·마감 시각
    if(!Auth.teacher) return;
    const r = S.rooms.find(x => x.id === S.roomId), g = el.dataset.asg, v = el.value ? new Date(el.value).getTime() : null;
    const assign = JSON.parse(JSON.stringify(r.assign || {})); assign[g] = {...(assign[g]||{status:"open"})};
    if(v) assign[g][el.dataset.f] = v; else delete assign[g][el.dataset.f];
    saveAssign(r, assign).then(ok => { if(ok){ toast("그룹 시간을 저장했어요." + (roomPushOn(r) && el.dataset.f === "startAt" && v > Date.now() ? " 그 시각에 이 그룹 학생에게 알림이 가요." : "")); schedSync({...r, assign}); render() } });
    return;
  }
  if(el.id === "m-sort" || el.id === "m-dur" || el.id === "s-sort" || el.id === "h-sort"){ S[{"m-sort":"msort","m-dur":"mdur","s-sort":"ss","h-sort":"hsort"}[el.id]] = el.value; if(el.id === "h-sort") lsSet("nonjae.hsort", el.value); render(); document.getElementById(el.id)?.focus(); return }
  // 학급 학생 수 (교사)
  if(el.hasAttribute("data-classsize")){
    const r = room(), v = Math.max(0, parseInt(el.value)||0);
    write(db => db.doc("rooms/"+r.id).update({classSize:v}), () => { r.classSize = v });
    return;
  }
  if(!el.dataset.form || !(el.type==="checkbox" || el.type==="radio" || el.tagName==="SELECT")) return;
  const {key, k} = onFormValue(el);
  if(key.startsWith("write:")) refreshWriteStatus();
  if(key.startsWith("write:") && k === "_stance"){ const wm = document.getElementById("wmap"), r = room(); if(wm && r) wm.outerHTML = writeMapHTML(r) }
  if(key === "create"){
    const f = F("create");
    if(k === "template") applyTemplate(f.template);
    if(k === "depth") applyDepth(f.depth);
    if(k === "tool"){ Object.assign(f, TOOLS[f.tool].force || {}) }   // 사고 도구가 요구하는 기능은 자동으로 켠다
    if(k === "rebuttal" && f.rebuttal) f.comment = true;
    if(k === "courseId") f.groups = groupsOf(courseOf(f.courseId)).map(g => g.id);   // 과목을 고르면 그 과목의 모든 그룹을 먼저 골라 둔다
    const id = el.id; render(); if(id) document.getElementById(id)?.focus();
  }
});
/* 고급 설정 열림 상태 기억 (toggle 이벤트는 버블링되지 않아 캡처로 받는다) */
document.addEventListener("toggle", e => {
  if(e.target.matches && e.target.matches("details[data-adv]")) F("create")._advOpen = e.target.open;
  if(e.target.matches && e.target.matches("details[data-q]")) S.qopen = e.target.open;
}, true);
function refreshWriteStatus(){
  const r = room(), box = document.getElementById("wstatus");
  const sk = document.getElementById("skprev"); if(sk && r) sk.innerHTML = sketchMapHTML(F(writeKey(r)));   // 생각 스케치: 적는 대로 지도 그리기
  if(!r || !box) return;
  box.outerHTML = statusHTML(r);
  revealFields(r);
}
document.addEventListener("keydown", e => { if(e.key==="Enter" && !e.isComposing && (e.target.id==="f-name" && S.mode !== "supa" || e.target.id==="f-code")){ e.preventDefault(); act("setname") } });
document.addEventListener("keydown", e => {                       // 가상 인물 대화: Enter로 보내기, Shift+Enter는 줄바꿈 (한글 입력 중에는 보내지 않음)
  if(e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  if(!(e.target.dataset?.form || "").startsWith("chat:")) return;
  e.preventDefault(); act("chat-send");
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(!b || b.disabled || b.closest("fieldset[disabled]")) return;
  if(b.dataset.a === "modal-bg" && e.target !== b) return;      // 모달 안쪽 클릭은 닫지 않는다
  if(b.closest("[data-racts]")) S.modal = null;                 // 관리 메뉴에서 고르면 메뉴는 닫고 그 동작을 한다
  act(b.dataset.a, b);
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "c-kw" && !e.isComposing){ e.preventDefault(); act("ai-suggest", e.target) } });
document.addEventListener("keydown", e => {
  if(S.tour != null){ if(e.key === "Escape") tourEnd(); else if(e.key === "ArrowRight" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) tourGo(S.tour + 1); else if(e.key === "ArrowLeft" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) tourGo(S.tour - 1); return }
  if(e.key === "Escape" && S.modal){ S.modal = null; render() } });
/* 발표 화면: 키보드 ← → 로 발표 목록 넘기기 */
document.addEventListener("keydown", e => {
  if(S.view !== "present" || S.modal || !/^Arrow(Left|Right)$/.test(e.key) || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(!document.querySelector('[data-a="pnav"]')) return;
  e.preventDefault(); act("pnav", {dataset:{v: e.key === "ArrowRight" ? "1" : "-1"}});
});

/* 문장 시작 넣기 */
function insertStarter(b){
  const el = document.getElementById(b.dataset.target);
  if(!el) return;
  const add = b.dataset.text || "";
  el.value = el.value.trim() ? el.value.replace(/\s*$/, "\n") + add : add;
  el.dispatchEvent(new Event("input", {bubbles:true}));
  el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  b.closest("details")?.removeAttribute("open");
}

async function act(a, b){
  if(S.tour != null && TOUR[S.tour]?.on){ const o = TOUR[S.tour].on;            // 둘러보기: 안내한 버튼을 직접 누르면 다음 장면으로
    if(o.a === a && (!o.id || b?.dataset?.id === o.id) && (!o.v || b?.dataset?.v === o.v)){ S.tour++; S.tourScrolled = -1 } }
  if(TEACHER_ACTS.has(a) && !Auth.teacher){ toast("선생님만 쓸 수 있는 기능이에요."); return }   // 학생 권한: 교사 기능 호출 차단
  if(["phase","step","go-respond","open-record"].includes(a)) S.work = a === "open-record" ? b.dataset.id : S.roomId;   // 단계로 가면 ‘내 활동’ 화면
  if(a === "open" || a === "home" || a === "mine") S.work = null;
  if(a === "open" && !isTeacher()) markSeen("r", [b.dataset.id]);       // 새 활동 표시(NEW)는 한 번 열면 사라진다
  const r = room(), p = r ? myPost(r) : null;
  switch(a){
    /* ---- 이동 ---- */
    case "home": S.view = "home"; S.confirmDel = false; S.openPost = null; scrollTo(0,0); break;
    case "mine": S.view = "mine"; scrollTo(0,0); break;
    case "open": S.gsel = ""; S.gselRoom = b.dataset.id; S.asgAdd = false; S.sq = ""; S.sf = "all"; S.fbSent = null; S.pmode = null; S.pidx = 0; S.prand = null; S.qopen = null; S.modal = null; S.ttab = "overview"; S.view = "room"; S.roomId = b.dataset.id; S.take = null; S.editing = null; S.confirmDel = false; S.openPost = null; scrollTo(0,0); break;
    case "open-record": S.view = "room"; S.roomId = b.dataset.id; S.step[b.dataset.id] = "record"; S.openPost = null; scrollTo(0,0); break;
    case "role": return;
    /* ---- Supabase: 교사 로그인 · 학생 명단 ---- */
    case "t-login": { await SB.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.origin + location.pathname + "#teacher"}}); return }
    case "t-logout": { await SB.auth.signOut(); location.hash = ""; location.reload(); return }
    case "t-cancel": S.wantTeacher = false; if(location.hash === "#teacher") history.replaceState(null, "", location.pathname); break;
    case "t-start": S.wantTeacher = true; history.replaceState(null, "", location.pathname + "#teacher"); scrollTo(0,0); break;
    case "roster-open": S.modal = {type:"roster"}; S.roster = undefined; S.rosterQ = ""; loadRoster(); break;
    case "roster-add": {
      S.rosterSchool = cleanSchool(document.getElementById("roster-school")?.value);
      const {ok, bad} = parseRoster(document.getElementById("roster-add")?.value, S.rosterSchool);
      if(!ok.length){ toast(bad.length ? "‘학번 이름’ 꼴로 적어 주세요." : "추가할 학생을 적어 주세요."); return }
      const have = new Set((S.roster || []).map(rosterLabel));
      const rows = ok.filter(x => { const k = rosterLabel(x); if(have.has(k)) return false; have.add(k); return true }).map(x => ({...x, code:newCode()}));   // 이미 있거나 겹친 줄은 빼고
      if(rows.length){ const r2 = await SB.from("students").upsert(rows, {onConflict:"tid,school,number,name", ignoreDuplicates:true}); if(r2.error){ toast("추가하지 못했어요: " + r2.error.message); return } }
      toast(`${rows.length}명을 추가했어요.${ok.length - rows.length ? ` (이미 있는 ${ok.length - rows.length}명은 그대로)` : ""}${bad.length ? ` 읽지 못한 줄 ${bad.length}개` : ""}`);
      await loadRoster(); break;
    }
    case "roster-reissue": { const r2 = await SB.from("students").update({code:newCode()}).eq("id", b.dataset.id); if(r2.error){ toast("바꾸지 못했어요."); return } toast("새 코드를 만들었어요. 예전 코드는 더 이상 쓸 수 없어요."); await loadRoster(); break }
    case "roster-del": {
      if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "정말 빼기"; setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = "빼기" } }, 3000); return }
      const r2 = await SB.from("students").delete().eq("id", b.dataset.id); if(r2.error){ toast("빼지 못했어요."); return }
      toast("명단에서 뺐어요. 이 학생이 쓴 글은 그대로 남아요."); await loadRoster(); break;
    }
    case "roster-print": printRoster(); return;
    /* ---- 가상 인물 대화 ---- */
    case "chat-starter": { const el = document.getElementById(`chat:${r.id}-msg`); if(el){ el.value = b.dataset.text; el.dispatchEvent(new Event("input", {bubbles:true})); el.focus() } return }
    case "chat-stop": { CHAT[r.id]?.ctl?.abort(); return }
    case "chat-send": {
      if(CHAT[r.id]?.busy) return;
      const key = "chat:" + r.id, f = F(key), msg = (f.msg || "").trim().slice(0, 600), P = personaOf(r);
      if(!msg){ toast(`${P.name}에게 물어볼 말을 적어 주세요.`); return }
      const sample = await getSample();
      if(!sample){ toast("이 화면에서는 AI 대화를 쓸 수 없어요."); break }
      const base = [...(p?.chat?.log || [])];
      if(base.filter(x => x.role === "user").length >= P.maxTurns){ toast("질문을 모두 했어요."); break }
      const log = base.concat({role:"user", text:msg, at:Date.now()});
      f.msg = ""; saveFormsSoon();
      const st = CHAT[r.id] = {busy:true, stream:"", ctl:new AbortController(), pending:log};
      render();
      const turns = [{role:"user", content:chatRules(r)}, ...log.slice(-20).map(x => ({role: x.role === "ai" ? "assistant" : "user", content: x.text}))];
      let reply = "";
      try{
        const res = await sample(turns, {modelTier:"quick", cache:false, signal:st.ctl.signal,
          onText: ({text}) => { st.stream = text; const el = document.getElementById("chatstream"); if(el){ el.textContent = text; const box = document.getElementById("chatbox"); if(box) box.scrollIntoView({block:"end", behavior:"smooth"}) } }});
        reply = (res.text || "").trim();
      }catch(e){
        if(e?.code === "cancelled" && (e.text || "").trim()) reply = e.text.trim() + " …(멈춤)";
        else if(e?.code !== "cancelled"){ toast(CHAT_ERR[e?.code] || "AI가 답하지 못했어요. 다시 보내 주세요.") }
      }
      delete CHAT[r.id];
      if(!reply){ F(key).msg = msg; saveFormsSoon(); break }          // 답이 없으면 질문을 입력 칸에 되돌린다
      log.push({role:"ai", text:reply, at:Date.now()});
      await savePost(r, {chat:{log, done:false}});
      break;
    }
    case "chat-done": {
      const log = p?.chat?.log || []; if(!log.length) return;
      const ok = await savePost(r, {chat:{log, done:true, doneAt:Date.now()}});
      if(ok){ dropForm("chat:" + r.id); toast("대화를 마쳤어요. 이제 대화에서 얻은 것을 정리해 볼까요?"); goNext(r) }
      break;
    }
    case "chat-skip": { const ok = await savePost(r, {chat:{log:[], done:true, skipped:true}}); if(ok) goNext(r); break }                                           // 화면 전환 버튼은 없앴다 (예전 버튼이 남아 있어도 아무 일도 하지 않는다)
    case "preview-home": enterPreview(null); break;
    case "create": {
      if(S.form.create?.editId) dropForm("create");
      const fresh = !S.form.create, f = createForm();
      if(fresh && courseOf(S.mcourse)){ f.courseId = S.mcourse; f.groups = groupsOf(courseOf(S.mcourse)).map(g => g.id); saveFormsSoon() }   // 고른 과목에서 만들면 그 과목으로
      S.tplNaming = false; S.view = "create"; scrollTo(0,0); break;
    }
    case "phase": {
      const ph = phasesOf(r).find(x=>x.k===b.dataset.v);
      goStep(r, ph.steps.find(s => stepState(r,p,s)==="open") || ph.steps[0]);
      break;
    }
    case "step": goStep(r, b.dataset.v); S.take = null; break;
    case "heart": {
      const pid = b.dataset.id, post = S.posts.find(x => x.id === pid);
      if(!post || !S.name || isMe(post.author) || (isTeacher() && !S.preview)) return;
      const ex = myHeart(pid), on = !(ex && ex.on !== false), id = ex?.id || ("h-" + pid + "-" + heartKey(S.name));
      const data = {roomId:post.roomId, postId:pid, author:meFor(post.roomId), kind:"heart", on, createdAt:ex?.createdAt || Date.now(), updatedAt:Date.now()};
      const prev = S.replies;
      S.replies = S.replies.filter(x => x.id !== id).concat({id, ...data}); render();          // 바로 보이게
      const ok = await write(db => db.doc("replies/" + id).set(data), () => {});
      if(!ok){ S.replies = prev; render() }
      return;
    }
    case "focus-com": { const t = document.getElementById("com:" + b.dataset.id + "-text") || document.querySelector(`[data-form="com:${b.dataset.id}"]`); t?.scrollIntoView({block:"center"}); t?.focus(); return }
    case "open-post": S.openPost = b.dataset.id; S.fbSent = null; if(b.dataset.c) S.comFocus = b.dataset.id; if(isTeacher() && S.view === "room"){ S.ttab = "students"; setTimeout(() => document.querySelector(".snav")?.scrollIntoView({block:"start"}), 0) } break;
    case "close-post": S.openPost = null; S.fbSent = null; break;
    case "port-student": S.modal = {type:"port", c:b.dataset.c, v:b.dataset.v}; break;
    case "port-open": S.modal = null; S.view = "room"; S.roomId = b.dataset.id; S.ttab = "students"; S.openPost = b.dataset.v; S.gsel = ""; scrollTo(0,0); break;
    case "go-respond": goStep(r, "respond"); S.openPost = b.dataset.id; break;
    case "starter": insertStarter(b); return;

    /* ---- 이름 ---- */
    case "rename":
      if(S.mode === "supa"){ lsSet("nonjae.name", ""); await SB.auth.signOut(); location.reload(); return }   // 다른 학생으로: 이 기기의 연결을 끊는다
      S.name = ""; lsSet("nonjae.name",""); S.form = {}; S.step = {}; if(S.view!=="room") S.view = "mine"; break;
    case "join-open": S.modal = {type:"join"}; break;
    case "note-share": { const v = b.dataset.v === "after" ? "after" : "teacher"; if(!r || r.reveal === v) break;
      const ok = await write(db => db.doc("rooms/" + r.id).update({reveal:v, updatedAt:Date.now()}), () => { r.reveal = v });
      if(ok) toast(v === "after" ? "이제 사진을 올린 학생끼리 서로 볼 수 있어요." : "이제 선생님만 볼 수 있어요."); break }
    case "tname-open": S.modal = {type:"tname"}; setTimeout(() => document.getElementById("t-name")?.select(), 0); break;
    case "tname-later": lsSet("nonjae.tname.later", "1"); S.modal = null; break;
    case "tname-save": {
      const v = (document.getElementById("t-name")?.value || "").trim().replace(/\s+/g, " ").replace(/\s*(선생님|선생|쌤|T)$/, "").trim().slice(0, 30);   // ‘선생님’은 화면에서 저절로 붙는다
      if(!v){ toast("이름을 적어 주세요."); return }
      if(b) b.disabled = true;
      const res = await rpcSafe("teacher_set_name", {p_name:v});
      if(!res?.data?.ok){ if(b) b.disabled = false; toast("이름을 저장하지 못했어요. 잠시 뒤 다시 해 보세요."); return }
      try{ await SB.auth.updateUser({data:{display_name:v}}) }catch(e){}      // 다른 기기에서도 이 이름으로
      S.sbName = v; S.modal = null; lsSet("nonjae.tname.later", "");
      const cs = S.courses.filter(c => c.teacherName !== v), rs = S.rooms.filter(r => r.teacherName && r.teacherName !== v);   // 학생에게 보이는 선생님 이름도 바꾼다
      await Promise.all([...cs.map(c => write(db => db.doc("courses/" + c.id).update({teacherName:v}), () => { c.teacherName = v })),
                         ...rs.map(r => write(db => db.doc("rooms/" + r.id).update({teacherName:v}), () => { r.teacherName = v }))]);
      toast(`이름을 ‘${v}’(으)로 정했어요.${cs.length + rs.length ? ` 과목 ${cs.length}개·활동 ${rs.length}개에도 바꿨어요.` : ""}`);
      break;
    }
    case "corder-edit": S.corderEdit = !S.corderEdit; break;
    case "cmove": { const ks = S.corderKeys || [], k = b.dataset.v; await courseReorder(ks, k, ks.indexOf(k) + Number(b.dataset.d)); setTimeout(() => document.querySelector(`[data-ck="${CSS.escape(k)}"] [data-d="${b.dataset.d}"]`)?.focus(), 0); return }
    case "join-save": {
      const g = id => (document.getElementById(id)?.value || "").trim(), num = g("j-num"), nm = g("j-name"), code = g("j-code");
      if(!num || !nm || !code){ toast("학번, 이름, 새 선생님의 개인 코드를 모두 적어 주세요."); return }
      if(b) b.disabled = true;
      const res = await rpcSafe("claim_student", {p_number:num, p_name:nm, p_code:code});
      if(res.error || !res.data){ if(b) b.disabled = false; toast("학번·이름·코드가 맞지 않아요. 새 선생님께 받은 코드인지 확인해 주세요."); return }
      if(S.mySids?.has(res.data.id)){ S.modal = null; toast("이미 연결된 선생님이에요. 과목이 안 보이면 선생님께 과목에 넣어 달라고 말해 주세요."); break }
      lsSet("nonjae.joined", "1"); location.reload(); return;            // 새 선생님의 과목·활동을 새로 불러온다
    }
    case "setname": {
      if(S.mode === "supa"){
        const g = id => (document.getElementById(id)?.value || "").trim();
        const num = g("f-num"), nm = g("f-name"), code = g("f-code");
        if(!num || !nm || !code){ toast("학번, 이름, 개인 코드를 모두 적어 주세요."); return }

      const sec0 = b.dataset.s ? parseInt(b.dataset.s) : (parseInt(ft.m) || 0) * 60 + (parseInt(ft.s) || 0), sec = Math.min(7200, Math.max(5, sec0 || 0));
      if(!rr) break; if(!(sec0 > 0)){ toast("몇 분 몇 초로 할지 적어 주세요."); document.getElementById("tmr-min")?.focus(); return }
      const now = Date.now(), ok = await setTimer(rr, {dur:sec * 1000, endsAt:now + sec * 1000, left:null, at:now});
      if(ok){ dropForm("tmr"); toast(`⏱ ${secL(sec)} 타이머를 시작했어요. 학생 화면에도 보여요.`) } break;
    }
    case "tmr-add": case "tmr-pause": case "tmr-resume": {
      const rr = S.rooms.find(x=>x.id===b.dataset.id), t = tmrOf(rr); if(!t) break;
      const now = Date.now(), cur = rr.timer;
      const add = (parseInt(b.dataset.v) || 60) * 1000;
      if(a === "tmr-add") await setTimer(rr, t.st === "paused" ? {...cur, dur:cur.dur + add, left:t.left + add, at:now} : {...cur, dur:cur.dur + add, endsAt:now + t.left + add, at:now});
      if(a === "tmr-pause") await setTimer(rr, {...cur, left:t.left, endsAt:null, at:now});
      if(a === "tmr-resume") await setTimer(rr, {...cur, endsAt:now + t.left, left:null, at:now});
      break;
    }
    case "tmr-stop": { const rr = S.rooms.find(x=>x.id===b.dataset.id); if(rr) await setTimer(rr, null); break }
    case "edit-room": { S.modal = null; const rr = S.rooms.find(x=>x.id===b.dataset.id); S.form.create = formFromRoom(rr); saveFormsSoon(); S.tplNaming = false; S.view = "create"; scrollTo(0,0); break }
    case "dup": {
      const rr = S.rooms.find(x=>x.id===b.dataset.id), nr = await duplicateRoom(rr);
      if(nr) S.modal = {type:"dup", id:nr.id};
      break;
    }
    case "discard-form": dropForm("create"); toast("작성하던 내용을 지웠어요."); break;
    case "del-ask": S.modal = {type:"del", id:b.dataset.id}; break;
    case "del-room": {
      const id = b.dataset.id;
      const ok = await write(db => db.doc("rooms/"+id).delete(), () => { S.rooms = S.rooms.filter(x=>x.id!==id) });
      if(ok){ if(tnote({id}).id) await write(db => db.doc("tnotes/"+id).delete(), () => { S.tnotes = S.tnotes.filter(x=>x.id!==id) });
        S.modal = null; S.view = "home"; toast("삭제했어요.") }
      break;
    }
    case "modal-close": case "modal-bg": S.modal = null; break;
    case "modal-copy": { const tx = document.getElementById("modal-text"); tx?.select(); copyText(tx?.value||"", "복사했어요."); return }
    case "copy-link": {
      const kind = b.dataset.kind || "room", g = b.dataset.g || "", link = linkFor(kind, b.dataset.id, g);
      if(!link){ S.modal = {type:"share", next:{a:"copy-link", kind, id:b.dataset.id, g}}; break }
      copyText(link, kind === "course" ? "과목 링크를 복사했어요." : g ? "그룹 학생 링크를 복사했어요." : "학생 링크를 복사했어요."); return;
    }
    case "qr": { const kind = b.dataset.kind || "room", g = b.dataset.g || ""; S.modal = linkFor(kind, b.dataset.id, g) ? {type:"qr", kind, id:b.dataset.id, g} : {type:"share", next:{a:"qr", kind, id:b.dataset.id, g}}; break }
    case "save-share": {
      const v = (document.getElementById("share-url")?.value || "").trim();
      if(!/^https?:\/\//.test(v)){ toast("https:// 로 시작하는 공유 링크를 붙여 넣어 주세요."); return }
      const data = {shareUrl:v.split("#")[0], updatedAt:Date.now()};
      const ok = await write(db => db.doc("config/app").set(data), () => { S.config = S.config.filter(x=>x.id!=="app").concat({id:"app", ...data}) });
      if(ok){ const nx = S.modal?.next; S.modal = nx?.a === "qr" ? {type:"qr", kind:nx.kind||"room", id:nx.id, g:nx.g||""} : null; toast("학생 링크를 설정했어요."); if(nx?.a === "copy-link") copyText(linkFor(nx.kind||"room", nx.id, nx.g||""), "링크를 복사했어요.") }
      break;
    }
    case "preview": { const rr = S.rooms.find(x=>x.id===b.dataset.id); enterPreview(rr); break }
    case "preview-form": {
      const f = createForm(), data = roomFromForm(f);
      if(!data.prompt) data.prompt = "(논제를 아직 적지 않았어요)";
      enterPreview({id:"__preview", ...data, ...roomMeta(f), status:"open", open:true, createdAt:Date.now()});
      break;
    }
    case "preview-exit": exitPreview(); break;
    case "present": S.view = "present"; S.roomId = b.dataset.id; S.pmode = b.dataset.mode || S.pmode; if(b.dataset.mode === "thoughts") S.pidx = 0; scrollTo(0,0); break;
    case "present-exit": S.view = "room"; break;
    case "fullscreen": { try{ const q = document.documentElement.requestFullscreen?.(); q?.catch?.(()=>toast("이 화면에서는 전체 화면을 쓸 수 없어요.")) }catch(e){ toast("이 화면에서는 전체 화면을 쓸 수 없어요.") } return }
    case "pin": {
      const cur = pinList(r).map(x => x.id), had = cur.includes(b.dataset.id);
      const arr = had ? cur.filter(x => x !== b.dataset.id) : cur.concat(b.dataset.id);   // 넣은 순서가 발표 순서
      const ok = await write(db => db.doc("rooms/"+r.id).update({pins:arr}), () => { r.pins = arr });
      if(ok) toast(had ? "발표 목록에서 뺐어요." : `발표 목록 ${arr.length}번에 넣었어요. 발표 화면에서는 이름 없이 보여요.`);
      break;
    }
    case "open-student": { S.ttab = "students"; S.openPost = b.dataset.id; const pp = S.posts.find(x=>x.id===b.dataset.id); S.pexp = pp?.author; break }
    case "class-fb": {
      const key = "cfb:"+r.id, text = (F(key).text||"").trim();
      if(!text){ toast("피드백 내용을 써 주세요."); return }
      const ok = await addReply({roomId:r.id, postId:"_class", author:"선생님", kind:"class", text, createdAt:Date.now()});
      if(ok){ dropForm(key); toast("우리 반 전체에게 보냈어요.") }
      break;
    }
    case "save-tset": {
      const key = "tset:"+r.id, f = F(key);
      const roster = String(f.roster||"").split("\n").map(x=>x.trim()).filter(Boolean);
      const cs = Math.max(0, parseInt(f.classSize)||0);
      const ok1 = await write(db => db.doc("rooms/"+r.id).update({classSize:cs}), () => { r.classSize = cs });
      const ok2 = await saveTnote(r, {roster, memo:(f.memo||"").trim()});
      if(ok1 && ok2){ dropForm(key); toast("저장했어요.") }
      break;
    }
    case "export": S.modal = {type:"export", id:b.dataset.id}; break;
    case "tpl-save-open": S.tplNaming = true; break;
    case "tpl-cancel": S.tplNaming = false; break;
    case "tpl-save": {
      const name = (document.getElementById("tpl-name")?.value || "").trim();
      if(!name){ toast("템플릿 이름을 적어 주세요."); return }
      const {editId, prompt, title, context, intro, memo, goal, ...settings} = createForm();
      const id = "t-" + Date.now().toString(36), data = {name, settings:JSON.parse(JSON.stringify(settings)), createdAt:Date.now()};
      const ok = await write(db => db.doc("ttemplates/"+id).set(data), () => { S.ttemplates.push({id, ...data}) });
      if(ok){ S.tplNaming = false; toast("내 템플릿으로 저장했어요. 새 활동을 만들 때 불러올 수 있어요.") }
      break;
    }
    case "use-tpl": {
      const tp = S.ttemplates.find(x=>x.id===b.dataset.id), f = createForm();
      Object.assign(f, tp.settings); f.goal = (GOALS.find(g=>g.t.includes(f.template))||GOALS[0]).k; saveFormsSoon();
      toast(`‘${tp.name}’ 설정을 불러왔어요.`);
      break;
    }
    case "toggle": {
      const open = r.open === false;
      const ok = await write(db => db.doc("rooms/"+r.id).update({open}), () => { r.open = open });
      if(ok) toast(open ? "다시 열었어요." : "마감했어요.");
      break;
    }
    case "del": S.confirmDel = true; break;
    case "del-no": S.confirmDel = false; break;
    case "del-yes": {
      const id = r.id;
      const ok = await write(db => db.doc("rooms/"+id).delete(), () => { S.rooms = S.rooms.filter(x=>x.id!==id) });
      if(ok){ S.view = "home"; S.confirmDel = false; toast("삭제했어요.") }
      break;
    }
    case "goal": {
      const f = createForm(), g = GOALS.find(x => x.k === b.dataset.v);
      f.goal = g.k; if(!g.t.includes(f.template)) applyTemplate(g.t[0]); saveFormsSoon();
      break;
    }
    case "tpl": createForm(); applyTemplate(b.dataset.v); saveFormsSoon(); break;
    case "st-add": { const f = createForm(), n = f.nst || TEMPLATES[f.template].stances.length || 2; if(n < 4){ f["st"+n] = f["st"+n] || `입장 ${n+1}`; f.nst = n + 1 } saveFormsSoon(); break }
    case "st-del": { const f = createForm(), n = f.nst || TEMPLATES[f.template].stances.length || 2; if(n > 2){ f.nst = n - 1; delete f["st"+f.nst] } saveFormsSoon(); break }
    case "depth": { const cf = createForm(); applyDepth(NO_DEEP.includes(cf.template) && b.dataset.v === "deep" ? "normal" : b.dataset.v); saveFormsSoon(); break }

    /* ---- 질문이음 ---- */
    case "ask-edit": { const k = "ask:"+r.id, q = p.questions[0]; S.form[k] = {text:q.text, qtype:q.qtype||"", _edit:true}; break }
    case "ask-save": {
      const f = F("ask:"+r.id), text = (f.text||"").trim();
      if(!text){ toast("궁금한 것 하나를 질문으로 적어 볼까요?"); return }
      const qtype = fixedQtype(r) || f.qtype || "";
      const qs = [...(p?.questions || [])];
      if(qs.length) qs[0] = {...qs[0], text, qtype}; else qs.push({id:"q1", text, qtype, at:Date.now()});
      b.disabled = true;
      const ok = await savePost(r, {questions:qs, status:"submitted", submittedAt:p?.submittedAt||Date.now()});
      if(ok){ dropForm("ask:"+r.id); toast("질문을 보냈어요. 이제 친구의 질문을 이어받아 볼까요?"); goNext(r) } else b.disabled = false;
      break;
    }
    case "take": S.take = {pid:b.dataset.id, qid:b.dataset.q}; S.anim = true; break;
    case "take-cancel": S.take = null; break;
    case "answer-save": {
      const key = `ans:${b.dataset.id}:${b.dataset.q}`, f = F(key), text = (f.text||"").trim();
      if(!text){ toast("이 질문에 대한 내 생각을 한 문장 적어 볼까요?"); return }
      b.disabled = true;
      const ok = await addReply({roomId:r.id, postId:b.dataset.id, qid:b.dataset.q, author:meFor(r.id), kind:"answer", text, evidence:(f.evidence||"").trim(), createdAt:Date.now()});
      if(ok){ dropForm(key); S.take = null; toast("생각을 보냈어요. 질문을 만든 친구에게 전해져요."); goNext(r) } else b.disabled = false;
      break;
    }
    case "react": {
      S.step[r.id] = "back";                 // 다른 답에도 반응할 수 있도록 이 화면에 머문다
      const prev = p.reactions?.[b.dataset.id];
      const ok = await savePost(r, {reactions:{...(p.reactions||{}), [b.dataset.id]:{kind:b.dataset.v, note:prev?.note||"", at:Date.now()}}});
      if(ok && !prev) toast("표시했어요.");
      break;
    }
    case "react-note": {
      const id = b.dataset.id, text = (F("rn:"+id).text||"").trim();
      if(!text){ toast("한 줄만 적어 볼까요?"); return }
      const ok = await savePost(r, {reactions:{...(p.reactions||{}), [id]:{...(p.reactions?.[id]||{}), note:text, at:Date.now()}}});
      if(ok){ dropForm("rn:"+id); toast("덧붙였어요.") }
      break;
    }
    case "dev-open": F("dev:"+r.id)._open = true; break;
    case "dev-skip": { const ok = await savePost(r, {developSkipped:true}); if(ok){ dropForm("dev:"+r.id); goNext(r) } break }
    case "develop-save": {
      const f = F("dev:"+r.id), text = (f.text||"").trim();
      if(!text){ toast("새로 궁금해진 것을 질문으로 적어 볼까요?"); return }
      const qs = [...(p.questions||[])], last = qs[qs.length-1];
      qs.push({id:"q"+(qs.length+1), text, qtype:fixedQtype(r) || f.qtype || "", from:last?.id||"", at:Date.now()});
      b.disabled = true;
      const ok = await savePost(r, {questions:qs});
      if(ok){ dropForm("dev:"+r.id); toast("새 질문이 질문 카드 풀에 들어갔어요."); goNext(r) } else b.disabled = false;
      break;
    }
    case "create-save": case "draft-save": case "publish-draft": {
      const f = createForm(), data = roomFromForm(f), t = TEMPLATES[data.template], asDraft = a === "draft-save";
      const editR = f.editId ? S.rooms.find(x=>x.id===f.editId) : null, locked = editR && allPostsOf(editR.id).length > 0, isDraftR = !!editR && statusOf(editR) === "draft";
      const willNotify = !asDraft && (!editR || (a === "publish-draft" && statusOf(editR) === "draft")) && f.notify !== false && canPush() && !!courseOf(f.courseId || editR?.courseId);
      if(!data.prompt && data.template === "notes") data.prompt = NOTES_PROMPT;
      if(!data.prompt && !asDraft){ toast("주제나 질문을 적어 주세요."); document.getElementById("c-prompt")?.focus(); return }
      if(!asDraft && !locked && t.stances.length && data.stances.length < 2){ toast("입장 이름을 두 개 이상 적어 주세요."); return }
      if(data.template === "chat" && !asDraft && !data.persona?.name){ toast("대화 상대를 적어 주세요. 예: 고종"); document.getElementById("c-pname")?.focus(); return }
      if(!data.title) data.title = "제목 없는 활동";
      const now = Date.now(), meta = roomMeta(f);
      // 과목: 새 활동은 여러 과목을 고를 수 있다 → 과목마다 같은 활동을 하나씩 만든다(결과는 과목별로). 수정은 한 과목
      const lockedCid = locked && courseOf(editR?.courseId) ? editR.courseId : "";
      const sel = lockedCid ? [lockedCid] : courseSel(f), cids = sel.length ? sel : [""];
      // 수업·그룹 배포: 이미 있던 그룹 설정은 그대로, 응답이 있는 그룹은 빼지 않는다
      const asgFor = (cid, base) => {
        const prevA = base?.assign || {}, keepG = base ? allPostsOf(base.id).map(p => p.groupId).filter(g => g && prevA[g]) : [];
        const selG = cid ? [...new Set([...(f.groups||[]).filter(g => groupsOf(courseOf(cid)).some(x => x.id === g)), ...keepG])] : [];
        // 그룹별 공개: 바로 공개 / 공개 예약(그 시각까지 ‘시작 전’) · 그룹 마감
        const gsOf = g => { const pv = {...(prevA[g] || {status:"open"})};
          if(f["gsm:" + g] === undefined && f["gsd:" + g] === undefined) return pv;
          const at = f["gsm:" + g] === "at" && f["gsa:" + g] ? new Date(f["gsa:" + g]).getTime() : null, due = f["gsd:" + g] ? new Date(f["gsd:" + g]).getTime() : null;
          if(at && at > now){ pv.status = "ready"; pv.startAt = at } else { delete pv.startAt; if(pv.status !== "closed") pv.status = "open" }
          if(due) pv.dueAt = due; else delete pv.dueAt;
          return pv };
        const noAt = selG.find(g => f["gsm:" + g] === "at" && !f["gsa:" + g]);
        return {noAt, asg:{courseId:cid, assign:Object.fromEntries(selG.map(g => [g, gsOf(g)])), ...(cid && (!editR || isDraftR) ? {notify:f.notify !== false} : {})}};
      };
      for(const c of cids){ const {noAt} = asgFor(c, editR && c === cids[0] ? editR : null); if(noAt && !asDraft){ toast(`${courseOf(c)?.title || ""} · ${groupName(c, noAt)}의 공개 시각을 적어 주세요.`); return } }
      let id, doc, ok;
      if(editR && !isDraftR){
        id = editR.id;
        const {asg} = asgFor(cids[0], editR);
        // 학생 응답이 있으면 글자로 된 안내만 바꾼다 (구조는 그대로)
        doc = locked ? {title:data.title, prompt:data.prompt, context:data.context, ctxImgs:data.ctxImgs, subject:data.subject, unit:data.unit, year:data.year, ...(data.persona ? {persona:data.persona} : {}), ...(data.noteCfg ? {noteCfg:data.noteCfg} : {}), ...meta, ...asg, updatedAt:now}
                     : {...data, ...meta, ...asg, updatedAt:now};
        ok = await write(db => db.doc("rooms/"+id).update(doc), () => Object.assign(editR, doc));
        if(!ok) return;
        if((f.memo||"").trim() !== (tnote({id}).memo||"")) await saveTnote({id}, {memo:(f.memo||"").trim()});
        dropForm("create"); S.view = "room"; S.roomId = id; S.ttab = "overview"; S.pendingRoom = id; S.gsel = ""; S.gselRoom = id; S.asgAdd = false;
        const fresh = {...editR, id, ...doc};
        if(canPush()) schedSync(fresh);                                  // 고친 공개 시각에 맞춰 예약 알림도 바꾼다
        toast("변경사항을 저장했어요."); scrollTo(0,0); break;
      }
      if(asDraft){                                                       // 임시 저장: 한 활동에 고른 과목 목록만 기억해 둔다
        const {asg} = asgFor(cids[0], editR);
        id = editR ? editR.id : "r-" + now.toString(36);
        doc = {...data, ...meta, ...asg, draftCourses: sel.length > 1 ? sel : null, status:"draft", open:false, updatedAt:now, ...(editR ? {} : {createdAt:now})};
        ok = await write(db => editR ? db.doc("rooms/"+id).update(doc) : db.doc("rooms/"+id).set(doc), () => { if(editR) Object.assign(editR, doc); else S.rooms.push({id, ...doc}) });
        if(!ok) return;
        if((f.memo||"").trim() !== (tnote({id}).memo||"")) await saveTnote({id}, {memo:(f.memo||"").trim()});
        f.editId = id; saveFormsSoon(); toast("임시 저장했어요. ‘내 과목’의 작성 중에서 이어서 만들 수 있어요."); break;
      }
      // 공개: 첫 과목은 이 활동(작성 중이었다면 그것), 나머지 과목은 같은 내용으로 새 활동
      const made = [];
      for(let i = 0; i < cids.length; i++){
        const c = cids[i], base = i === 0 && editR ? editR : null, {asg} = asgFor(c, base);
        const rid = base ? base.id : "r-" + now.toString(36) + (i ? "-" + i : "");
        const d = base ? {...data, ...meta, ...asg, draftCourses:null, status:"open", open:true, updatedAt:now}
                       : {...data, ...meta, ...asg, status:"open", open:true, createdAt:now + i, updatedAt:now};
        const okR = await write(db => base ? db.doc("rooms/"+rid).update(d) : db.doc("rooms/"+rid).set(d), () => { if(base) Object.assign(base, d); else S.rooms.push({id:rid, ...d}) });
        if(!okR){ if(!made.length) return; break }
        if((f.memo||"").trim()) await saveTnote({id:rid}, {memo:(f.memo||"").trim()});
        made.push({...(base || {}), id:rid, ...d});
      }
      id = made[0].id;
      dropForm("create"); S.view = "room"; S.roomId = id; S.ttab = "overview"; S.pendingRoom = id; S.gsel = ""; S.gselRoom = id; S.asgAdd = false; scrollTo(0,0);
      const many = made.length > 1 ? ` 과목 ${made.length}개에 하나씩 만들었어요.` : "";
      if(willNotify){ render(); for(const m of made){ await notifyNewRoom(m) } if(many) setTimeout(() => toast("공개했어요." + many), 2600); return }
      if(canPush()) made.forEach(m => schedSync(m));
      toast((a === "publish-draft" ? "공개했어요." : "활동을 만들었어요.") + (many || " 학생 링크를 공유해 보세요."));
      break;
    }
    default: return;
  }
  render();
}

/* 마감·시작 시각이 지나는 순간 화면을 다시 그린다 (자동 마감) */
function dueKey(){
  const now = Date.now();
  return S.rooms.map(r => [r.dueAt && now >= r.dueAt ? r.id : "", ...asgIds(r).map(g => { const a = r.assign[g]; return (a.dueAt && now >= a.dueAt) || (a.startAt && now >= a.startAt) ? r.id + "/" + g : "" })].filter(Boolean).join(",")).join(";");
}
let DUE_KEY = "";                                     // 마지막으로 그린 화면의 마감 상태 (render()가 갱신)
setInterval(() => { if(dueKey() !== DUE_KEY){ render(); toast("시각이 되어 활동 상태가 바뀌었어요.") } }, 10000);
render();
init();
</script>
