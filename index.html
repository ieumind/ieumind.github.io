  if(!f.change){
    if(p?.revisit) return `<div class="card saved"><div class="lbl">수업 후 다시 생각하기</div><p class="txt">${esc(p.revisit)}</p></div>` + nextBtn(r);
    if(!open) return closedNote();
    const key = "rv:" + r.id, first = p?.initial ? firstThought(r, p) : null;
    return (first ? `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>` : "") + `<div class="card">${question(key,"text",{q:"수업을 듣고 나니 내 예측은 어땠나요?", rows:3, tip:"맞았는지보다, 무엇을 새로 알게 됐는지가 중요해요.", starters:[{show:"처음에는 ___라고 예측했는데, ___", ins:"처음에는 "}]})}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revisit">저장하기</button></div></div>`;
  }
  const first = firstThought(r, p), key = "chg:" + r.id, editing = S.form[key]?._edit;
  if(p?.change && !editing){
    return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div><div><div class="lbl">지금의 생각</div>${changeSaved(r,p.change)}</div></div>
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="change-edit">고치기</button>` : ""}` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({now:p?.change?.now||"", nowStance:p?.change?.nowStance||p?.stance||"", degree:p?.change?.degree||"", influences:p?.change?.influences||[], biggest:p?.change?.biggest||""}));
  return `<div class="compare"><div><div class="lbl">${first.label}</div>${first.html}</div></div>
    <p class="reassure">생각이 바뀌지 않아도 괜찮아요. 친구의 생각을 보고도 내 생각을 지킬 수 있어요.</p>
    <div class="card">
      <fieldset class="q"><legend>친구들의 생각을 본 뒤, 내 생각이 달라졌나요?</legend>${radios(key,"degree",DEGREE_CHOICES,{label:"생각의 변화"})}</fieldset>
      ${(r.stances||[]).length ? `<fieldset class="q"><legend>지금 내 입장은? <span class="opt">(처음과 같아도 괜찮아요)</span></legend>${radios(key,"nowStance",r.stances,{label:"지금 입장", colors:r.stances.length, icons:stanceIcons(r)})}</fieldset>` : ""}
      ${question(key,"now",{q:"지금 나는 어떻게 생각하나요?", rows:3, tip:"달라졌어도, 그대로여도 괜찮아요. 왜 그런지만 함께 적어 주세요.",
         starters:[{show:"처음에는 ___라고 생각했지만, 지금은 ___라고 생각한다.", ins:"처음에는 "},{show:"처음 생각과 크게 달라지지 않았다. 왜냐하면 ___ 때문이다.", ins:"처음 생각과 크게 달라지지 않았다. 왜냐하면 "},{show:"친구의 생각을 읽고 ___라는 점은 생각하지 못했다.", ins:"친구의 생각을 읽고 "}]})}
      ${f.deep ? `<details class="help" style="margin-top:14px"><summary>${ic("plus", "sm")} 더 생각해 보기 (선택)</summary><div style="display:grid;gap:14px;margin-top:6px">
         ${question(key,"biggest",{q:"생각에 가장 영향을 준 것은 무엇인가요?", opt:true, rows:2, tip:"친구의 글, 자료, 선생님 말씀 중 하나를 떠올려 보세요.", starters:[{show:"친구의 글을 읽고 ___을 알게 되었다.", ins:"친구의 글을 읽고 "}]})}
         <fieldset class="q"><legend>영향을 준 것 고르기 <span class="opt">(선택)</span></legend>${checks(key,"influences",INFLUENCES,{label:"영향을 준 것"})}</fieldset></div></details>` : ""}
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-change">지금의 생각 남기기</button></div></div>`;
}

/* ---- 다시 생각하기 · 글 다시 쓰기 ---- */
function receivedSummary(r, p){
  const ps = postsOf(r.id);
  const show = repliesOf(p.id).filter(x => x.kind==="teacher" || x.kind==="rebuttal" || x.kind==="note" || x.kind==="comment");
  if(!show.length) return `<p class="muted small">아직 받은 답이나 피드백이 없어요.</p>`;
  return `<div class="replies">${show.map(x=>replyHTML(r,x,ps)).join("")}</div>`;
}
function stepRevise(r, p, open){
  const key = "rev:" + r.id, editing = S.form[key]?._edit;
  if(isEssay(r) && p?.essay){
    if(p.revision?.essay && !editing){
      return `<div class="card"><h3>고쳐 쓴 글</h3><p class="txt">${esc(p.revision.essay)}</p>
        ${(p.revision.edits||[]).length ? `<p style="margin-top:8px">${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
        ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
        <details class="card"><summary>처음 쓴 글 보기</summary><p class="txt" style="margin-top:10px">${esc(p.essay.text)}</p></details>` + nextBtn(r);
    }
    if(!open) return closedNote();
    F(key, () => ({essay:p.revision?.essay || p.essay.text, edits:p.revision?.edits || []}));
    return `<div class="compare"><div><div class="lbl">받은 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
      <div class="card"><div class="q"><label for="${key}-essay">글 고쳐 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요</span></label>${ta(key,"essay",{rows:12, rich:true})}</div>
        <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
        <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">고친 글 저장</button></div></div>`;
  }
  if(p?.revision && !editing){
    return `<div class="card"><h3>다시 쓴 글</h3>${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}
      ${(p.revision.edits||[]).length ? `<p>${p.revision.edits.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</p>` : ""}
      ${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="revise-edit">다시 고치기</button>` : ""}</div>
      <details class="card"><summary>처음 글 보기</summary><div style="margin-top:10px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></details>` + nextBtn(r);
  }
  if(!open) return closedNote();
  F(key, () => ({...(p?.revision?.body || p?.body || {}), edits:p?.revision?.edits || []}));
  let form = "";
  for(const x of effFields(r)){
    const s = sField(r, x);
    form += question(key, x.k, {q:s.q, rows:3, tip:s.tip, starters:[]});
  }
  return `<div class="compare">
      <div><div class="lbl">처음 글</div><div style="margin-top:6px">${fieldsHTML(r,p.body,{evidenceType:p.evidenceType})}</div></div>
      <div><div class="lbl">받은 답과 피드백</div><div style="margin-top:6px">${receivedSummary(r,p)}</div></div></div>
    <div class="card"><h3>다시 쓰기 <span class="opt">· 처음 글이 미리 들어 있어요. 고치고 싶은 곳만 고치세요.</span></h3>${form}
      <fieldset class="q"><legend>무엇을 고쳤나요? <span class="opt">(선택)</span></legend>${checks(key,"edits",EDITS,{label:"고친 부분"})}</fieldset>
      <div class="foot"><span></span><button class="btn pri" type="button" data-a="save-revise">다시 쓴 글 저장</button></div></div>`;
}

/* ---- 결과 화면: 나의 생각 흐름 (입력 없음, 자동 정리) ---- */
function thinkFlow(r, p){
  if(isRelay(r)) return relayFlow(r, p);
  const teacher = isTeacher(), reps = repliesOf(p.id), ps = postsOf(r.id), b = p.body || {}, fields = effFields(r);
  const L = (s, t) => teacher ? t : s;
  const node = (nm, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic(nm)}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  if(p.chat?.log?.length) h += node("masks-theater", `${stepMeta(r,"chat").s} (질문 ${p.chat.log.filter(x=>x.role==="user").length}개)`, `<details class="chatfold"><summary class="muted small">대화 펼쳐 보기</summary>${chatLogHTML(r, p.chat.log)}</details>`);
  if(p.initial) h += node(p.initial.predict ? "crystal-ball" : "bubble", p.initial.predict ? "내 예측" : "처음 생각", `<div class="v">${initialHTML(r,p.initial)}</div>`);
  // 내가 말한 생각 + 이유
  if(fields.some(x=>x.k==="claim")){
    h += node("pencil", L((r.stances||[]).length ? "처음 입장 · 내 생각" : "내가 말한 생각","주장"), `<div class="v">${p.stance?stanceChip(r,p.stance)+" ":""}${esc(b.claim||"")}</div>`);
    if(b.reason) h += node("books", L("내가 든 이유","근거"), `<div class="v">${p.evidenceType?`<span class="chip">${esc(p.evidenceType)}</span> `:""}${esc(b.reason)}</div>${b.warrant?`<div class="sub"><span class="muted">${L("도움이 되는 까닭","근거 설명")} · </span>${esc(b.warrant)}</div>`:""}`);
    const rest = fields.filter(x => !["claim","reason","warrant"].includes(x.k) && b[x.k]);
    if(rest.length) h += node("notes", L("그 밖에 쓴 내용","기타 서술"), rest.map(x=>`<div class="sub"><span class="muted">${esc(fieldLabel(r,x))} · </span>${esc(b[x.k])}</div>`).join(""));
  }else{
    h += node("pencil", L("내가 말한 생각","작성한 글"), `<div class="v">${fieldsHTML(r, b, {evidenceType:p.evidenceType})}</div>`);
  }
  if(p.deeper && (p.deeper.other || p.deeper.source)) h += node("search", L("더 깊이 생각한 것","심화(다른 관점·자료)"), `${p.deeper.other?`<div class="sub"><span class="muted">다른 관점 · </span>${esc(p.deeper.other)}</div>`:""}${p.deeper.source?`<div class="sub"><span class="muted">자료 · </span>${esc(p.deeper.source)}</div>`:""}`);
  if(p.essay?.text) h += node("file-text", L("내가 쓴 글","작성한 글"), `<div class="v">${esc(p.essay.text)}</div>`);
  if(p.counter) h += node("arrows-exchange", L("나와 다른 생각 예상","예상 반론"), `<div class="v">${esc(p.counter.objection)}</div>${p.counter.response?`<div class="sub"><span class="muted">${L("내 대답","재반박")} · </span>${esc(p.counter.response)}</div>`:""}`);
  // 만난 다른 생각
  const diff = p.meet?.diffPostId && ps.find(x=>x.id===p.meet.diffPostId);
  const myReplies = S.replies.filter(x=>x.roomId===r.id && x.author===p.author && (x.kind==="rebuttal"||x.kind==="comment"));
  const meetAns = MISSIONS.filter(m => p.meet?.answers?.[m.k] && !(m.k==="reply" && myReplies.length));
  if(diff || meetAns.length){
    h += node("users", L("친구의 생각","친구 글 읽기"),
      (diff ? `<div class="v"><span class="muted small">내가 고른 생각 · ${esc(displayName(r,diff.author,ps))}</span><p class="quote" style="margin-top:4px">${esc(previewText(r,diff))}</p></div>` : "") +
      meetAns.map(m=>`<div class="sub"><span class="muted">${esc(m.q)} · </span>${esc(p.meet.answers[m.k])}</div>`).join(""));
  }
  // 내가 한 답
  if(myReplies.length) h += node("bulb", L("친구 생각을 읽고 내가 발견한 점","작성한 반박·댓글"), `<div class="sub muted">${myReplies.length}개</div><div class="replies">${replyHTML(r,myReplies[myReplies.length-1],ps)}</div>`);
  // 받은 반응과 피드백
  const got = reps.filter(x=>x.kind==="rebuttal"||x.kind==="comment"||x.kind==="note");
  if(got.length) h += node("message-circle", L("친구들이 남긴 답","받은 반박·댓글"), `<div class="sub muted">${got.length}개</div><div class="replies">${got.slice(-2).map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  const fb = reps.filter(x=>x.kind==="teacher");
  if(fb.length) h += node("chalkboard-teacher", L("나에게 온 선생님 피드백","개인 피드백"), `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  // 지금의 생각
  if(p.revision?.essay) h += node("refresh", L("고쳐 쓴 글","최종 수정본"), `<div class="v">${esc(p.revision.essay)}</div>`, true);
  else if(p.revision) h += node("refresh", L("지금의 생각 · 다시 쓴 글","최종 수정본"), `<div class="v">${fieldsHTML(r,p.revision.body,{evidenceType:p.evidenceType})}</div>${p.change?`<div class="sub"><span class="chip">${esc(DEGREES.find(d=>d.k===p.change.degree)?.l||"")}</span> ${esc(p.change.biggest||"")}</div>`:""}`, true);
  else if(p.change) h += node("refresh", L("지금의 생각","생각의 변화"), `${p.stance && p.change.nowStance ? `<div class="sub">처음에는 ${stanceChip(r,p.stance)} → 지금은 ${stanceChip(r,p.change.nowStance)}${p.stance===p.change.nowStance ? ' <span class="muted">· 입장은 그대로, 생각은 더 깊어졌어요</span>' : ' <span class="muted">· 생각이 달라졌어요</span>'}</div>` : ""}<div class="v">${changeSaved(r,p.change)}</div>`, true);
  else if(p.revisit) h += node("refresh", L("수업 후의 생각","수업 후 다시 생각하기"), `<div class="v">${esc(p.revisit)}</div>`, true);
  return h + `</ol>`;
}
function stepRecord(r, p){
  if(!submitted(p)) return `<div class="empty">글을 내면 나의 생각 흐름이 여기에 정리돼요.</div>`;
  let h = `<div class="card"><div class="flow-h"><h3>${ic("compass")} 나의 생각 흐름</h3><p class="muted small">${esc(TEMPLATES[r.template]?.flowSummary || "처음 생각 → 친구의 생각 → 지금의 생각")}</p></div>${thinkFlow(r,p)}</div>`;
  // 빠른 활동: 만남 단계가 없어도 친구 글은 둘러볼 수 있다
  if(!featuresOf(r).meet && r.reveal !== "teacher"){
    const ps = postsOf(r.id), others = ps.filter(x=>!isMe(x.author));
    if(others.length) h += `<details class="card"><summary>친구들 생각 둘러보기 (${others.length}편)</summary><div style="margin-top:12px">${groupedPosts(r, others, x => readCard(r, x, p, ps, {pickable:false}))}</div></details>`;
  }
  return h + `<div class="row end"><button class="btn" type="button" data-a="mine">내 생각 기록 전체 보기</button></div>`;
}

/* ---- 질문으로 생각하기 · 질문 보기 ---- */
function stepSee(r, p, open){
  const q = QTYPES[r.qtype];
  return `<div class="card"><div class="eyebrow">${ic("search", "sm")} 오늘의 질문</div><p class="qline" style="font-size:20px;margin-top:6px">${esc(r.prompt)}</p>
    ${q ? `<p class="row" style="margin-top:10px">${qtypeChip(r.qtype)}<span class="muted small">${esc(q.d)}</span></p>` : ""}
    <div style="margin-top:10px">${qtypeHelp()}</div>
    <div class="foot"><span></span><button class="btn pri" type="button" data-a="see-done">내 생각 쓰러 가기</button></div></div>`;
}
/* ---- 논술 · 글쓰기 ---- */
const essayKey = r => "essay:" + r.id;
function essayStatusHTML(r){
  const t = F(essayKey(r)).text || "", n = cnt(t), min = r.minChars || 0, ok = t.trim() && n >= min;
  const pct = min ? Math.min(100, n/min*100) : 100;
  return `<div class="status ${ok?"ok":""}" id="estatus" aria-live="polite"><span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>
    ${min ? `<span class="mono small">${n} / 최소 ${min}자</span>` : ""}<span>${ok ? `${ic("check", "sm")} 보낼 수 있어요.` : "정리한 생각과 근거를 이어서 써 보세요."}</span></div>`;
}
function stepCompose(r, p, open){
  const editing = S.form[essayKey(r)]?._edit;
  if(p?.essay?.text && !editing){
    return `<div class="card"><h3>내가 쓴 글</h3><p class="txt">${esc(p.essay.text)}</p>
      ${open && S.canWrite && !p.revision ? `<button class="linkbtn" type="button" data-a="essay-edit">고치기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  const key = essayKey(r), b = p?.body || {};
  F(key, () => ({text:p?.essay?.text || ""}));
  const outline = effFields(r).map(x => b[x.k] ? `${b[x.k]}` : "").filter(Boolean).join("\n\n");
  return `<details class="card" open><summary style="cursor:pointer;font-weight:600">내가 정리한 생각과 근거</summary><div style="margin-top:10px">${fieldsHTML(r, b, {evidenceType:p?.evidenceType})}</div></details>
    <div class="card"><div class="q"><label for="${key}-text">한 편의 글로 써 보세요</label>
      ${helpBox(`${key}-text`, "처음–가운데–끝으로 나누면 쉬워요. 정리한 내용을 불러와서 다듬어도 돼요.", [{show:"정리한 내용 불러오기", ins:outline},{show:"나는 ___라고 생각한다. 그 이유는 첫째, …", ins:"나는 "}])}
      ${ta(key,"text",{rows:12, rich:true})}</div>
      <div class="foot">${essayStatusHTML(r)}<button class="btn pri" type="button" data-a="essay-save">글 보내기</button></div></div>`;
}
/* ---- 논술 · 피드백 보기 ---- */
function stepFeedback(r, p, open){
  const fb = repliesOf(p.id).filter(x => x.kind==="teacher"), ps = postsOf(r.id);
  if(fb.length) return `<div class="card"><h3>선생님 피드백</h3><div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div></div>` + nextBtn(r);
  return `<div class="empty">선생님이 글을 읽고 있어요. 피드백이 오면 여기에 보여요.</div>
    ${p.feedbackSkipped ? nextBtn(r) : (open && S.canWrite ? `<div class="next"><button class="btn" type="button" data-a="fb-skip">피드백 없이 다음으로 ${ic("arrow-right")}</button></div>` : "")}`;
}

/* =========================================================
   질문이음 — 정해진 순서 없이 '질문 카드 풀'에서 원하는 질문을 이어받는다
   질문: posts 문서의 questions[] · 이어받은 생각: replies(kind "answer", qid) · 질문자의 반응: posts.reactions
   ========================================================= */
const RELAY_REACT = [
  {k:"curious", ic:"bulb", l:"더 궁금해졌어요"},
  {k:"changed", ic:"refresh", l:"생각이 달라졌어요"},
  {k:"newidea", ic:"sparkles", l:"새로운 생각을 얻었어요"}
];
const ASK_HELP = {tip:"‘왜’, ‘만약’, ‘어떻게’로 시작하면 질문이 잘 떠올라요.",
  starters:[{show:"왜 ___였을까?", ins:"왜 "},{show:"만약 ___였다면 어떻게 되었을까?", ins:"만약 "},{show:"어떻게 ___할 수 있었을까?", ins:"어떻게 "}]};
const fixedQtype = r => QTYPES[r.qtype] ? r.qtype : "";
const answersTo = (p, q) => S.replies.filter(x => x.kind==="answer" && x.postId===p.id && x.qid===q.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function relayPool(r){
  const out = [];
  postsOf(r.id).forEach(p => (p.questions||[]).forEach(q => out.push({p, q, answers:answersTo(p,q)})));
  return out;
}
function relayCard(r, it, ps, {action=false}={}){
  const mine = it.answers.some(a => isMe(a.author));
  return `<article class="qcard"><div class="eyebrow">${ic("search", "sm")} 질문${it.q.from ? " · 이어진 질문" : ""}</div>
    <p class="qt">“${esc(it.q.text)}”</p>
    <div class="meta">${qtypeChip(it.q.qtype)}<span>만든 친구: ${esc(displayName(r, it.p.author, ps))}</span><span>답 ${it.answers.length}개</span></div>
    ${action ? (mine ? `<p class="small" style="color:var(--accent);font-weight:600">${ic("check", "sm")} 내가 이어받은 질문</p>`
                     : `<button class="btn pri" type="button" data-a="take" data-id="${esc(it.p.id)}" data-q="${esc(it.q.id)}">이 질문 이어받기</button>`) : ""}</article>`;
}
function qtypeField(r, key){
  if(fixedQtype(r)) return `<p class="small">이번에는 ${qtypeChip(r.qtype)}을 만들어요. <span class="muted">${esc(QTYPES[r.qtype].d)}</span></p>`;
  return `<fieldset class="q"><legend>어떤 질문인가요? <span class="opt">(선택)</span></legend>
    ${radios(key,"qtype",Object.entries(QTYPES).map(([k,v])=>({k, l:v.short, ic:v.mark})),{label:"질문 유형"})}${qtypeHelp("내 질문 점검하기")}</fieldset>`;
}
/* ① 질문 만들기: 입력창 하나 */
function stepAsk(r, p, open){
  const qs = p?.questions || [], key = "ask:" + r.id, ps = postsOf(r.id);
  if(qs.length && !S.form[key]?._edit){
    const it = {p, q:qs[0], answers:answersTo(p, qs[0])};
    return relayCard(r, it, ps) + (open && S.canWrite && !it.answers.length ? `<button class="linkbtn" type="button" data-a="ask-edit">질문 고치기</button>` : "") + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:qs[0]?.text||"", qtype:qs[0]?.qtype||""}));
  return `<div class="card">
    ${question(key,"text",{q:"어떤 질문이 떠올랐나요?", rows:2, ph:"질문을 입력하세요", ...ASK_HELP})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><span class="muted small">질문을 보내면 친구들이 이어받아 답해요.</span>
      <button class="btn pri" type="button" data-a="ask-save">질문 보내기</button></div></div>`;
}
/* ② 질문 이어받기: 카드 풀에서 골라 답하기 */
function stepTake(r, p, open){
  const ps = postsOf(r.id), pool = relayPool(r).filter(it => !isMe(it.p.author));
  const sel = S.take && pool.find(it => it.p.id===S.take.pid && it.q.id===S.take.qid);
  const myAns = myRepliesIn(r, ["answer"]);
  if(sel && open && S.canWrite){
    const key = `ans:${sel.p.id}:${sel.q.id}`;
    return relayCard(r, sel, ps) + `<div class="card">
      ${question(key,"text",{q:"이 질문에 대한 내 생각은?", rows:2, tip:"정답을 맞히는 게 아니에요. 지금 떠오르는 생각을 적어 보세요.", starters:[{show:"나는 ___라고 생각한다.", ins:"나는 "},{show:"잘 모르겠지만 ___일 것 같다.", ins:"잘 모르겠지만 "}]})}
      ${question(key,"evidence",{q:"왜 그렇게 생각하나요?", opt:true, rows:2, tip:"수업 내용, 자료, 내 경험 중 하나를 떠올려 보세요.", starters:[{show:"왜냐하면 ___ 때문이다.", ins:"왜냐하면 "}]})}
      <div class="foot"><button class="linkbtn" type="button" data-a="take-cancel">다른 질문 고르기</button>
        <button class="btn pri" type="button" data-a="answer-save" data-id="${esc(sel.p.id)}" data-q="${esc(sel.q.id)}">내 생각 보내기</button></div></div>`;
  }
  // 아직 내가 답하지 않은 질문, 답이 적은 질문이 앞으로
  const rank = it => (it.answers.some(a=>isMe(a.author)) ? 1000 : 0) + it.answers.length;
  const sorted = [...pool].sort((a,b) => rank(a)-rank(b) || (a.q.at||0)-(b.q.at||0));
  let h = `<div class="card"><p><b>친구의 질문 하나를 골라 이어받아 보세요.</b></p>
    <p class="muted small" style="margin-top:4px">답이 적은 질문이 앞에 있어요.${myAns.length ? ` · 지금까지 ${myAns.length}개 이어받았어요.` : ""}</p></div>`;
  if(!sorted.length) h += `<div class="empty">아직 친구들이 만든 질문이 없어요. 잠시 뒤 다시 와 보세요.</div>`;
  else h += `<div class="qgrid">${sorted.map(it => relayCard(r, it, ps, {action: open && S.canWrite})).join("")}</div>`;
  if(myAns.length) h += nextBtn(r);
  return h;
}
/* ③ 내 질문으로 돌아가기: 친구의 생각 → 나의 생각(반응) */
function stepBack(r, p, open){
  const ps = postsOf(r.id), qs = p?.questions || [], can = open && S.canWrite;
  const items = qs.map(q => ({q, answers:answersTo(p,q)})).filter(x => x.answers.length);
  if(!items.length){
    return `<div class="empty">아직 내 질문에 답한 친구가 없어요. 조금만 기다려 주세요.
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" type="button" data-a="step" data-v="take">그동안 다른 질문 이어받기</button></div></div>`;
  }
  let h = "";
  for(const {q, answers} of items){
    h += `<div class="card"><ol class="flow">

/* ④ 질문 키우기: 새 질문은 다시 카드 풀로 */
function stepDevelop(r, p, open){
  const qs = p?.questions || [], ps = postsOf(r.id), last = qs[qs.length-1], key = "dev:" + r.id;
  if(qs.length > 1){
    return qs.slice(1).map(q => relayCard(r, {p, q, answers:answersTo(p,q)}, ps)).join("") + nextBtn(r);
  }
  if(p?.developSkipped && !S.form[key]?._open){
    return `<div class="card"><p class="muted">이번에는 질문 키우기를 넘어갔어요.</p>${open && S.canWrite ? `<button class="linkbtn" type="button" data-a="dev-open">그래도 질문 키워 보기</button>` : ""}</div>` + nextBtn(r);
  }
  if(!open) return closedNote();
  if(!S.canWrite) return readonlyNote();
  F(key, () => ({text:"", qtype:last?.qtype||""}));
  return `<div class="card">
    <div class="q"><span class="hint">처음 질문</span><p class="quote">${esc(last?.text||"")}</p></div>
    ${question(key,"text",{q:"친구의 생각을 보고 새로 궁금해진 것은?", rows:2, ph:"새 질문을 입력하세요", tip:"처음 질문을 더 깊게, 또는 더 넓게 바꿔 보세요.",
       starters:[{show:"그렇다면 ___는 어떨까?", ins:"그렇다면 "},{show:"왜 ___일까?", ins:"왜 "},{show:"만약 ___라면?", ins:"만약 "}]})}
    <div style="margin-top:14px">${qtypeField(r, key)}</div>
    <div class="foot"><button class="linkbtn" type="button" data-a="dev-skip">이번엔 넘어가기</button>
      <button class="btn pri" type="button" data-a="develop-save">새 질문 보내기</button></div></div>`;
}
/* 질문이음의 생각 흐름: 질문 씨앗 → 친구의 생각 → 나의 생각 → 새로운 질문 */
function relayFlow(r, p){
  const ps = postsOf(r.id), qs = p.questions || [], teacher = isTeacher();
  const node = (nm, k, v, final=false) => `<li class="${final?"final":""}"><span class="ic" aria-hidden="true">${ic(nm)}</span><div style="min-width:0"><div class="k">${esc(k)}</div>${v}</div></li>`;
  let h = `<ol class="flow">`;
  qs.forEach((q, i) => {
    h += node(i ? "leaf" : "plant-2", i ? "새롭게 생긴 질문" : "내가 만든 질문", `<p class="qline">“${esc(q.text)}”</p>${qtypeChip(q.qtype)}`, i>0 && i===qs.length-1);
    const ans = answersTo(p, q);
    if(ans.length) h += node("user", "친구의 생각", ans.map(a => `<div class="sub"><b>${esc(displayName(r,a.author,ps))}</b> · ${esc(a.text)}${a.evidence?` <span class="muted">(${esc(a.evidence)})</span>`:""}</div>`).join(""));
    const re = ans.filter(a => p.reactions?.[a.id]);
    if(re.length) h += node("bulb", "내가 발견한 점", re.map(a => { const x = p.reactions[a.id]; return `<div class="sub">${esc(RELAY_REACT.find(k=>k.k===x.kind)?.l||"")}${x.note?` · ${esc(x.note)}`:""}</div>` }).join(""));
  });
  const taken = S.replies.filter(x => x.roomId===r.id && x.kind==="answer" && x.author===p.author);
  if(taken.length) h += node("link", teacher ? "이어받아 답한 질문" : "내가 이어받은 질문", taken.map(a => {
    const owner = ps.find(x=>x.id===a.postId), q = owner?.questions?.find(y=>y.id===a.qid);
    return `<div class="sub"><span class="muted">“${esc(q?.text||"")}” → </span>${esc(a.text)}</div>`;
  }).join(""));
  const fb = repliesOf(p.id).filter(x=>x.kind==="teacher");
  if(fb.length) h += node("chalkboard-teacher", "선생님 피드백", `<div class="replies">${fb.map(x=>replyHTML(r,x,ps)).join("")}</div>`);
  return h + `</ol>`;
}

/* 향후 사고 보조(AI) 자리: 각 단계의 question() 옆 도움말(helpBox)에 '생각을 더 깊게 해 볼 질문' 같은

function barRow(label, n, total){
  const pct = total ? Math.round(n/total*100) : 0;

/* 참여 통계: 활동에 실제로 있는 단계만 센다 */
/* 이 활동을 해야 하는 학생(이름표): 과목에 수강 학생이 정해져 있으면 그 학생만, 그룹을 고르면 그 그룹 학생만 */
function courseRoster(r, gid = ""){
  const c = courseOf(r.courseId);
  if(S.mode !== "supa" || !c || !Array.isArray(c.members)) return null;            // 수강 학생을 정하지 않았으면 예전 방식
  if(S.roster === undefined){ if(!S.rosterLoading){ S.rosterLoading = true; loadRoster().then(() => { S.rosterLoading = false; render() }) } return [] }
  let ids = new Set(c.members);
  const gm = g => groupsOf(c).find(x => x.id === g)?.members, ag = asgIds(r);
  if(gid && Array.isArray(gm(gid))) ids = new Set(gm(gid));
  else if(!gid && ag.length && ag.every(g => Array.isArray(gm(g)))) ids = new Set(ag.flatMap(g => gm(g)));   // 일부 그룹에만 배포한 활동
  return (S.roster || []).filter(x => ids.has(x.id)).map(rosterLabel);
}
/* 👀 조회 기록: 학생이 활동을 열면 room_view()로 한 번 남기고, 선생님은 room_viewers()로 본다 (30초마다 새로) */
const VIEWED = new Set();
function markViewed(r){
  if(S.mode !== "supa" || S.demo || S.preview || isTeacher() || !S.name || !SB || VIEWED.has(r.id)) return;
  VIEWED.add(r.id); rpcSafe("room_view", {p_room:r.id});
}
const viewsOn = () => S.demo || (S.mode === "supa" && !!SB);
function viewersOf(r){                                                   // 이름표 → {first, last, n}
  const m = new Map();
  if(S.demo){ (S.demoViews?.[r.id] || []).forEach(v => m.set(v.who, {first:v.at, last:v.at, n:1})); return m }
  if(S.mode !== "supa" || !SB) return m;
  S.views = S.views || {};
  const c = S.views[r.id];
  if(!c?.loading && (!c || Date.now() - c.at > 30000)){
    S.views[r.id] = {list:c?.list || [], at:c?.at || 0, loading:true};
    rpcSafe("room_viewers", {p_room:r.id}).then(res => { S.views[r.id] = {list:Array.isArray(res?.data) ? res.data : (c?.list || []), at:Date.now()}; if(S.view === "room" && S.roomId === r.id) render() });
  }
  if(S.roster === undefined && !S.rosterLoading){ S.rosterLoading = true; loadRoster().then(() => { S.rosterLoading = false; render() }) }
  const byId = new Map((S.roster || []).map(x => [x.id, rosterLabel(x)]));
  (S.views[r.id]?.list || []).forEach(v => { const n = byId.get(v.student_id); if(n) m.set(n, {first:Date.parse(v.first_at), last:Date.parse(v.last_at), n:v.n}) });
  return m;
}
function teacherStats(r){
  const gs = S.gsel && S.gselRoom === r.id;                       // 그룹별 보기: 활동 전체 명단·학생 수는 쓰지 않는다
  const cr = courseRoster(r, gs ? S.gsel : "");
  const all = allPostsOf(r.id), sub = all.filter(submitted), roster = cr || (gs ? [] : (tnote(r).roster || []));
  const total = cr ? cr.length : gs ? 0 : (roster.length || Number(r.classSize) || 0);
  const steps = stepsOf(r);
  const complete = all.filter(p => steps.every(st => stepDone(r,p,st)));
  const st = {all, sub, total, roster, complete:complete.length, participants:all.length,
    inProgress: all.length - complete.length, notJoined: total ? Math.max(0, total - all.length) : null};
  if(steps.includes("reflect")) st.reflected = all.filter(p => stepDone(r,p,"reflect")).length;
  if(steps.includes("revise")) st.revised = all.filter(p => p.revision).length;
  return st;
}
/* 학생 한 명의 진행 상태 */
function progressOf(r, p){
  if(!p) return {label:"미참여", cls:"none", pct:0, cur:""};
  const steps = stepsOf(r), done = steps.filter(st => stepDone(r,p,st)).length;
  if(done === steps.length) return {label:"완료", cls:"done", pct:100, cur:""};
  const cur = steps.find(st => !stepDone(r,p,st));
  const i = steps.indexOf(cur);
  return {label: !submitted(p) ? `첫 응답 작성 중 · ${STEP[cur].t}` : `${i+1}단계 진행 중 · ${STEP[cur].t}`, cls:"", pct:Math.round(done/steps.length*100), cur};
}

      <div class="q wide"><label for="${key}-memo" style="font-size:15px">${ic("notes", "sm")} 교사용 메모 <span class="opt">(학생에게 보이지 않아요)</span></label>${ta(key,"memo",{rows:2, ph:"예: 다음 시간 토론 전에 활용"})}</div></div>
      <div class="row end" style="margin-top:10px"><button class="btn pri" type="button" data-a="save-tset">저장</button></div></section>
    <section class="card"><h3>결과 내보내기</h3><p class="muted small">전체 결과, 학생별 진행 현황, 학생 생각만, 생각 변화만, 피드백 기록 중에서 골라 CSV(엑셀에서 열림)로 받아요. 이 활동에 있는 항목만 들어가요.</p>
      <div class="row" style="margin-top:8px"><button class="btn" type="button" data-a="export" data-id="${esc(r.id)}">${ic("download")} 결과 내보내기 (CSV)…</button></div></section>
    <section class="card"><h3>활동 정리</h3><p class="muted small">보관하면 학생 목록에서 사라지지만 데이터는 그대로 남아요. 다시 꺼낼 수 있어요.</p>
      <div class="row" style="margin-top:8px">${statusOf(r)==="archived" ? statusButtons(r) : `<button class="btn" type="button" data-a="status" data-id="${esc(r.id)}" data-v="archived">${ic("archive")} 보관하기</button>`}
        <button class="btn danger" type="button" data-a="del-ask" data-id="${esc(r.id)}">삭제…</button></div>
      <p class="muted small" style="margin-top:6px">학생 응답 ${st.all.length}개 · 댓글·답 ${n - st.all.length}개</p></section>`;
}
/* ---- 수업에서 함께 보기 (프로젝터용): 입장 분포 · 학생 생각(발표 목록) · 생각 변화 · 질문 · 랜덤 ---- */
function presentThought(r, p){ return p.change?.now || p.revision?.essay || p.essay?.text || (isRelay(r) ? (p.questions||[])[0]?.text : "") || finalBody(p).claim || previewText(r,p) }
function presentModes(r, sub){
  const hasSt = (r.stances||[]).length > 0, pins = pinList(r).filter(p => submitted(p));
  const m = [];
  if(hasSt) m.push(["stance","입장 분포"]);
  m.push(["thoughts", pins.length ? `학생 생각 · 발표 목록 ${pins.length}` : "학생 생각"]);
  if(presentQs(r).length > 1){ m.push(["byq","질문별로 보기"]); m.push(["bys","학생별로 보기"]) }     // 단계별 질문이 여러 개일 때
  if(sub.some(p => p.change)) m.push(["change","생각 변화"]);
  if(isRelay(r) && sub.some(p => (p.questions||[]).length)) m.push(["questions","질문"]);
  m.push(["random","랜덤 학생 생각"]);
  return m;
}
/* 함께 보기에서 쓸 질문들 (단계별 질문) · 학생은 늘 ‘익명 n’으로 (먼저 쓴 순서대로 번호) */
const presentQs = r => isRelay(r) || isNotes(r) ? [] : effFields(r).filter(x => x.k !== "drawing");
function pagerHTML(i, pages, label){
  return pages > 1 ? `<div class="pnav"><button class="btn" type="button" data-a="pnav" data-v="-1" ${i ? "" : "disabled"}>${ic("arrow-left")} 이전</button><span class="mono">${label}</span><button class="btn pri" type="button" data-a="pnav" data-v="1" ${i < pages - 1 ? "" : "disabled"}>다음 →</button></div>
    <p class="muted small" style="text-align:center">키보드 화살표 키로도 넘길 수 있어요.</p>` : "";
}
function viewPresent(r){
  const sub = postsOf(r.id), n = sub.length, hasSt = (r.stances||[]).length > 0;
  const modes = presentModes(r, sub);
  let mode = S.pmode; if(!modes.some(x => x[0] === mode)) mode = hasSt ? "stance" : "thoughts";
  const order = [...allPostsOf(r.id)].sort((a, b) => (a.createdAt||0) - (b.createdAt||0)).map(p => p.id);
  const anon = p => S.pnames ? p.author : `익명 ${order.indexOf(p.id) + 1}`;   // 기본은 익명 번호, 선생님이 ‘이름 보기’를 켜면 이름
  const quote = (p, big) => `<div class="pquote${big?" big":""}"><span class="who muted">${anon(p)}의 생각 ${p.stance && hasSt ? stanceChip(r,p.stance) : ""}</span>${drawingHTML(finalBody(p).drawing, anon(p) + "의 그림")}<p>${esc(presentThought(r,p))}</p></div>`;
  const page = (list, per) => { const pages = Math.max(1, Math.ceil(list.length / per)), i = Math.max(0, Math.min(S.pidx || 0, pages - 1)); S.pidx = i;
    return {i, pages, items:list.slice(i * per, i * per + per), label: per === 1 ? `${list.length ? i + 1 : 0} / ${list.length}` : `${list.length ? i * per + 1 : 0}–${Math.min(list.length, i * per + per)} / ${list.length}`} };
  let h = `<div class="present"><div class="pbar"><span>생각이음 · ${ic("presentation")} 수업에서 함께 보기${S.gsel && S.gselRoom === r.id ? ` · ${esc(groupName(r.courseId, S.gsel))}` : ""}</span><span class="row">${(() => { const t = tmrOf(r); return t && !(t.st === "end" && t.ago > 10 * 60000) ? `<span class="ptmr ${tmrCls(t)}" data-tmr="${esc(r.id)}">${t.st === "end" ? `${ic("alarm")} 시간 종료` : `${ic("clock")} <b class="tmr-t">${mmss(t.left)}</b>`}</span>` : "" })()}
      <button class="btn sm" type="button" data-a="pnames" aria-pressed="${!!S.pnames}" title="화면에 학생 이름을 보여 줄지 정해요">${S.pnames ? `${ic("eye-off")} 익명으로 보기` : `${ic("user")} 이름 보기`}</button>
      <button class="btn sm" type="button" data-a="fullscreen">전체 화면</button><button class="btn sm pri" type="button" data-a="present-exit">나가기</button></span></div>
    <nav class="pmodes" aria-label="발표 모드">${modes.map(([k,l]) => `<button type="button" data-a="pmode" data-v="${k}" aria-pressed="${mode===k}">${esc(l)}</button>`).join("")}</nav>
    <h1>${esc(r.prompt)}</h1>`;
  if(!n) return h + `<p class="lead">아직 제출한 생각이 없어요.</p></div>`;
  if(mode === "stance"){
    h += `<p class="lead">우리 반은 이렇게 생각하고 있습니다. <span class="muted">(${n}명)</span></p><div class="pbars">${r.stances.map((s,i)=>{
      const c = sub.filter(p=>p.stance===s).length, pct = Math.round(c/n*100);
      return `<div class="pb" style="--c:var(--${SC[i%4]})"><span><span aria-hidden="true">${stanceIcon(r,i)}</span> ${esc(s)}</span><span class="tr" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="pct">${pct}%</span></div>`;
    }).join("")}</div>`;
    const ch = sub.filter(p=>p.change);
    if(ch.length){
      const moved = ch.filter(p => changeInfo(r,p)?.k === "moved").length;
      h += `<p class="lead" style="font-weight:400">친구의 생각을 만난 뒤 생각이 달라진 친구 <b>${ch.filter(p=>["some","much"].includes(p.change.degree)).length}명</b> · 입장을 바꾼 친구 <b>${moved}명</b></p>`;
    }
  }else if(mode === "thoughts"){
    const pins = pinList(r).filter(p => submitted(p));
    if(pins.length){
      const i = Math.max(0, Math.min(S.pidx||0, pins.length-1)); S.pidx = i;
      h += quote(pins[i], true) + `<div class="pnav"><button class="btn" type="button" data-a="pnav" data-v="-1" ${i?"":"disabled"}>${ic("arrow-left")} 이전</button><span class="mono">${i+1} / ${pins.length}</span><button class="btn pri" type="button" data-a="pnav" data-v="1" ${i<pins.length-1?"":"disabled"}>다음 →</button></div>
        <p class="muted small" style="text-align:center">키보드 화살표 키로도 넘길 수 있어요.</p>`;
    }else{
      const pg = page([...sub].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)), 3);   // 최근 생각부터 3개씩, 옆으로 넘겨 더 보기
      h += `<div class="pquotes">${pg.items.map(p => quote(p)).join("")}</div>${pagerHTML(pg.i, pg.pages, pg.label)}
        <p class="muted small">‘학생 생각’ 탭에서 ‘발표’ 버튼으로 발표 목록을 만들면 고른 순서대로 한 명씩 넘겨 볼 수 있어요. 지금은 최근 생각부터 3개씩 보여 줘요.</p>`;
    }
  }else if(mode === "byq"){                                           // 질문 하나에 대한 여러 학생의 답
    const qs = presentQs(r), qi = Math.max(0, Math.min(S.pq || 0, qs.length - 1)), x = qs[qi];
    const ans = sub.filter(p => String(finalBody(p)[x.k] || "").trim());
    const pg = page(ans, 6);
    h += `<nav class="pqtabs" aria-label="질문 고르기">${qs.map((y, j) => `<button type="button" data-a="pq" data-v="${j}" aria-pressed="${j === qi}">질문 ${j + 1}</button>`).join("")}</nav>
      <h2 class="pq-q"><span class="pq-n">${qi + 1}</span>${esc(sField(r, x).q)}</h2>
      ${ans.length ? `<div class="pquotes pq-grid">${pg.items.map(p => `<div class="pquote"><span class="who muted">${anon(p)} ${p.stance && hasSt ? stanceChip(r,p.stance) : ""}</span><p>${esc(finalBody(p)[x.k])}</p></div>`).join("")}</div>${pagerHTML(pg.i, pg.pages, pg.label)}` : `<p class="lead">아직 이 질문에 답한 학생이 없어요.</p>`}`;
  }else if(mode === "bys"){                                           // 학생 한 명의 답을 질문 차례대로 (한 화면에 2~3명)
    const qs = presentQs(r), per = [1, 2, 3].includes(S.pper) ? S.pper : 3, pg = page([...sub].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id)), per);
    h += `<div class="pper" role="group" aria-label="한 화면에 몇 명"><span class="muted small">한 화면에</span>${[1, 2, 3].map(k => `<button type="button" data-a="pper" data-v="${k}" aria-pressed="${per === k}">${k}명</button>`).join("")}</div>
      <div class="pstu pstu-${per}">${pg.items.map(p => { const b = finalBody(p);
        return `<article class="pstu-card"><header><b>${anon(p)}</b>${p.stance && hasSt ? stanceChip(r,p.stance) : ""}</header>
          <ol>${qs.map((x, j) => `<li><span class="pq-n">${j + 1}</span><div><span class="muted small">${esc(sField(r, x).q)}</span><p>${esc(b[x.k] || "—")}</p></div></li>`).join("")}</ol></article>` }).join("")}</div>
      ${pagerHTML(pg.i, pg.pages, pg.label)}`;
  }else if(mode === "change"){
    const ch = sub.filter(p => p.change).sort((a,b) => (changeInfo(r,b)?.score||0) - (changeInfo(r,a)?.score||0)).slice(0,6);
    h += `<p class="lead">친구의 생각을 만난 뒤, 우리 반의 생각은 이렇게 움직였어요.</p><div class="pquotes">${ch.map(p => { const f = firstThought(r,p), ci = changeInfo(r,p);
      return `<div class="pquote"><span class="who muted">${anon(p)} ${ci ? changeChip(ci) : ""}</span><span class="muted small">처음 생각</span><p style="font-size:clamp(16px,1.6vw,19px)">${esc((p.initial?.text || p.body?.claim || firstText(p.body)).slice(0,160))}</p><span class="muted small">${ic("arrow-down", "sm")} 지금의 생각</span><p>${esc(p.change.now||"")}</p></div>` }).join("")}</div>
      <p class="muted small">생각을 유지한 것도 친구 생각과 견주어 본 결과예요.</p>`;
  }else if(mode === "questions"){
    const qs = sub.flatMap(p => (p.questions||[]).map((q,i) => ({p, q, i}))).slice(0,12);
    h += `<p class="lead">우리 반이 만든 질문 <span class="muted">(${qs.length}개)</span></p><div class="pquotes">${qs.map(x => `<div class="pquote"><span class="who muted">${anon(x.p)}의 ${x.i ? "키운 질문" : "질문"}</span><p>“${esc(x.q.text)}”</p></div>`).join("")}</div>`;
  }else if(mode === "random"){
    let p = sub.find(x => x.id === S.prand);
    if(!p){ p = sub[Math.floor(Math.random()*n)]; S.prand = p.id }
    h += quote(p, true) + `<div class="pnav"><button class="btn pri" type="button" data-a="prand">${ic("arrows-shuffle")} 다른 학생 생각 보기</button></div>`;
  }
  return h + `</div>`;
}

const QUICK_FB = ["근거가 탄탄해요", "예시를 하나 더 들어 볼까요?", "친구 생각과 비교해 보세요", "내 말로 다시 정리해 볼까요?"];
function teacherCard(r, p, ps, nav){
  const f = featuresOf(r), isOpen = S.openPost === p.id, ss = sstatus(r, p);
  const prog = `<div class="sline"><span class="sst ${ss.k}">${ic(ss.ic, "sm")} ${ss.l}</span></div><div class="sprog" aria-label="단계별 진행">${marksOf(r).map(m => { const ok = m.ok(p); return `<span class="${ok?"on":"off"}">${esc(m.l)}<span class="sr">${ok?" 완료":" 아직"}</span></span>` }).join("")}</div>`;
  const nfb = repliesOf(p.id).filter(x=>x.kind==="teacher").length;
  let h = `<article class="post${isOpen?" open":""}">${postHead(r,p,ps)}`;
  const pi = (r.pins||[]).indexOf(p.id), pinned = pi >= 0;
  const pinBtn = `<button class="btn sm pinbtn" type="button" data-a="pin" data-id="${esc(p.id)}" aria-pressed="${pinned}">${pinned ? `${ic("presentation")} 발표 목록 ${pi+1}번` : `${ic("presentation")} 발표 목록에 넣기`}</button>`;
  if(!isOpen){                                                     // 학생 카드: 상태 색 띠 · 글 · 반응 · 바로 피드백
    const {title, text} = padText(r, p), img = Object.values(finalBody(p)).find(isImg), lastFb = repliesOf(p.id).filter(x => x.kind === "teacher").slice(-1)[0];
    const nH = heartsOf(p.id).length, nC = visibleReplies(p).filter(x => x.kind === "comment" || x.kind === "rebuttal").length, qOpen = S.qfb === p.id, key = "fb:" + p.id;
    return `<article class="post tcard st-${ss.k}">${postHead(r,p,ps)}${prog}
      <div class="tc-body" data-a="open-post" data-id="${esc(p.id)}" title="사고 과정 보기">${img ? `<img class="wimg" src="${esc(img)}" alt="" loading="lazy">` : ""}${title ? `<b class="pad-title">${esc(title)}</b>` : ""}${text ? `<p class="preview">${esc(text)}</p>` : ""}</div>
      <div class="tc-meta"><span title="친구들이 누른 하트">${ic("heart", "sm")} ${nH}</span><span title="친구 댓글·답">${ic("message-circle", "sm")} ${nC}</span>${f.feedback ? `<span class="${nfb ? "fbok" : ""}" title="선생님 피드백">${ic("chalkboard-teacher", "sm")} ${nfb ? `피드백 ${nfb}` : "피드백 아직"}</span>` : ""}</div>
      ${lastFb ? `<p class="tc-fb">${ic("chalkboard-teacher", "sm")} ${esc(lastFb.text.slice(0, 80))}${lastFb.text.length > 80 ? "…" : ""}</p>` : ""}
      ${qOpen ? `<div class="qfb"><div class="qfb-chips">${QUICK_FB.map(t => `<button type="button" class="chip" data-a="fb-chip" data-id="${esc(p.id)}" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
        ${ta(key, "text", {rows:2, ph:"잘한 점 한 가지 + 다음에 해 볼 점 한 가지", id:key + "-text"})}
        <div class="row end"><button class="btn sm" type="button" data-a="qfb-close">취소</button><button class="btn sm pri" type="button" data-a="save-feedback" data-id="${esc(p.id)}">피드백 보내기</button></div></div>` : ""}
      <div class="tc-acts">${f.feedback && !qOpen ? `<button class="btn sm" type="button" data-a="qfb" data-id="${esc(p.id)}">${ic("message-circle")} 바로 피드백</button>` : ""}<button class="btn sm pinbtn" type="button" data-a="pin" data-id="${esc(p.id)}" aria-pressed="${pinned}" title="발표 목록에 넣기/빼기">${pinned ? `${ic("presentation")} ${pi+1}번` : `${ic("presentation")} 발표`}</button><span class="sp"></span><button class="btn sm" type="button" data-a="open-post" data-id="${esc(p.id)}">사고 과정 →</button></div></article>`;
  }
  h += prog + thinkFlow(r, p);
  const others = visibleReplies(p).filter(x=>x.kind==="comment"||x.kind==="note");
  if(others.length) h += `<details style="margin-top:6px"><summary class="muted small" style="cursor:pointer">댓글·읽기 메모 ${others.length}개 모두 보기</summary><div class="replies">${others.map(x=>replyHTML(r,x,ps)).join("")}</div></details>`;
  if(f.feedback){
    const key = "fb:" + p.id;
    const next = nav?.next;
    if(S.fbSent === p.id) h += `<div class="fbdone" role="status"><span>${ic("circle-check")} 피드백을 보냈습니다.</span>${next ? `<button class="btn sm pri" type="button" data-a="snav" data-id="${esc(next.p.id)}">다음 학생 ${ic("arrow-right")}</button>` : `<span class="small">마지막 학생이에요. <button class="linkbtn" type="button" data-a="close-post">학생 목록으로</button></span>`}</div>`;
    h += `<div class="row" style="margin-top:8px">${pinBtn}</div><div class="rform"><div class="q"><label for="${key}-text">개인 피드백 남기기</label>${ta(key,"text",{rows:3, ph:"잘한 점 한 가지와 다음에 해 볼 점 한 가지를 함께 적으면 좋아요."})}</div>
      <div class="row end"><button class="btn sm pri" type="button" data-a="save-feedback" data-id="${esc(p.id)}">피드백 보내기</button></div></div>`;
  }
  else h += `<div class="row" style="margin-top:8px">${pinBtn}</div>`;
  return h + `<div class="row end" style="margin-top:10px"><button class="linkbtn" type="button" data-a="close-post">${ic("arrow-left", "sm")} 학생 목록</button></div></article>`;
}






/* =========================================================
   Supabase 연결 (GitHub Pages 등)
   - 학생: 로그인 없이 익명 세션 → 학번·이름·개인 코드로 본인 확인(claim_student)
   - 교사: 구글 로그인 + teachers 표에 등록된 이메일만 교사(whoami)
   - 교사마다 자기 활동·학생 명단·학생 글만 본다. 학생은 코드로 확인된 선생님 반의 활동만 본다
   - 권한은 Supabase 규칙(RLS)이 서버에서 지킨다. 앱의 저장 방식(collection/doc)은 그대로 쓴다.
   ========================================================= */
/* 🔄 새 버전 알림: 배포 때마다 APP_VERSION과 version.json의 v를 같은 값으로 올린다.
   GitHub Pages는 화면을 10분쯤 기억하므로, 옛 화면이면 아래쪽에 ‘새로고침’ 띠를 띄우고 주소를 바꿔 새로 받는다 */
const APP_VERSION = "2026-10-28d";
async function checkVersion(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) return;
    const j = await r.json();
    if(j.v && j.v !== APP_VERSION){
      S.newVer = j.v;
      let el = document.getElementById("upd");

let SB = null;
/* Supabase RPC를 안전하게: supabase-js의 rpc()는 .catch가 없는 객체를 돌려주므로 await + try로 감싼다 (실패해도 앱이 멈추지 않게) */
/* 탈퇴: 올린 사진·파일은 저장소(Storage) API로 먼저 지운다 — 데이터베이스를 지우면 어느 활동의 파일인지 알 수 없게 되므로 */
async function storageList(bucket, prefix, depth = 0){
  const out = [], {data} = await SB.storage.from(bucket).list(prefix, {limit:1000});
  for(const e of data || []){ const q = prefix + "/" + e.name; if(e.id) out.push(q); else if(depth < 2) out.push(...await storageList(bucket, q, depth + 1)) }
  return out;
}
async function purgeMyFiles(){
  const jobs = [["materials", S.sbUid], ...S.rooms.map(r => ["notes", r.id])];
  for(const [bucket, prefix] of jobs){
    if(!prefix) continue;
    try{
      const files = await storageList(bucket, prefix);
      for(let i = 0; i < files.length; i += 100) await SB.storage.from(bucket).remove(files.slice(i, i + 100));
    }catch(e){ /* 일부 파일을 못 지워도 탈퇴는 계속한다 */ }
  }
}
async function rpcSafe(fn, args){ try{ return await SB.rpc(fn, args) }catch(e){ return {data:null, error:e} } }

  catch(e){ return {data:null, error:e} }
}

/* 앱이 쓰는 저장 방식(collection/doc)을 Supabase의 docs 표 위에 그대로 옮긴다 */
function supaDB(sb){
  const live = {}, refetch = {};                          // 모음별 화면 데이터 → 내 저장도 바로 반영 · 다시 받기
  const errOf = e => Object.assign(new Error(e?.message || "db"), {code: /row-level security|permission|violates|denied/i.test(e?.message || "") ? "invalid_argument" : "unavailable"});
  const chk = r => { if(r.error) throw errOf(r.error); return r };
  const local = (col, fn) => (live[col] || []).forEach(l => { fn(l.map); l.emit() });
  const docRef = path => {
    const i = path.indexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
    return {
      set: async data => { chk(await sb.from("docs").upsert({col, id, data})); local(col, m => m.set(id, JSON.parse(JSON.stringify(data)))) },
      update: async patch => { chk(await sb.rpc("doc_merge", {p_col:col, p_id:id, p_patch:patch})); local(col, m => { if(m.has(id)) m.set(id, {...m.get(id), ...JSON.parse(JSON.stringify(patch))}) }) },
      delete: async () => { chk(await sb.from("docs").delete().eq("col", col).eq("id", id)); local(col, m => m.delete(id)) }
    };
  };
  return {
    doc: docRef,
    reload: col => Promise.all((refetch[col] || []).map(f => f().catch(() => {}))),   // 볼 수 있는 범위가 바뀌었을 때 처음부터 다시 받기
    collection: col => ({
      add: async data => {
        const id = "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        chk(await sb.from("docs").insert({col, id, data}));
        local(col, m => m.set(id, JSON.parse(JSON.stringify(data))));
        return {id};
      },
      onSnapshot(cb, onErr){
        const map = new Map(); let ready = false, t = null;
        const emit = () => { if(!ready) return; clearTimeout(t); t = setTimeout(() => cb({docs:[...map.entries()].map(([id, d]) => ({id, data:() => d}))}), 40) };
        (live[col] = live[col] || []).push({map, emit});
        const fetchAll = async () => {
          const fresh = new Map();
          for(let from = 0; ; from += 1000){
            const r = chk(await sb.from("docs").select("id,data,tid").eq("col", col).range(from, from + 999));
            r.data.forEach(x => { fresh.set(x.id, x.data); if(x.tid) DOC_TID.set(col + "/" + x.id, x.tid) });
            if(r.data.length < 1000) break;
          }
          map.clear(); fresh.forEach((v, k) => map.set(k, v)); ready = true; emit();
        };
        (refetch[col] = refetch[col] || []).push(fetchAll);
        fetchAll().catch(e => { onErr && onErr(e) });
        sb.channel("docs-" + col + "-" + Math.random().toString(36).slice(2, 8))
          .on("postgres_changes", {event:"INSERT", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); if(p.new.tid) DOC_TID.set(col + "/" + p.new.id, p.new.tid); emit() })
          .on("postgres_changes", {event:"UPDATE", schema:"public", table:"docs", filter:`col=eq.${col}`}, p => { map.set(p.new.id, p.new.data); if(p.new.tid) DOC_TID.set(col + "/" + p.new.id, p.new.tid); emit() })
          .on("postgres_changes", {event:"DELETE", schema:"public", table:"docs"}, p => { if(p.old && p.old.col === col){ map.delete(p.old.id); emit() } })
          .subscribe();
        return () => {};
      }
    })
  };
}

async function guestProbe(rid){
  (S.guestProbed = S.guestProbed || new Set()).add(rid);
  const who = (await rpcSafe("whoami", {p_ref: rid})).data || {};
  if(!who.guest_room) return;
  const info = {room:rid, title:who.guest_title || "", teacher:who.guest_teacher || ""};
  let ok = !!who.guest_name;
  if(!ok && who.guest_nick){
    const j = (await rpcSafe("guest_join", {p_room:rid, p_nick:who.guest_nick})).data; ok = !!j?.ok;
    if(!ok) S.guestGate = {...info, nick:who.guest_nick, err:j?.reason || "denied"};
  }else if(!ok) S.guestGate = info;
  if(ok){ location.reload(); return }                                  // 들어온 활동을 새로 불러온다 (주소의 활동 링크는 그대로)
  render();
}

/* 교사: 학생 명단과 개인 코드 */
const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(n = 6){ const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => CODE_ABC[x % CODE_ABC.length]).join("") }
/* 명단 한 줄: ‘학번 이름’ 또는 ‘학교 학번 이름’ (학교 이름은 …고·…중·…학교로 끝나면 알아본다). 위 칸의 학교는 학교가 없는 줄에 쓴다 */
const cleanSchool = t => String(t || "").replace(/\s+/g, "").slice(0, 30);
function parseRoster(text, defSchool = ""){
  const ok = [], bad = [];
  String(text || "").split(/\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/[\t,]+|\s+/).filter(Boolean), i = parts.findIndex(x => /^\d{3,10}$/.test(x));
    if(i < 0){ bad.push(line); return }
    const before = parts.slice(0, i), after = parts.slice(i + 1);
    const asSchool = after.length > 0;                                   // ‘학교 학번 이름’일 때만 앞을 학교로 본다 (‘이름 학번’이면 앞은 이름)
    const schoolToks = asSchool ? before : [], nameToks = asSchool ? after : before;
    const name = nameToks.join(" ").trim();
    if(!name){ bad.push(line); return }
    ok.push({school:cleanSchool(schoolToks.join("") || defSchool), number:parts[i], name});
  });
  return {ok, bad};
}
/* 글쓴이 이름표 ‘[학교] 학번 이름’ 나누기 */
function splitAuthor(a){
  const t = String(a || "").trim().split(/\s+/), i = t.findIndex(x => /^\d{3,10}$/.test(x));
  if(i < 0) return {school:"", number:"", name:String(a || "")};
  return {school:t.slice(0, i).join(" "), number:t[i], name:t.slice(i + 1).join(" ")};
}

function drawStroke(ctx, st, from = 1){
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  for(let i = Math.max(1, from); i < p.length; i++){
    ctx.lineWidth = (p[i-1][2] + p[i][2]) / 2;
    ctx.beginPath(); ctx.moveTo(p[i-1][0], p[i-1][1]); ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
  }
}

async function courseReorder(keys, from, to){
  const i = keys.indexOf(from); if(i < 0 || to < 0 || to >= keys.length || i === to) return;
  const next = [...keys]; next.splice(i, 1); next.splice(to, 0, from);
  if(isTeacher()){
    const ch = next.map((id, n) => [courseOf(id), n]).filter(([c, n]) => c && c.ord !== n);
    ch.forEach(([c, n]) => { c.ord = n });                               // 화면부터 바로
    render();
    await Promise.all(ch.map(([c, n]) => write(db => db.doc("courses/" + c.id).update({ord:n}), () => {})));
  }else{ lsSet("nonjae.corder", JSON.stringify(next)); render() }
}

function cmGuess(f){                                              // 예전 과목: 그룹 이름과 같은 학급 학생을 미리 골라 둔다

const msgLive = () => S.mode === "supa" && !!SB && !S.demo && !S.preview;

/* 📊 수행평가 점수 안내: 학생마다 {학생명}·{점수}를 채운 안내 + 예/아니오 질문 → 응답을 엑셀(CSV)로 */
const SCORE_TPL = "안녕하세요. 온라인 공동교육과정 담당 교사입니다. {학생명} 학생 수행평가 점수입니다. {점수}";

function scoreF(){
  const f = MSGF();
  if(!f.sc) f.sc = {tpl:lsGet("nonjae.scoretpl") || SCORE_TPL, items:["수행평가 A", "수행평가 B"], v:{}, ask:SCORE_ASK.slice(), title:"수행평가 점수 안내"};
  return f.sc;
}
const scoreList = (sc, sid) => sc.items.map((n, i) => `${i + 1}) ${(n || "").trim() || "수행평가 " + (i + 1)} : ${String(sc.v[sid]?.[i] ?? "").trim() || "-"}`).join(" / ");
const scoreBody = (sc, x) => (sc.tpl || SCORE_TPL).split("{학생명}").join(x.name || "").split("{점수}").join(scoreList(sc, x.id));
const scoreRows = f => { const sel = new Set(f.sel); return msgRoster().filter(x => sel.has(x.id)) };
function scoreTableHTML(f){

      || `<tr><td colspan="${sc.items.length + 2}" class="muted small">위에서 학생을 고르거나, 아래에 엑셀 표를 붙여 넣으면 학생이 채워져요.</td></tr>`}</tbody></table></div>`;

function scorePaste(){                                            // 엑셀에서 복사: ‘학번 이름 점수…’ (첫 줄이 ‘학번’으로 시작하면 평가 이름으로)
  const f = MSGF(), sc = scoreF(), txt = document.getElementById("sc-paste")?.value || "";
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!lines.length){ toast("엑셀에서 ‘학번 · 이름 · 점수…’ 칸을 복사해 붙여 넣어 주세요."); return }
  const cells = l => l.includes("\t") ? l.split("\t").map(c => c.trim()) : l.split(/\s{2,}|,|\s+/).map(c => c.trim());
  const ros = msgRoster(), sel = new Set(f.sel); let hit = 0; const miss = [];
  lines.forEach((l, li) => {
    const c = cells(l), ni = c.findIndex(v => /^\d{3,10}$/.test(v));
    if(ni < 0){ if(li === 0 && c.length > 2){ const hi = c.findIndex(v => /학번/.test(v)); const names = c.slice((hi >= 0 ? hi : 0) + 2).filter(Boolean); if(names.length) sc.items = names.slice(0, 8) } return }
    const num = c[ni], nm = (c[ni + 1] || "").replace(/\s/g, ""), x = ros.find(y => y.number === num && (!nm || y.name.replace(/\s/g, "") === nm)) || ros.find(y => y.number === num);
    if(!x){ miss.push(num + (nm ? " " + nm : "")); return }
    const vals = c.slice(ni + 2); while(sc.items.length < Math.min(vals.length, 8)) sc.items.push("수행평가 " + String.fromCharCode(65 + sc.items.length));
    sc.v[x.id] = sc.items.map((_, i) => vals[i] ?? sc.v[x.id]?.[i] ?? ""); sel.add(x.id); hit++;
  });

}

function scoreSheetRows(b){                                       // 학교명/학번/이름/질문들/응답일시
  const ask = Array.isArray(b.ask) && b.ask.length ? b.ask : SCORE_ASK, pad = n => String(n).padStart(2, "0");
  const dt = v => { if(!v) return ""; const d = new Date(Date.parse(v) || v); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` };

async function saveFile(name, data, mime = "text/csv;charset=utf-8"){   // 파일로 받기 (안 되는 환경이면 false)
  try{ const dl = window.claude && typeof claude.use === "function" ? await claude.use("downloads") : null;
    if(dl){ try{ await dl.save({filename:name, data}); return true }catch(e){ if(e?.code === "declined") return "declined" } } }catch(e){}
  try{ const u = URL.createObjectURL(new Blob([data], {type:mime})), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true }catch(e){ return false }
}
const csvOf = rows => "﻿" + rows.map(row => row.map(v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v }).join(",")).join("\r\n");

function asgSummary(r){

/* =========================================================
   10-0. 교사: 학생 생각 살펴보기 — 검색 · 필터 · 정렬 · 보기 방식 · 이전/다음
   학생 정보는 지금처럼 ‘번호와 이름’ 문자열(author) 하나만 쓴다. 번호는 그 문자열에서 읽어 낸다.
   ========================================================= */
/* "2반 14번 김지우" → 14 · "10314 김지우" → 10314 · 번호가 없으면 "" */
function studentNo(name){
  const s = String(name||""), m = s.match(/(\d+)\s*번/);
  if(m) return m[1];
  const m2 = s.match(/^\s*(\d+)(?!\s*반)/);
  return m2 ? m2[1] : "";
}
function cleanName(name){
  const s = String(name||"");
  const t = s.replace(/\d+\s*학년/g,"").replace(/\d+\s*반/g,"").replace(/\d+\s*번/g,"").replace(/^\s*\d+[.)\-\s]*/,"").replace(/\s+/g," ").trim();
  return t || s;
}
const numKey = name => (String(name||"").match(/\d+/g)||[]).map(Number);
function cmpNum(a, b){
  const x = numKey(a), y = numKey(b);
  if(!x.length || !y.length) return (!x.length) - (!y.length);
  for(let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i] ?? -1) - (y[i] ?? -1); if(d) return d }
  return 0;
}
const koCmp = (a, b) => String(a).localeCompare(String(b), "ko");
const eul = w => { const c = String(w).trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? ((c-0xAC00)%28 ? "을" : "를") : "를" };

/* 학생 카드·표에 보일 단계 표시: 이 활동에 실제로 있는 단계만 */
const MARK_L = {chat:"AI 대화", think:"처음 생각", why:"이유", counter:"예상 반론", read:"친구 생각", respond:"답하기", revise:"다시 쓰기", compose:"글쓰기",
                ask:"질문", take:"이어받아 답", back:"답 확인", develop:"질문 키우기"};
function marksOf(r){
  const fields = effFields(r), f = featuresOf(r), out = [];
  stepsOf(r).forEach(s => {
    if(s === "see" || s === "feedback") return;           // 피드백은 따로 칸을 둔다
    if(s === "write"){
      const hasC = fields.some(x=>x.k==="claim"), hasR = fields.some(x=>x.k==="reason");
      if(hasC) out.push({k:"claim", l:"주장", ok:p => !!(finalBody(p).claim||"").trim()});
      else out.push({k:"write", l: isEssay(r) ? "생각 정리" : toolOf(r) === "sketch" ? "스케치" : toolOf(r) === "draw" ? "그림" : toolOf(r) === "chatReflect" ? "대화 정리" : "생각 쓰기", ok:p => stepDone(r,p,"write")});
      if(hasR && !stepsOf(r).includes("why")) out.push({k:"reason", l:"근거", ok:p => !!(finalBody(p).reason||"").trim()});
      return;
    }
    if(s === "reflect"){ out.push({k:s, l: f.change ? "생각 변화" : "돌아보기", ok:p => stepDone(r,p,s)}); return }
    out.push({k:s, l: MARK_L[s] || STEP[s].t, ok:p => stepDone(r,p,s)});
  });
  return out;
}
function sstatus(r, p){
  if(!p) return {k:"none", l:"미참여", ic:"circle-dashed"};
  if(stepsOf(r).every(s => stepDone(r,p,s))) return {k:"done", l:"완료", ic:"circle-check"};
  if(!submitted(p)) return {k:"draft", l:"쓰는 중", ic:"pencil"};
  return {k:"doing", l:"진행 중", ic:"progress"};
}
/* 생각의 변화: 바뀌지 않았다고 생각하지 않은 것이 아니다 → ‘유지’ ‘깊어짐’도 따로 보여 준다 */
function changeInfo(r, p){
  if(!p || !p.change) return null;
  const hasSt = (r.stances||[]).length > 0;
  const a = p.initial?.stance && stanceIdx(r, p.initial.stance) >= 0 ? p.initial.stance : p.stance, b = p.change.nowStance || p.stance;
  if(hasSt && a && b && a !== b) return {k:"moved", ic:"arrows-exchange", l:"입장이 바뀜", score:4};
  const deg = p.change.degree;
  if(deg === "much") return hasSt ? {k:"deep", ic:"trending-up", l:"같은 입장이지만 생각이 크게 깊어짐", score:3} : {k:"much", ic:"trending-up", l:"크게 달라짐", score:3};
  if(deg === "some") return hasSt ? {k:"deep", ic:"arrow-up-right", l:"같은 입장이지만 근거가 깊어짐", score:2} : {k:"some", ic:"arrow-up-right", l:"조금 달라짐", score:2};
  return {k:"keep", ic:"equal", l:"생각을 유지함", score:1};
}
const changeChip = ci => `<span class="chip cchip">${ic(ci.ic, "sm")} ${esc(ci.l)}</span>`;

/* 학생 한 명 = 응답(post) 또는 명단에만 있는 이름 */
function studentEntries(r, st){
  const seen = new Set(), marks = marksOf(r), pins = r.pins || [];
  const out = st.all.map(p => { seen.add(p.author); return {name:p.author, p} });
  (st.roster||[]).forEach(n => { if(!seen.has(n)){ seen.add(n); out.push({name:n, p:null}) } });
  out.forEach(e => {
    const p = e.p;
    e.no = studentNo(e.name); e.st = sstatus(r, p);
    e.marks = marks.map(m => ({l:m.l, ok: p ? m.ok(p) : false}));
    e.missing = p ? stepsOf(r).filter(s => !stepDone(r,p,s)).length : 99;
    e.fb = p ? repliesOf(p.id).filter(x=>x.kind==="teacher").length : 0;
    e.ci = changeInfo(r, p);
    e.pin = p ? pins.indexOf(p.id) : -1;
    e.ts = p ? (p.updatedAt||p.createdAt||0) : 0;
  });
  return out;
}
/* 필터: 지금 데이터로 판단할 수 있는 것만 */
function sfilters(r, st){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"all", l:"전체", t:() => true},
    {k:"todo", l:"미완료", t:e => !!e.p && e.st.k !== "done"},
    {k:"nojoin", l:"미참여", t:e => !e.p, show:(st.roster||[]).length > 0},
    {k:"fbneed", l:"피드백 필요", t:e => !!e.p && submitted(e.p) && !e.fb, show:f.feedback},
    {k:"pinned", l:"발표 후보", t:e => e.pin >= 0},
    {k:"noread", l:"친구 생각 미확인", t:e => !!e.p && !stepDone(r,e.p,"read"), show:steps.includes("read")},
    {k:"nochange", l: f.change ? "생각 변화 미작성" : "돌아보기 미작성", t:e => !!e.p && !stepDone(r,e.p,"reflect"), show:steps.includes("reflect")},
    {k:"noreason", l:"근거 없음", t:e => !!e.p && !(finalBody(e.p).reason||"").trim(), show:hasReason}
  ].filter(x => x.show !== false);
}
function ssorts(r){
  const steps = stepsOf(r), f = featuresOf(r), hasReason = !isRelay(r) && effFields(r).some(x=>x.k==="reason");
  return [
    {k:"no", l:"번호순", c:() => 0},
    {k:"name", l:"이름순", c:(a,b) => koCmp(cleanName(a.name), cleanName(b.name))},
    {k:"recent", l:"최근 작성순", c:(a,b) => b.ts - a.ts},
    {k:"todo", l:"남은 단계 많은 순", c:(a,b) => b.missing - a.missing},
    {k:"change", l:"생각 변화가 큰 순", c:(a,b) => (b.ci?.score ?? 0) - (a.ci?.score ?? 0), show:steps.includes("reflect") && f.change},
    {k:"noreason", l:"근거 없는 학생 먼저", c:(a,b) => !!(finalBody(a.p).reason||"").trim() - !!(finalBody(b.p).reason||"").trim(), show:hasReason},
    {k:"noread", l:"친구 생각 안 본 학생 먼저", c:(a,b) => stepDone(r,a.p,"read") - stepDone(r,b.p,"read"), show:steps.includes("read")},
    {k:"nofb", l:"피드백 없는 학생 먼저", c:(a,b) => (!!a.fb) - (!!b.fb), show:f.feedback}
  ].filter(x => x.show !== false);
}
function studentView(r, st){
  const all = studentEntries(r, st), fl = sfilters(r, st), so = ssorts(r);
  if(!fl.some(x => x.k === S.sf)) S.sf = "all";
  if(!so.some(x => x.k === S.ss)) S.ss = "no";
  const flt = fl.find(x => x.k === S.sf), srt = so.find(x => x.k === S.ss), q = (S.sq||"").trim().toLowerCase().replace(/\s+/g," ");
  let list = all.filter(flt.t);
  if(q) list = list.filter(e => e.name.toLowerCase().replace(/\s+/g," ").includes(q) || (e.no && e.no === q.replace(/번$/,"")));
  list.sort((a,b) => cmpNum(a.name, b.name) || koCmp(a.name, b.name));                 // 기본: 번호순
  if(srt.k !== "no") list.sort((a,b) => (srt.k === "name" ? 0 : (!a.p) - (!b.p)) || srt.c(a,b));   // 미참여는 맨 뒤
  return {all, list, fl, so};
}
function vtoggle(a, cur, opts){
  return `<span class="vtoggle" role="group" aria-label="보기 방식">${opts.map(([k,l]) => `<button type="button" data-a="${a}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</span>`;
}
function studentListHTML(r, st, v){
  const list = v.list;
  if(!list.length) return `<div class="empty">조건에 맞는 학생이 없습니다.<br><span class="small">검색어 또는 필터를 변경해 보세요.</span></div>`;
  if(S.sview === "grid") return studentTableHTML(r, list);
  return `<p class="muted small" style="margin-bottom:8px">${list.length}명 · ‘사고 과정 보기’를 누르면 자세히 보고, 이전·다음 학생으로 넘겨 볼 수 있어요.</p><div class="scards">${list.map(e => e.p ? teacherCard(r, e.p, st.sub)
    : `<article class="post nojoin"><div class="post-h"><strong>${esc(e.name)}</strong></div><div class="sline"><span class="sst none">${ic("circle-dashed", "sm")} 미참여</span><span class="muted small">아직 활동을 시작하지 않았어요.</span></div></article>`).join("")}</div>`;
}
/* 한눈에 보기: 35명이 어디까지 했는지 한 화면에서 */
function studentTableHTML(r, list){
  const marks = marksOf(r), f = featuresOf(r);

    ${list.map(e => {
      const cell = (inner, label) => e.p ? `<button class="cellbtn" type="button" data-a="open-post" data-id="${esc(e.p.id)}" aria-label="${esc(e.name)} ${label} — 자세히 보기">${inner}</button>` : inner;
      return `<tr class="${e.p?"":"nj"}"><td class="mono c">${esc(e.no||"–")}</td><td>${cell(`<b>${esc(cleanName(e.name))}</b>`, "")}</td>${showG ? `<td class="c small">${e.p?.groupId ? esc(groupName(r0.courseId, e.p.groupId)) : "–"}</td>` : ""}
        <td class="c">${cell(`<span class="sst ${e.st.k}">${ic(e.st.ic, "sm")} ${e.st.l}</span>`, e.st.l)}</td>
        ${e.marks.map(m => `<td class="c">${e.p ? cell(yn(m.ok), m.l + (m.ok ? " 완료" : " 아직")) : `<span class="no">–</span>`}</td>`).join("")}
        ${f.feedback ? `<td class="c">${e.p ? cell(yn(e.fb > 0), e.fb ? "피드백 보냄" : "피드백 아직") : `<span class="no">–</span>`}</td>` : ""}
        <td class="c">${e.p && submitted(e.p) ? `<button class="cellbtn" type="button" data-a="pin" data-id="${esc(e.p.id)}" aria-pressed="${e.pin>=0}" title="발표 목록에 넣기/빼기" aria-label="${esc(e.name)} 발표 목록 ${e.pin>=0?"빼기":"넣기"}">${e.pin>=0 ? `${ic("presentation", "sm")} ${e.pin+1}` : ic("plus", "sm")}</button>` : ""}</td></tr>`;
    }).join("")}</tbody></table></div>
    <p class="muted small" style="margin-top:8px">${ic("check", "sm")} 한 단계 · ${ic("x", "sm")} 아직 안 한 단계 · 칸을 누르면 그 학생의 생각 과정으로 가요.</p>`;
}
/* 학생 상세: 지금 필터·정렬 순서대로 이전/다음 */
function studentDetail(r, st, p){
  const v = studentView(r, st), list = v.list.filter(e => e.p), i = list.findIndex(e => e.p.id === p.id);
  if(i >= 0) S.sidx = i;
  const pos = Math.min(S.sidx||0, list.length);
  const prev = i >= 0 ? list[i-1] : list[pos-1], next = i >= 0 ? list[i+1] : list[pos];   // 필터에서 빠진 학생(예: 방금 피드백을 받음)은 원래 자리 기준
  const fl = v.fl.find(x => x.k === S.sf), no = studentNo(p.author);
  const where = i >= 0 ? `${i+1} / ${list.length}명` : "지금 필터에서 빠짐";
  return `<div class="snav"><button class="linkbtn" type="button" data-a="close-post">${ic("arrow-left", "sm")} 학생 목록</button>
    <div class="snav-c"><button class="btn sm" type="button" data-a="snav" data-id="${prev ? esc(prev.p.id) : ""}" ${prev ? "" : "disabled"}>${ic("arrow-left")} 이전</button>
      <span class="snav-who">${no ? `<b class="mono">${esc(no)}</b>번 ` : ""}<b>${esc(cleanName(p.author))}</b> <span class="muted small">${where}${S.sf !== "all" ? ` · ${esc(fl.l)}` : ""}${S.sq ? ` · ‘${esc(S.sq)}’ 검색` : ""}</span></span>
      <button class="btn sm" type="button" data-a="snav" data-id="${next ? esc(next.p.id) : ""}" ${next ? "" : "disabled"}>다음 ${ic("arrow-right")}</button></div></div>
    ${teacherCard(r, p, st.sub, {next})}`;
}
/* 발표 목록(큐): 기존 pins 배열을 그대로 순서로 쓴다 */
function pinList(r){ const ps = allPostsOf(r.id); return (r.pins||[]).map(id => ps.find(p => p.id === id)).filter(Boolean) }

      : `<p class="muted small" style="margin:4px 0 6px">학생 카드나 ‘한눈에 보기’ 표에서 ‘발표’ 버튼을 눌러 발표할 생각을 골라 두세요. 고른 순서대로 발표 화면에서 한 명씩 넘겨 볼 수 있어요.</p>`}</details>`;

/* ---- 개요: 지금 수업에서 볼 것 · 입장 분포 · 참여/완료 · 교사 확인 필요 ---- */
const NEXT_HINT = {read:"이제 친구 생각을 살펴보도록 안내하기 좋습니다.", respond:"이제 친구 생각에 답하도록 안내하기 좋습니다.", reflect:"이제 생각의 변화를 적도록 안내하기 좋습니다.",
  revise:"이제 글을 다시 다듬도록 안내하기 좋습니다.", counter:"이제 다른 생각을 예상해 보도록 안내하기 좋습니다.", why:"이제 이유를 쓰도록 안내하기 좋습니다.",
  compose:"이제 글쓰기로 넘어가도록 안내하기 좋습니다.", take:"이제 친구 질문을 이어받도록 안내하기 좋습니다.", back:"이제 내 질문에 달린 답을 확인하도록 안내하기 좋습니다.",

function lessonHints(r, st){

  if(P < 3) return out;                                       // 학생이 적으면 판단 문장을 만들지 않는다

  const k = sc.findIndex(x => x.n / P < 0.8);

  else if(k === 0) out.push(`${P}명 중 ${sc[0].n}명이 ${sc[0].l}${eul(sc[0].l)} 마쳤습니다. 아직 쓰는 학생이 있으니 조금 더 시간을 주세요.`);
  else out.push(`${P}명 중 ${sc[k-1].n}명이 ${sc[k-1].l}까지 마쳤습니다. ${NEXT_HINT[sc[k].s] || `이제 ‘${sc[k].l}’ 단계로 안내하기 좋습니다.`}`);

}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || document.getElementById("confetti")) return;
  const cv = document.createElement("canvas"); cv.id = "confetti"; cv.setAttribute("aria-hidden", "true");

  const ps = Array.from({length:110}, (_, i) => { const left = i % 2, a = (left ? 55 : 125) * Math.PI / 180 + (Math.random() - .5) * .8, v = 11 + Math.random() * 9;
    return {x:left ? 0 : W, y:H * .85, vx:Math.cos(a) * v * (left ? 1 : 1), vy:-Math.sin(a) * v - 4, w:6 + Math.random() * 6, h:3 + Math.random() * 5, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:cols[i % cols.length]} });

}

async function saveTnote(r, patch){
  const cur = (({id, ...rest}) => rest)(tnote(r));
  const data = {...cur, ...patch, updatedAt:Date.now()};
  return write(db => db.doc("tnotes/"+r.id).set(data), () => { S.tnotes = S.tnotes.filter(x=>x.id!==r.id).concat({id:r.id, ...data}) });
}
async function setStatus(r, st){
  const patch = {status:st, open: st==="open", updatedAt:Date.now()};
  if(st === "open" && pastDue(r)) patch.dueAt = null;                  // 마감 시각이 지난 활동을 다시 열면 마감 시각을 지운다
  return write(db => db.doc("rooms/"+r.id).update(patch), () => Object.assign(r, patch));
}

function pgSaved(f){
  const guide = (f.personaGuide || "").trim().slice(0, PG_MAX), g = pgInput(f);
  const gen = {type:g.type, subj:g.subj, grade:g.grade, goal:g.goal.slice(0, 400), support:g.support};
  return {...(guide ? {guide} : {}), ...(g.type || g.subj || g.grade || g.goal ? {gen} : {})};
}

/* 복제: 설정만 복사하고 학생 응답·댓글·피드백·참여 기록은 복사하지 않는다 */
async function duplicateRoom(r){
  const {id, status, open, createdAt, updatedAt, classSize, pins, ...rest} = r;
  const nid = "r-" + Date.now().toString(36), now = Date.now();
  const doc = {...JSON.parse(JSON.stringify(rest)), title:(r.title||"활동") + " - 복사본", status:"draft", open:false, createdAt:now, updatedAt:now, copiedFrom:r.id};
  if(doc.assign) doc.assign = Object.fromEntries(asgIds(r).map(g => [g, {status:"open"}]));     // 같은 그룹 배포만 복사 (상태·시간은 새로)
  const ok = await write(db => db.doc("rooms/"+nid).set(doc), () => { S.rooms.push({id:nid, ...doc}) });
  if(!ok) return null;
  if(tnote(r).memo) await saveTnote({id:nid}, {memo:tnote(r).memo});
  return {id:nid, ...doc};
}

function exportRowsKind(r, kind){

    return [col.map(c=>c[0]), ...ch.map(p => col.map(([,fn]) => String(fn(p)||"")))];

async function exportCSV(r, kind = "all"){

  const csv = "﻿" + rows.map(row => row.map(v => /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v).join(",")).join("\r\n");
  const name = `생각이음_${(r.title||"활동").replace(/[\\/:*?"<>|]/g," ").slice(0,40)}${kind && kind !== "all" ? "_" + EXPORTS[kind] : ""}${S.gsel && S.gselRoom === r.id ? "_" + groupName(r.courseId, S.gsel) : ""}_${(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`)(new Date())}.csv`;
  const ok = await saveFile(name, csv);

  render();
}

/* =========================================================
   11. 내 생각 기록 (포트폴리오)
   ========================================================= */
function finalThought(r, p){
  if(isRelay(r)){ const qs = p.questions||[]; return {label: qs.length>1 ? "키운 질문" : "질문에 달린 답", text: qs.length>1 ? `“${qs[qs.length-1].text}”` : `${S.replies.filter(x=>x.kind==="answer"&&x.postId===p.id).length}개`} }
  if(p.revision) return {label:"지금의 생각 · 다시 쓴 글", text: p.revision.body.claim || firstText(p.revision.body)};
  if(p.change) return {label:"지금의 생각", text:p.change.now};
  if(p.revisit) return {label:"수업 후의 생각", text:p.revisit};
  return {label:"내가 낸 생각", text: p.body?.claim || firstText(p.body)};
}

/* 🗺 지도로 보기: 가운데 = 과목, 둘레 = 그 과목에서 내가 쓴 활동(한 화면에 8개). 새로 저장하는 것 없이 있는 기록만 보여 준다 */

function mineGroups(items){

function mmapNode(x, i, n, sel){

      <span class="mn-s">${two ? `<span class="mn-sh" aria-hidden="true"><span style="color:var(--${SC[ia % 4]})">${stanceIcon(r, ia)}</span><span>→</span><span style="color:var(--${SC[ib % 4]})">${stanceIcon(r, ib)}</span></span>` : ""}${esc(sum)}</span></button>`

/* 활동 깊이를 고르면 세부 기능이 자동으로 맞춰진다 */
function applyDepth(k, f = F("create")){
  const d = DEPTHS[k], t = TEMPLATES[f.template || "debate2"], hasSt = t.stances.length > 0;
  const inter = hasSt ? d.interact.stance : d.interact.free;
  if(k !== "quick" && f.reveal === "teacher" && f.template !== "notes") f.reveal = "after";   // 학습 나눔은 선생님이 고를 때만 서로 보기     // 만남부터는 친구 글이 보여야 한다 (논술처럼 ‘선생님만 보기’로 시작하는 활동)
  else if(k === "quick" && t.reveal === "teacher") f.reveal = "teacher";
  Object.assign(f, {
    depth:k,
    initial:d.features.initial, evidenceType:d.features.evidenceType, warrant:d.features.warrant, counter:d.features.counter,
    meet:d.features.meet, missionDeep:d.features.readMission.length > 0,
    comment: inter !== "none", rebuttal: inter === "rebuttal",
    change:k === "deep" && d.features.change, feedback:d.features.feedback, revise:d.features.revise, terms:false,   // ② 생각→만남은 변화 단계 없이
    minChars: String(TOOLS[t.tool]?.only ? t.minChars : t.minChars && k !== "quick" ? t.minChars : (t.tool==="free" || t.tool==="feel" ? Math.min(d.minChars, 40) : d.minChars)),
    evidenceTypes: f.evidenceTypes || [...EVIDENCE_TYPES]
  });
}
/* 활동 유형은 입장·공개 방식·사고 도구·기본 깊이를 정한다 */
function applyTemplate(k){
  const t = TEMPLATES[k], f = F("create");
  Object.assign(f, {template:k, tool:t.tool, stances:t.stances.join(", "), reveal:t.reveal, anonymous:t.anonymous, qtype:t.qtype||"", predict:false, develop:false, nst:t.stances.length});
  delete f.qs; f.qframe = "";                                          // 활동 유형이 바뀌면 단계별 질문도 그 유형의 기본 틀로
  if(NO_DEEP.includes(k) && f.depth === "deep") applyDepth("normal");
  if(k === "notes" && f.prompt === NOTES_PROMPT) f.prompt = "";        // 예전에 자동으로 넣던 안내는 지우고, 빈칸 회색 예시로만 보여 준다
  t.stances.forEach((x,i) => { f["st"+i] = x });
  applyDepth(t.depth);
}

/* 대화 횟수에 맞춘 단계 계획 */
function pgPlan(g, sp){
  const N = g.turns, ph = sp.phase, lines = [], rng = (a, b) => a === b ? `${a}번째` : `${a}~${b}번째`;
  if(N <= 1) return [`학생의 1번째 발언(마지막): ${ph.intro} ${ph.confirm || ""} ${ph.end}`.replace(/\s+/g, " ")];
  const confirm = !!ph.confirm && N >= 3, midEnd = N - 1 - (confirm ? 1 : 0), m = Math.max(0, midEnd - 1);
  lines.push(`학생의 1번째 발언(도입): ${ph.intro}`);
  if(m === 1) lines.push(`학생의 2번째 발언(전개): ${ph.dev} ${ph.deep}`);
  else if(m > 1){ const d = Math.ceil(m / 2); lines.push(`학생의 ${rng(2, 1 + d)} 발언(전개): ${ph.dev}`); lines.push(`학생의 ${rng(2 + d, midEnd)} 발언(심화): ${ph.deep}`) }
  if(confirm) lines.push(`학생의 ${N - 1}번째 발언(확인): ${m ? "" : ph.dev + " 이어서 "}${ph.confirm}`);
  lines.push(`학생의 ${N}번째 발언(마지막): ${ph.end}`);
  return lines;
}

function pgValid(t){ return typeof t === "string" && t.length >= 600 && PG_HEADS.every(h => t.includes(h)) }
/* 지시문 만들기: Gemini로 다듬기 (선생님의 키 · 선생님이 고른 항목과 기본 지시문만 보낸다). 체험 모드·연결 없음이면 기본 지시문을 쓴다 */
async function aiGuide(body){
  if(!aiLive()){ await new Promise(r => setTimeout(r, 300)); return {demo:true} }
  const r = await invokeSafe("suggest", body, 60000);
  return r.timeout ? {error:"timeout"} : r.error ? {error:"network"} : (r.data || {error:"ai_error"});
}

async function avatarAdd(file){

  const live = S.mode === "supa" && SB && !S.demo && !S.preview && S.sbUid;
  try{
    const {blob} = await shrinkImage(file, live ? 400 : 240, 0.85);
    let url;
    if(live){
      const path = `${S.sbUid}/avatar-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}.jpg`;
      const up = await SB.storage.from("materials").upload(path, blob, {contentType:"image/jpeg", upsert:false});
      if(up.error) throw up.error;
      url = SB.storage.from("materials").getPublicUrl(path).data.publicUrl;

  }catch(e){ toast("이미지를 올리지 못했어요: " + (e?.message || "다시 해 보세요.")) }

}

/* 문장 시작 넣기 */
function insertStarter(b){
  const el = document.getElementById(b.dataset.target);
  if(!el) return;
  const add = b.dataset.text || "";
  if(el.isContentEditable){                                              // 서식 글상자: 맨 끝에 덧붙인다
    el.focus(); const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(el); rg.collapse(false); sel.removeAllRanges(); sel.addRange(rg);
    document.execCommand("insertText", false, (el.textContent.trim() ? "\n" : "") + add);
    el.dispatchEvent(new Event("input", {bubbles:true})); b.closest("details")?.removeAttribute("open"); return;
  }
  el.value = el.value.trim() ? el.value.replace(/\s*$/, "\n") + add : add;
  el.dispatchEvent(new Event("input", {bubbles:true}));
  el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  b.closest("details")?.removeAttribute("open");
}
