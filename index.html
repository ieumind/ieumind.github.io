/* 복제: 설정만 복사하고 학생 응답·댓글·피드백·참여 기록은 복사하지 않는다 */
async function duplicateRoom(r){
  const {id, status, open, createdAt, updatedAt, classSize, pins, ...rest} = r;
  const nid = "r-" + Date.now().toString(36), now = Date.now();
  const doc = {...JSON.parse(JSON.stringify(rest)), title:(r.title||"활동") + " - 복사본", status:"draft", open:false, createdAt:now, updatedAt:now, copiedFrom:r.id};
  if(doc.assign) doc.assign = Object.fromEntries(asgIds(r).map(g => [g, {status:"open"}]));     // 같은 그룹 배포만 복사 (상태·시간은 새로)
  const ok = await write(db => db.doc("rooms/"+nid).set(doc), () => { S.rooms.push({id:nid, ...doc}) });
  if(!ok) return null;
  if(tnote(r).memo) await saveTnote({id:nid}, {memo:tnote(r).memo});
  return {id:nid, ...doc};
}
/* CSV 내보내기: 이 활동에 실제로 있는 항목만 */
function exportRows(r){
  const ps = allPostsOf(r.id), f = featuresOf(r), fields = effFields(r), hasSt = (r.stances||[]).length>0;
  const col = [];
  col.push(["학생", p => p.author]);
  col.push(["상태", p => progressOf(r,p).label]);
  if(isRelay(r)){
    col.push(["만든 질문", p => (p.questions||[]).map((q,i)=>`${i+1}. ${q.text}`).join("\n")]);
    col.push(["받은 답", p => (p.questions||[]).flatMap(q=>answersTo(p,q).map(a=>`${a.author}: ${a.text}`)).join("\n")]);
    col.push(["반응", p => Object.values(p.reactions||{}).map(x=>(RELAY_REACT.find(k=>k.k===x.kind)?.l||"")+(x.note?` (${x.note})`:"")).join("\n")]);
    col.push(["이어받아 쓴 답", p => S.replies.filter(x=>x.roomId===r.id && x.kind==="answer" && x.author===p.author).map(x=>x.text).join("\n")]);
  }else{
    if(hasSt) col.push(["처음 입장", p => p.initial?.stance || p.stance || ""]);
    col.push([f.predict ? "예측" : "처음 생각", p => p.initial?.text || ""]);
    fields.forEach(x => col.push([x.l, p => cellv(p.body?.[x.k])]));
    col.push(["근거 유형", p => p.evidenceType || ""]);
    col.push(["다른 관점·자료", p => [p.deeper?.other, p.deeper?.source].filter(Boolean).join(" / ")]);
    col.push(["쓴 글", p => p.essay?.text || ""]);
    col.push(["예상 반론", p => p.counter ? `${p.counter.objection}${p.counter.response?` → ${p.counter.response}`:""}` : ""]);
    col.push(["고른 친구 생각", p => { const d = ps.find(x=>x.id===p.meet?.diffPostId); return d ? `${d.author}: ${previewText(r,d)}` : "" }]);
    col.push(["친구에게 남긴 말·반론", p => S.replies.filter(x=>x.roomId===r.id && x.author===p.author && (x.kind==="rebuttal"||x.kind==="comment")).map(x=>x.text+(x.evidence?` (이유: ${x.evidence})`:"")).join("\n")]);
    col.push(["받은 댓글·반론 수", p => { const n = repliesOf(p.id).filter(x=>x.kind==="rebuttal"||x.kind==="comment").length; return n ? String(n) : "" }]);
    col.push(["생각의 변화", p => p.change ? (DEGREES.find(d=>d.k===p.change.degree)?.l||"") : ""]);
    if(hasSt) col.push(["지금 입장", p => p.change?.nowStance || ""]);
    col.push(["지금의 생각", p => p.change?.now || p.revisit || ""]);
    col.push(["영향을 준 것", p => [p.change?.biggest, ...(p.change?.influences||[])].filter(Boolean).join(" / ")]);
    col.push(["최종 수정", p => p.revision ? (p.revision.essay || Object.values(p.revision.body||{}).map(cellv).join(" / ")) : ""]);
  }
  if(stepsOf(r).includes("chat")) col.push(["AI 인물 대화", p => (p.chat?.log||[]).map(x => `${x.role==="ai" ? personaOf(r).name : "학생"}: ${x.text}`).join("\n")]);
  col.push(["교사 피드백", p => repliesOf(p.id).filter(x=>x.kind==="teacher").map(x=>x.text).join("\n")]);
  const used = col.filter(([,fn], i) => i < 2 || ps.some(p => String(fn(p)||"").trim()));
  return [used.map(c=>c[0]), ...ps.map(p => used.map(([,fn]) => String(fn(p)||"")))];
}

    else{ fields.forEach(x => col.push([x.l, p => cellv(p.body?.[x.k])])); col.push(["쓴 글", p => p.essay?.text || ""]); col.push(["다시 쓴 글", p => p.revision ? (p.revision.essay || Object.values(p.revision.body||{}).map(cellv).join(" / ")) : ""]) }
    const used = col.filter(([,fn], i) => i < 2 || sub.some(p => String(fn(p)||"").trim()));
    return [used.map(c=>c[0]), ...sub.map(p => used.map(([,fn]) => String(fn(p)||"")))];
  }
  if(kind === "change"){
    const ch = ps.filter(p => p.change || p.revisit);
    const col = [["번호", p => studentNo(p.author)], ["학생", p => p.author]];
    if(hasSt) col.push(["처음 입장", p => p.initial?.stance || p.stance || ""]);
    col.push(["처음 생각", p => p.initial?.text || p.body?.claim || firstText(p.body)]);
    col.push(["변화", p => changeInfo(r,p)?.l || ""]);
    col.push(["학생이 고른 변화 정도", p => p.change ? (DEGREES.find(d=>d.k===p.change.degree)?.l||"") : ""]);
    if(hasSt) col.push(["지금 입장", p => p.change?.nowStance || p.stance || ""]);
    col.push(["지금의 생각", p => p.change?.now || p.revisit || ""]);
    col.push(["영향을 준 것", p => [p.change?.biggest, ...(p.change?.influences||[])].filter(Boolean).join(" / ")]);
    return [col.map(c=>c[0]), ...ch.map(p => col.map(([,fn]) => String(fn(p)||"")))];
  }
  if(kind === "feedback"){
    const rows = [["번호","학생","피드백","보낸 시각"]];
    classFeedbacks(r).slice().reverse().forEach(x => rows.push(["", "우리 반 전체", x.text||"", fmt(x.createdAt)]));
    ps.slice().sort((a,b) => cmpNum(a.author,b.author) || koCmp(a.author,b.author)).forEach(p => repliesOf(p.id).filter(x=>x.kind==="teacher").forEach(x => rows.push([studentNo(p.author), p.author, x.text||"", fmt(x.createdAt)])));
    return rows;
  }
  return exportRows(r);
}
async function exportCSV(r, kind = "all"){

  const name = `생각이음_${(r.title||"활동").replace(/[\\/:*?"<>|]/g," ").slice(0,40)}${kind && kind !== "all" ? "_" + EXPORTS[kind] : ""}${S.gsel && S.gselRoom === r.id ? "_" + groupName(r.courseId, S.gsel) : ""}_${(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`)(new Date())}.csv`;
  let dl = null;
  try{ dl = window.claude && typeof claude.use === "function" ? await claude.use("downloads") : null }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:csv}); toast("결과 파일을 저장했어요."); return }
    catch(e){ if(e?.code === "declined") return }
  }
  S.modal = {type:"text", title:`결과 (CSV) · ${EXPORTS[kind] || "전체 결과"}`, note:"이 화면에서는 파일로 바로 저장할 수 없어요. 아래 내용을 복사해 메모장에 붙여 넣고 .csv로 저장하면 엑셀에서 열려요.", text:csv.slice(1)};
  render();
}

function finalThought(r, p){
  if(isRelay(r)){ const qs = p.questions||[]; return {label: qs.length>1 ? "키운 질문" : "질문에 달린 답", text: qs.length>1 ? `“${qs[qs.length-1].text}”` : `${S.replies.filter(x=>x.kind==="answer"&&x.postId===p.id).length}개`} }
  if(p.revision) return {label:"지금의 생각 · 다시 쓴 글", text: p.revision.body.claim || firstText(p.revision.body)};
  if(p.change) return {label:"지금의 생각", text:p.change.now};
  if(p.revisit) return {label:"수업 후의 생각", text:p.revisit};
  return {label:"내가 낸 생각", text: p.body?.claim || firstText(p.body)};
}

/* 활동 깊이를 고르면 세부 기능이 자동으로 맞춰진다 */
function applyDepth(k){
  const f = F("create"), d = DEPTHS[k], t = TEMPLATES[f.template || "debate2"], hasSt = t.stances.length > 0;
  const inter = hasSt ? d.interact.stance : d.interact.free;
  Object.assign(f, {
    depth:k,
    initial:d.features.initial, evidenceType:d.features.evidenceType, warrant:d.features.warrant, counter:d.features.counter,
    meet:d.features.meet, missionDeep:d.features.readMission.length > 0,
    comment: inter !== "none", rebuttal: inter === "rebuttal",
    change:d.features.change, feedback:d.features.feedback, revise:d.features.revise, terms:false,
    minChars: String(TOOLS[t.tool]?.only ? t.minChars : t.minChars && k !== "quick" ? t.minChars : (t.tool==="free" || t.tool==="feel" ? Math.min(d.minChars, 40) : d.minChars)),
    evidenceTypes: f.evidenceTypes || [...EVIDENCE_TYPES]
  });
}
/* 활동 유형은 입장·공개 방식·사고 도구·기본 깊이를 정한다 */
function applyTemplate(k){
  const t = TEMPLATES[k], f = F("create");
  Object.assign(f, {template:k, tool:t.tool, stances:t.stances.join(", "), reveal:t.reveal, anonymous:t.anonymous, qtype:t.qtype||"", predict:false, develop:false, nst:t.stances.length});
  if(k === "notes" && !(f.prompt||"").trim()) f.prompt = "오늘 수업에서 배운 내용을 공책이나 태블릿에 정리하고, 사진을 찍어 올려 주세요.";
  t.stances.forEach((x,i) => { f["st"+i] = x });
  applyDepth(t.depth);
}
function createForm(){
  const f = F("create", () => ({unit:"", subject:""}));

  if(!f.goal || !GOALS.some(g => g.k === f.goal)) f.goal = (GOALS.find(g => g.t.includes(f.template)) || GOALS[0]).k;
  if(TEMPLATES[f.template].stances.length && !f.nst){ f.nst = TEMPLATES[f.template].stances.length; TEMPLATES[f.template].stances.forEach((x,i) => { f["st"+i] = f["st"+i] || x }) }

}

function onFormValue(el){
  const key = el.dataset.form, k = el.dataset.k, f = F(key);
  if(el.type === "checkbox" && el.hasAttribute("data-multi")){
    const set = new Set(f[k] || []); el.checked ? set.add(el.value) : set.delete(el.value); f[k] = [...set];
  }else if(el.type === "checkbox") f[k] = el.checked;
  else if(el.type === "radio"){ if(el.checked) f[k] = el.value }
  else f[k] = el.value;
  saveFormsSoon();
  return {key, k};
}

document.addEventListener("change", e => {

    const r = S.rooms.find(x => x.id === S.roomId), g = el.dataset.asg, v = el.value ? new Date(el.value).getTime() : null;
    const assign = JSON.parse(JSON.stringify(r.assign || {})); assign[g] = {...(assign[g]||{status:"open"})};

  // 학급 학생 수 (교사)
  if(el.hasAttribute("data-classsize")){
    const r = room(), v = Math.max(0, parseInt(el.value)||0);
    write(db => db.doc("rooms/"+r.id).update({classSize:v}), () => { r.classSize = v });
    return;
  }
  if(!el.dataset.form || !(el.type==="checkbox" || el.type==="radio" || el.tagName==="SELECT")) return;
  const {key, k} = onFormValue(el);
  if(key.startsWith("write:")) refreshWriteStatus();
  if(key.startsWith("write:") && k === "_stance"){ const wm = document.getElementById("wmap"), r = room(); if(wm && r) wm.outerHTML = writeMapHTML(r) }
  if(key === "create"){
    const f = F("create");
    if(k === "template") applyTemplate(f.template);
    if(k === "depth") applyDepth(f.depth);
    if(k === "tool"){ Object.assign(f, TOOLS[f.tool].force || {}) }   // 사고 도구가 요구하는 기능은 자동으로 켠다
    if(k === "rebuttal" && f.rebuttal) f.comment = true;
    if(k === "courseId") f.groups = groupsOf(courseOf(f.courseId)).map(g => g.id);   // 수업을 고르면 그 수업의 모든 그룹을 먼저 골라 둔다
    const id = el.id; render(); if(id) document.getElementById(id)?.focus();
  }
});
/* 고급 설정 열림 상태 기억 (toggle 이벤트는 버블링되지 않아 캡처로 받는다) */
document.addEventListener("toggle", e => {
  if(e.target.matches && e.target.matches("details[data-adv]")) F("create")._advOpen = e.target.open;
  if(e.target.matches && e.target.matches("details[data-q]")) S.qopen = e.target.open;
}, true);
function refreshWriteStatus(){
  const r = room(), box = document.getElementById("wstatus");
  const sk = document.getElementById("skprev"); if(sk && r) sk.innerHTML = sketchMapHTML(F(writeKey(r)));   // 생각 스케치: 적는 대로 지도 그리기
  if(!r || !box) return;
  box.outerHTML = statusHTML(r);
  revealFields(r);
}
document.addEventListener("keydown", e => { if(e.key==="Enter" && !e.isComposing && (e.target.id==="f-name" && S.mode !== "supa" || e.target.id==="f-code")){ e.preventDefault(); act("setname") } });
document.addEventListener("keydown", e => {                       // 가상 인물 대화: Enter로 보내기, Shift+Enter는 줄바꿈 (한글 입력 중에는 보내지 않음)
  if(e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  if(!(e.target.dataset?.form || "").startsWith("chat:")) return;
  e.preventDefault(); act("chat-send");
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(!b || b.disabled || b.closest("fieldset[disabled]")) return;
  if(b.dataset.a === "modal-bg" && e.target !== b) return;      // 모달 안쪽 클릭은 닫지 않는다
  if(b.closest("[data-racts]")) S.modal = null;                 // 관리 메뉴에서 고르면 메뉴는 닫고 그 동작을 한다
  act(b.dataset.a, b);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.modal){ S.modal = null; render() } });
/* 발표 화면: 키보드 ← → 로 발표 목록 넘기기 */
document.addEventListener("keydown", e => {
  if(S.view !== "present" || S.modal || !/^Arrow(Left|Right)$/.test(e.key) || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(!document.querySelector('[data-a="pnav"]')) return;
  e.preventDefault(); act("pnav", {dataset:{v: e.key === "ArrowRight" ? "1" : "-1"}});
});

/* 문장 시작 넣기 */
function insertStarter(b){
  const el = document.getElementById(b.dataset.target);
  if(!el) return;
  const add = b.dataset.text || "";
  el.value = el.value.trim() ? el.value.replace(/\s*$/, "\n") + add : add;
  el.dispatchEvent(new Event("input", {bubbles:true}));
  el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  b.closest("details")?.removeAttribute("open");
}

async function act(a, b){
  if(TEACHER_ACTS.has(a) && !Auth.teacher){ toast("선생님만 쓸 수 있는 기능이에요."); return }   // 학생 권한: 교사 기능 호출 차단
  if(["phase","step","go-respond","open-record"].includes(a)) S.work = a === "open-record" ? b.dataset.id : S.roomId;   // 단계로 가면 ‘내 활동’ 화면
  if(a === "open" || a === "home" || a === "mine") S.work = null;
  const r = room(), p = r ? myPost(r) : null;
  switch(a){
    /* ---- 이동 ---- */
    case "home": S.view = "home"; S.confirmDel = false; S.openPost = null; scrollTo(0,0); break;
    case "mine": S.view = "mine"; scrollTo(0,0); break;
    case "open": S.gsel = ""; S.gselRoom = b.dataset.id; S.asgAdd = false; S.sq = ""; S.sf = "all"; S.fbSent = null; S.pmode = null; S.pidx = 0; S.prand = null; S.qopen = null; S.modal = null; S.ttab = "overview"; S.view = "room"; S.roomId = b.dataset.id; S.take = null; S.editing = null; S.confirmDel = false; S.openPost = null; scrollTo(0,0); break;
    case "open-record": S.view = "room"; S.roomId = b.dataset.id; S.step[b.dataset.id] = "record"; S.openPost = null; scrollTo(0,0); break;
    case "role": return;
    /* ---- Supabase: 교사 로그인 · 학생 명단 ---- */
    case "t-login": { await SB.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.origin + location.pathname + "#teacher"}}); return }
    case "t-logout": { await SB.auth.signOut(); location.hash = ""; location.reload(); return }
    case "t-cancel": S.wantTeacher = false; break;
    case "roster-open": S.modal = {type:"roster"}; S.roster = undefined; S.rosterQ = ""; loadRoster(); break;
    case "roster-add": {
      const {ok, bad} = parseRoster(document.getElementById("roster-add")?.value);
      if(!ok.length){ toast(bad.length ? "‘학번 이름’ 꼴로 적어 주세요." : "추가할 학생을 적어 주세요."); return }
      const have = new Set((S.roster || []).map(x => x.number + " " + x.name));
      const rows = ok.filter(x => { const k = x.number + " " + x.name; if(have.has(k)) return false; have.add(k); return true }).map(x => ({...x, code:newCode()}));   // 이미 있거나 겹친 줄은 빼고
      if(rows.length){ const r2 = await SB.from("students").upsert(rows, {onConflict:"tid,number,name", ignoreDuplicates:true}); if(r2.error){ toast("추가하지 못했어요: " + r2.error.message); return } }
      toast(`${rows.length}명을 추가했어요.${ok.length - rows.length ? ` (이미 있는 ${ok.length - rows.length}명은 그대로)` : ""}${bad.length ? ` 읽지 못한 줄 ${bad.length}개` : ""}`);
      await loadRoster(); break;
    }
    case "roster-reissue": { const r2 = await SB.from("students").update({code:newCode()}).eq("id", b.dataset.id); if(r2.error){ toast("바꾸지 못했어요."); return } toast("새 코드를 만들었어요. 예전 코드는 더 이상 쓸 수 없어요."); await loadRoster(); break }
    case "roster-del": {
      if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "정말 빼기"; setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = "빼기" } }, 3000); return }
      const r2 = await SB.from("students").delete().eq("id", b.dataset.id); if(r2.error){ toast("빼지 못했어요."); return }
      toast("명단에서 뺐어요. 이 학생이 쓴 글은 그대로 남아요."); await loadRoster(); break;
    }
    case "roster-print": printRoster(); return;
    /* ---- 가상 인물 대화 ---- */
    case "chat-starter": { const el = document.getElementById(`chat:${r.id}-msg`); if(el){ el.value = b.dataset.text; el.dispatchEvent(new Event("input", {bubbles:true})); el.focus() } return }
    case "chat-stop": { CHAT[r.id]?.ctl?.abort(); return }
    case "chat-send": {
      if(CHAT[r.id]?.busy) return;
      const key = "chat:" + r.id, f = F(key), msg = (f.msg || "").trim().slice(0, 600), P = personaOf(r);
      if(!msg){ toast(`${P.name}에게 물어볼 말을 적어 주세요.`); return }
      const sample = await getSample();
      if(!sample){ toast("이 화면에서는 AI 대화를 쓸 수 없어요."); break }
      const base = [...(p?.chat?.log || [])];
      if(base.filter(x => x.role === "user").length >= P.maxTurns){ toast("질문을 모두 했어요."); break }
      const log = base.concat({role:"user", text:msg, at:Date.now()});
      f.msg = ""; saveFormsSoon();
      const st = CHAT[r.id] = {busy:true, stream:"", ctl:new AbortController(), pending:log};
      render();
      const turns = [{role:"user", content:chatRules(r)}, ...log.slice(-20).map(x => ({role: x.role === "ai" ? "assistant" : "user", content: x.text}))];
      let reply = "";
      try{
        const res = await sample(turns, {modelTier:"quick", cache:false, signal:st.ctl.signal,
          onText: ({text}) => { st.stream = text; const el = document.getElementById("chatstream"); if(el){ el.textContent = text; const box = document.getElementById("chatbox"); if(box) box.scrollIntoView({block:"end", behavior:"smooth"}) } }});
        reply = (res.text || "").trim();
      }catch(e){
        if(e?.code === "cancelled" && (e.text || "").trim()) reply = e.text.trim() + " …(멈춤)";
        else if(e?.code !== "cancelled"){ toast(CHAT_ERR[e?.code] || "AI가 답하지 못했어요. 다시 보내 주세요.") }
      }
      delete CHAT[r.id];
      if(!reply){ F(key).msg = msg; saveFormsSoon(); break }          // 답이 없으면 질문을 입력 칸에 되돌린다
      log.push({role:"ai", text:reply, at:Date.now()});
      await savePost(r, {chat:{log, done:false}});
      break;
    }
    case "chat-done": {
      const log = p?.chat?.log || []; if(!log.length) return;
      const ok = await savePost(r, {chat:{log, done:true, doneAt:Date.now()}});
      if(ok){ dropForm("chat:" + r.id); toast("대화를 마쳤어요. 이제 대화에서 얻은 것을 정리해 볼까요?"); goNext(r) }
      break;
    }
    case "chat-skip": { const ok = await savePost(r, {chat:{log:[], done:true, skipped:true}}); if(ok) goNext(r); break }                                           // 화면 전환 버튼은 없앴다 (예전 버튼이 남아 있어도 아무 일도 하지 않는다)
    case "preview-home": enterPreview(null); break;
    case "create": {
      if(S.form.create?.editId) dropForm("create");
      const fresh = !S.form.create, f = createForm();
      if(fresh && courseOf(S.mcourse)){ f.courseId = S.mcourse; f.groups = groupsOf(courseOf(S.mcourse)).map(g => g.id); saveFormsSoon() }   // 고른 수업에서 만들면 그 수업으로
      S.tplNaming = false; S.view = "create"; scrollTo(0,0); break;
    }
    case "phase": {
      const ph = phasesOf(r).find(x=>x.k===b.dataset.v);
      goStep(r, ph.steps.find(s => stepState(r,p,s)==="open") || ph.steps[0]);
      break;
    }
    case "step": goStep(r, b.dataset.v); S.take = null; break;
    case "open-post": S.openPost = b.dataset.id; S.fbSent = null; if(isTeacher() && S.view === "room"){ S.ttab = "students"; setTimeout(() => document.querySelector(".snav")?.scrollIntoView({block:"start"}), 0) } break;
    case "close-post": S.openPost = null; S.fbSent = null; break;
    case "go-respond": goStep(r, "respond"); S.openPost = b.dataset.id; break;
    case "starter": insertStarter(b); return;

    /* ---- 이름 ---- */
    case "rename":
      if(S.mode === "supa"){ lsSet("nonjae.name", ""); await SB.auth.signOut(); location.reload(); return }   // 다른 학생으로: 이 기기의 연결을 끊는다
      S.name = ""; lsSet("nonjae.name",""); S.form = {}; S.step = {}; if(S.view!=="room") S.view = "mine"; break;
    case "setname": {
      if(S.mode === "supa"){
        const g = id => (document.getElementById(id)?.value || "").trim();
        const num = g("f-num"), nm = g("f-name"), code = g("f-code");
        if(!num || !nm || !code){ toast("학번, 이름, 개인 코드를 모두 적어 주세요."); return }
        if(b) b.disabled = true;
        const res = await SB.rpc("claim_student", {p_number:num, p_name:nm, p_code:code});
        if(res.error || !res.data){ if(b) b.disabled = false; toast("학번·이름·코드가 맞지 않아요. 다시 확인해 주세요."); return }
        lsSet("nonjae.name", res.data.name); location.reload(); return;   // 그 선생님 반의 활동을 새로 불러온다
      }
      const v = (document.getElementById("f-name")?.value || "").trim();
      if(!v){ toast("번호와 이름을 써 주세요."); return }
      S.name = v; lsSet("nonjae.name", v); loadForms(); S.seenTeacher = null; checkNewFeedback(); S.anim = true;
      break;
    }

    /* ---- 처음 생각 ---- */
    case "save-initial": {
      const f = F("init:"+r.id), hasSt = (r.stances||[]).length;
      const pred = featuresOf(r).predict;
      if(hasSt && !pred ? !f.stance : !(f.text||"").trim()){ toast(hasSt && !pred ? "지금 생각에 가까운 것을 하나 골라 주세요." : "떠오른 생각을 한 문장만 적어 볼까요?"); return }
      const ok = await savePost(r, {initial:{stance:pred ? null : (f.stance||null), text:(f.text||"").trim(), predict:pred, at:Date.now()}});
      if(ok){ dropForm("init:"+r.id); toast("처음 생각을 남겼어요."); goNext(r) }
      break;
    }

    /* ---- 내 생각과 이유 ---- */
    case "edit": S.editing = r.id; dropForm(writeKey(r)); break;
    case "cancel-edit": S.editing = null; dropForm(writeKey(r)); break;
    case "save-write": {
      if(b.dataset.part === "0"){
        // 감상·성찰: 생각만 먼저 저장하고 이유 쓰기로
        const st0 = writeStatus(r); if(!st0.ok){ toast(st0.msg); return }
        const x0 = effFields(r)[0], v0 = (F(writeKey(r))[x0.k]||"").trim();
        const ok0 = await savePost(r, {body:{...(p?.body||{}), [x0.k]:v0}});
        if(ok0) goStep(r, "why");
        break;
      }
      S.writePart = undefined;
      const st = writeStatus(r);
      if(!st.ok){ toast(st.msg); return }
      const f = F(writeKey(r)), body = {};
      effFields(r).forEach(x => body[x.k] = (f[x.k]||"").trim());
      const patch = {stance:f._stance||null, body, evidenceType:f._etype||""};
      if((f._other||"").trim() || (f._source||"").trim()) patch.deeper = {other:(f._other||"").trim(), source:(f._source||"").trim()};
      const editing = S.editing === r.id, counter = featuresOf(r).counter;
      if(!editing && !counter && !isEssay(r)){ patch.status = "submitted"; patch.submittedAt = Date.now() }
      b.disabled = true;
      const ok = await savePost(r, patch);
      if(!ok){ b.disabled = false; return }
      dropForm(writeKey(r)); delete DRAW[writeKey(r)];
      if((r.stances||[]).length) S.landed = r.id;      // 지도에 내 카드가 들어가는 모습
      if(editing){ S.editing = null; toast("고친 글을 저장했어요.") }
      else if(counter){ toast("잘 썼어요. 하나만 더 생각해 볼까요?"); goStep(r, "counter") }
      else if(isEssay(r)){ toast("정리했어요. 이제 글로 써 볼까요?"); goStep(r, "compose") }
      else { toast(featuresOf(r).meet ? "제출했어요. 이제 친구는 어떻게 생각했는지 볼까요?" : "제출했어요."); goNext(r) }
      break;
    }

    /* ---- 나와 다른 생각 (여기서 제출) ---- */
    case "counter-edit": { const k = "counter:"+r.id; S.form[k] = {objection:p.counter.objection, response:p.counter.response||"", _edit:true}; break }
    case "save-counter": {
      const f = F("counter:"+r.id);
      if(!(f.objection||"").trim()){ toast("나와 다른 생각을 한 가지만 적어 볼까요?"); return }
      const patch = {counter:{objection:f.objection.trim(), response:(f.response||"").trim(), at:Date.now()}};
      const first = !submitted(p) && !isEssay(r);
      if(!submitted(p)){
        const w = S.form[writeKey(r)];
        if(w){ const body = {}; effFields(r).forEach(x => body[x.k] = (w[x.k]||"").trim()); Object.assign(patch, {body, stance:w._stance||p?.stance||null, evidenceType:w._etype||""});
          if((w._other||"").trim() || (w._source||"").trim()) patch.deeper = {other:(w._other||"").trim(), source:(w._source||"").trim()} }
        if(first){ patch.status = "submitted"; patch.submittedAt = Date.now() }
      }
      b.disabled = true;
      const ok = await savePost(r, patch);
      if(!ok){ b.disabled = false; return }
      dropForm("counter:"+r.id); dropForm(writeKey(r));
      toast(first ? "제출했어요. 이제 친구는 어떻게 생각했는지 볼까요?" : "저장했어요.");
      goNext(r);
      break;
    }

    /* ---- 친구 생각 살펴보기 ---- */
    case "pick-diff": {
      const f = F("meet:"+r.id); f.diffPostId = f.diffPostId === b.dataset.id ? "" : b.dataset.id; saveFormsSoon();
      if(f.diffPostId) toast(featuresOf(r).deep ? "골랐어요. 다 읽은 뒤 ‘다 읽었어요’를 눌러 주세요." : "골랐어요. 아래에 한마디 남겨 볼까요?");
      break;
    }
    case "see-done": F("seen:"+r.id).v = true; saveFormsSoon(); goNext(r); break;
    case "essay-edit": { const k = essayKey(r); S.form[k] = {text:p.essay.text, _edit:true}; break }
    case "essay-save": {
      const f = F(essayKey(r)), text = (f.text||"").trim();
      if(!text){ toast("정리한 생각을 글로 이어 써 볼까요?"); return }
      if(cnt(text) < (r.minChars||0)){ toast("자신의 생각이 잘 드러나도록 조금 더 써 볼까요?"); return }
      b.disabled = true;
      const ok = await savePost(r, {essay:{text, at:Date.now()}, status:"submitted", submittedAt:p?.submittedAt || Date.now()});
      if(ok){ dropForm(essayKey(r)); toast("글을 보냈어요. 선생님이 읽고 피드백을 줄 거예요."); goNext(r) } else b.disabled = false;
      break;
    }
    case "fb-skip": { const ok = await savePost(r, {feedbackSkipped:true}); if(ok) goNext(r); break }
    case "theme-set": setTheme(b.dataset.v === "dark" ? "dark" : "light"); return;
    case "to-stage": S.work = S.roomId; S.openPost = null; scrollTo(0,0); break;
    case "rmode": S.work = b.dataset.v === "work" ? S.roomId : null; S.openPost = null; break;
    case "due-clear": { const f = createForm(); f.dueAt = ""; saveFormsSoon(); break }
    /* ---- 오늘의 필기 ---- */
    case "note-redo": S.noteRedo = r?.id; break;
    case "note-redo-cancel": S.noteRedo = null; (NDRAFT[r.id]||[]).forEach(x => URL.revokeObjectURL(x.url)); delete NDRAFT[r.id]; break;
    case "note-rm": { const l = NDRAFT[r.id] || [], i = +b.dataset.i; if(l[i]){ URL.revokeObjectURL(l[i].url); l.splice(i, 1) } break }
    case "note-move": { const l = NDRAFT[r.id] || [], i = +b.dataset.i, j = i + (+b.dataset.d); if(l[i] && l[j]) [l[i], l[j]] = [l[j], l[i]]; break }
    case "note-clear": (NDRAFT[r.id]||[]).forEach(x => URL.revokeObjectURL(x.url)); NDRAFT[r.id] = []; break;
    case "note-submit": await noteSubmit(r); return;
    case "note-view": S.modal = {type:"note", pid:b.dataset.pid || null, draft:b.dataset.draft || null, i:+b.dataset.i || 0}; break;
    case "note-nav": if(S.modal) S.modal.i = (S.modal.i||0) + (+b.dataset.d); break;
    case "note-filter": S.nf = b.dataset.v; break;
    case "note-req": S.modal = {type:"noteReq", pid:b.dataset.pid}; break;
    case "note-req-send": {
      const p = S.posts.find(x => x.id === b.dataset.pid), msg = (document.getElementById("nreq-msg")?.value || "").trim().slice(0, 200);
      if(!p) return;
      const req = {at:Date.now(), msg};
      if(await write(db => db.doc("posts/"+p.id).update({resubmitReq:req}), () => { p.resubmitReq = req })){ S.modal = null; toast(`${p.author} 학생에게 다시 제출을 요청했어요.`) }
      break;
    }
    case "note-req-cancel": {
      const p = S.posts.find(x => x.id === b.dataset.pid); if(!p) return;
      if(await write(db => db.doc("posts/"+p.id).update({resubmitReq:null}), () => { p.resubmitReq = null })) toast("요청을 취소했어요.");
      break;

    case "tpl-cancel": S.tplNaming = false; break;
    case "tpl-save": {
      const name = (document.getElementById("tpl-name")?.value || "").trim();
      if(!name){ toast("템플릿 이름을 적어 주세요."); return }
      const {editId, prompt, title, context, intro, memo, goal, ...settings} = createForm();
      const id = "t-" + Date.now().toString(36), data = {name, settings:JSON.parse(JSON.stringify(settings)), createdAt:Date.now()};
      const ok = await write(db => db.doc("ttemplates/"+id).set(data), () => { S.ttemplates.push({id, ...data}) });
      if(ok){ S.tplNaming = false; toast("내 템플릿으로 저장했어요. 새 활동을 만들 때 불러올 수 있어요.") }
      break;
    }
    case "use-tpl": {
      const tp = S.ttemplates.find(x=>x.id===b.dataset.id), f = createForm();
      Object.assign(f, tp.settings); f.goal = (GOALS.find(g=>g.t.includes(f.template))||GOALS[0]).k; saveFormsSoon();
      toast(`‘${tp.name}’ 설정을 불러왔어요.`);
      break;
    }
    case "toggle": {
      const open = r.open === false;
      const ok = await write(db => db.doc("rooms/"+r.id).update({open}), () => { r.open = open });
      if(ok) toast(open ? "다시 열었어요." : "마감했어요.");
      break;
    }
    case "del": S.confirmDel = true; break;
    case "del-no": S.confirmDel = false; break;
    case "del-yes": {
      const id = r.id;
      const ok = await write(db => db.doc("rooms/"+id).delete(), () => { S.rooms = S.rooms.filter(x=>x.id!==id) });
      if(ok){ S.view = "home"; S.confirmDel = false; toast("삭제했어요.") }
      break;
    }
    case "goal": {
      const f = createForm(), g = GOALS.find(x => x.k === b.dataset.v);
      f.goal = g.k; if(!g.t.includes(f.template)) applyTemplate(g.t[0]); saveFormsSoon();
      break;
    }
    case "tpl": createForm(); applyTemplate(b.dataset.v); saveFormsSoon(); break;
    case "st-add": { const f = createForm(), n = f.nst || TEMPLATES[f.template].stances.length || 2; if(n < 4){ f["st"+n] = f["st"+n] || `입장 ${n+1}`; f.nst = n + 1 } saveFormsSoon(); break }
    case "st-del": { const f = createForm(), n = f.nst || TEMPLATES[f.template].stances.length || 2; if(n > 2){ f.nst = n - 1; delete f["st"+f.nst] } saveFormsSoon(); break }
    case "depth": createForm(); applyDepth(b.dataset.v); saveFormsSoon(); break;

    /* ---- 질문이음 ---- */
    case "ask-edit": { const k = "ask:"+r.id, q = p.questions[0]; S.form[k] = {text:q.text, qtype:q.qtype||"", _edit:true}; break }
    case "ask-save": {
      const f = F("ask:"+r.id), text = (f.text||"").trim();
      if(!text){ toast("궁금한 것 하나를 질문으로 적어 볼까요?"); return }
      const qtype = fixedQtype(r) || f.qtype || "";
      const qs = [...(p?.questions || [])];
      if(qs.length) qs[0] = {...qs[0], text, qtype}; else qs.push({id:"q1", text, qtype, at:Date.now()});
      b.disabled = true;
      const ok = await savePost(r, {questions:qs, status:"submitted", submittedAt:p?.submittedAt||Date.now()});
      if(ok){ dropForm("ask:"+r.id); toast("질문을 보냈어요. 이제 친구의 질문을 이어받아 볼까요?"); goNext(r) } else b.disabled = false;
      break;
    }
    case "take": S.take = {pid:b.dataset.id, qid:b.dataset.q}; S.anim = true; break;
    case "take-cancel": S.take = null; break;
    case "answer-save": {
      const key = `ans:${b.dataset.id}:${b.dataset.q}`, f = F(key), text = (f.text||"").trim();
      if(!text){ toast("이 질문에 대한 내 생각을 한 문장 적어 볼까요?"); return }
      b.disabled = true;
      const ok = await addReply({roomId:r.id, postId:b.dataset.id, qid:b.dataset.q, author:S.name, kind:"answer", text, evidence:(f.evidence||"").trim(), createdAt:Date.now()});
      if(ok){ dropForm(key); S.take = null; toast("생각을 보냈어요. 질문을 만든 친구에게 전해져요."); goNext(r) } else b.disabled = false;
      break;
    }
    case "react": {
      S.step[r.id] = "back";                 // 다른 답에도 반응할 수 있도록 이 화면에 머문다
      const prev = p.reactions?.[b.dataset.id];
      const ok = await savePost(r, {reactions:{...(p.reactions||{}), [b.dataset.id]:{kind:b.dataset.v, note:prev?.note||"", at:Date.now()}}});
      if(ok && !prev) toast("표시했어요.");
      break;
    }
    case "react-note": {
      const id = b.dataset.id, text = (F("rn:"+id).text||"").trim();
      if(!text){ toast("한 줄만 적어 볼까요?"); return }
      const ok = await savePost(r, {reactions:{...(p.reactions||{}), [id]:{...(p.reactions?.[id]||{}), note:text, at:Date.now()}}});
      if(ok){ dropForm("rn:"+id); toast("덧붙였어요.") }
      break;
    }
    case "dev-open": F("dev:"+r.id)._open = true; break;
    case "dev-skip": { const ok = await savePost(r, {developSkipped:true}); if(ok){ dropForm("dev:"+r.id); goNext(r) } break }
    case "develop-save": {
      const f = F("dev:"+r.id), text = (f.text||"").trim();
      if(!text){ toast("새로 궁금해진 것을 질문으로 적어 볼까요?"); return }
      const qs = [...(p.questions||[])], last = qs[qs.length-1];
      qs.push({id:"q"+(qs.length+1), text, qtype:fixedQtype(r) || f.qtype || "", from:last?.id||"", at:Date.now()});
      b.disabled = true;
      const ok = await savePost(r, {questions:qs});
      if(ok){ dropForm("dev:"+r.id); toast("새 질문이 질문 카드 풀에 들어갔어요."); goNext(r) } else b.disabled = false;
      break;
    }
    case "create-save": case "draft-save": case "publish-draft": {
      const f = createForm(), data = roomFromForm(f), t = TEMPLATES[data.template], asDraft = a === "draft-save";
      const editR = f.editId ? S.rooms.find(x=>x.id===f.editId) : null, locked = editR && allPostsOf(editR.id).length > 0;
      if(!data.prompt && !asDraft){ toast("주제나 질문을 적어 주세요."); document.getElementById("c-prompt")?.focus(); return }
      if(!asDraft && !locked && t.stances.length && data.stances.length < 2){ toast("입장 이름을 두 개 이상 적어 주세요."); return }
      if(data.template === "chat" && !asDraft && !data.persona?.name){ toast("대화 상대를 적어 주세요. 예: 고종"); document.getElementById("c-pname")?.focus(); return }
      if(!data.title) data.title = "제목 없는 활동";
      const now = Date.now(), meta = roomMeta(f);
      // 수업·그룹 배포: 이미 있던 그룹 설정은 그대로, 응답이 있는 그룹은 빼지 않는다
      const prevA = editR?.assign || {}, cid = courseOf(f.courseId) ? f.courseId : (locked && courseOf(editR?.courseId) ? editR.courseId : "");
      const keepG = editR ? allPostsOf(editR.id).map(p => p.groupId).filter(g => g && prevA[g]) : [];
      const selG = cid ? [...new Set([...(f.groups||[]).filter(g => groupsOf(courseOf(cid)).some(x => x.id === g)), ...keepG])] : [];
      const asg = {courseId:cid, assign:Object.fromEntries(selG.map(g => [g, prevA[g] || {status:"open"}]))};
      let id, doc, ok;
      if(editR){
        id = editR.id;
        // 학생 응답이 있으면 글자로 된 안내만 바꾼다 (구조는 그대로)
        doc = locked ? {title:data.title, prompt:data.prompt, context:data.context, subject:data.subject, unit:data.unit, year:data.year, ...(data.persona ? {persona:data.persona} : {}), ...(data.noteCfg ? {noteCfg:data.noteCfg} : {}), ...meta, ...asg, updatedAt:now}
                     : {...data, ...meta, ...asg, updatedAt:now};
        if(a === "publish-draft") Object.assign(doc, {status:"open", open:true});
        ok = await write(db => db.doc("rooms/"+id).update(doc), () => Object.assign(editR, doc));
      }else{
        id = "r-" + now.toString(36);
        doc = {...data, ...meta, ...asg, status: asDraft ? "draft" : "open", open: !asDraft, createdAt:now, updatedAt:now};
        ok = await write(db => db.doc("rooms/"+id).set(doc), () => { S.rooms.push({id, ...doc}) });
      }
      if(!ok) return;
      if((f.memo||"").trim() !== (tnote({id}).memo||"")) await saveTnote({id}, {memo:(f.memo||"").trim()});
      if(asDraft){ f.editId = id; saveFormsSoon(); toast("임시 저장했어요. ‘내 수업’의 작성 중에서 이어서 만들 수 있어요."); break }
      dropForm("create"); S.view = "room"; S.roomId = id; S.ttab = "overview"; S.pendingRoom = id; S.gsel = ""; S.gselRoom = id; S.asgAdd = false;
      toast(editR ? (a === "publish-draft" ? "공개했어요. 학생 링크를 공유해 보세요." : "변경사항을 저장했어요.") : "활동을 만들었어요. 학생 링크를 공유해 보세요.");
      scrollTo(0,0);
      break;
    }
    default: return;
  }
  render();
}

/* 마감·시작 시각이 지나는 순간 화면을 다시 그린다 (자동 마감) */
function dueKey(){
  const now = Date.now();
  return S.rooms.map(r => [r.dueAt && now >= r.dueAt ? r.id : "", ...asgIds(r).map(g => { const a = r.assign[g]; return (a.dueAt && now >= a.dueAt) || (a.startAt && now >= a.startAt) ? r.id + "/" + g : "" })].filter(Boolean).join(",")).join(";");
}
let DUE_KEY = "";                                     // 마지막으로 그린 화면의 마감 상태 (render()가 갱신)
setInterval(() => { if(dueKey() !== DUE_KEY){ render(); toast("시각이 되어 활동 상태가 바뀌었어요.") } }, 10000);
render();
init();
</script>
